<!DOCTYPE html>
<!-- ======================================================================
     P-51 MUSTANG STUDY — the airshow, for George World. Filed
     2026-08-31, Doug's transport batch. A proper Mustang: laminar
     wing, bubble canopy, the signature belly RADIATOR SCOOP, silver
     skin with invasion stripes, red spinner on a prop that spins to
     a blur. The display, flown off the grass strip: takeoff roll and
     a clean climb-out, a wide climbing turn, the FAST LOW PASS down
     the strip, pull up into a VICTORY ROLL, a lazy descending
     wingover, then approach, flare, squeak — and taxi back to do it
     all again. Banked properly through every turn. An airshow, not a
     war — nobody gets strafed at Aipotu.
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-51 Mustang Study</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#dfe8f0; }
  #chip { position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(20,26,34,0.8); color:#eaf0f8; font:13px/1.5 system-ui, sans-serif;
    padding:10px 14px; border-radius:10px; user-select:none; backdrop-filter:blur(4px); }
  #chip b { font-size:14px; }
  #chip .hint { opacity:0.7; }
</style>
</head>
<body>
<div id="chip">
  <b>🛩️ P-51 Mustang Study</b> — the airshow display, v1<br>
  <span class="hint">takeoff · low pass · victory roll · wingover · the squeak landing</span>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xdde6ee), 80, 500);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.2, 900);
camera.position.set(14, 8, 22);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 3; controls.maxDistance = 140;
controls.maxPolarAngle = 1.54;
{
  const geo = new THREE.SphereGeometry(420, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xf0f2ea), zenith = new THREE.Color(0x4f9ad8),
        below = new THREE.Color(0xd0d8cc), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/420;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.55)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xdcecf6, 0xa8b494, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.2);
sun.position.set(20, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -10;
scene.add(sun);
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(400, 48),
    new THREE.MeshLambertMaterial({ color:0x8fa863 }));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
  // the grass strip
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(64, 5),
    new THREE.MeshLambertMaterial({ color:0xa4b070 }));
  strip.rotation.x = -Math.PI/2; strip.position.y = 0.02; scene.add(strip);
  for(let i = 0; i < 8; i++){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.3),
      new THREE.MeshLambertMaterial({ color:0xe8e4d0 }));
    m.rotation.x = -Math.PI/2;
    m.position.set(-28 + i*8, 0.03, 0);
    scene.add(m);
  }
  // windsock
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 3.2, 6),
    new THREE.MeshLambertMaterial({ color:0x8a8578 }));
  pole.position.set(-10, 1.6, -6);
  scene.add(pole);
  const sock = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.4, 8),
    new THREE.MeshLambertMaterial({ color:0xe8823c }));
  sock.rotation.z = Math.PI/2 - 0.15;
  sock.position.set(-9.2, 3.1, -6);
  scene.add(sock);
  // a little hangar
  const hang = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 6, 12, 1, false, 0, Math.PI),
    new THREE.MeshLambertMaterial({ color:0x9a9488, flatShading:true }));
  hang.rotation.z = Math.PI/2;
  hang.rotation.y = Math.PI/2;
  hang.position.set(6, 0, -9);
  hang.castShadow = true;
  scene.add(hang);
}

// ==========================================================================
//  THE MUSTANG — nose along +x
// ==========================================================================
const PLANE = new THREE.Group();
scene.add(PLANE);
let prop, blur, gear;
{
  const silver = new THREE.MeshStandardMaterial({ color:0xc8ccd2, roughness:0.35, metalness:0.55 });
  const dark = new THREE.MeshLambertMaterial({ color:0x2a3038 });
  const red = new THREE.MeshLambertMaterial({ color:0xc03a2a });
  // fuselage: tapered capsule-ish from cylinders
  const fus = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.3, 4.6, 16), silver);
  fus.rotation.z = Math.PI/2;
  fus.position.set(-0.2, 0, 0);
  fus.castShadow = true;
  PLANE.add(fus);
  const noseC = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 0.9, 16), silver);
  noseC.rotation.z = Math.PI/2;
  noseC.position.set(2.55, 0, 0);
  PLANE.add(noseC);
  const tailC = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.14, 1.4, 14), silver);
  tailC.rotation.z = Math.PI/2;
  tailC.position.set(-3.2, 0.03, 0);
  PLANE.add(tailC);
  // spinner + prop (four blades) + blur disc
  const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.7, 14), red);
  spinner.rotation.z = -Math.PI/2;
  spinner.position.set(3.3, 0, 0);
  PLANE.add(spinner);
  prop = new THREE.Group();
  prop.position.set(3.15, 0, 0);
  for(let i = 0; i < 4; i++){
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.5, 0.14), dark);
    const bg = new THREE.Group();
    bg.rotation.x = i*Math.PI/2;
    blade.position.y = 0.75;
    blade.rotation.y = 0.35;
    bg.add(blade);
    prop.add(bg);
  }
  PLANE.add(prop);
  blur = new THREE.Mesh(new THREE.CircleGeometry(1.55, 24),
    new THREE.MeshBasicMaterial({ color:0x888890, transparent:true, opacity:0, side:THREE.DoubleSide }));
  blur.rotation.y = Math.PI/2;
  blur.position.set(3.15, 0, 0);
  PLANE.add(blur);
  // THE WING — laminar taper, with invasion stripes painted as bands
  function wingHalf(s){
    const geo = new THREE.BoxGeometry(1.35, 0.1, 2.9);
    const w = new THREE.Mesh(geo, silver);
    w.position.set(0.45, -0.18, s*1.55);
    w.scale.z = 1;
    w.rotation.x = s*0.035;                    // dihedral
    w.castShadow = true;
    // taper: scale the tip via a second segment
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 1.5), silver);
    tip.position.set(0.4, -0.18 + s*0.1*0.55, s*(2.9 + 0.72));
    tip.rotation.x = s*0.035;
    tip.castShadow = true;
    PLANE.add(w); PLANE.add(tip);
    // invasion stripes on the inner wing
    for(let i = 0; i < 3; i++){
      const st = new THREE.Mesh(new THREE.BoxGeometry(1.36, 0.102, 0.3),
        i%2 ? new THREE.MeshLambertMaterial({ color:0xf0f0ea }) : dark);
      st.position.set(0.45, -0.18, s*(0.8 + i*0.32));
      st.rotation.x = s*0.035;
      PLANE.add(st);
    }
  }
  wingHalf(1); wingHalf(-1);
  // the belly SCOOP — the Mustang signature
  const scoop = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 1.5, 12, 1, false, 0, Math.PI), silver);
  scoop.rotation.z = Math.PI/2;
  scoop.rotation.x = Math.PI;
  scoop.position.set(-0.3, -0.44, 0);
  PLANE.add(scoop);
  // bubble canopy
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.4, 14, 10),
    new THREE.MeshStandardMaterial({ color:0x8ab8d8, roughness:0.15, metalness:0.2, transparent:true, opacity:0.75 }));
  canopy.scale.set(1.6, 0.75, 0.8);
  canopy.position.set(0.6, 0.34, 0);
  PLANE.add(canopy);
  // tail feathers
  const hstab = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.07, 2.4), silver);
  hstab.position.set(-3.55, 0.1, 0);
  hstab.castShadow = true;
  PLANE.add(hstab);
  const vstab = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.07), silver);
  vstab.position.set(-3.6, 0.6, 0);
  vstab.castShadow = true;
  PLANE.add(vstab);
  const rudderTip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.075), red);
  rudderTip.position.set(-3.75, 1.25, 0);
  PLANE.add(rudderTip);
  // gear (retracts): two mains + tailwheel
  gear = new THREE.Group();
  PLANE.add(gear);
  for(const s of [-1, 1]){
    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.6, 6), dark);
    strut.position.set(0.8, -0.55, s*0.8);
    gear.add(strut);
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.1, 12), dark);
    wheel.rotation.x = Math.PI/2;
    wheel.position.set(0.8, -0.88, s*0.8);
    gear.add(wheel);
  }
  const tw = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.07, 10), dark);
  tw.rotation.x = Math.PI/2;
  tw.position.set(-3.1, -0.42, 0);
  gear.add(tw);
}

// ==========================================================================
//  THE DISPLAY — a 40s routine. Position comes from a piecewise path;
//  heading and pitch from the path's own derivative; bank is scripted
//  per segment (plus the victory roll's full rotations).
// ==========================================================================
const T_TOTAL = 40;
function pathAt(f){
  // returns [x, y, z]
  if(f < 5){                                  // takeoff roll (tail comes up) + liftoff
    const k = f/5;
    return [lerp(-26, 2, k*k), 0.9 + Math.max(0, k - 0.75)*8*(k - 0.75), 0];
  } else if(f < 12){                          // climbing left-hand turn, out and around
    const k = (f - 5)/7;
    const a = k*Math.PI*1.15;
    return [2 + Math.sin(a)*26, 1.9 + smooth(Math.min(1, k*1.6))*10 - smooth(clamp((k - 0.6)/0.4, 0, 1))*8,
      -Math.sin(a*0.5)*30];
  } else if(f < 16){                          // THE LOW PASS — fast down the strip
    const k = (f - 12)/4;
    return [lerp(30, -30, k), 2.2, 0];
  } else if(f < 21){                          // pull up + victory roll on the up-line
    const k = (f - 16)/5;
    return [lerp(-30, -44, k), 2.2 + smooth(k)*17, 0];
  } else if(f < 30){                          // the lazy wingover back around
    const k = (f - 21)/9;
    const a = k*Math.PI;
    return [-44 + Math.sin(a)*-14 + (1 - Math.cos(a))*36, 19 - smooth(k)*13, Math.sin(a)*22];
  } else if(f < 37){                          // approach + flare + squeak + rollout
    const k = (f - 30)/7;
    return [lerp(28, -18, smooth(k)), lerp(6, 0.9, clamp(k*1.25, 0, 1)) + (k > 0.8 ? 0 : 0), 0];
  } else {                                    // taxi back to the numbers
    const k = (f - 37)/3;
    return [lerp(-18, -26, smooth(k)), 0.9, 0];
  }
}
let phT = 0;
let propSpin = 0;
const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT = (phT + dt) % T_TOTAL;
  const f = phT;

  _p1.fromArray(pathAt(f));
  _p2.fromArray(pathAt(Math.min(T_TOTAL - 0.001, f + 0.08)));
  PLANE.position.copy(_p1);
  // orient: nose along the velocity
  const vel = _p2.clone().sub(_p1);
  if(vel.lengthSq() > 1e-8){
    const heading = Math.atan2(-vel.z, vel.x);
    const pitch = Math.atan2(vel.y, Math.hypot(vel.x, vel.z));
    // bank: scripted per segment
    let bank = 0;
    if(f >= 5 && f < 12) bank = -0.7*Math.sin((f - 5)/7*Math.PI);          // climbing turn
    else if(f >= 16 && f < 21){                                            // VICTORY ROLL
      const k = clamp(((f - 16) - 1.2)/2.6, 0, 1);
      bank = k*Math.PI*4;                                                  // two full rolls
    }
    else if(f >= 21 && f < 30) bank = 0.85*Math.sin((f - 21)/9*Math.PI);   // the wingover
    PLANE.rotation.set(0, 0, 0);
    PLANE.rotateY(heading);
    PLANE.rotateZ(pitch);
    PLANE.rotateX(bank);
  }
  // prop
  const flying = f > 0.2 && f < 39.5;
  propSpin = lerp(propSpin, flying ? 34 : 6, dt*1.5);
  prop.rotation.x += propSpin*dt;
  blur.material.opacity = clamp((propSpin - 14)/20, 0, 0.35);
  prop.visible = propSpin < 20;
  // gear tucks after liftoff, drops for approach
  const gearOut = f < 6 || f > 29;
  gear.scale.y = lerp(gear.scale.y, gearOut ? 1 : 0.05, dt*3);
  gear.visible = gear.scale.y > 0.1;

  controls.target.lerp(new THREE.Vector3(PLANE.position.x, Math.max(1.5, PLANE.position.y), PLANE.position.z), dt*2.4);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
