     wing, bubble canopy, the signature belly RADIATOR SCOOP, silver
     skin with invasion stripes, red spinner on a prop that spins to
     a blur. The display, flown off the grass strip: takeoff roll and
     a clean climb-out, a wide climbing turn, the FAST LOW PASS down
     the strip, pull up into a VICTORY ROLL, a lazy descending

     war — nobody gets strafed at Aipotu.

// ==========================================================================
//  THE DISPLAY — a 40s routine. Position comes from a piecewise path;
//  heading and pitch from the path's own derivative; bank is scripted
//  per segment (plus the victory roll's full rotations).
// ==========================================================================
const T_TOTAL = 40;
function pathAt(f){
  // returns [x, y, z]
  if(f < 5){                                  // takeoff roll (tail comes up) + liftoff
    const k = f/5;
    return [lerp(-26, 2, k*k), 0.9 + Math.max(0, k - 0.75)*8*(k - 0.75), 0];
  } else if(f < 12){                          // climbing left-hand turn, out and around
    const k = (f - 5)/7;
    const a = k*Math.PI*1.15;
    return [2 + Math.sin(a)*26, 1.9 + smooth(Math.min(1, k*1.6))*10 - smooth(clamp((k - 0.6)/0.4, 0, 1))*8,
      -Math.sin(a*0.5)*30];
  } else if(f < 16){                          // THE LOW PASS — fast down the strip
    const k = (f - 12)/4;
    return [lerp(30, -30, k), 2.2, 0];
  } else if(f < 21){                          // pull up + victory roll on the up-line
    const k = (f - 16)/5;
    return [lerp(-30, -44, k), 2.2 + smooth(k)*17, 0];
  } else if(f < 30){                          // the lazy wingover back around
    const k = (f - 21)/9;
    const a = k*Math.PI;
    return [-44 + Math.sin(a)*-14 + (1 - Math.cos(a))*36, 19 - smooth(k)*13, Math.sin(a)*22];
  } else if(f < 37){                          // approach + flare + squeak + rollout
    const k = (f - 30)/7;
    return [lerp(28, -18, smooth(k)), lerp(6, 0.9, clamp(k*1.25, 0, 1)) + (k > 0.8 ? 0 : 0), 0];
  } else {                                    // taxi back to the numbers
    const k = (f - 37)/3;
    return [lerp(-18, -26, smooth(k)), 0.9, 0];
  }
}
// ==========================================================================
//  DEBRIS + THE FLAK HIT
// ==========================================================================
function puffTex(inner){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 4, 32, 32, 30);
  rg.addColorStop(0, inner); rg.addColorStop(1, 'rgba(60,60,60,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const smokes = [];
{
  const sm = new THREE.SpriteMaterial({ map:puffTex('rgba(70,70,72,0.75)'), transparent:true, depthWrite:false });
  for(let i = 0; i < 60; i++){
    const s = new THREE.Sprite(sm.clone());
    s.visible = false;
    scene.add(s);
    smokes.push({ m:s, age:9, life:1 });
  }
}
function smoke(pos, life, size){
  const p = smokes.find(x => x.age > x.life); if(!p) return;
  p.age = 0; p.life = life;
  p.m.position.copy(pos);
  p.m.scale.setScalar(size);
  p.baseSize = size;
  p.m.visible = true;
}

  }
}

// ==========================================================================
//  FLIGHT DYNAMICS — position integrated from speed + orientation;
//  each maneuver commands pitch/roll/yaw RATES; speed trades with climb.
// ==========================================================================
let mode = 'display';
let mT = 0, stallPhase = 0;
document.getElementById('mnv').addEventListener('change', e => {
  mode = e.target.value; mT = 0; stallPhase = 0;
  if(mode !== 'display'){
    // start every maneuver from clean level flight at altitude
    PLANE.position.set(-20, 14, 0);
    PLANE.rotation.set(0, 0, 0);
    speed = 22;
  } else phT = 0;
});
let speed = 22;
let phT = 0;
let propSpin = 0;
const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3(), _fwdW = new THREE.Vector3();
const _lvl = new THREE.Quaternion(), _e = new THREE.Euler();
const clock = new THREE.Clock();

function levelToward(dt, k = 1.2){
  // ease the attitude toward wings-level, nose-level on the current heading
  _fwdW.set(1, 0, 0).applyQuaternion(PLANE.quaternion);
  const heading = Math.atan2(-_fwdW.z, _fwdW.x);
  _lvl.setFromEuler(_e.set(0, heading, 0));
  PLANE.quaternion.slerp(_lvl, Math.min(1, dt*k));
}
function flyManeuver(dt){
  mT += dt;
  let pitchR = 0, rollR = 0, yawR = 0, done = false;
  if(mode === 'level'){
    levelToward(dt, 1.6);
    if(PLANE.position.y < 13) pitchR = 0.12;
    else if(PLANE.position.y > 15) pitchR = -0.08;
  } else if(mode === 'loop'){
    if(mT < 2*Math.PI/1.15) pitchR = 1.15;
    else done = true;
  } else if(mode === 'barrel'){
    if(mT < 2*Math.PI/1.7){ rollR = 1.7; pitchR = 0.32; }
    else done = true;
  } else if(mode === 'immelmann'){
    if(mT < Math.PI/1.15) pitchR = 1.15;                 // the half loop
    else if(mT < Math.PI/1.15 + Math.PI/2.2) rollR = 2.2; // roll off the top
    else done = true;
  } else if(mode === 'stall'){
    if(stallPhase === 0){                                 // haul the nose up
      pitchR = 1.0;
      speed -= dt*9;
      if(speed < 8) stallPhase = 1;
    } else if(stallPhase === 1){                          // the mush + the drop
      pitchR = -1.5;
      rollR = Math.sin(mT*7)*0.7;                         // that ugly wing-rock
      speed += dt*2;
      _fwdW.set(1, 0, 0).applyQuaternion(PLANE.quaternion);
      if(_fwdW.y < -0.65) stallPhase = 2;
    } else {                                              // speed back, pull out
      speed += dt*6;
      pitchR = 1.0;
      rollR = -PLANE.rotation.x*2;
      _fwdW.set(1, 0, 0).applyQuaternion(PLANE.quaternion);
      if(_fwdW.y > -0.05) done = true;
    }
  } else if(mode === 'hardleft' || mode === 'hardright'){
    const s = mode === 'hardleft' ? 1 : -1;
    if(mT < 0.7) rollR = s*2.6;                           // SNAP into the bank
    else if(mT < 4.2){ yawR = s*0.85; pitchR = 0.35; }    // haul it around
    else if(mT < 5.0) rollR = -s*2.4;                     // snap out
    else done = true;
  } else if(mode === 'dive'){
    if(mT < 1.6){ pitchR = -0.9; speed += dt*8; }         // push over, howling
    else if(PLANE.position.y > 5 && stallPhase === 0){ speed += dt*10; }
    else { stallPhase = 1; pitchR = 1.25; speed -= dt*4;  // the pull-out
      _fwdW.set(1, 0, 0).applyQuaternion(PLANE.quaternion);
      if(_fwdW.y > 0.05) done = true; }
  }
  if(done){ mT = 0; stallPhase = 0; levelToward(dt, 2); } // breathe, then again
  PLANE.rotateZ(pitchR*dt);
  PLANE.rotateX(rollR*dt);
  PLANE.rotateY(yawR*dt);
  // energy: diving buys speed, climbing spends it
  _fwdW.set(1, 0, 0).applyQuaternion(PLANE.quaternion);
  speed += (-_fwdW.y*6.5 + (20 - speed)*0.25)*dt;
  speed = clamp(speed, 6, 42);
  PLANE.position.addScaledVector(_fwdW, speed*dt*0.55);
  // never fly into the dirt; drift back toward the field
  if(PLANE.position.y < 3.2){ PLANE.position.y = 3.2; levelToward(dt, 3); }
  if(PLANE.position.y > 30) PLANE.position.y = 30;
  const R = Math.hypot(PLANE.position.x, PLANE.position.z);
  if(R > 70) PLANE.position.multiplyScalar(70/R);
  planeVel.copy(_fwdW).multiplyScalar(speed*0.55);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if(exploded){
    explodeT += dt;
    fireAge += dt;
    const fk = clamp(fireAge/0.9, 0, 1);
    fireball.scale.setScalar(2 + fk*7);
    fireball.material.opacity = (1 - fk)*0.95;
    if(fk >= 1) fireball.visible = false;
    for(const d of debris){
      if(d.resting) continue;
      d.vel.y -= 8*dt;
      d.m.position.addScaledVector(d.vel, dt);
      d.m.rotation.x += d.spin.x*dt;
      d.m.rotation.y += d.spin.y*dt;
      d.m.rotation.z += d.spin.z*dt;
      if(Math.random() < 0.25) smoke(d.m.position, 1.6, 0.5);
      if(d.m.position.y < 0.15){
        d.m.position.y = 0.15;
        d.resting = true;
        smoke(d.m.position, 2.2, 0.9);
      }
    }
    if(explodeT > 7){                          // the next ship rolls out
      exploded = false;
      PLANE.visible = true;
      for(const d of debris) d.m.visible = false;
      if(mode === 'display') phT = 0;
      else { PLANE.position.set(-20, 14, 0); PLANE.rotation.set(0, 0, 0); speed = 22; mT = 0; stallPhase = 0; }
    }
  } else if(mode === 'display'){
    phT = (phT + dt) % T_TOTAL;
    const f = phT;
    _p1.fromArray(pathAt(f));
    _p2.fromArray(pathAt(Math.min(T_TOTAL - 0.001, f + 0.08)));
    PLANE.position.copy(_p1);
    const vel = _p2.clone().sub(_p1);
    planeVel.copy(vel).multiplyScalar(1/0.08);
    if(vel.lengthSq() > 1e-8){
      const heading = Math.atan2(-vel.z, vel.x);
      const pitch = Math.atan2(vel.y, Math.hypot(vel.x, vel.z));
      let bank = 0;
      if(f >= 5 && f < 12) bank = -0.7*Math.sin((f - 5)/7*Math.PI);
      else if(f >= 16 && f < 21){
        const k = clamp(((f - 16) - 1.2)/2.6, 0, 1);
        bank = k*Math.PI*4;
      }
      else if(f >= 21 && f < 30) bank = 0.85*Math.sin((f - 21)/9*Math.PI);
      PLANE.rotation.set(0, 0, 0);
      PLANE.rotateY(heading);
      PLANE.rotateZ(pitch);
      PLANE.rotateX(bank);
    }
  } else {
    flyManeuver(dt);
  }

  // prop + gear
  const inDisplay = mode === 'display' && !exploded;
  const flying = exploded ? false : (inDisplay ? (phT > 0.2 && phT < 39.5) : true);
  propSpin = lerp(propSpin, flying ? 34 : 6, dt*1.5);
  prop.rotation.x += propSpin*dt;
  blur.material.opacity = clamp((propSpin - 14)/20, 0, 0.35);
  prop.visible = propSpin < 20;
  const gearOut = inDisplay ? (phT < 6 || phT > 29) : false;
  gear.scale.y = lerp(gear.scale.y, gearOut ? 1 : 0.05, dt*3);
  gear.visible = gear.scale.y > 0.1;

  // smoke pool
  for(const p of smokes){
    if(p.age > p.life) continue;
    p.age += dt;
    p.m.position.y += dt*0.5;
    const k = p.age/p.life;
    p.m.scale.setScalar((p.baseSize || 0.5)*(1 + k*2));
    p.m.material.opacity = (1 - k)*0.55;
    if(p.age >= p.life) p.m.visible = false;
  }

  const focus = exploded ? fireball.position : PLANE.position;
  controls.target.lerp(new THREE.Vector3(focus.x, Math.max(1.5, focus.y), focus.z), dt*2.4);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// stage remote-control: #set=<selectId>:<value>[,...] · #click=<data-m>
{
  const _h = new URLSearchParams(location.hash.slice(1));
  const _s = _h.get('set');
  if(_s) for(const pair of _s.split(',')){
    const [id, val] = pair.split(':');
    const el = document.getElementById(id);
    if(el){ el.value = val; el.dispatchEvent(new Event('change')); }
  }
  const _c = _h.get('click');
  if(_c){ const b = document.querySelector('[data-m="' + _c + '"]'); if(b) b.click(); }
}
</script>
