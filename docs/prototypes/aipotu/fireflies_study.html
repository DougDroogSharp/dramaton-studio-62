<!DOCTYPE html>
<!-- ======================================================================
     FIREFLIES STUDY — the night set, for George World.
     Filed 2026-08-31. Standalone; vendored three (r160), game importmap.
     A dark meadow after supper: campfire coals, a log seat, fir
     silhouettes, stars and a crescent moon. A swarm of fireflies
     drifts and blinks over the grass — each with its own wander and
     its own blink rhythm — and a SYNCHRONY button lets them slowly
     fall into step (the Great Smoky Mountains trick). One brave
     firefly loiters low by the berry bush; a Vita walks up, cups its
     hands around it, peeks at the glow pulsing between its fingers,
     then opens its hands and watches it spiral up into the dark.
     ====================================================================== -->

let seed = 6161;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

// ---------- the night sky --------------------------------------------------
{

        below = new THREE.Color(0x090c14), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/280;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.55)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false })));
}
function glowTex(inner, outer){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  rg.addColorStop(0, inner); rg.addColorStop(0.35, outer); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
{ // stars — twinkle-free points, dense at zenith

const B = {};
function bone(name, parentName, x, y, z){
  const b = new THREE.Bone();
  b.name = name;
  b.position.set(x, y, z);
  if(parentName) B[parentName].add(b);
  B[name] = b;
  return b;
}
const rootBone = bone('mixamorigHips', null, 0, 0.62, 0);
bone('mixamorigSpine',  'mixamorigHips',  0, 0.10, 0);
bone('mixamorigSpine1', 'mixamorigSpine', 0, 0.12, 0);
bone('mixamorigSpine2', 'mixamorigSpine1',0, 0.12, 0);
bone('mixamorigNeck',   'mixamorigSpine2',0, 0.12, 0);

}

const boneIndex = {};
allBones.forEach((b, i) => boneIndex[b.name] = i);
const V = { g: new THREE.Group() };
scene.add(V.g);
V.g.add(rootBone);
rootBone.updateMatrixWorld(true);
const bWorld = {};
for(const b of allBones){
  bWorld[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld)
    .sub(V.g.position);
}
V.g.remove(rootBone);
function partGeo(geoFn, boneName, colorHex){
  const g = geoFn();
  const p = bWorld[boneName];
  g.translate(p.x, p.y, p.z);
  const n = g.attributes.position.count;
  const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
  for(let i = 0; i < n; i++){ si[i*4] = boneIndex[boneName]; sw[i*4] = 1; }
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
  const col = new Float32Array(n*3);
  const c = new THREE.Color(colorHex);
  for(let i = 0; i < n; i++){ col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return g;
}
{

    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.085, 0.15, 8, 12);

    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.075, 10, 8);

    parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.125, 0.135, 0.045, 14);

    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.095, 12, 9);

}

// ---------- the CLIPS: the catch choreography, by bone name ----------------
function quatTrack(boneName, times, eulers){
  const vals = [];
  for(const e of eulers){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    vals.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.QuaternionKeyframeTrack(boneName + '.quaternion', times, vals);
}
const CLIPS = {};
{ // soft night walk — the rig-study walk, gentled
  const T = [0, 0.45, 0.9, 1.35, 1.8];
  const A = 0.5;
  CLIPS.walk = new THREE.AnimationClip('walk', 1.8, [
    quatTrack('mixamorigLeftUpLeg', T, [[A,0,0],[0,0,0],[-A,0,0],[0,0,0],[A,0,0]]),
    quatTrack('mixamorigRightUpLeg', T, [[-A,0,0],[0,0,0],[A,0,0],[0,0,0],[-A,0,0]]),
    quatTrack('mixamorigLeftLeg', T, [[0,0,0],[0.45,0,0],[0,0,0],[0.05,0,0],[0,0,0]]),
    quatTrack('mixamorigRightLeg', T, [[0,0,0],[0.05,0,0],[0,0,0],[0.45,0,0],[0,0,0]]),
    quatTrack('mixamorigLeftArm', T, [[-0.35,0,0.3],[0,0,0.3],[0.35,0,0.3],[0,0,0.3],[-0.35,0,0.3]]),
    quatTrack('mixamorigRightArm', T, [[0.35,0,-0.3],[0,0,-0.3],[-0.35,0,-0.3],[0,0,-0.3],[0.35,0,-0.3]]),
    quatTrack('mixamorigSpine', T, [[0.05,0,0.02],[0.05,0,0],[0.05,0,-0.02],[0.05,0,0],[0.05,0,0.02]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.62,0, 0,0.65,0, 0,0.62,0, 0,0.65,0, 0,0.62,0]),
  ]);
}
{ // lean in and CUP — both arms sweep forward, palms meeting; eyes on the hands
  const T = [0, 0.9, 1.6];
  CLIPS.cup = new THREE.AnimationClip('cup', 1.6, [
    quatTrack('mixamorigSpine', T, [[0.05,0,0],[0.3,0,0],[0.32,0,0]]),
    quatTrack('mixamorigLeftArm', T, [[0,0,0.3],[-1.5,0,0.35],[-1.6,-0.35,0.3]]),
    quatTrack('mixamorigRightArm', T, [[0,0,-0.3],[-1.5,0,-0.35],[-1.6,0.35,-0.3]]),
    quatTrack('mixamorigLeftForeArm', T, [[0,0,0],[-0.2,-0.3,0],[-0.3,-0.55,0]]),
    quatTrack('mixamorigRightForeArm', T, [[0,0,0],[-0.2,0.3,0],[-0.3,0.55,0]]),
    quatTrack('mixamorigNeck', T, [[0,0,0],[0.2,0,0],[0.25,0,0]]),
    quatTrack('mixamorigHead', T, [[0,0,0],[0.15,0,0],[0.2,0,0]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.62,0, 0,0.58,0, 0,0.57,0]),
  ]);
}
{ // PEEK — cupped hands lifted to the face, tiny breath sway (loops)
  const T = [0, 1.2, 2.4];
  CLIPS.peek = new THREE.AnimationClip('peek', 2.4, [
    quatTrack('mixamorigSpine', T, [[0.1,0,0],[0.12,0,0],[0.1,0,0]]),
    quatTrack('mixamorigLeftArm', T, [[-2.15,-0.3,0.35],[-2.2,-0.3,0.35],[-2.15,-0.3,0.35]]),
    quatTrack('mixamorigRightArm', T, [[-2.15,0.3,-0.35],[-2.2,0.3,-0.35],[-2.15,0.3,-0.35]]),
    quatTrack('mixamorigLeftForeArm', T, [[-0.5,-0.5,0],[-0.5,-0.5,0],[-0.5,-0.5,0]]),
    quatTrack('mixamorigRightForeArm', T, [[-0.5,0.5,0],[-0.5,0.5,0],[-0.5,0.5,0]]),
    quatTrack('mixamorigNeck', T, [[0.3,0,0],[0.33,0,0],[0.3,0,0]]),
    quatTrack('mixamorigHead', T, [[0.32,0,0],[0.35,0.05,0],[0.32,0,0]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.6,0, 0,0.605,0, 0,0.6,0]),
  ]);
}
{ // OPEN — the palms part outward and offer the sky (head left free to track)
  const T = [0, 1.1];
  CLIPS.open = new THREE.AnimationClip('open', 1.1, [
    quatTrack('mixamorigSpine', T, [[0.1,0,0],[0,0,0]]),
    quatTrack('mixamorigLeftArm', T, [[-2.15,-0.3,0.35],[-1.7,0,0.95]]),
    quatTrack('mixamorigRightArm', T, [[-2.15,0.3,-0.35],[-1.7,0,-0.95]]),
    quatTrack('mixamorigLeftForeArm', T, [[-0.5,-0.5,0],[0,0,0]]),
    quatTrack('mixamorigRightForeArm', T, [[-0.5,0.5,0],[0,0,0]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.6,0, 0,0.62,0]),
  ]);
}
{ // the goodbye WAVE (loops; head free)
  const T = [0, 0.25, 0.5, 0.75, 1.0];
  CLIPS.wave = new THREE.AnimationClip('wave', 1.0, [
    quatTrack('mixamorigLeftArm', T, [[0,0,0.3],[0,0,0.3],[0,0,0.3],[0,0,0.3],[0,0,0.3]]),
    quatTrack('mixamorigRightArm', T, [[0,0,-2.35],[0,0,-2.6],[0,0,-2.35],[0,0,-2.6],[0,0,-2.35]]),
    quatTrack('mixamorigRightForeArm', T, [[0,0,-0.25],[0,0,0.25],[0,0,-0.25],[0,0,0.25],[0,0,-0.25]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.62,0, 0,0.62,0, 0,0.62,0, 0,0.62,0, 0,0.62,0]),
  ]);
}
const mixer = new THREE.AnimationMixer(V.mesh);
const actions = {};
for(const k of Object.keys(CLIPS)) actions[k] = mixer.clipAction(CLIPS[k]);
actions.cup.setLoop(THREE.LoopOnce); actions.cup.clampWhenFinished = true;
actions.open.setLoop(THREE.LoopOnce); actions.open.clampWhenFinished = true;
let currentAction = null;
function playClip(name, fade = 0.35){
  const next = actions[name];
  if(currentAction === next) return;
  next.reset().play();
  if(currentAction) next.crossFadeFrom(currentAction, fade, false);
  currentAction = next;
}
// manual head aim (only while the active clip leaves the head free)
function aimHeadAt(worldPos, dt, k = 5){
  const local = V.g.worldToLocal(worldPos.clone());
  const head = new THREE.Vector3();
  B.mixamorigHead.getWorldPosition(head);
  const dy = worldPos.y - head.y;
  const dist = Math.hypot(local.x, local.z);
  const pitch = clamp(-Math.atan2(dy, Math.max(0.3, dist)), -0.9, 0.6);
  const yaw = clamp(Math.atan2(local.x - 0, local.z - 0) - 0, -1.1, 1.1);
  B.mixamorigNeck.rotation.x = lerp(B.mixamorigNeck.rotation.x, pitch*0.45, dt*k);
  B.mixamorigNeck.rotation.y = lerp(B.mixamorigNeck.rotation.y, yaw*0.4, dt*k);
  B.mixamorigHead.rotation.x = lerp(B.mixamorigHead.rotation.x, pitch*0.55, dt*k);
  B.mixamorigHead.rotation.y = lerp(B.mixamorigHead.rotation.y, yaw*0.5, dt*k);
}

// ---------- the catch-and-release loop -------------------------------------
// 0–3.2  the brave one loiters by the bush; Vita walks up
// 3.2–5  Vita leans in, arms sweep together and CUP around it
// 5–9    holds the cupped hands up; the glow PULSES between the fingers
// 9–11   the hands open; the firefly hangs a beat, then
// 11–16  spirals UP into the dark; Vita's head follows it; a little wave
// 16–20  Vita wanders back to the fire; the brave one is a star now
let phT = 0;
const START = new THREE.Vector3(-1.6, 0.1, 3.4);
const CATCH_SPOT = new THREE.Vector3(BUSH.x - 0.85, 0.1, BUSH.z + 0.35);
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT = (phT + dt) % 20;
  const f = phT;

  // fire flicker
  fireLight.intensity = 2.0 + Math.sin(t*11)*0.35 + Math.sin(t*23 + 1.7)*0.2;
  for(const fl of flames){
    fl.m.scale.y = 0.7 + Math.sin(t*9 + fl.ph)*0.3;
    fl.m.scale.x = fl.m.scale.z = 0.85 + Math.sin(t*13 + fl.ph)*0.15;
    fl.m.material.opacity = 0.55 + Math.sin(t*7 + fl.ph)*0.25;
  }

  // ------ the swarm: drift + blink (independent or synchronized) ------
  const globalPh = (t*1.15) % (Math.PI*2);
  for(let i = 0; i < N; i++){
    const F = flies[i];
    fPos[i*3]   = F.hx + Math.sin(t*F.wx + F.px)*F.span;
    fPos[i*3+1] = clamp(F.hy + Math.sin(t*F.wy + F.py)*0.55, 0.15, 3.2);
    fPos[i*3+2] = F.hz + Math.sin(t*F.wz + F.pz)*F.span;
    if(SYNC){ // Kuramoto-lite: everyone eases toward the common beat
      let d = globalPh - F.blinkPh % (Math.PI*2);
      if(d > Math.PI) d -= Math.PI*2; if(d < -Math.PI) d += Math.PI*2;
      F.blinkPh += (1.15 + d*0.45)*dt;
    } else {
      F.blinkPh += F.blinkW*dt;
    }
    const s = Math.sin(F.blinkPh);
    const b = s > 0 ? Math.pow(s, 3) : 0;        // sharp on, long off
    fCol[i*3]   = 0.85*b;
    fCol[i*3+1] = 1.0*b;
    fCol[i*3+2] = 0.35*b;
  }
  swarmGeo.attributes.position.needsUpdate = true;
  swarmGeo.attributes.color.needsUpdate = true;

  // ------ the brave one + the Vita (all body motion = armature clips) ------
  const heroPulse = 0.55 + Math.pow(Math.max(0, Math.sin(t*2.4)), 3)*0.45;
  const handMid = () => {
    const a = new THREE.Vector3(), b = new THREE.Vector3();
    B.mixamorigLeftHand.getWorldPosition(a);
    B.mixamorigRightHand.getWorldPosition(b);
    return a.add(b).multiplyScalar(0.5);
  };
  let headTarget = null;                     // set only when the clip leaves the head free
  if(f < 3.2){                               // loiter low; Vita approaches softly
    playClip('walk');
    actions.walk.timeScale = 0.85;
    hero.position.set(
      BUSH.x + Math.sin(t*0.7)*0.4,
      0.55 + Math.sin(t*1.3)*0.18,
      BUSH.z + Math.cos(t*0.9)*0.4);
    hero.material.opacity = heroPulse;
    heroLight.intensity = heroPulse*0.5;
    const p = smooth(f/3.2);
    V.g.position.lerpVectors(START, CATCH_SPOT, p);
    V.g.rotation.y = Math.atan2(CATCH_SPOT.x - START.x, CATCH_SPOT.z - START.z);
    headTarget = hero.position;              // eyes on it the whole approach
  } else if(f < 5){                          // lean in and CUP (LoopOnce, clamps)
    playClip('cup', 0.25);
    const want = Math.atan2(hero.position.x - V.g.position.x, hero.position.z - V.g.position.z);
    V.g.rotation.y += (want - V.g.rotation.y)*Math.min(1, dt*4);
    hero.material.opacity = heroPulse;
    heroLight.intensity = heroPulse*0.5;
    if(f > 4.4)                              // the gentle snap — caught!
      hero.position.lerp(handMid(), Math.min(1, dt*10));
  } else if(f < 9){                          // PEEK at the pulse through the fingers
    playClip('peek', 0.5);
    hero.position.copy(handMid());
    const cupped = 0.2 + Math.pow(Math.max(0, Math.sin(t*2.4)), 3)*0.5;
    hero.material.opacity = cupped;
    hero.scale.setScalar(0.22 + cupped*0.1); hero.scale.z = 1;
    heroLight.intensity = cupped*0.9;        // hands glow from inside
  } else if(f < 11){                         // the hands OPEN
    playClip('open', 0.4);
    hero.position.lerp(handMid().add(new THREE.Vector3(0, 0.1, 0)), dt*4);
    hero.material.opacity = heroPulse;
    hero.scale.set(0.34, 0.34, 1);
    heroLight.intensity = heroPulse*0.5;
    headTarget = hero.position;              // open clip leaves the head free
  } else if(f < 16){                         // the spiral UP; head + wave follow
    const k = (f - 11)/5;
    const releaseAt = new THREE.Vector3(CATCH_SPOT.x, 1.6, CATCH_SPOT.z + 0.4);
    hero.position.set(
      releaseAt.x + Math.cos(k*9)*0.5*(1 - k*0.4),
      releaseAt.y + k*k*6.5,
      releaseAt.z + Math.sin(k*9)*0.5*(1 - k*0.4));
    hero.material.opacity = heroPulse*(1 - smooth(clamp((k - 0.75)/0.25, 0, 1)));
    heroLight.intensity = 0;
    playClip(f < 13.5 ? 'open' : 'wave', 0.45);
    headTarget = hero.position;
  } else {                                   // back to the fire
    hero.material.opacity = 0; heroLight.intensity = 0;
    playClip('walk', 0.45);
    actions.walk.timeScale = 1;
    const p = smooth(clamp((f - 16)/3.6, 0, 1));
    const FIRESEAT = new THREE.Vector3(fireLight.position.x + 1.5, 0.1, fireLight.position.z + 1.1);
    V.g.position.lerpVectors(CATCH_SPOT, FIRESEAT, p);
    V.g.rotation.y = Math.atan2(FIRESEAT.x - CATCH_SPOT.x, FIRESEAT.z - CATCH_SPOT.z);
  }

  mixer.update(dt);
  if(headTarget) aimHeadAt(headTarget, dt);
  else if(currentAction === actions.walk){   // ease the free head back to neutral
    for(const bn of ['mixamorigNeck', 'mixamorigHead']){
      B[bn].rotation.x = lerp(B[bn].rotation.x, 0, dt*4);
      B[bn].rotation.y = lerp(B[bn].rotation.y, 0, dt*4);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
