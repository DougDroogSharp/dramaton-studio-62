<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe2f0f6), 60, 300);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 500);

// ==========================================================================
//  THE CANONICAL SKELETON (verbatim from vita_rig_study.html)
// ==========================================================================
const B = {};
function bone(name, parentName, x, y, z){
  const b = new THREE.Bone();
  b.name = name;
  b.position.set(x, y, z);
  if(parentName) B[parentName].add(b);
  B[name] = b;
  return b;
}
const rootBone = bone('mixamorigHips', null, 0, 0.62, 0);
bone('mixamorigSpine',  'mixamorigHips',  0, 0.10, 0);
bone('mixamorigSpine1', 'mixamorigSpine', 0, 0.12, 0);
bone('mixamorigSpine2', 'mixamorigSpine1',0, 0.12, 0);
bone('mixamorigNeck',   'mixamorigSpine2',0, 0.12, 0);
bone('mixamorigHead',   'mixamorigNeck',  0, 0.10, 0);
for(const [S, s] of [['Left', 1], ['Right', -1]]){
  bone(`mixamorig${S}Shoulder`, 'mixamorigSpine2', s*0.16, 0.06, 0);
  bone(`mixamorig${S}Arm`,      `mixamorig${S}Shoulder`, s*0.14, -0.02, 0);
  bone(`mixamorig${S}ForeArm`,  `mixamorig${S}Arm`, s*0.09, -0.20, 0);
  bone(`mixamorig${S}Hand`,     `mixamorig${S}ForeArm`, s*0.05, -0.18, 0);
  bone(`mixamorig${S}UpLeg`,    'mixamorigHips', s*0.155, -0.06, 0);
  bone(`mixamorig${S}Leg`,      `mixamorig${S}UpLeg`, 0, -0.26, 0);
  bone(`mixamorig${S}Foot`,     `mixamorig${S}Leg`, 0, -0.26, 0);
  bone(`mixamorig${S}ToeBase`,  `mixamorig${S}Foot`, 0, -0.04, 0.12);
}
const allBones = Object.values(B);
const skeleton = new THREE.Skeleton(allBones);
const boneIndex = {};
allBones.forEach((b, i) => boneIndex[b.name] = i);
const ourRoot = new THREE.Group();
ourRoot.position.set(-0.9, 0, 0);
scene.add(ourRoot);
ourRoot.add(rootBone);
ourRoot.updateMatrixWorld(true);     // so the bone world positions include the -0.9 offset
rootBone.updateMatrixWorld(true);
const bWorld = {};
for(const b of allBones){
  bWorld[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld)
    .sub(ourRoot.position);
}
ourRoot.remove(rootBone);
function partGeo(geoFn, boneName, colorHex){
  let g = geoFn();
  if(g.index) g = g.toNonIndexed();   // icosahedra are non-indexed — unify, or merge fails
  const p = bWorld[boneName];
  g.translate(p.x, p.y, p.z);
  const n = g.attributes.position.count;
  const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
  for(let i = 0; i < n; i++){ si[i*4] = boneIndex[boneName]; sw[i*4] = 1; }
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
  const col = new Float32Array(n*3);
  const c = new THREE.Color(colorHex);
  for(let i = 0; i < n; i++){ col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return g;
}

// ==========================================================================
//  THE SKIN LIBRARY — every body binds to the SAME skeleton.
// ==========================================================================
function buildChibi(pal){
  const skinDk = new THREE.Color(pal.skin).offsetHSL(0, 0.02, -0.05).getHex();
  const shirtDk = new THREE.Color(pal.shirt).offsetHSL(0, 0, -0.07).getHex();
  const parts = [];
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.23, 20, 14);
    g.scale(1.34, 0.8, 1.0); g.translate(0, -0.02, 0); return g; }, 'mixamorigHips', pal.pants));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.215, 0.245, 0.16, 18);
    g.translate(0, 0.02, 0); return g; }, 'mixamorigSpine', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.26, 20, 16);
    g.scale(1.22, 0.98, 0.9); g.translate(0, 0.04, 0.01); return g; }, 'mixamorigSpine1', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.1, 0.115, 0.44, 14);
    g.rotateZ(Math.PI/2); g.translate(0, 0.05, 0); return g; }, 'mixamorigSpine2', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.085, 0.105, 0.14, 14);
    g.translate(0, 0.05, 0); return g; }, 'mixamorigNeck', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.40, 28, 20);
    g.scale(1.04, 1.0, 0.97); g.translate(0, 0.24, 0); return g; }, 'mixamorigHead', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.065, 12, 9);
    g.translate(0, 0.17, 0.4); return g; }, 'mixamorigHead', pal.skin));
  for(const s of [-1, 1]){
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.07, 10, 8);
      g.scale(0.7, 1, 0.9); g.translate(s*0.41, 0.2, 0.02); return g; }, 'mixamorigHead', skinDk));
  }
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.41, 24, 14, 0, Math.PI*2, 0, Math.PI*0.42);
    g.scale(1.05, 1.0, 0.99); g.translate(0, 0.26, 0); return g; }, 'mixamorigHead', pal.hair));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.12, 10, 7);
    g.scale(1.9, 0.42, 0.6); g.translate(0, 0.5, 0.28); return g; }, 'mixamorigHead', pal.hair));
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.082, 0.1, 6, 12);
      g.rotateZ(s*0.35); g.translate(s*0.075, -0.05, 0); return g; }, `mixamorig${S}Arm`, pal.shirt));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.074, 0.1, 6, 12);
      g.rotateZ(-s*0.1); g.translate(s*0.1, -0.17, 0); return g; }, `mixamorig${S}Arm`, shirtDk));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.066, 0.13, 6, 12);
      g.translate(s*0.028, -0.09, 0); return g; }, `mixamorig${S}ForeArm`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.092, 14, 10);
      g.scale(0.9, 1.1, 1); g.translate(0, -0.05, 0); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.032, 0.05, 4, 8);
      g.rotateZ(-s*0.7); g.translate(-s*0.075, -0.02, 0.03); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.135, 0.15, 8, 14);
      g.scale(1, 1, 1.08); g.rotateZ(s*0.06); g.translate(s*0.012, -0.13, 0.01); return g; }, `mixamorig${S}UpLeg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.085, 0.15, 8, 12);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.075, 10, 8);
      g.scale(0.9, 1.25, 0.9); g.translate(0, -0.07, -0.045); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.125, 14, 10);
      g.scale(1, 0.72, 1.2); g.translate(0, -0.015, 0.02); return g; }, `mixamorig${S}Foot`, 0xf2f2f0));
    parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.125, 0.135, 0.045, 14);
      g.scale(1, 1, 1.3); g.translate(0, -0.08, 0.03); return g; }, `mixamorig${S}Foot`, 0x3a3d42));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.095, 12, 9);
      g.scale(1, 0.62, 1.05); g.translate(0, -0.035, 0.055); return g; }, `mixamorig${S}ToeBase`, 0xf2f2f0));
  }
  return new THREE.SkinnedMesh(mergeGeometries(parts, false),
    new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.7 }));
}
// the alien — SMOOTHED (Doug: facets read as menacing; keep it friendly)
function buildAlien(pal){
  const EYE = 0x1c2228, TOE = 0xd8dcc8, GLOW = pal.glow;
  const parts = [];
  const P = (fn, bn, col) => parts.push(partGeo(fn, bn, col));
  P(() => { const g = new THREE.SphereGeometry(0.17, 14, 10);
    g.scale(1.1, 0.75, 0.95); return g; }, 'mixamorigHips', pal.body);
  // a soft rounded tail, not a spike
  P(() => { const g = new THREE.CapsuleGeometry(0.055, 0.18, 6, 10);
    g.rotateX(2.1); g.translate(0, -0.06, -0.2); return g; }, 'mixamorigHips', pal.dark);
  P(() => { const g = new THREE.CapsuleGeometry(0.035, 0.13, 6, 8);
    g.rotateX(2.5); g.translate(0, -0.15, -0.34); return g; }, 'mixamorigHips', pal.dark);
  P(() => { const g = new THREE.CylinderGeometry(0.115, 0.14, 0.16, 14);
    g.translate(0, 0.02, 0); return g; }, 'mixamorigSpine', pal.body);
  P(() => { const g = new THREE.SphereGeometry(0.21, 16, 12);
    g.scale(1.15, 1.0, 0.85); g.translate(0, 0.04, 0); return g; }, 'mixamorigSpine1', pal.body);
  P(() => { const g = new THREE.CylinderGeometry(0.07, 0.08, 0.36, 12);
    g.rotateZ(Math.PI/2); g.translate(0, 0.05, 0); return g; }, 'mixamorigSpine2', pal.body);
  P(() => { const g = new THREE.CylinderGeometry(0.055, 0.075, 0.18, 12);
    g.translate(0, 0.05, 0); return g; }, 'mixamorigNeck', pal.body);
  // the head: tall SMOOTH cranium, gentle jaw, big friendly eyes
  P(() => { const g = new THREE.SphereGeometry(0.34, 22, 16);
    g.scale(0.95, 1.4, 1.05); g.translate(0, 0.3, 0.02); return g; }, 'mixamorigHead', pal.body);
  P(() => { const g = new THREE.SphereGeometry(0.2, 14, 10);
    g.scale(0.62, 0.5, 0.72); g.translate(0, 0.03, 0.09); return g; }, 'mixamorigHead', pal.body);
  for(const s of [-1, 1]){
    P(() => { const g = new THREE.SphereGeometry(0.11, 14, 10);
      g.scale(1.15, 0.75, 0.5); g.rotateZ(s*0.38); g.rotateY(s*0.5);
      g.translate(s*0.17, 0.3, 0.26); return g; }, 'mixamorigHead', EYE);
    // a little glint in each eye — reads as warmth
    P(() => { const g = new THREE.SphereGeometry(0.028, 8, 6);
      g.translate(s*0.13, 0.34, 0.33); return g; }, 'mixamorigHead', 0xf2f6f8);
    P(() => { const g = new THREE.CylinderGeometry(0.012, 0.02, 0.3, 8);
      g.rotateZ(-s*0.45); g.translate(s*0.14, 0.68, 0); return g; }, 'mixamorigHead', pal.dark);
    P(() => { const g = new THREE.SphereGeometry(0.04, 10, 8);
      g.translate(s*0.205, 0.81, 0); return g; }, 'mixamorigHead', GLOW);
  }
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    P(() => { const g = new THREE.CapsuleGeometry(0.045, 0.16, 6, 10);
      g.rotateZ(s*0.2); g.translate(s*0.04, -0.09, 0); return g; }, `mixamorig${S}Arm`, pal.body);
    P(() => { const g = new THREE.CapsuleGeometry(0.04, 0.2, 6, 10);
      g.translate(s*0.02, -0.12, 0); return g; }, `mixamorig${S}ForeArm`, pal.body);
    P(() => { const g = new THREE.SphereGeometry(0.055, 12, 9);
      g.scale(1, 1.1, 0.8); g.translate(0, -0.04, 0); return g; }, `mixamorig${S}Hand`, pal.body);
    for(const [dz, rx] of [[-0.035, -0.22], [0, 0], [0.035, 0.22]]){
      P(() => { const g = new THREE.CapsuleGeometry(0.016, 0.1, 4, 8);
        g.rotateX(rx); g.translate(0, -0.14, dz); return g; }, `mixamorig${S}Hand`, pal.dark);
    }
    P(() => { const g = new THREE.CapsuleGeometry(0.016, 0.06, 4, 8);
      g.rotateZ(-s*0.9); g.translate(-s*0.055, -0.04, 0.02); return g; }, `mixamorig${S}Hand`, pal.dark);
    P(() => { const g = new THREE.CapsuleGeometry(0.075, 0.16, 6, 10);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}UpLeg`, pal.body);
    P(() => { const g = new THREE.CapsuleGeometry(0.055, 0.16, 6, 10);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}Leg`, pal.body);
    P(() => { const g = new THREE.SphereGeometry(0.08, 12, 9);
      g.scale(0.9, 0.6, 1.5); g.translate(0, -0.04, 0.04); return g; }, `mixamorig${S}Foot`, pal.body);
    // rounded toe nubs, not claws
    for(const dx of [-0.032, 0.032]){
      P(() => { const g = new THREE.SphereGeometry(0.03, 8, 6);
        g.scale(1, 0.8, 1.35); g.translate(dx, -0.035, 0.1); return g; }, `mixamorig${S}ToeBase`, TOE);
    }
  }
  return new THREE.SkinnedMesh(mergeGeometries(parts, false),
    new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.7 }));
}
const SKINLIB = [
  { name:'Vita — blue',  build: () => buildChibi({ shirt:0x2e6fd8, pants:0x4c5666, skin:0xeab98f, hair:0x54402e }) },
  { name:'Vita — red',   build: () => buildChibi({ shirt:0xc0392b, pants:0x4c5666, skin:0xeab98f, hair:0x2e2620 }) },
  { name:'Vita — royal', build: () => buildChibi({ shirt:0x7d3fa8, pants:0x3c3050, skin:0xf2c299, hair:0x8a5a28 }) },
  { name:'Alien — green', build: () => buildAlien({ body:0x9cb87c, dark:0x7a9660, glow:0xd8e848 }) },
  { name:'Alien — gray',  build: () => buildAlien({ body:0xb2bab4, dark:0x8a948c, glow:0x6ce4e8 }) },
];
// build them all, bind them all to the ONE skeleton, show one at a time
const meshes = SKINLIB.map((def, i) => {
  const m = def.build();
  m.castShadow = true;
  m.frustumCulled = false;
  if(i === 0) m.add(rootBone);            // the bones live under the first body
  m.bind(skeleton);
  m.visible = i === 0;
  ourRoot.add(m);
  return m;
});
const skinSel = document.getElementById('skinsel');
SKINLIB.forEach((def, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = def.name;
  skinSel.appendChild(o);
});
function showSkin(v){
  if(String(v).startsWith('dl:')){
    activeDL = +String(v).slice(3);
    meshes.forEach(m => m.visible = false);
    DL.forEach((d, i) => d.obj.visible = i === activeDL);
  } else {
    activeDL = -1;
    DL.forEach(d => d.obj.visible = false);
    meshes.forEach((m, i) => m.visible = i === +v);
  }
  replay();
}
skinSel.addEventListener('change', () => showSkin(skinSel.value));

// ---------- our test clips (authored on the canonical rig) -----------------
function quatTrack(boneName, times, eulers){
  const vals = [];
  for(const e of eulers){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    vals.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.QuaternionKeyframeTrack(boneName + '.quaternion', times, vals);
}
const OURS = [];
{

    quatTrack('mixamorigRightLeg', T, [[0,0,0],[0.05,0,0],[0,0,0],[0.5,0,0],[0,0,0]]),

    quatTrack('mixamorigSpine', T, [[0.06,0,0.03],[0.06,0,0],[0.06,0,-0.03],[0.06,0,0],[0.06,0,0.03]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.62,0, 0,0.66,0, 0,0.62,0, 0,0.66,0, 0,0.62,0]),
  ]));
}
{
  const T = [0, 0.25, 0.5, 0.75, 1.0];
  OURS.push(new THREE.AnimationClip('test_wave', 1.0, [
    quatTrack('mixamorigRightArm', T, [[0,0,-0.3],[0,0,-2.4],[0,0,-2.7],[0,0,-2.4],[0,0,-0.3]]),
    quatTrack('mixamorigRightForeArm', T, [[0,0,0],[0,0,-0.3],[0,0,0.3],[0,0,-0.3],[0,0,0]]),
    quatTrack('mixamorigHead', T, [[0,0,0],[0,0,0.12],[0,0,0.12],[0,0,0.12],[0,0,0]]),

}
{
  const T = [0, 0.7, 1.4, 2.1, 2.8];
  OURS.push(new THREE.AnimationClip('test_squat', 2.8, [
    quatTrack('mixamorigLeftUpLeg', T, [[0,0,0],[-1.15,0,0.12],[-1.15,0,0.12],[-1.15,0,0.12],[0,0,0]]),
    quatTrack('mixamorigRightUpLeg', T, [[0,0,0],[-1.15,0,-0.12],[-1.15,0,-0.12],[-1.15,0,-0.12],[0,0,0]]),
    quatTrack('mixamorigLeftLeg', T, [[0,0,0],[1.75,0,0],[1.75,0,0],[1.75,0,0],[0,0,0]]),
    quatTrack('mixamorigRightLeg', T, [[0,0,0],[1.75,0,0],[1.75,0,0],[1.75,0,0],[0,0,0]]),
    quatTrack('mixamorigSpine', T, [[0,0,0],[0.3,0,0],[0.3,0,0],[0.3,0,0],[0,0,0]]),
    quatTrack('mixamorigLeftArm', T, [[0,0,0.3],[-1.1,0,0.3],[-1.1,0,0.3],[-1.1,0,0.3],[0,0,0.3]]),
    quatTrack('mixamorigRightArm', T, [[0,0,-0.3],[-1.1,0,-0.3],[-1.1,0,-0.3],[-1.1,0,-0.3],[0,0,-0.3]]),
    new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
      [0,0.62,0, 0,0.34,0, 0,0.34,0, 0,0.34,0, 0,0.62,0]),
  ]));
}
{
  const T = [0, 0.8, 1.6, 2.4, 3.2, 4.0];
  OURS.push(new THREE.AnimationClip('test_headaim', 4.0, [
    quatTrack('mixamorigNeck', T, [[0,0,0],[0,0.5,0],[0,0.5,0],[0,-0.5,0],[0,-0.5,0],[0,0,0]]),
    quatTrack('mixamorigHead', T, [[0,0,0],[0,0.35,0],[-0.3,0.3,0],[0,-0.35,0],[0.25,-0.3,0],[0,0,0]]),
    quatTrack('mixamorigSpine2', T, [[0,0,0],[0,0.12,0],[0,0.12,0],[0,-0.12,0],[0,-0.12,0],[0,0,0]]),
  ]));
}

// ==========================================================================
//  GUESTS & DOWNLOADED SKINS — Xbot stands at the right as the reference;
//  every .glb listed in vendor/models/manifest.json (or DRAGGED onto this
//  page) joins the SKIN menu and takes the left spot when picked. Foreign
//  skins keep their own skeletons — clips travel by bone name, and only
//  quaternion tracks cross rigs (positions stay home).
// ==========================================================================
const ourMixer = new THREE.AnimationMixer(meshes[0]);
const animSel = document.getElementById('animsel');
const loader = new GLTFLoader();
const DL = [];                    // downloaded skins {name, obj, mixer, clips, action}
let activeDL = -1;                // -1 = a built-in body is on stage
let xbot = null;                  // {mixer, clips, action}
let ourAction = null;
let lastPick = null;

function quatsOnly(clip){
  return new THREE.AnimationClip(clip.name, clip.duration,
    clip.tracks.filter(tr => !tr.name.endsWith('.position') && !tr.name.endsWith('.scale')));
}
function normNames(clip){
  for(const tr of clip.tracks) tr.name = tr.name.replace('mixamorig:', 'mixamorig');
  return clip;
}
function stopAll(){
  if(ourAction) ourAction.stop();
  if(xbot?.action) xbot.action.stop();
  for(const d of DL) if(d.action) d.action.stop();
}
function playAll(clip, src, si = -1){
  lastPick = { clip, src, si };
  stopAll();
  if(activeDL < 0){
    ourAction = ourMixer.clipAction(src === 'ours' ? clip : quatsOnly(clip), meshes[0]);
    ourAction.reset().play();
  } else {
    const d = DL[activeDL];
    d.action = d.mixer.clipAction(src === 'skin' && si === activeDL ? clip : quatsOnly(clip));
    d.action.reset().play();
  }
  if(xbot){
    xbot.action = xbot.mixer.clipAction(src === 'xbot' ? clip : quatsOnly(clip));
    xbot.action.reset().play();
  }
}
function replay(){ if(lastPick) playAll(lastPick.clip, lastPick.src, lastPick.si); }

// the cascade: one <select>, an <optgroup> per MODEL, its clips inside
const ogOurs = document.createElement('optgroup');
ogOurs.label = '★ Canonical Vita rig — authored clips';
OURS.forEach((c, i) => {
  const o = document.createElement('option');
  o.value = 'ours:' + i; o.textContent = c.name;
  ogOurs.appendChild(o);
});
animSel.appendChild(ogOurs);
animSel.addEventListener('change', () => {
  const p = animSel.value.split(':');
  if(p[0] === 'ours') playAll(OURS[+p[1]], 'ours');
  else if(p[0] === 'xbot' && xbot) playAll(xbot.clips[+p[1]], 'xbot');
  else if(p[0] === 'skin') playAll(DL[+p[1]].clips[+p[2]], 'skin', +p[1]);
});

const ogDL = document.createElement('optgroup');
ogDL.label = 'Downloaded skins';
skinSel.appendChild(ogDL);

function groundAndScale(obj, x){
  const box = new THREE.Box3().setFromObject(obj);
  const h = Math.max(0.01, box.max.y - box.min.y);
  const s = 1.55/h;                // every guest stands Vita-height
  obj.scale.setScalar(s);
  obj.position.set(x, -box.min.y*s, 0);
}
function registerSkin(name, gltf){
  const obj = gltf.scene;
  obj.traverse(o => { if(o.isMesh || o.isSkinnedMesh) o.castShadow = true; });
  groundAndScale(obj, -0.9);
  obj.visible = false;
  scene.add(obj);
  const clips = (gltf.animations || []).map(normNames);
  DL.push({ name, obj, mixer: new THREE.AnimationMixer(obj), clips, action:null });
  const si = DL.length - 1;
  const o = document.createElement('option');
  o.value = 'dl:' + si; o.textContent = name;
  ogDL.appendChild(o);
  if(clips.length){
    const og = document.createElement('optgroup');
    og.label = name + ' — bundled clips';
    clips.forEach((c, ci) => {
      const oo = document.createElement('option');
      oo.value = 'skin:' + si + ':' + ci; oo.textContent = c.name;
      og.appendChild(oo);
    });
    animSel.appendChild(og);
  }
  return si;
}

// the manifest: any .glb dropped into vendor/models/ and listed there
fetch('./vendor/models/manifest.json')
  .then(r => r.ok ? r.json() : null)
  .then(man => {
    if(!man?.skins) return;
    for(const it of man.skins){
      if(it.file === 'Xbot.glb') continue;   // Xbot is the standing reference
      loader.load('./vendor/models/' + it.file,
        g => registerSkin(it.name || it.file, g),
        undefined, err => console.warn('skin load failed', it.file, err));
    }
  }).catch(() => {});

// drag a .glb from anywhere onto the page — instant audition
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  for(const f of e.dataTransfer.files){
    f.arrayBuffer().then(buf => loader.parse(buf, './', g => {
      const si = registerSkin(f.name.replace(/\.(glb|gltf)$/i, ''), g);
      skinSel.value = 'dl:' + si;
      showSkin('dl:' + si);
    }, err => console.warn('drop parse failed', err)));
  }
});

// Xbot — the permanent reference on the right
loader.load('./vendor/models/Xbot.glb', gltf => {
  const guest = gltf.scene;
  guest.position.set(0.9, 0, 0);
  guest.traverse(o => { if(o.isMesh || o.isSkinnedMesh) o.castShadow = true; });
  scene.add(guest);
  xbot = { mixer: new THREE.AnimationMixer(guest),
           clips: (gltf.animations || []).map(normNames), action:null };
  const og = document.createElement('optgroup');
  og.label = 'Xbot — real Mixamo library (from the .glb)';
  xbot.clips.forEach((c, i) => {
    const o = document.createElement('option');
    o.value = 'xbot:' + i; o.textContent = c.name;
    og.appendChild(o);
  });
  animSel.appendChild(og);
  playAll(OURS[0], 'ours');               // open on our walk
}, undefined, () => playAll(OURS[0], 'ours'));

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  ourMixer.update(dt);
  if(xbot) xbot.mixer.update(dt);
  for(const d of DL) d.mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// stage remote-control: #set=<selectId>:<value>[,...] · #click=<data-m>
{
  const _h = new URLSearchParams(location.hash.slice(1));
  const _s = _h.get('set');
  if(_s) for(const pair of _s.split(',')){
    const [id, val] = pair.split(':');
    const el = document.getElementById(id);
    if(el){ el.value = val; el.dispatchEvent(new Event('change')); }
  }
  const _c = _h.get('click');
  if(_c){ const b = document.querySelector('[data-m="' + _c + '"]'); if(b) b.click(); }
}
</script>
