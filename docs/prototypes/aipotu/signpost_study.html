<!DOCTYPE html>
<!-- ======================================================================
     SIGNPOST STUDY — wayfinding, for George World.
     Filed 2026-08-31. Standalone; vendored three (r160), game importmap.
     A weathered post with FIVE pointing-finger boards (painted canvas
     text + a carved pointing hand) aimed at real island features:
     THE BIG GROVE · KING'S HILL · THE VOLCANO · SURF BEACH · THE WELL.
     Boards at different heights/angles, one hanging crooked from a
     single nail (it swings). The scene: a traveler Vita walks up,
     READS (head tilting up the boards one by one), SCRATCHES its
     head, re-reads the grove board, then POINTS the matching way,
     nods, and walks off in exactly that direction. Pairs with the
     map's named-feature dialogue.
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signpost Study</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#e4e6d4; }
  #chip { position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(26,28,18,0.78); color:#f2f4e4; font:13px/1.5 system-ui, sans-serif;
    padding:10px 14px; border-radius:10px; user-select:none; backdrop-filter:blur(4px); }
  #chip b { font-size:14px; }
  #chip .hint { opacity:0.7; }
</style>
</head>
<body>
<div id="chip">
  <b>🪧 Signpost Study</b> — read, scratch, point, go, v1<br>
  <span class="hint">drag to orbit · scroll to zoom · the crooked board swings on its one nail</span>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 7878;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe2e4d2), 40, 240);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.2, 600);
camera.position.set(3.6, 2.6, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.5; controls.maxDistance = 30;
controls.maxPolarAngle = 1.52;
{
  const geo = new THREE.SphereGeometry(280, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xf4f2e2), zenith = new THREE.Color(0x84b2d8),
        below = new THREE.Color(0xd8dac6), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/280;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.6)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xdcecf6, 0xaca878, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.3);
sun.position.set(16, 24, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
scene.add(sun);
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(240, 40),
    new THREE.MeshLambertMaterial({ color:0xbcb684 }));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
  // a fork of worn paths radiating from the post
  for(const a of [0.5, 1.9, 3.4, 4.6, 5.7]){
    const path = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 7),
      new THREE.MeshLambertMaterial({ color:0xc4ae7e }));
    path.rotation.x = -Math.PI/2;
    path.rotation.z = -a;
    path.position.set(Math.sin(a)*4, 0.01, Math.cos(a)*4);
    scene.add(path);
  }
}

// ---------- THE POST -------------------------------------------------------
const matWood = new THREE.MeshLambertMaterial({ color:0x8a6a42, flatShading:true });
const boards = [];
function boardTex(text){
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = '#a3865a'; g.fillRect(0, 0, 256, 64);
  // grain streaks
  for(let i = 0; i < 12; i++){
    g.strokeStyle = 'rgba(90,64,36,0.25)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(0, 6 + i*5 + Math.random()*2);
    g.lineTo(256, 6 + i*5 + Math.random()*2);
    g.stroke();
  }
  // the carved POINTING HAND
  g.fillStyle = '#3a2c18';
  g.font = '900 30px system-ui';
  g.fillText('☞', 6, 44);
  g.font = '900 26px Georgia, serif';
  g.fillText(text, 48, 42);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
{
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 3.1, 8), matWood);
  post.position.y = 1.55;
  post.rotation.z = 0.035;               // a little weathered lean
  post.castShadow = true;
  scene.add(post);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), matWood);
  cap.position.y = 3.12;
  scene.add(cap);
  const DEFS = [
    ['THE BIG GROVE', 2.65, 0.55, false],
    ["KING'S HILL",   2.3, 2.3, false],
    ['THE VOLCANO',   1.95, 3.6, false],
    ['SURF BEACH',    1.6, 4.9, false],
    ['THE WELL',      1.25, 1.4, true],   // the crooked one, on one nail
  ];
  for(const [text, y, dirA, crooked] of DEFS){
    const pivot = new THREE.Group();       // the nail
    pivot.position.set(0, y, 0);
    pivot.rotation.y = -dirA;
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.24, 0.045),
      new THREE.MeshLambertMaterial({ map: boardTex(text) }));
    // the arrow end: a little pointed tip
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.2, 4),
      matWood);
    tip.rotation.z = -Math.PI/2;
    tip.rotation.y = Math.PI/4;
    tip.position.x = 0.66;
    b.add(tip);
    b.position.x = 0.62;                   // board sticks out one side of the post
    b.castShadow = true;
    pivot.add(b);
    scene.add(pivot);
    boards.push({ pivot, crooked, z0: crooked ? -0.35 : rand(-0.03, 0.03), ph: rand(0, 9), dirA });
    pivot.rotation.z = boards[boards.length-1].z0;
  }
}

// ---------- the traveler ---------------------------------------------------
const V = { g: new THREE.Group() };
{
  const dress = new THREE.MeshLambertMaterial({ color:0x9a7b5a });
  const skin = new THREE.MeshLambertMaterial({ color:0xecc9a2 });
  V.hips = new THREE.Group(); V.hips.position.y = 0.42; V.g.add(V.hips);
  const barrel = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.42, 6, 12), dress);
  barrel.position.y = 0.22; barrel.castShadow = true; V.hips.add(barrel);
  V.head = new THREE.Group(); V.head.position.y = 0.8; V.hips.add(V.head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), skin);
  skull.castShadow = true; V.head.add(skull);
  V.arms = [];
  for(const s of [-1, 1]){
    const arm = new THREE.Group();
    arm.position.set(s*0.32, 0.5, 0);
    const limb = new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.4, 4, 8), skin);
    limb.position.y = -0.24; limb.castShadow = true; arm.add(limb);
    V.hips.add(arm); V.arms.push(arm);
  }
  V.legs = [];
  for(const s of [-1, 1]){
    const leg = new THREE.Group();
    leg.position.set(s*0.14, 0, 0);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.32, 4, 8),
      new THREE.MeshLambertMaterial({ color:0x4c5666 }));
    shin.position.y = -0.26; shin.castShadow = true; leg.add(shin);
    V.hips.add(leg); V.legs.push(leg);
  }
  scene.add(V.g);
}
function walkCycle(t, sp = 1){
  const ph = t*8*sp;
  V.legs[0].rotation.x = Math.sin(ph)*0.45;
  V.legs[1].rotation.x = -Math.sin(ph)*0.45;
  V.hips.position.y = 0.42 + Math.abs(Math.cos(ph))*0.025;
}
function stillLegs(dt){
  V.legs[0].rotation.x = lerp(V.legs[0].rotation.x, 0, dt*6);
  V.legs[1].rotation.x = lerp(V.legs[1].rotation.x, 0, dt*6);
}

// ---------- the loop: approach → read up the boards → scratch → re-read
// the grove board → POINT its way → nod → walk off THAT way -----------------
let phT = 0;
const GROVE = boards ? 0 : 0;            // index of THE BIG GROVE board
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT = (phT + dt) % 17;
  const f = phT;

  // the crooked board swings on its nail; the others barely breathe
  for(const b of boards){
    if(b.crooked)
      b.pivot.rotation.z = b.z0 + Math.sin(t*1.9 + b.ph)*0.09;
    else
      b.pivot.rotation.z = b.z0 + Math.sin(t*1.1 + b.ph)*0.008;
  }

  const READ_SPOT = new THREE.Vector3(1.35, 0.1, 0.9);
  const groveDir = boards[0].dirA;         // the way THE BIG GROVE points
  if(f < 2.8){                             // walking up
    const p = smooth(f/2.8);
    V.g.position.lerpVectors(new THREE.Vector3(5.5, 0.1, 3.6), READ_SPOT, p);
    V.g.rotation.y = Math.atan2(READ_SPOT.x - 5.5, READ_SPOT.z - 3.6);
    walkCycle(t);
    V.head.rotation.set(0, 0, 0);
  } else if(f < 7.3){                      // READING: up the boards one by one
    stillLegs(dt);
    const want = Math.atan2(-V.g.position.x, -V.g.position.z);
    V.g.rotation.y += (want - V.g.rotation.y)*Math.min(1, dt*4);
    const bi = Math.floor((f - 2.8)/0.9) % 5;
    const targY = [-(2.65), -(2.3), -(1.95), -(1.6), -(1.25)][bi];
    V.head.rotation.x = lerp(V.head.rotation.x, -0.15 - (2.65 + targY)*0.28 - 0.25, dt*5);
    V.head.rotation.y = lerp(V.head.rotation.y, Math.sin(bi*1.3)*0.15, dt*5);
  } else if(f < 9.3){                      // THE HEAD SCRATCH — which way was it?
    stillLegs(dt);
    V.arms[1].rotation.x = -2.5;
    V.arms[1].rotation.z = 0.35 + Math.sin(t*9)*0.12;    // scratch-scratch
    V.head.rotation.z = 0.18;
    V.head.rotation.x = -0.2;
    V.hips.rotation.y = Math.sin(t*1.2)*0.05;            // weight shifting, unsure
  } else if(f < 10.6){                     // re-read THE BIG GROVE board
    stillLegs(dt);
    V.arms[1].rotation.x = lerp(V.arms[1].rotation.x, 0, dt*5);
    V.arms[1].rotation.z = lerp(V.arms[1].rotation.z, 0.12, dt*5);
    V.head.rotation.z = lerp(V.head.rotation.z, 0, dt*5);
    V.head.rotation.x = lerp(V.head.rotation.x, -0.55, dt*5);   // the top board
    V.head.rotation.y = lerp(V.head.rotation.y, 0.1, dt*5);
  } else if(f < 12.6){                     // POINT the matching way + the nod
    stillLegs(dt);
    const want = groveDir;                 // turn to face where the board points
    V.g.rotation.y += (want - V.g.rotation.y)*Math.min(1, dt*3);
    V.arms[1].rotation.x = -1.5;           // the point
    V.arms[1].rotation.z = 0.05 + Math.sin(t*3)*0.04;
    V.head.rotation.x = -0.06 + (f > 11.6 ? Math.sin(t*6.5)*0.2 : 0);   // the satisfied nod
    V.head.rotation.y = 0;
  } else {                                 // and off THAT way
    const p = smooth(clamp((f - 12.6)/4.4, 0, 1));
    const dst = new THREE.Vector3(Math.sin(groveDir)*7, 0.1, Math.cos(groveDir)*7);
    V.g.position.lerpVectors(READ_SPOT, dst, p);
    V.g.rotation.y = groveDir;
    walkCycle(t);
    V.arms[1].rotation.x = lerp(V.arms[1].rotation.x, 0, dt*4);
    V.head.rotation.x = lerp(V.head.rotation.x, 0, dt*4);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
