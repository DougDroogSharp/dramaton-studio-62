function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

// ==========================================================================
//  THE PAINTED FACE — verbatim from vita_study (7 expressions + blink)
// ==========================================================================
const SKIN = '#eab98f';
const EXPRS = ['happy','content','surprised','smug','weary','afraid','angry'];
function drawFace(g, expr, blink){
  const W = 256;
  g.fillStyle = SKIN; g.fillRect(0, 0, W, W);
  const P = {
    happy:     { lid:0,    browY:-8,  browA: 0.15, mouth:'grin',  blush:1, eyeS:1.0 },
    content:   { lid:0.25, browY:-2,  browA: 0.10, mouth:'smile', blush:1, eyeS:0.95 },
    surprised: { lid:0,    browY:-16, browA: 0.05, mouth:'O',     blush:0, eyeS:1.22 },
    smug:      { lid:0.38, browY:-6,  browA:-0.28, mouth:'smug',  blush:0, eyeS:0.95, browOne:true },
    weary:     { lid:0.55, browY: 2,  browA: 0.45, mouth:'flat',  blush:0, eyeS:0.9 },
    afraid:    { lid:0,    browY:-14, browA: 0.55, mouth:'wobble',blush:0, eyeS:1.15 },
    angry:     { lid:0.15, browY: 0,  browA:-0.55, mouth:'frown', blush:0, eyeS:0.95 },
  }[expr] || {};
  const lid = Math.max(P.lid ?? 0, blink);
  const eyeY = 110, mouthY = 163;
  for(const s of [-1, 1]){
    const ex = 128 + s*36;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.ellipse(ex, eyeY, 24*(P.eyeS||1), 29*(P.eyeS||1)*(1-lid*0.85), 0, 0, 7); g.fill();
    if(lid < 0.8){
      g.fillStyle = '#432';
      g.beginPath(); g.ellipse(ex, eyeY+4, 11.5, 13*(1-lid*0.7), 0, 0, 7); g.fill();
      g.fillStyle = '#000';
      g.beginPath(); g.ellipse(ex, eyeY+5, 6.5, 7.5*(1-lid*0.7), 0, 0, 7); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(ex-4, eyeY-1, 3.6, 4, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(ex+5, eyeY+8, 1.8, 2, 0, 0, 7); g.fill();
    }
    if(lid > 0){
      g.fillStyle = SKIN;
      g.beginPath();
      g.ellipse(ex, eyeY - 29*(1-lid*1.6), 26*(P.eyeS||1), 30*lid, 0, 0, 7);
      g.fill();
    }
    const bA = (P.browA||0)*s*-1, bY = eyeY - 42 + (P.browY||0)
             + (P.browOne && s===1 ? -7 : 0);
    g.save();
    g.translate(ex, bY);
    g.rotate(bA);
    g.fillStyle = '#54402e';
    g.beginPath(); g.roundRect(-20, -5, 40, 10, 5); g.fill();
    g.restore();
    if(P.blush){
      g.fillStyle = 'rgba(235,130,110,0.35)';
      g.beginPath(); g.ellipse(128 + s*62, 148, 12, 8, 0, 0, 7); g.fill();
    }
  }
  g.strokeStyle = '#5a3325'; g.fillStyle = '#7c3a2c';
  g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath();
  switch(P.mouth){
    case 'grin':
      g.moveTo(96, mouthY-6);
      g.quadraticCurveTo(128, mouthY+30, 160, mouthY-6);
      g.quadraticCurveTo(128, mouthY+6, 96, mouthY-6);
      g.fill();
      g.beginPath(); g.moveTo(96, mouthY-6);
      g.quadraticCurveTo(128, mouthY+30, 160, mouthY-6); g.stroke();
      break;
    case 'smile':
      g.moveTo(106, mouthY-2); g.quadraticCurveTo(128, mouthY+14, 150, mouthY-2); g.stroke(); break;
    case 'smug':
      g.moveTo(112, mouthY+2); g.quadraticCurveTo(140, mouthY+8, 154, mouthY-8); g.stroke(); break;
    case 'flat':
      g.moveTo(108, mouthY+3); g.quadraticCurveTo(128, mouthY+6, 148, mouthY+3); g.stroke(); break;
    case 'frown':
      g.moveTo(106, mouthY+10); g.quadraticCurveTo(128, mouthY-8, 150, mouthY+10); g.stroke(); break;
    case 'O':
      g.beginPath(); g.ellipse(128, mouthY+4, 13, 17, 0, 0, 7); g.fill();
      g.stroke(); break;
    case 'wobble':
      g.moveTo(104, mouthY+4);
      for(let i=1;i<=6;i++) g.lineTo(104 + i*8, mouthY+4 + (i%2 ? 7 : 0));
      g.stroke(); break;
  }
}

// ==========================================================================
//  BUILD ONE VITA — the v0.55 hero body, beard REMOVED per the v0.61 ruling
// ==========================================================================
const matSkin  = new THREE.MeshStandardMaterial({ color:0xeab98f, roughness:0.65 });
const matHair  = new THREE.MeshStandardMaterial({ color:0x54402e, roughness:0.8 });
const matPants = new THREE.MeshStandardMaterial({ color:0x4c5666, roughness:0.8 });
const matShoe  = new THREE.MeshStandardMaterial({ color:0xf2f2f0, roughness:0.6 });
const matSole  = new THREE.MeshStandardMaterial({ color:0x3a3d42, roughness:0.8 });
const matWood  = new THREE.MeshStandardMaterial({ color:0x9a7648, roughness:0.9 });

function makeVita(shirtHex, hairHex){
  const shirtMat = new THREE.MeshStandardMaterial({ color:shirtHex, roughness:0.75 });
  const hairMat = hairHex ? new THREE.MeshStandardMaterial({ color:hairHex, roughness:0.8 }) : matHair;
  const root = new THREE.Group();

  const hips = new THREE.Group();
  hips.position.y = 0.55;
  root.add(hips);

  const legs = {};
  const legGeo = new THREE.CapsuleGeometry(0.115, 0.30, 4, 10);
  legGeo.translate(0, -0.22, 0);
  const shoeGeo = new THREE.SphereGeometry(0.155, 12, 8);
  const soleGeo = new THREE.CylinderGeometry(0.155, 0.165, 0.06, 12);
  for(const s of [-1, 1]){
    const L = new THREE.Group();
    L.position.set(s*0.155, 0.02, 0);
    const leg = new THREE.Mesh(legGeo, matPants);
    leg.castShadow = true;
    const shoe = new THREE.Mesh(shoeGeo, matShoe);
    shoe.scale.set(1, 0.8, 1.35);
    shoe.position.set(0, -0.48, 0.05);
    shoe.castShadow = true;
    const sole = new THREE.Mesh(soleGeo, matSole);
    sole.scale.z = 1.35;
    sole.position.set(0, -0.545, 0.05);
    L.add(leg, shoe, sole);
    hips.add(L);
    legs[s] = L;
  }

  const torso = new THREE.Group();
  torso.position.y = 0.10;
  hips.add(torso);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 16), shirtMat);
  belly.scale.set(1.02, 1.05, 0.88);
  belly.position.y = 0.32;
  belly.castShadow = true;
  torso.add(belly);

  const arms = {};
  const armGeo = new THREE.CapsuleGeometry(0.085, 0.16, 4, 10);
  armGeo.translate(0, -0.11, 0);
  const foreGeo = new THREE.CapsuleGeometry(0.078, 0.13, 4, 10);
  foreGeo.translate(0, -0.10, 0);
  for(const s of [-1, 1]){
    const sh = new THREE.Group();
    sh.position.set(s*0.335, 0.50, 0);
    const up = new THREE.Mesh(armGeo, shirtMat);
    up.castShadow = true;
    const el = new THREE.Group();
    el.position.y = -0.22;
    const fore = new THREE.Mesh(foreGeo, matSkin);
    fore.castShadow = true;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.105, 10, 8), matSkin);
    hand.position.y = -0.26;
    hand.castShadow = true;
    const grip = new THREE.Group();          // props parent here
    grip.position.y = -0.28;
    el.add(fore, hand, grip);
    sh.add(up, el);
    torso.add(sh);
    arms[s] = { sh, el, grip };
  }

  // THE HEAD — big painted face; NO beard (v0.61: Vitas are non-binary)
  const headG = new THREE.Group();
  headG.position.y = 0.72;
  torso.add(headG);
  const faceCv = document.createElement('canvas');
  faceCv.width = faceCv.height = 256;
  const faceCtx = faceCv.getContext('2d');
  drawFace(faceCtx, 'happy', 0);
  const faceTex = new THREE.CanvasTexture(faceCv);
  faceTex.colorSpace = THREE.SRGBColorSpace;
  faceTex.wrapS = faceTex.wrapT = THREE.ClampToEdgeWrapping;
  faceTex.repeat.set(2.2, 2.2);
  faceTex.offset.set(-0.6, -0.662);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 24),
    new THREE.MeshStandardMaterial({ map:faceTex, roughness:0.65 }));
  head.scale.set(1.04, 1.0, 0.97);
  head.position.y = 0.28;
  head.rotation.y = -Math.PI/2;
  head.castShadow = true;
  headG.add(head);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), matSkin);
  nose.position.set(0, 0.21, 0.435);
  headG.add(nose);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.475, 24, 16,
    0, Math.PI*2, 0, Math.PI*0.36), hairMat);
  cap.scale.set(1.04, 1.0, 0.99);
  cap.position.y = 0.30;
  cap.castShadow = true;
  headG.add(cap);
  const fringe = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), hairMat);
  fringe.scale.set(1.9, 0.45, 0.6);
  fringe.position.set(0, 0.585, 0.32);
  headG.add(fringe);
  for(const s of [-1,1]){
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 8), matSkin);
    ear.position.set(s*0.47, 0.24, 0.02);
    headG.add(ear);
  }

  // haul crate (library prop)
  const crate = new THREE.Group();
  const cbox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.34, 0.36), matWood);
  cbox.castShadow = true;
  crate.add(cbox);
  crate.position.set(0, 0.30, 0.52);
  crate.visible = false;
  torso.add(crate);

  const zs = [];
  for(let i=0;i<3;i++){
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g2 = cv.getContext('2d');
    g2.font = 'bold 44px system-ui'; g2.fillStyle = '#4a6a8a';
    g2.textAlign = 'center'; g2.textBaseline = 'middle';
    g2.fillText('Z', 32, 34);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false, opacity:0 }));
    sp.scale.setScalar(0.22 + i*0.08);
    scene.add(sp);
    zs.push(sp);
  }

  const face = {
    expr: 'happy', blink: 0,
    set(e){ if(this.expr === e) return; this.expr = e; this.redraw(); },
    redraw(){ drawFace(faceCtx, this.expr, this.blink); faceTex.needsUpdate = true; },
  };

  return { root, hips, torso, headG, arms, legs, crate, zs, face,
    blinkT: rand(2,4) };
}
const vita = makeVita(0x2e6fd8);
scene.add(vita.root);

  HS.neck.position.set(0, 0.26, 0.68);

  neckG.translate(0, 0.3, 0.1);
  const neck = new THREE.Mesh(neckG, matBay);

  HS.neck.add(skull);

    const hip = new THREE.Group();
    hip.position.set(x, -0.22, z);

  horse.position.set(2.6, 0, -1.6);
  horse.rotation.y = 0.6;
  scene.add(horse);

// ==========================================================================
//  THE POSE ENGINE — vita_study's, extended with z-channels for sprawls
// ==========================================================================
function zeroPose(){
  return { rootY:0, rootRX:0, rootRZ:0, hipsY:0, hipsRX:0, hipsRZ:0, hipsRY:0,
    torsoRX:0, torsoRY:0, torsoRZ:0,
    headRX:0, headRY:0, headRZ:0,
    shL:[0,0,0], elL:[0,0,0], shR:[0,0,0], elR:[0,0,0],
    legL:0, legR:0, legLZ:0, legRZ:0, crate:false, zzz:false, expr:null };
}
const ANIMS = {
  // ---- the original library, verbatim behavior ----
  idle(t, P){
    const b = Math.sin(t*2.2);
    P.hipsY = 0.012*b;
    P.torsoRX = 0.03 + 0.015*b;
    P.headRY = 0.15*Math.sin(t*0.6);
    P.headRZ = 0.04*Math.sin(t*0.45+2);
    P.shL[2] = -0.10 - 0.02*b; P.shR[2] = 0.10 + 0.02*b;

  },
  walk(t, P){
    const p = t*6.0, sw = Math.sin(p);

    P.shL[0] = -0.55*sw; P.shR[0] = 0.55*sw;
    P.elL[0] = -0.35; P.elR[0] = -0.35;

    P.elL[0] = -1.5; P.elR[0] = -1.5;

  pick(t, P){

      const k = smoothstep((c-0.42)/0.2);

      const k = (c-0.85)/0.15;

    }
  },
  celebrate(t, P){

  dance(t, P){

  point(t, P){

  skip(t, P){

  shout(t, P){

  kneel(t, P){

  sleepside(t, P){

  },
  sleeptummy(t, P){

    P.legLZ = -0.18; P.legRZ = 0.3;
    P.torsoRX = 0.04*Math.sin(t*1.1);
  },
};

function applyPose(v, P, k){
  const e = (o, x, y, z) => { o.rotation.x += (x-o.rotation.x)*k;
    o.rotation.y += (y-o.rotation.y)*k; o.rotation.z += (z-o.rotation.z)*k; };
  v.root.position.y += (P.rootY - v.root.position.y)*k;
  v.root.rotation.x += (P.rootRX - v.root.rotation.x)*k;
  v.root.rotation.z += (P.rootRZ - v.root.rotation.z)*k;
  v.hips.position.y += (0.55 + P.hipsY - v.hips.position.y)*k;
  e(v.hips, P.hipsRX, P.hipsRY, P.hipsRZ);
  e(v.torso, P.torsoRX, P.torsoRY, P.torsoRZ);
  e(v.headG, P.headRX, P.headRY, P.headRZ);
  e(v.arms[-1].sh, P.shL[0], P.shL[1], P.shL[2]);
  e(v.arms[-1].el, P.elL[0], P.elL[1], P.elL[2]);
  e(v.arms[1].sh, P.shR[0], P.shR[1], P.shR[2]);
  e(v.arms[1].el, P.elR[0], P.elR[1], P.elR[2]);
  e(v.legs[-1], P.legL, 0, P.legLZ);
  e(v.legs[1], P.legR, 0, P.legRZ);
  v.crate.visible = P.crate;
}

// ==========================================================================
//  MODE DRIVER — pose + locomotion + the scripted scenes (give, ride)
// ==========================================================================
let mode = 'dance', animT = 0;
const sel = document.getElementById('animsel');
sel.addEventListener('change', () => {
  mode = sel.value; animT = 0;
  vita.root.rotation.set(0, 0, 0);
  vita.root.position.set(0, 0, 0);
  berry.visible = false; bushBerry.visible = true;
});

const clock = new THREE.Clock();
let simT = 0;
function update(dt){
  simT += dt; animT += dt;
  const t = animT;
  const P = zeroPose();
  const Pp = zeroPose();
  ANIMS.idle(simT + 3, Pp);          // the partner idles by default
  let partnerFace = 'content';

  // ---------- locomotion circles (HEADING FIXED: face the travel direction).
  // position (cosA·R, −sinA·R) has velocity ∝ (−sinA, −cosA); a +z-forward
  // body needs rotation.y = A + π to walk INTO that velocity. ----------
  if(mode === 'run'){
    ANIMS.run(t, P);
    const a = t * 1.9, R = 2.6;
    vita.root.position.x = Math.cos(a)*R;
    vita.root.position.z = -Math.sin(a)*R;
    vita.root.rotation.y = a + Math.PI;
  } else if(mode === 'skip'){
    ANIMS.skip(t, P);
    const a = t * 1.1, R = 2.4;
    vita.root.position.x = Math.cos(a)*R;
    vita.root.position.z = -Math.sin(a)*R;
    vita.root.rotation.y = a + Math.PI;
  } else if(mode === 'crawl'){
    ANIMS.crawl(t, P);
    const a = t * 0.55, R = 1.8;
    vita.root.position.x = Math.cos(a)*R;
    vita.root.position.z = -Math.sin(a)*R;
    vita.root.rotation.y = a + Math.PI;
  } else if(mode === 'cartwheel'){
    ANIMS.cartwheel(t, P);
    const CYC = 2.8, c = (t % CYC)/CYC;
    vita.root.rotation.y = Math.PI/2;               // wheeling along +x
    vita.root.position.z = 0;
    vita.root.position.x = c < 0.3 ? lerp(-2, -0.9, c/0.3)
      : c < 0.72 ? lerp(-0.9, 1.1, (c-0.3)/0.42) : 1.1;
  } else if(mode === 'give'){
    // pick from the bush, carry it, HAND IT OVER; the partner receives
    const CYC = 9, c = (t % CYC)/CYC;
    const bushSpot = new THREE.Vector3(-1.25, 0, 0.5);
    const partSpot = new THREE.Vector3(1.1, 0, 0.4);
    if(c < 0.22){
      const k = smoothstep(c/0.22);
      vita.root.position.lerpVectors(new THREE.Vector3(0, 0, -0.7), bushSpot, k);
      vita.root.rotation.y = -Math.PI/2;
      ANIMS.walk(t, P);
      bushBerry.visible = true; berry.visible = false;
    } else if(c < 0.36){
      // the library's own pick beat, aimed at the bush
      vita.root.position.copy(bushSpot);
      vita.root.rotation.y = -Math.PI/2;
      ANIMS.pick(((c - 0.22)/0.14)*1.05, P);
      if(c > 0.29){ bushBerry.visible = false; berry.visible = true; }
    } else if(c < 0.62){
      const k = smoothstep((c-0.36)/0.26);
      vita.root.position.lerpVectors(bushSpot, partSpot, k);
      vita.root.rotation.y = lerp(-Math.PI/2, Math.PI/2 + 0.35, k);
      ANIMS.walk(t, P);
      P.shR[0] = -1.0; P.elR[0] = -1.2;             // berry held close
    } else if(c < 0.8){
      const k = smoothstep((c-0.62)/0.18);
      vita.root.position.copy(partSpot);
      vita.root.rotation.y = Math.PI/2 + 0.35;
      P.shR[0] = lerp(-1.0, -1.35, k);              // the arm extends
      P.elR[0] = lerp(-1.2, -0.3, k);
      P.torsoRX = 0.12*k;
      P.expr = 'happy';
      Pp.shL[0] = -1.25*k; Pp.elL[0] = -0.3*k;      // the partner reaches
      Pp.headRX = -0.1*k;
      partnerFace = 'surprised';
    } else {
      vita.root.position.copy(partSpot);
      vita.root.rotation.y = Math.PI/2 + 0.35;
      P.shR[0] = -0.4;
      P.expr = 'happy';
      Pp.shL[0] = -1.0; Pp.elL[0] = -1.3;           // holding the gift close
      Pp.headRX = 0.25;                              // the thank-you nod
      partnerFace = 'happy';
    }
    // the berry rides whichever grip owns it
    if(berry.visible){
      const owner = c >= 0.78 ? partner.arms[-1].grip : vita.arms[1].grip;
      owner.getWorldPosition(berry.position);
    }
  } else if(mode === 'ride'){
    rideScene(t, P);
  } else {
    ANIMS[mode](t, P);
  }

  // horse parked unless riding
  if(mode !== 'ride'){
    horse.position.lerp(new THREE.Vector3(2.6, 0, -1.6), Math.min(1, dt*2));
    HS.legs.forEach(l => l.rotation.x = lerp(l.rotation.x, 0, dt*4));
    HS.body.rotation.x = lerp(HS.body.rotation.x, 0, dt*4);
    HS.body.position.y = 1.32;
  }

  // faces
  if(P.expr) vita.face.set(P.expr);
  partner.face.set(partnerFace);

  applyPose(vita, P, Math.min(1, dt*(animT < 0.45 ? 6 : 14)));
  applyPose(partner, Pp, Math.min(1, dt*8));

  // blink + z's, both vitas
  for(const v of [vita, partner]){
    v.blinkT -= dt;
    if(v.blinkT < 0){
      v.face.blink = 1; v.face.redraw();
      v.blinkT = rand(2.4, 4.8);
      setTimeout(() => { v.face.blink = 0; v.face.redraw(); }, 130);
    }
    for(let z=0; z<v.zs.length; z++){
      const sp = v.zs[z];
      if(P.zzz && v === vita){
        const ph = (simT*0.5 + z*0.33) % 1;
        sp.material.opacity = Math.sin(ph*Math.PI)*0.8;
        sp.position.set(v.root.position.x + 0.5 + ph*0.3 + z*0.1,
                        0.9 + ph*0.8 + z*0.15, v.root.position.z + 0.2);
      } else sp.material.opacity = 0;
    }
  }
}

// ---------- the ride: mount → walk → canter → dismount ---------------------
function rideScene(t, P){
  const CYC = 18, f = t % CYC;
  if(f < 1.2){                                     // walk to the horse's side
    const k = smoothstep(f/1.2);
    vita.root.position.lerpVectors(new THREE.Vector3(0.9, 0, -0.9),
      new THREE.Vector3(2.0, 0, -1.35), k);
    vita.root.rotation.y = 1.1;
    ANIMS.walk(t, P);
    horse.position.set(2.6, 0, -1.6);
    horse.rotation.y = 0.6;
  } else if(f < 2.6){                              // THE MOUNT
    const k = smoothstep((f - 1.2)/1.4);
    vita.root.position.x = lerp(2.0, 2.6, k);
    vita.root.position.z = lerp(-1.35, -1.55, k);
    P.rootY = Math.sin(k*Math.PI)*0.5 + k*1.15;
    vita.root.rotation.y = lerp(1.1, 0.6, k);
    P.legR = -0.9*Math.sin(k*Math.PI);             // the mounting leg
    P.legLZ = -Math.sin(k*Math.PI)*1.2;            // THE SWING over the back
    P.shL[0] = -1.3*Math.sin(k*Math.PI);           // hauling on the saddle
    P.expr = 'surprised';
  } else if(f < 14.2){                             // RIDING
    const cantering = f > 7.6 && f < 12.6;
    const sp = cantering ? 2.6 : 1.0;
    const a = (f - 2.6) * sp * 0.22 + 0.6;
    horse.position.set(Math.cos(a)*2.9, 0, -Math.sin(a)*2.9);
    horse.rotation.y = a + Math.PI;                // heading fix here too
    const ph = (f - 2.6) * (cantering ? 9 : 5);
    HS.body.position.y = 1.32 + Math.abs(Math.sin(ph*0.5))*(cantering ? 0.1 : 0.03);
    HS.body.rotation.x = cantering ? Math.sin(ph*0.5)*0.09 : 0;
    HS.legs.forEach((leg, i) => {
      leg.rotation.x = Math.sin(ph + (i === 0 || i === 3 ? 0 : Math.PI)) * (cantering ? 0.75 : 0.45);
    });
    vita.root.position.copy(horse.position);
    P.rootY = HS.body.position.y - 1.32 + 1.42;
    vita.root.rotation.y = a + Math.PI;
    P.legL = -1.1; P.legR = -1.1;                  // astride
    P.legLZ = -0.5; P.legRZ = 0.5;
    P.shL[0] = -0.9; P.shR[0] = -0.9;              // on the reins
    P.elL[0] = -0.6; P.elR[0] = -0.6;
    P.torsoRX = cantering ? 0.15 + Math.sin(ph*0.5)*0.05 : 0.05;
    P.hipsY = cantering ? Math.abs(Math.sin(ph*0.5))*0.05 : 0;
    P.expr = cantering ? 'happy' : 'content';
  } else if(f < 15.7){                             // pulling up
    P.legL = -1.1; P.legR = -1.1;
    P.legLZ = -0.5; P.legRZ = 0.5;
    P.rootY = 1.42;
    vita.root.position.copy(horse.position);
    P.torsoRX = -0.08;                             // sitting back on the reins
    P.shL[0] = -1.2; P.shR[0] = -1.2;
  } else {                                         // THE DISMOUNT
    const k = smoothstep((f - 15.7)/2.3);
    vita.root.position.x = horse.position.x - 0.6*k;
    vita.root.position.z = horse.position.z + 0.25*k;
    P.rootY = lerp(1.42, 0, k) + Math.sin(k*Math.PI)*0.25;
    P.legLZ = -Math.sin(k*Math.PI)*1.2;            // the leg swings back over
    P.legL = lerp(-1.1, 0, k);
    P.legR = lerp(-1.1, 0, k);
    P.legRZ = lerp(0.5, 0, k);
    P.shL[0] = lerp(-0.9, 0, k);
    P.shR[0] = -1.2*Math.sin(k*Math.PI);           // holding on as they slide
    P.expr = 'content';
  }
}

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  controls.update();
  renderer.render(scene, camera);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
