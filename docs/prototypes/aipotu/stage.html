<!DOCTYPE html>
<!-- ======================================================================
     HvB ASSET STAGE v3 — one screen for every George World object & animation,
     with a CASCADING menu: pick the ITEM, then pick its ANIMATION /
     scene / skin from the second pulldown (populated per item). The
     second menu drives the study through the #set=/#click= hash the
     studies understand (the "stage remote-control" snippet).
     v3 (2026-09-01, Doug): ◀ ▶ buttons and ← → keys step through every item
     no matter what has focus (the iframe's keydown is hooked, same-origin);
     a NOTES box per item saves as you type — to localStorage, and through
     POST /stage-notes on serve_nocache.py to stage_notes.json + STAGE_NOTES.md
     beside the studies, so the sessions can read Doug's critiques.
     Serve from the aipotu folder (serve_nocache.py :8201/stage.html).
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HvB Asset Stage</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#14181c; }
  #bar {
    position:fixed; top:0; left:0; right:0; height:44px; z-index:20;
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background:linear-gradient(180deg,#232a30,#1a2025);
    border-bottom:1px solid #3a444c; color:#e8f0f4;
    font:13px system-ui, sans-serif; overflow-x:auto;
  }
  #bar b { font-size:14px; letter-spacing:0.5px; white-space:nowrap; }
  #bar select {
    padding:6px 10px; border:0; border-radius:8px;
    background:#3f7040; color:#fff; font:13px system-ui; cursor:pointer;
  }
  #pick { min-width:230px; }
  #anim { min-width:170px; background:#3d6f96; }
  #anim:disabled { opacity:0.45; }
  #frame { position:fixed; top:44px; left:0; right:0; bottom:0;
    width:100%; height:calc(100% - 44px); border:0; }
  body.notes-open #frame { bottom:150px; height:calc(100% - 44px - 150px); }
  /* prev / next / notes controls (v3, 2026-09-01) */
  #bar button {
    padding:6px 11px; border:0; border-radius:8px; cursor:pointer;
    background:#4d545d; color:#fff; font:13px system-ui; white-space:nowrap;
  }
  #bar button:hover { background:#5d656f; }
  #count { font:12px Consolas, monospace; color:#aab4be; white-space:nowrap; }
  #notesbtn.has { background:#8a6d1f; }
  #notes {
    position:fixed; left:0; right:0; bottom:0; height:150px; z-index:20;
    display:none; flex-direction:column; gap:6px; padding:8px 12px;
    background:linear-gradient(0deg,#232a30,#1a2025); border-top:1px solid #3a444c;
    color:#e8f0f4; font:13px system-ui, sans-serif;
  }
  body.notes-open #notes { display:flex; }
  #notes .row { display:flex; align-items:center; gap:10px; }
  #notes .row b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #notestat { font:11px Consolas, monospace; color:#aab4be; margin-left:auto; white-space:nowrap; }
  #note {
    flex:1; resize:none; border:1px solid #3a444c; border-radius:8px; padding:8px;
    background:#0f1316; color:#f2f6fa; font:14px system-ui, sans-serif;
  }
  #notes button { padding:4px 9px; border:0; border-radius:7px; cursor:pointer;
    background:#4d545d; color:#fff; font:12px system-ui; }
</style>
</head>
<body>
<div id="bar">
  <b>🎬 HvB ASSET STAGE</b>
  <select id="pick">
    <optgroup label="Creatures & characters">
      <option value="vita_anim_study.html">Vita — 30 behavior prototypes (OLD body)</option>
      <option value="vita_study.html">Vita — the hero body</option>
      <option value="poppy_study.html">Poppy — the real girl (9 anims)</option>
      <option value="horse_study.html">Appaloosa horse — gaits, rear, treat</option>
      <option value="barnyard_study.html">Barnyard — goats, shearing, chickens, donkey</option>
      <option value="fish_study.html">Fish — silversides, flying fish, mullet</option>
      <option value="seagull_study.html">Seagull</option>
      <option value="orca_study.html">Orcas</option>
      <option value="godzilla_study.html">Godzilla — the leviathan (full range)</option>
      <option value="cat_study.html">Cat — slink, groom, pounce, loaf</option>
      <option value="pterodactyl_study.html">Pteranodon — soar, land, perch, launch</option>
      <option value="brontosaurus_study.html">Brontosaurus — the plod, the browse, the swallow</option>
      <option value="triceratops_study.html">Triceratops — graze, guard, lunge</option>
      <option value="pachycephalosaurus_study.html">Pachycephalosaurus — the duel</option>
      <option value="ankylosaurus_study.html">Ankylosaurus — fortress and club</option>
      <option value="crab_study.html">Coconut crab — scuttle, brandish</option>
      <option value="turtle_study.html">Sea turtle (honu) — crawl, swim, bask</option>
      <option value="dragon_study.html">The Dragon — idle, fly, rage, fire</option>
    </optgroup>
    <optgroup label="The armature pipeline">
      <option value="vita_rig_study.html">★ Vita RIG — THE NEW BODY</option>
      <option value="skin_test_study.html">Skin gallery — skins × clips + imports</option>
      <option value="anim_viewer.html">Animation viewer — drop .glb, audit clips</option>
      <option value="terrainwalk_study.html">Terrain walk — FULL LEG IK, any skin</option>
      <option value="formation_study.html">Formation — marching the contours</option>
      <option value="duo_study.html">Duo — hug, hand in hand, the Frug</option>
      <option value="army_study.html">Army — archers, the duel, the march</option>
      <option value="roman_study.html">Romans — the charge &amp; the testudo</option>
      <option value="landingcraft_study.html">Landing craft — ramp down, six ashore</option>
    </optgroup>
    <optgroup label="Transport">
      <option value="tradeboat_study.html">Trading boat — load, hoist, reach, return</option>
      <option value="dock_study.html">Dock — quay, pier, jib crane</option>
      <option value="chariot_study.html">Celtic chariot — gallop, whip, skid</option>
      <option value="train_study.html">Train — loco, boxcars, hoppers, caboose</option>
      <option value="hotair_study.html">Hot air balloon — blast, rise, drift</option>
      <option value="flyer_study.html">Wright Flyer — the twelve-second hop</option>
      <option value="p51_study.html">P-51 Mustang — aerobatics + FLAK</option>
      <option value="jet_study.html">Passenger jet — the circuit</option>
      <option value="rocket_study.html">Rocket — ignition, staging</option>
    </optgroup>
    <optgroup label="Objects & builds">
      <option value="wagon_study.html">Wagon — smooth & bumpy rolling</option>
      <option value="rowboat_study.html">Rowboat — row, get in, get out</option>
      <option value="surfboard_study.html">Surfboards — log, thruster, fish</option>
      <option value="throne_study.html">Throne — the king sits</option>
      <option value="castle_study.html">Castle — the Norman keep</option>
      <option value="bank_study.html">Bank — deposits in, paper out</option>
      <option value="plantation_study.html">Plantation — product flows one way</option>
      <option value="houses_study.html">Houses — Wright vs the McMansion</option>
      <option value="tools_study.html">Tools — hammer, axe, saw + fence posts</option>
      <option value="windmill_study.html">Windmill — the mill grinds</option>
      <option value="market_study.html">Market stall — haggle &amp; handshake</option>
      <option value="bell_study.html">Bell tower — heads turn when it rings</option>
      <option value="beehive_study.html">Beehives — smoke, honey, the sting</option>
      <option value="bridge_study.html">Footbridge — planks bounce, Poppy dashes</option>
      <option value="signpost_study.html">Signpost — read, scratch, point, go</option>
      <option value="drum_study.html">Drum — steps lock to the beat</option>
      <option value="spinningwheel_study.html">Spinning wheel — treadle, draft, wind on</option>
      <option value="scythe_study.html">Scythe — sweep, step, sweep</option>
      <option value="plow_study.html">Oxen & plow — the soil curls</option>
      <option value="kite_study.html">Kites — four sails + the dragon</option>
      <option value="fire_study.html">Fire — campfire & the king's hearth</option>
      <option value="balloon_study.html">Balloon — the gift and the toddle</option>
      <option value="well_study.html">Well — crank, haul, carry, drink</option>
      <option value="clocktower_study.html">Clock tower — geared hands, pendulum, the toll</option>
      <option value="watertower_study.html">Water tower — valve, pour, gauge</option>
      <option value="bulldozer_study.html">Bulldozer — tracks, blade, the heap</option>
      <option value="reader_study.html">Reader — a Vita with a book</option>
      <option value="printingpress_study.html">Printing press — ink, lay, pull, peel</option>
      <option value="sculptor_study.html">Sculptor — gravestone, figure, ovoid</option>
      <option value="explosions_study.html">Explosions — grenade, shell, barrage</option>
    </optgroup>
    <optgroup label="Flora & growth">
      <option value="palm_study.html">Palm</option>
      <option value="fir_study.html">Firs — six realistic specimens</option>
      <option value="berrybush_study.html">Berry bush — the study</option>
      <option value="bushgrowth_study.html">Berry bush — growth stages + wilt</option>
      <option value="corn_study.html">Corn — 3 cultivars × 4 stages, in wind</option>
      <option value="wind_study.html">Wind — palm, bush & fir in four winds</option>
      <option value="baobab_study.html">Baobab — bottle trunk, pods on the wind</option>
      <option value="jungle_study.html">Jungle — gibbon brachiation, monkey circuit</option>
      <option value="flora_study.html">Ground flora — 10 weeds + 6 wildflowers</option>
    </optgroup>
    <optgroup label="World & atmosphere">
      <option value="sky_study.html">Sky — clouds, storm, moon</option>
      <option value="weather_study.html">Weather — rain follows the wind</option>
      <option value="waves_study.html">Waves — surf on an undulating coast</option>
      <option value="volcano_study.html">Volcano — the eruption</option>
      <option value="tornado_study.html">Tornado — twisting, rising, dust</option>
      <option value="inlandwater_study.html">Inland water — spring, creek, river, lake</option>
      <option value="fireflies_study.html">Fireflies — the night set, catch &amp; release</option>
      <option value="easteregg_study.html">Easter egg chamber — the hidden room</option>
      <option value="bigbang_study.html">Big Bang — the dragon's egg at the origin</option>
      <option value="caldera_study.html">The Caldera — island map study</option>
      <option value="atoll_study.html">Ring Atoll — the lagoon-necklace map</option>
      <option value="delta_study.html">The River Delta — the branching-river map</option>
      <option value="terrain_study.html">Aipotu terrain — realism pass (REV 6)</option>
      <option value="georgeland2_study.html">Georgeland 2 — the big island (Rev 5)</option>
    </optgroup>
    <optgroup label="The machine">
      <option value="georgeotron_parts_study.html">Georgeotron parts — the kit in 3D + anchors</option>
    </optgroup>
    <optgroup label="The game">
      <option value="georgeworld.html">▶ GEORGE WORLD — the live game</option>
    </optgroup>
  </select>
  <select id="anim"></select>
  <button id="prev" title="previous item (← key)">◀</button>
  <span id="count"></span>
  <button id="next" title="next item (→ key)">▶</button>
  <button id="notesbtn" title="your notes on this item">✎ Notes</button>
</div>
<iframe id="frame" src="vita_anim_study.html"></iframe>
<div id="notes">
  <div class="row">
    <b id="notelabel"></b>
    <span id="notestat"></span>
    <button id="copyall" title="copy every note as markdown">Copy all notes</button>
    <button id="notesclose">✕</button>
  </div>
  <textarea id="note" placeholder="Your reaction to this item. Saved as you type; ← → still move to the next item."></textarea>
</div>
<script>
  // Second-level menus: file → [[hash, label], ...]. The hash rides the
  // iframe URL; the study's stage-remote-control snippet applies it.
  const MODES = {
    'vita_anim_study.html': [
      ['set=animsel:dance', 'Dance'], ['set=animsel:idle', 'Idle'], ['set=animsel:walk', 'Walk'],
      ['set=animsel:run', 'Run'], ['set=animsel:skip', 'Skip'], ['set=animsel:crawl', 'Crawl'],
      ['set=animsel:pick', 'Pick fruit'], ['set=animsel:give', 'Pick & hand a berry'],
      ['set=animsel:celebrate', 'Celebrate'], ['set=animsel:jumptriumph', 'Triumphant jumps'],
      ['set=animsel:cartwheel', 'Cartwheel'], ['set=animsel:point', 'Point'],
      ['set=animsel:headturn', 'Head turn'], ['set=animsel:jump', 'Jump (peering)'],
      ['set=animsel:bow', 'Bow'], ['set=animsel:kneel', 'Kneel'],
      ['set=animsel:prostrate', 'Full prostrate bow'], ['set=animsel:haul', 'Haul the crate'],
      ['set=animsel:yes', 'Nod YES'], ['set=animsel:no', 'Shake NO'],
      ['set=animsel:talk', 'Talk (expressions)'], ['set=animsel:shout', 'Shout'],
      ['set=animsel:threaten', 'Threaten'], ['set=animsel:crouch', 'Defensive crouch'],
      ['set=animsel:tantrum', 'TANTRUM'], ['set=animsel:sitdown', 'Sit down'],
      ['set=animsel:sit', 'Sit (pose)'], ['set=animsel:sleep', 'Sleep — back'],
      ['set=animsel:sleepside', 'Sleep — side'], ['set=animsel:sleeptummy', 'Sleep — tummy'],
      ['set=animsel:ride', 'Mount → ride → dismount'],
    ],
    'poppy_study.html': [
      ['click=happy', 'Happy'], ['click=walk', 'Walk (terrain-following)'],
      ['click=sit', 'Sit'], ['click=curl', 'CURL UP to sleep'], ['click=sleep', 'Sleep — sprawled'],
      ['click=pawup', 'Paw-up'], ['click=rearup', 'Rear-up'],
      ['click=tailchase', 'Tail-chase'], ['click=sad', 'Sad'],
    ],
    'duo_study.html': [
      ['set=duet:hug', 'The hug'], ['set=duet:hand', 'Hand in hand'], ['set=duet:frug', 'The Frug'],
    ],
    'army_study.html': [
      ['set=scene:archery', 'Archery — the volley'], ['set=scene:duel', 'The duel'],
      ['set=scene:march', 'The march'],
    ],
    'roman_study.html': [
      ['set=scene:charge', 'The charge — volley & gladius'], ['set=scene:testudo', 'The TESTUDO'],
    ],
    'formation_study.html': [
      ['set=weapon:rifle', 'Garands — 12'], ['set=weapon:pike', 'Swiss pikes — 12'],
      ['set=size:6', 'Six — column of twos'], ['set=size:24', 'Twenty-four — of fours'],
    ],
    'skin_test_study.html': [
      ['set=skinsel:0', 'Skin: Vita — blue'], ['set=skinsel:1', 'Skin: Vita — red'],
      ['set=skinsel:2', 'Skin: Vita — royal'], ['set=skinsel:3', 'Skin: Alien — green'],
      ['set=skinsel:4', 'Skin: Alien — gray'],
    ],
    'terrainwalk_study.html': [
      ['set=skinsel:-1', 'Walker: Vita — THE NEW BODY'],
    ],
    'p51_study.html': [
      ['set=mnv:display', 'The airshow display'], ['set=mnv:level', 'Straight & level'],
      ['set=mnv:loop', 'Loop'], ['set=mnv:barrel', 'Barrel roll'],
      ['set=mnv:immelmann', 'Immelmann'], ['set=mnv:stall', 'Stall & recover'],
      ['set=mnv:hardleft', 'Violent turn LEFT'], ['set=mnv:hardright', 'Violent turn RIGHT'],
      ['set=mnv:dive', 'Dive & pull-out'],
    ],
    'houses_study.html': [
      ['set=house:wright', 'The Wright house'], ['set=house:mcmansion', 'The McMansion'],
    ],
  };
  const pick = document.getElementById('pick');
  const anim = document.getElementById('anim');
  const frame = document.getElementById('frame');
  function fillAnim(){
    const modes = MODES[pick.value];
    anim.innerHTML = '';
    if(!modes){
      const o = document.createElement('option');
      o.textContent = '— one continuous scene —';
      anim.appendChild(o);
      anim.disabled = true;
      return;
    }
    anim.disabled = false;
    for(const [hash, label] of modes){
      const o = document.createElement('option');
      o.value = hash;
      o.textContent = label;
      anim.appendChild(o);
    }
  }
  let loadN = 0;
  function load(){
    // the ?n= buster forces a real reload even when only the hash changed
    const hash = (!anim.disabled && anim.value) ? '#' + anim.value : '';
    frame.src = pick.value + '?n=' + (++loadN) + hash;
    updateCount();
    showNote();
  }
  pick.addEventListener('change', () => { fillAnim(); load(); });
  anim.addEventListener('change', load);

  // ---- v3 (2026-09-01): step through EVERY item with ← → or the ◀ ▶ buttons,
  // no matter what has focus (the iframe, a button, the page) ----
  const items = Array.from(pick.options);           // flat list across optgroups
  const countEl = document.getElementById('count');
  function updateCount(){ countEl.textContent = (pick.selectedIndex+1) + ' / ' + items.length; }
  function step(d){
    const n = items.length;
    pick.selectedIndex = ((pick.selectedIndex + d) % n + n) % n;
    fillAnim(); load();
  }
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  function isTyping(t){
    return t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable);
  }
  function onKey(e){
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    if(isTyping(e.target)) return;          // the pulldowns and the notes box keep their own arrows
    e.preventDefault();
    step(e.key === 'ArrowRight' ? 1 : -1);
  }
  window.addEventListener('keydown', onKey);
  // the studies are same-origin: hook the iframe's own document on every load,
  // so arrows work after you've clicked a button INSIDE a study
  frame.addEventListener('load', () => {
    try { frame.contentWindow.addEventListener('keydown', onKey); } catch(err) {}
  });

  // ---- v3: per-item NOTES. Saved as you type to localStorage AND, when the
  // local server is serving (serve_nocache.py), POSTed to /stage-notes so it
  // writes stage_notes.json + STAGE_NOTES.md beside the studies for the
  // sessions to read. On the public Netlify copy there is no server: notes
  // stay in this browser, and "Copy all notes" hands them over as markdown. ----
  const KEY = 'hvb_stage_notes';
  let NOTES = {};
  try { NOTES = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(err) { NOTES = {}; }
  const notesEl = document.getElementById('notes');
  const noteEl = document.getElementById('note');
  const noteLabel = document.getElementById('notelabel');
  const noteStat = document.getElementById('notestat');
  const notesBtn = document.getElementById('notesbtn');
  for(const o of items) o.dataset.label = o.textContent;
  function markOptions(){
    let n = 0;
    for(const o of items){
      const has = !!(NOTES[o.value] && (NOTES[o.value].text || '').trim());
      o.textContent = (has ? '✎ ' : '') + o.dataset.label;
      if(has) n++;
    }
    notesBtn.textContent = '✎ Notes' + (n ? ' (' + n + ')' : '');
    notesBtn.classList.toggle('has', !!(NOTES[pick.value] && (NOTES[pick.value].text || '').trim()));
  }
  function showNote(){
    const o = items[pick.selectedIndex];
    noteLabel.textContent = o ? o.dataset.label : '';
    noteEl.value = (NOTES[pick.value] && NOTES[pick.value].text) || '';
    noteStat.textContent = NOTES[pick.value] && NOTES[pick.value].ts ? 'saved ' + NOTES[pick.value].ts : '';
    markOptions();
  }
  function stamp(){
    const d = new Date(), p = x => String(x).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  let saveT = null;
  async function saveNotes(){
    try { localStorage.setItem(KEY, JSON.stringify(NOTES)); } catch(err) {}
    try {
      const r = await fetch('/stage-notes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(NOTES) });
      noteStat.textContent = r.ok ? 'saved to STAGE_NOTES.md ' + stamp() : 'saved in this browser only';
    } catch(err) {
      noteStat.textContent = 'saved in this browser only (no local server)';
    }
    markOptions();
  }
  noteEl.addEventListener('input', () => {
    const o = items[pick.selectedIndex];
    NOTES[pick.value] = { label: o ? o.dataset.label : pick.value, text: noteEl.value, ts: stamp() };
    noteStat.textContent = 'saving…';
    clearTimeout(saveT); saveT = setTimeout(saveNotes, 600);
  });
  function toggleNotes(open){
    document.body.classList.toggle('notes-open', open);
    if(open) noteEl.focus();
  }
  notesBtn.addEventListener('click', () => toggleNotes(!document.body.classList.contains('notes-open')));
  document.getElementById('notesclose').addEventListener('click', () => toggleNotes(false));
  document.getElementById('copyall').addEventListener('click', async () => {
    const lines = ['# HvB Asset Stage notes — ' + stamp(), ''];
    for(const o of items){
      const n = NOTES[o.value];
      if(n && (n.text || '').trim()){ lines.push('## ' + o.dataset.label + '  `' + o.value + '`', '_' + n.ts + '_', '', n.text.trim(), ''); }
    }
    const md = lines.join('\n');
    try { await navigator.clipboard.writeText(md); noteStat.textContent = 'all notes copied as markdown'; }
    catch(err) { noteEl.value = md; noteEl.select(); noteStat.textContent = 'select-all + copy from the box'; }
  });
  // merge notes the local server already holds (typed on another device on the LAN)
  fetch('stage_notes.json?n=' + Date.now()).then(r => r.ok ? r.json() : null).then(srv => {
    if(!srv) return;
    for(const k in srv){ if(!NOTES[k] || (srv[k].ts || '') >= (NOTES[k].ts || '')) NOTES[k] = srv[k]; }
    try { localStorage.setItem(KEY, JSON.stringify(NOTES)); } catch(err) {}
    showNote();
  }).catch(() => {});

  fillAnim();
  updateCount();
  showNote();
</script>
</body>
</html>
