<!DOCTYPE html>
<!-- ======================================================================
     THE STAGE — one screen for every George World object & animation.
     Filed 2026-08-31. Pick a study from the pulldown; it loads in place
     (each study's own animation controls appear inside its panel, so
     nothing clutters). The last entry loads the live game itself.
     Serve from the aipotu folder (serve_nocache.py :8201/stage.html).
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>George World Stage</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#14181c; }
  #bar {
    position:fixed; top:0; left:0; right:0; height:44px; z-index:20;
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background:linear-gradient(180deg,#232a30,#1a2025);
    border-bottom:1px solid #3a444c; color:#e8f0f4;
    font:13px system-ui, sans-serif;
  }
  #bar b { font-size:14px; letter-spacing:0.5px; }
  #bar select {
    padding:6px 10px; border:0; border-radius:8px; min-width:260px;
    background:#3f7040; color:#fff; font:13px system-ui; cursor:pointer;
  }
  #bar .note { opacity:0.6; font-size:12px; }
  #frame { position:fixed; top:44px; left:0; right:0; bottom:0;
    width:100%; height:calc(100% - 44px); border:0; }
</style>
</head>
<body>
<div id="bar">
