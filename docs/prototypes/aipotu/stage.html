<!DOCTYPE html>
<!-- ======================================================================
     HvB ASSET STAGE v8.30 — THE SIMPLE ONE.

     WHY THIS WAS REBUILT (Doug, 2026-09-03: "it's really confusing")
     v7 had four dropdowns (category, item, view, skin), a zoom cluster, a rig
     tools cluster, an item counter, a notes cluster and a George World button
     spread across a wrapping bar. Browsing one asset meant understanding which
     of four menus drove which. On an iPad, for a tired or disabled person, that
     is not a browsing interface — it is a control panel.

     THE RULE NOW: pick an asset from ONE list, and look at it.
       · ONE list, left, grouped in plain language, tap a row to load it.
       · SIX big controls along the bottom: Back, Next, Play, Animation,
         zoom out, zoom in — plus Reset view. 56px minimum tap targets.
       · The name of what you are looking at is the biggest text on screen.
       · Drag to rotate. Pinch or the +/- buttons to zoom.

     WHAT WENT (all of it redundant or dev-only):
       · the category + item cascade   -> one list
       · the VIEW menu                 -> already dead in v6, markup now gone
       · the SKIN dropdown             -> dev-only; the terrain walk loads its own
       · the RIG TOOLS cluster         -> its two entries live in the list
       · the item counter "22 / 98"    -> noise
       · the zoom slider               -> two big buttons; drag/pinch still work

     v8.10 adds the MESHY ONLY switch at the top of the list: the catalog holds
     19 Meshy-pipeline models among ~85 procedural studies, and this hides
     everything that did not come out of Meshy. A third element of 1 on a
     catalog row is the Meshy tag. The choice is remembered per device.

     WHAT STAYED: the version stamp (house rule), the George World button (house
     rule), and Doug's per-asset NOTES — that is his feedback channel to the
     sessions, not a debug panel, so it survives as one clearly-labelled button.

     THE BIG BUTTONS talk to the study through window.STAGE_API — a six-method
     shape (clipCount/clipName/play/pause/nextClip/zoom/reset). creature_study
     and effects_study implement it. Studies that do not still load and still
     zoom (synthetic wheel events); their Play and Animation buttons grey out
     rather than lying about what they do.
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HvB Asset Stage v8.41</title>
<!-- VERSION STAMP (Doug's standing rule: every piece of software under
     development shows its version beside its title). Bump REV on EVERY save
     and set REV_BUILT from the real clock — never guess the time. -->
<script>
  const REV = '8.41';
  const REV_BUILT = '2026-09-04 11:19 -07:00';
</script>
<style>
  :root{
    --top: 52px;          /* header height */
    --ctl: 78px;          /* big control bar height */
    --list: 260px;        /* asset list width on a wide screen */
    --ink:#eef4f8; --dim:#c3cfd8;
    --panel:#1b2228; --panel2:#141a1f; --line:#333e47;
    --hot:#3f8f52; --hot2:#4aa862;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#10151a; color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%; }

  /* ---------- header: what am I looking at ---------- */
  #top{ position:fixed; top:0; left:0; right:0; height:var(--top); z-index:30;
    display:flex; align-items:center; gap:10px; padding:0 10px;
    background:linear-gradient(180deg,#242c33,#1a2126); border-bottom:1px solid var(--line); }
  #top .brand{ font-size:13px; font-weight:800; letter-spacing:.6px; white-space:nowrap;
    opacity:.9; }
  #rev{ font:11px Consolas,monospace; color:#8fd9a8; background:#1d2a22;
    border:1px solid #2f4a38; border-radius:6px; padding:2px 6px; white-space:nowrap; }
  /* the single most important text on the page */
  #now{ flex:1; min-width:0; font-size:19px; font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  #gwbtn{ background:linear-gradient(180deg,#4a9d4e,#2e7a38); color:#fff; border:0;
    border-radius:9px; font:800 13px system-ui; letter-spacing:.5px; padding:9px 13px;
    cursor:pointer; white-space:nowrap; }

  /* ---------- the one list ---------- */
  #listbtn{ display:none; }
  #list{ position:fixed; top:var(--top); bottom:var(--ctl); left:0; width:var(--list);
    z-index:25; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel2); border-right:1px solid var(--line); padding:6px 0 14px; }
  #list .grp{ font:700 11px system-ui; letter-spacing:1.4px; text-transform:uppercase;
    color:#93a4b2; padding:14px 14px 5px; }
  #list button{ display:block; width:100%; text-align:left; border:0; background:none;
    color:var(--ink); font:15px system-ui; padding:12px 14px; min-height:46px;
    cursor:pointer; border-left:4px solid transparent; }
  /* THE v8.30 BUG, fixed in v8.31. applyFilter() hides a row with
     `row.hidden = true`, which sets the attribute correctly — but the browser's
     own [hidden]{display:none} lives in the UA stylesheet, and the AUTHOR rule
     `#list button{display:block}` two lines up beats it. So every row kept
     rendering and the switch looked dead. (The group headings DID hide, because
     `#list .grp` sets no display property for [hidden] to lose to — which is
     why it failed in a way that looked like nothing happening at all.)
     Stated explicitly here so no future display rule silently re-breaks it. */
  #list button[hidden], #list .grp[hidden]{ display:none !important; }
  #list button:hover{ background:#1e262d; }
  #list button.on{ background:#24402c; border-left-color:var(--hot2); font-weight:700; }
  #list button .note{ color:#ffcf7a; margin-right:5px; }

  /* the Meshy-only switch: full width, 56px, unmistakably on or off */
  #meshybar{ position:sticky; top:0; z-index:2; padding:8px 10px 9px;
    background:var(--panel2); border-bottom:1px solid var(--line); }
  /* Specificity trap, same family as the [hidden] one above: the switch is a
     <button> inside #list, so `#list button{display:block}` (one id + one type)
     OUTRANKS a bare `#meshybtn` (one id) and would flatten this flex row —
     collapsing the toggle track to nothing and leaving what looks like plain
     text. #meshybar #meshybtn is two ids, so it wins outright. */
  #meshybar #meshybtn{ display:flex; align-items:center; gap:10px; width:100%;
    min-height:56px; padding:0 12px; border:1px solid var(--line);
    border-radius:12px; background:#222b32; color:var(--ink);
    font:700 15px system-ui; cursor:pointer; text-align:left; }
  #meshybtn .sw{ flex:0 0 46px; height:27px; border-radius:14px; background:#48535e;
    position:relative; transition:background .15s ease; }
  #meshybtn .knob{ position:absolute; top:3px; left:3px; width:21px; height:21px;
    border-radius:50%; background:#dfe8ef; transition:transform .15s ease; }
  #meshybtn .txt{ flex:1; }
  #meshybtn .cnt{ font:600 12px Consolas,monospace; color:var(--dim); }
  #meshybtn.on{ background:#24402c; border-color:var(--hot2); }
  #meshybtn.on .sw{ background:var(--hot2); }
  #meshybtn.on .knob{ transform:translateX(19px); }
  #meshybtn.on .cnt{ color:#bfe6cb; }
  @media (prefers-reduced-motion: reduce){
    #meshybtn .sw, #meshybtn .knob{ transition:none; }
  }

  /* ---------- the stage itself ---------- */
  /* an iframe is a REPLACED element: with width:auto it takes its intrinsic
     300x150 instead of resolving from left/right, so the size must be stated. */
  #frame{ position:fixed; top:var(--top); left:var(--list); border:0; background:#0f1418;
    width:calc(100% - var(--list)); height:calc(100% - var(--top) - var(--ctl)); }
  #scrim{ display:none; position:fixed; inset:0; z-index:24; background:rgba(0,0,0,.45); }

  /* ---------- six big controls ---------- */
  #ctl{ position:fixed; left:0; right:0; bottom:0; height:var(--ctl); z-index:30;
    display:flex; align-items:center; gap:8px; padding:0 10px;
    padding-bottom:env(safe-area-inset-bottom);
    background:linear-gradient(0deg,#242c33,#1a2126); border-top:1px solid var(--line); }
  #ctl button{ flex:1 1 0; min-width:0; height:58px; border:0; border-radius:12px;
    background:#38424c; color:#fff; cursor:pointer;
    font:700 15px system-ui; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; }
  #ctl button:hover:not(:disabled){ background:#465260; }
  #ctl button:active:not(:disabled){ transform:translateY(1px); }
  #ctl button .ico{ font-size:20px; line-height:1; }
  #ctl button .cap{ font-size:11px; font-weight:600; opacity:.9; letter-spacing:.3px; }
  /* disabled must still be READABLE — it means "not for this item", not "gone" */
  #ctl button:disabled{ opacity:.45; cursor:not-allowed; }
  #playbtn{ background:var(--hot); } #playbtn:hover:not(:disabled){ background:var(--hot2); }
  #ctl .small{ flex:0 0 60px; }

  /* ---------- notes: Doug's feedback channel, one button ---------- */
  #notes{ position:fixed; left:0; right:0; bottom:var(--ctl); height:190px; z-index:29;
    display:none; flex-direction:column; gap:7px; padding:10px 12px;
    background:#1a2126; border-top:1px solid var(--line); }
  body.notes-open #notes{ display:flex; }
  #notes .row{ display:flex; align-items:center; gap:10px; }
  #notes .row b{ font-size:15px; }
  #notestat{ font:11px Consolas,monospace; color:var(--dim); margin-left:auto; }
  #notes textarea{ flex:1; resize:none; border:1px solid var(--line); border-radius:9px;
    padding:9px; background:#0f1316; color:#f2f6fa; font:15px system-ui; }
  #notes button{ border:0; border-radius:8px; background:#4d545d; color:#fff;
    font:13px system-ui; padding:8px 12px; cursor:pointer; min-height:38px; }

  /* someone who has asked their device for less motion gets the drawer
     snapping open instead of sliding */
  @media (prefers-reduced-motion: reduce){
    #list{ transition:none !important; }
    #ctl button:active:not(:disabled){ transform:none; }
  }

  /* ---------- narrow / iPad portrait: the list becomes a drawer ---------- */
  @media (max-width: 820px){
    #listbtn{ display:flex; align-items:center; justify-content:center;
      background:#38424c; color:#fff; border:0; border-radius:9px;
      font:700 14px system-ui; padding:9px 12px; cursor:pointer; white-space:nowrap; }
    #list{ transform:translateX(-100%); transition:transform .18s ease;
      box-shadow:6px 0 22px rgba(0,0,0,.5); width:80vw; max-width:320px; }
    body.list-open #list{ transform:none; }
    body.list-open #scrim{ display:block; }
    #frame{ left:0; width:100%; }
    #top .brand{ display:none; }          /* the asset name matters more */
    #gwbtn{ padding:9px 10px; font-size:12px; }
  }
</style>
</head>
<body>

<header id="top">
  <span class="brand">🎬 ASSET STAGE</span><span id="rev"></span>
  <button id="listbtn">☰ Assets</button>
  <span id="now">Loading…</span>
  <!-- house rule: ONE button into the game itself -->
  <button id="gwbtn" title="enter George World — the game itself">🌴 GEORGE WORLD</button>
</header>

<nav id="list">
  <!-- the filter belongs WITH the list it filters, sticky at its top, so it is
       on screen exactly when you are browsing — and on iPad portrait it comes
       along inside the Assets drawer. -->
  <div id="meshybar">
    <button id="meshybtn" role="switch" aria-pressed="false"
            title="show only the models built through the Meshy pipeline">
      <span class="sw"><span class="knob"></span></span>
      <span class="txt">Meshy only</span>
      <span class="cnt" id="meshycount"></span>
    </button>
  </div>
</nav>
<div id="scrim"></div>
<iframe id="frame" title="the asset on stage"></iframe>

<footer id="ctl">
  <button id="prev"    title="previous asset"><span class="ico">◀</span><span class="cap">Back</span></button>
  <button id="next"    title="next asset"><span class="ico">▶</span><span class="cap">Next</span></button>
  <button id="playbtn" title="play or pause the animation"><span class="ico">⏸</span><span class="cap">Pause</span></button>
  <button id="animbtn" title="show the next animation"><span class="ico">🎞</span><span class="cap">Animation</span></button>
  <button id="zout" class="small" title="zoom out"><span class="ico">−</span><span class="cap">Out</span></button>
  <button id="zin"  class="small" title="zoom in"><span class="ico">＋</span><span class="cap">In</span></button>
  <button id="reset" class="small" title="reset the view"><span class="ico">⟲</span><span class="cap">Reset</span></button>
  <button id="notesbtn" class="small" title="notes on this asset"><span class="ico">✎</span><span class="cap">Notes</span></button>
</footer>

<div id="notes">
  <div class="row"><b id="notelabel"></b>
    <span id="notestat"></span>
    <button id="copyall">Copy all</button>
    <button id="notesclose">Close</button></div>
  <textarea id="note" placeholder="What do you think of this one? Typed here, it reaches the sessions."></textarea>
</div>

<script>
(function(){
  'use strict';

  // =====================================================================
  // THE LIST — grouped in plain language, newest 3-D assets FIRST in each
  // group. An entry is [file, label]; the file may carry its own query
  // (creature_study.html?m=orca) and that survives the cache-buster below.
  // =====================================================================
  const CATALOG = [
    // v8.20 (Doug): three little plays in which the Meshy assets act on each
    // other rather than turning on the spot alone. One page, ?s=<key> picks
    // the scene, choreography authored in DRAM Script. Tagged Meshy (1)
    // because that is what they are built out of — they stay under the filter.
    ['Scenes', [
      ['scenes_study.html?s=standoff',   'Standoff', 1],
      ['scenes_study.html?s=dragon',     'Dragon & castle', 1],
      ['scenes_study.html?s=whalewatch', 'Whale watch', 1],
    ]],
    // Every one of these is a Meshy build with its own clips, played by the
    // one viewer. The people are full mixamorig humanoids and can ALSO be
    // walked over terrain from Tools > Terrain walk.
    ['People', [
      ['creature_study.html?m=vita2b', 'Vita 2b', 1],
      ['creature_study.html?m=vita2c', 'Vita 2c', 1],
      ['creature_study.html?m=vita2',  'Vita 2', 1],
      ['creature_study.html?m=vita',   'Vita 1', 1],
      ['creature_study.html?m=ivy',    'Ivy', 1],
      ['creature_study.html?m=alien',  'Alien', 1],
      ['creature_study.html?m=legion', 'Legionary', 1],
    ]],
    ['Animals', [
      ['creature_study.html?m=dragon', 'Dragon', 1],
      // side-by-side for the low-poly-default trial: same dragon, 22% of the
      // triangles and 12% of the download. Sits directly under the original so
      // Back/Next flips between the two.
      ['creature_study.html?m=dragonlow', 'Dragon (low-poly)', 1],
      ['creature_study.html?m=poppy',  'Poppy the dog', 1],
      ['creature_study.html?m=honu',   'Sea turtle', 1],
      ['creature_study.html?m=crab',   'Coconut crab', 1],
      ['creature_study.html?m=gull',   'Gull', 1],
      ['creature_study.html?m=orca',   'Orca', 1],
      ['horse_study.html', 'Horse'],
      ['barnyard_study.html', 'Barnyard'],
      ['cat_study.html', 'Cat'],
      ['fish_study.html', 'Fish'],
      ['seagull_study.html', 'Seagull'],
      ['orca_study.html', 'Orcas (drawn)'],
      ['crab_study.html', 'Crab (drawn)'],
      ['turtle_study.html', 'Turtle (drawn)'],
      ['jungle_study.html', 'Gibbons'],
      ['pterodactyl_study.html', 'Pteranodon'],
      ['brontosaurus_study.html', 'Brontosaurus'],
      ['triceratops_study.html', 'Triceratops'],
      ['pachycephalosaurus_study.html', 'Pachycephalosaur'],
      ['ankylosaurus_study.html', 'Ankylosaurus'],
      ['godzilla_study.html', 'Godzilla'],
    ]],
    ['Things', [
      ['creature_study.html?m=castle',  'Castle', 1],
      ['creature_study.html?m=throne',  'Throne', 1],
      ['creature_study.html?m=balloon', 'Hot air balloon', 1],
      ['creature_study.html?m=rowboat', 'Rowboat', 1],
      ['creature_study.html?m=hoard',   'Dragon hoard', 1],
      ['creature_study.html?m=fire',    'Campfire', 1],
      ['castle_study.html', 'Castle (drawn)'],
      ['throne_study.html', 'Throne (drawn)'],
      ['bank_study.html', 'Bank'],
      ['plantation_study.html', 'Plantation'],
      ['houses_study.html', 'Houses'],
      ['windmill_study.html', 'Windmill'],
      ['bell_study.html', 'Bell tower'],
      ['clocktower_study.html', 'Clock tower'],
      ['watertower_study.html', 'Water tower'],
      ['dock_study.html', 'Dock'],
      ['wagon_study.html', 'Wagon'],
      ['rowboat_study.html', 'Rowboat (drawn)'],
      ['tradeboat_study.html', 'Trading boat'],
      ['surfboard_study.html', 'Surfboards'],
      ['chariot_study.html', 'Chariot'],
      ['train_study.html', 'Train'],
      ['bulldozer_study.html', 'Bulldozer'],
      ['hotair_study.html', 'Balloon (drawn)'],
      ['flyer_study.html', 'Wright Flyer'],
      ['p51_study.html', 'P-51 Mustang'],
      ['jet_study.html', 'Passenger jet'],
      ['rocket_study.html', 'Rocket'],
    ]],
    ['Fire & effects', [
      // opens on the campfire, not the default embers: embers is a few faint
      // sparks and reads as "nothing loaded" to someone just looking
      ['effects_study.html?p=campfire', 'Fire'],
      ['bigbang_study.html', 'Big Bang'],
      ['explosions_study.html', 'Explosions'],
      ['fire_study.html', 'Fire (drawn)'],
      ['fireflies_study.html', 'Fireflies'],
      ['volcano_study.html', 'Volcano'],
      ['tornado_study.html', 'Tornado'],
      ['weather_study.html', 'Weather'],
      ['sky_study.html', 'Sky'],
      ['waves_study.html', 'Waves'],
    ]],
    ['Places', [
      ['georgeland2_study.html', 'Georgeland 2'],
      ['terrain_study.html', 'Aipotu terrain'],
      ['caldera_study.html', 'The Caldera'],
      ['atoll_study.html', 'Ring Atoll'],
      ['delta_study.html', 'River Delta'],
      ['inlandwater_study.html', 'Inland water'],
      ['easteregg_study.html', 'Crystal grotto'],
    ]],
    ['Plants', [
      ['palm_study.html', 'Palm'],
      ['fir_study.html', 'Firs'],
      ['baobab_study.html', 'Baobab'],
      ['corn_study.html', 'Corn'],
      ['berrybush_study.html', 'Berry bush'],
      ['bushgrowth_study.html', 'Berry bush growth'],
      ['flora_study.html', 'Weeds & wildflowers'],
      ['wind_study.html', 'Wind'],
    ]],
    ['Vignettes', [
      ['duo_study.html', 'Duo'],
      ['army_study.html', 'Army'],
      ['roman_study.html', 'Romans'],
      ['landingcraft_study.html', 'Landing craft'],
      ['formation_study.html', 'Formation'],
      ['market_study.html', 'Market stall'],
      ['reader_study.html', 'Reader'],
      ['plow_study.html', 'Oxen & plow'],
      ['scythe_study.html', 'Scythe'],
      ['sculptor_study.html', 'Sculptor'],
      ['printingpress_study.html', 'Printing press'],
      ['spinningwheel_study.html', 'Spinning wheel'],
      ['kite_study.html', 'Kites'],
      ['balloon_study.html', 'Balloon scene'],
      ['well_study.html', 'Well'],
      ['bridge_study.html', 'Footbridge'],
      ['signpost_study.html', 'Signpost'],
      ['drum_study.html', 'Drum'],
      ['beehive_study.html', 'Beehives'],
      ['tools_study.html', 'Tools'],
    ]],
    ['Tools', [
      ['terrainwalk_study.html', 'Terrain walk'],
      ['anim_viewer.html', 'Animation viewer'],
      ['georgeotron_parts_study.html', 'Georgeotron parts'],
    ]],
  ];

  const frame    = document.getElementById('frame');
  const listEl   = document.getElementById('list');
  const nowEl    = document.getElementById('now');
  const playBtn  = document.getElementById('playbtn');
  const animBtn  = document.getElementById('animbtn');
  const meshyBtn = document.getElementById('meshybtn');
  const meshyCount = document.getElementById('meshycount');

  const BY_FILE = {}, ALL = [];
  for(const [gname, items] of CATALOG){
    for(const [file, label, meshy] of items){
      BY_FILE[file] = { file, label, grp:gname, meshy: !!meshy };
      ALL.push(BY_FILE[file]);
    }
  }

  // MESHY ONLY (Doug, 2026-09-03). The list carries both the Meshy-pipeline
  // models and ~85 procedural studies; this hides everything that did not come
  // out of Meshy. Remembered per device, because someone who works in one mode
  // wants it still set tomorrow — and the switch sits at the top of the list,
  // lit when it is on, so a filtered list can never look like a lost one.
  // v8.30: the DEFAULT is now ON. The pre-Meshy skins were archived out of the
  // store entirely on 2026-09-03 (vendor/models/_archive_pre_meshy/), so what
  // this switch hides is no longer old junk — it is the ~85 procedural studies,
  // which are legitimate but are not what the stage is for day to day. Opening
  // clean and letting the switch REVEAL the rest is one mechanism, not two.
  // Only an explicit stored '0' turns it off, so a first visit gets the clean view.
  let meshyOnly = true;
  try { const v = localStorage.getItem('hvb-stage-meshy-only'); if(v === '0') meshyOnly = false; }
  catch(err){}
  // the items you can actually reach right now — Back and Next walk THIS
  function visible(){ return meshyOnly ? ALL.filter(i => i.meshy) : ALL; }

  // Boot on a real asset, framed and moving. v6 opened on the terrain walk
  // because the old placeholder Vitas were "very uninviting"; the dragon is a
  // finished asset that answers the same objection and is what this page is
  // actually for. The terrain walk is one tap away under Tools.
  let current = 'creature_study.html?m=dragon';

  // ?item=<file> still deep-links, e.g. ?item=creature_study.html%3Fm%3Dorca
  {
    const hit = /(?:^|[?&])item=(.*)$/.exec(location.search.replace(/^\?/, ''));
    if(hit){
      const want = decodeURIComponent(hit[1]);
      if(BY_FILE[want]) current = want;
    }
  }

  // ---------------------------------------------------------------------
  // the list
  // ---------------------------------------------------------------------
  let wantScroll = false;
  const rowOf = {};
  const groupEls = [];
  for(const [gname, items] of CATALOG){
    const h = document.createElement('div');
    h.className = 'grp'; h.textContent = gname;
    listEl.appendChild(h);
    const mine = [];
    for(const [file, label] of items){
      const b = document.createElement('button');
      b.dataset.file = file;
      b.innerHTML = '<span class="note"></span>' + label;
      b.addEventListener('click', () => { current = file; wantScroll = true; load(); closeList(); });
      listEl.appendChild(b);
      rowOf[file] = b;
      mine.push(file);
    }
    groupEls.push({ head:h, files:mine });
  }

  // show/hide rows for the current filter, and drop a group heading whose
  // every row is hidden so the list never shows an empty "PLANTS"
  function applyFilter(){
    for(const f in rowOf) rowOf[f].hidden = meshyOnly && !BY_FILE[f].meshy;
    for(const g of groupEls) g.head.hidden = g.files.every(f => rowOf[f].hidden);
    meshyBtn.classList.toggle('on', meshyOnly);
    meshyBtn.setAttribute('aria-pressed', meshyOnly ? 'true' : 'false');
    meshyCount.textContent = visible().length;
  }
  function markList(){
    for(const f in rowOf){
      rowOf[f].classList.toggle('on', f === current);
      const n = NOTES[f] && (NOTES[f].text || '').trim();
      rowOf[f].querySelector('.note').textContent = n ? '✎' : '';
    }
    // Only scroll the list when the USER moved to another asset. markList also
    // runs on boot and whenever notes arrive from the server, and scrolling
    // then just yanks the list out from under whoever is reading it.
    const row = rowOf[current];
    if(wantScroll && row && row.scrollIntoView){ row.scrollIntoView({ block:'nearest' }); }
    wantScroll = false;
  }

  meshyBtn.addEventListener('click', () => {
    meshyOnly = !meshyOnly;
    try { localStorage.setItem('hvb-stage-meshy-only', meshyOnly ? '1' : '0'); } catch(err){}
    applyFilter();
    // Turning the filter ON while looking at, say, the palm tree would leave a
    // hidden asset on stage and a list with nothing selected. Move to the first
    // Meshy model instead. Turning it OFF never moves you.
    if(meshyOnly && !BY_FILE[current].meshy){
      const first = visible()[0];
      if(first){ current = first.file; wantScroll = true; load(); return; }
    }
    wantScroll = true; markList();
  });

  function openList(){ document.body.classList.add('list-open'); }
  function closeList(){ document.body.classList.remove('list-open'); }
  document.getElementById('listbtn').addEventListener('click',
    () => document.body.classList.toggle('list-open'));
  document.getElementById('scrim').addEventListener('click', closeList);

  // ---------------------------------------------------------------------
  // loading
  // ---------------------------------------------------------------------
  let loadN = 0;
  function load(){
    const rec = BY_FILE[current];
    nowEl.textContent = rec ? rec.label : current;
    // a catalog entry may carry its own query, so the cache-buster joins with
    // & in that case — otherwise the second '?' swallows the first
    // embed=1 tells a study that understands it to hide its own control panel,
    // so there is exactly ONE way to pick an asset and ONE set of buttons.
    // Studies that do not know the flag simply ignore it.
    const sep = current.indexOf('?') >= 0 ? '&' : '?';
    frame.src = current + sep + 'embed=1&n=' + (++loadN);
    markList();
    showNote();
    setControls(null);                 // until the new page reports in
  }

  // the study's control surface, if it has one
  function api(){
    try { return (frame.contentWindow && frame.contentWindow.STAGE_API) || null; }
    catch(err){ return null; }         // not loaded yet
  }
  function setControls(a){
    const has = !!a;
    const clips = has ? a.clipCount() : 0;
    playBtn.disabled = !has || clips === 0;
    animBtn.disabled = !has || clips < 2;
    if(has && clips){
      const playing = a.isPlaying();
      playBtn.querySelector('.ico').textContent = playing ? '⏸' : '▶';
      playBtn.querySelector('.cap').textContent = playing ? 'Pause' : 'Play';
      const n = a.clipName();
      animBtn.querySelector('.cap').textContent = (clips > 1 && n) ? n : 'Animation';
    } else {
      playBtn.querySelector('.ico').textContent = '▶';
      playBtn.querySelector('.cap').textContent = 'Play';
      animBtn.querySelector('.cap').textContent = 'Animation';
    }
  }
  // STAGE_API exists the moment the study's module runs — which is BEFORE its
  // multi-megabyte model has arrived, when the clip count is still zero. Waiting
  // only for the object therefore froze Play and Animation greyed out on a page
  // that was about to have three clips. So keep the buttons in sync on a light
  // heartbeat instead: it costs nothing, survives a slow model, and also tracks
  // changes made inside the study itself.
  // ONE timer, not two. A second faster poll layered on top bought about a
  // third of a second of button responsiveness and cost far more than it was
  // worth: two repeating timers keep the task queue busy enough to starve a
  // headless capture of the idle time it needs to fetch an 8 MB model, so the
  // stage screenshotted empty. 250ms is imperceptible and leaves the page idle.
  setInterval(() => setControls(api()), 250);

  // ---------------------------------------------------------------------
  // the six big buttons
  // ---------------------------------------------------------------------
  function step(d){
    const list = visible();
    if(!list.length) return;
    const i = list.findIndex(x => x.file === current);
    // if the asset on stage is filtered out, step lands on the first visible
    // one rather than jumping somewhere arbitrary
    const j = (i < 0) ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length;
    current = list[j].file; wantScroll = true; load();
  }
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));

  playBtn.addEventListener('click', () => { const a = api(); if(!a) return;
    a.toggle(); setControls(a); });
  animBtn.addEventListener('click', () => { const a = api(); if(!a) return;
    a.nextClip(); setControls(a); });

  // zoom: STAGE_API where it exists, synthetic wheel everywhere else, so the
  // buttons do something on all ~90 studies rather than only the new ones
  function wheelPulse(dir){
    try {
      const doc = frame.contentDocument;
      const el = doc && (doc.querySelector('canvas') || doc.body);
      if(el) el.dispatchEvent(new WheelEvent('wheel',
        { deltaY: dir * 120, bubbles:true, cancelable:true }));
    } catch(err){}
  }
  function zoom(f, dir){ const a = api(); if(a && a.zoom) a.zoom(f); else wheelPulse(dir); }
  document.getElementById('zin').addEventListener('click',  () => zoom(1/1.25, -1));
  document.getElementById('zout').addEventListener('click', () => zoom(1.25,    1));
  document.getElementById('reset').addEventListener('click', () => {
    const a = api(); if(a && a.reset) a.reset(); else load();
  });

  // arrow keys still step, including when the iframe has focus
  function onKey(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key === 'ArrowLeft')  step(-1);
    if(e.key === 'ArrowRight') step(1);
  }
  addEventListener('keydown', onKey);
  frame.addEventListener('load', () => {
    try { frame.contentDocument.addEventListener('keydown', onKey); } catch(err){}
  });

  document.getElementById('gwbtn').addEventListener('click',
    () => { location.href = 'georgeworld.html'; });

  // ---------------------------------------------------------------------
  // notes — Doug's channel to the sessions. localStorage plus, when the local
  // server is there, POST /stage-notes -> stage_notes.json + STAGE_NOTES.md
  // ---------------------------------------------------------------------
  const KEY = 'hvb-stage-notes';
  let NOTES = {};
  try { NOTES = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(err){ NOTES = {}; }
  const noteEl = document.getElementById('note');
  const noteStat = document.getElementById('notestat');
  const noteLabel = document.getElementById('notelabel');
  const notesBtn = document.getElementById('notesbtn');

  function stamp(){
    const d = new Date(), p = x => String(x).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
         + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function showNote(){
    const o = BY_FILE[current];
    noteLabel.textContent = o ? o.label : '';
    noteEl.value = (NOTES[current] && NOTES[current].text) || '';
    noteStat.textContent = (NOTES[current] && NOTES[current].ts) ? 'saved ' + NOTES[current].ts : '';
    markList();
  }
  let saveT = null;
  async function saveNotes(){
    try { localStorage.setItem(KEY, JSON.stringify(NOTES)); } catch(err){}
    try {
      const r = await fetch('/stage-notes', { method:'POST',
        headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(NOTES) });
      // 2026-09-04: the server MERGES (newer ts per item) and answers with the
      // whole set, so notes made on the other device arrive here instead of
      // being erased. Adopt them; leave the box alone while it is being typed in.
      let merged = null;
      try { merged = r.ok ? (await r.json()).notes : null; } catch(err){ merged = null; }
      if(merged && typeof merged === 'object'){
        NOTES = merged;
        try { localStorage.setItem(KEY, JSON.stringify(NOTES)); } catch(err){}
        if(document.activeElement !== noteEl) showNote();
      }
      noteStat.textContent = r.ok ? 'saved to STAGE_NOTES.md ' + stamp() : 'saved in this browser only';
    } catch(err){ noteStat.textContent = 'saved in this browser only (no local server)'; }
    markList();
  }
  noteEl.addEventListener('input', () => {
    const o = BY_FILE[current];
    NOTES[current] = { label: o ? o.label : current, text: noteEl.value, ts: stamp() };
    noteStat.textContent = 'saving…';
    clearTimeout(saveT); saveT = setTimeout(saveNotes, 600);
  });
  notesBtn.addEventListener('click',
    () => { document.body.classList.toggle('notes-open');
            if(document.body.classList.contains('notes-open')) noteEl.focus(); });
  document.getElementById('notesclose').addEventListener('click',
    () => document.body.classList.remove('notes-open'));
  document.getElementById('copyall').addEventListener('click', async () => {
    const lines = ['# HvB Asset Stage notes — ' + stamp(), ''];
    for(const it of ALL){
      const n = NOTES[it.file];
      if(n && (n.text || '').trim())
        lines.push('## ' + it.grp + ' > ' + it.label + '  (' + it.file + ')',
                   n.ts, '', n.text.trim(), '');
    }
    const md = lines.join('\n');
    try { await navigator.clipboard.writeText(md); noteStat.textContent = 'all notes copied'; }
    catch(err){ noteEl.value = md; noteEl.select(); noteStat.textContent = 'select all and copy'; }
  });
  fetch('stage_notes.json?n=' + Date.now()).then(r => r.ok ? r.json() : null).then(srv => {
    if(!srv) return;
    for(const k in srv) if(!NOTES[k] || (srv[k].ts || '') >= (NOTES[k].ts || '')) NOTES[k] = srv[k];
    try { localStorage.setItem(KEY, JSON.stringify(NOTES)); } catch(err){}
    showNote();
  }).catch(() => {});

  // ---------------------------------------------------------------------
  applyFilter();
  // a remembered filter must not leave a hidden asset on stage at boot
  if(meshyOnly && BY_FILE[current] && !BY_FILE[current].meshy){
    const first = visible()[0];
    if(first) current = first.file;
  }
  document.getElementById('rev').textContent = 'v' + REV;
  document.getElementById('rev').title = 'built ' + REV_BUILT;
  load();
  window.STAGE = { get current(){ return current; }, ALL, CATALOG, load,
                   go(f){ current = f; load(); }, api };
})();
</script>
</body>
</html>
