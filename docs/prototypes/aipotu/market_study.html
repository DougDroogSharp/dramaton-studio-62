<!DOCTYPE html>
<!-- ======================================================================
     MARKET STALL STUDY — trade's visible home, for George World.
     Filed 2026-08-31. Standalone; vendored three (r160), game importmap.
     A striped-awning stall: counter, shelf, hanging goods on the crossbar,
     berry baskets and bread on the boards. The scene loop: the KEEPER
     lays out wares; a SHOPPER arrives; THE HAGGLE — big alternating
     gestures, head-shakes, the offer and the counter-offer; the
     HANDSHAKE that seals it; goods and payment CHANGE HANDS; the
     shopper strolls off with the basket and the keeper re-stocks.
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Stall Study</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#e6e4d2; }
  #chip { position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(28,24,16,0.78); color:#f2eee2; font:13px/1.5 system-ui, sans-serif;
    padding:10px 14px; border-radius:10px; user-select:none; backdrop-filter:blur(4px); }
  #chip b { font-size:14px; }
  #chip .hint { opacity:0.7; }
</style>
</head>
<body>
<div id="chip">
  <b>🧺 Market Stall Study</b> — the haggle and the handshake, v1<br>
  <span class="hint">drag to orbit · scroll to zoom · loop: lay out → haggle → shake → goods change hands</span>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 555777;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe4e2d0), 40, 240);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.2, 600);
camera.position.set(4.2, 2.8, 6.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 2; controls.maxDistance = 30;
controls.maxPolarAngle = 1.52;
{
  const geo = new THREE.SphereGeometry(280, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xf4f2e0), zenith = new THREE.Color(0x84b2d8),
        below = new THREE.Color(0xdad8c4), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/280;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.6)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xdcecf6, 0xb0a880, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.3);
sun.position.set(16, 24, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(220, 40),
    new THREE.MeshLambertMaterial({ color:0xc2b586 }));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
}

// ---------- THE STALL ------------------------------------------------------
const matWood = new THREE.MeshLambertMaterial({ color:0x8a6134, flatShading:true });
const matWoodLt = new THREE.MeshLambertMaterial({ color:0xa07948, flatShading:true });
const matBerry = new THREE.MeshLambertMaterial({ color:0xd8433c });
const matBread = new THREE.MeshLambertMaterial({ color:0xc9963c, flatShading:true });
{
  // counter + posts
  const counter = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.9), matWoodLt);
  counter.position.y = 0.95;
  counter.castShadow = true;
  scene.add(counter);
  const skirtCv = document.createElement('canvas'); skirtCv.width = 128; skirtCv.height = 64;
  {
    const g = skirtCv.getContext('2d');
    for(let i = 0; i < 8; i++){ g.fillStyle = i % 2 ? '#d8433c' : '#efe6cc'; g.fillRect(i*16, 0, 16, 64); }
  }
  const skirtTex = new THREE.CanvasTexture(skirtCv);
  skirtTex.colorSpace = THREE.SRGBColorSpace;
  const skirt = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.85),
    new THREE.MeshLambertMaterial({ map: skirtTex }));
  skirt.position.set(0, 0.48, 0.45);
  scene.add(skirt);
  for(const s of [-1, 1]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.07, 2.5, 7), matWood);
    post.position.set(s*1.25, 1.25, -0.35);
    post.castShadow = true;
    scene.add(post);
    const postF = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.065, 2.15, 7), matWood);
    postF.position.set(s*1.25, 1.07, 0.45);
    postF.castShadow = true;
    scene.add(postF);
  }
  // the striped AWNING, gently sloped, with a scalloped front edge
  const awnCv = document.createElement('canvas'); awnCv.width = 128; awnCv.height = 64;
  {
    const g = awnCv.getContext('2d');
    for(let i = 0; i < 8; i++){ g.fillStyle = i % 2 ? '#3d8ec9' : '#efe6cc'; g.fillRect(i*16, 0, 16, 64); }
  }
  const awnTex = new THREE.CanvasTexture(awnCv);
  awnTex.colorSpace = THREE.SRGBColorSpace;
  window.__awning = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 1.5, 8, 4),
    new THREE.MeshLambertMaterial({ map: awnTex, side:THREE.DoubleSide }));
  window.__awning.rotation.x = -0.42;
  window.__awning.position.set(0, 2.35, 0.1);
  window.__awning.castShadow = true;
  scene.add(window.__awning);
  // crossbar with HANGING GOODS (a string of onions, a cloth bundle, a pan)
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.4, 7), matWood);
  bar.rotation.z = Math.PI/2;
  bar.position.set(0, 1.85, -0.32);
  scene.add(bar);
  window.__hangs = [];
  const hangDefs = [
    [-0.8, () => { const g2 = new THREE.Group();
      for(let i = 0; i < 3; i++){ const o = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6),
        new THREE.MeshLambertMaterial({ color:0xc9a12e })); o.position.y = -0.1 - i*0.13; g2.add(o); }
      return g2; }],
    [0.1, () => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 7),
      new THREE.MeshLambertMaterial({ color:0x9a7b5a })); m.scale.y = 1.3; m.position.y = -0.2;
      const g2 = new THREE.Group(); g2.add(m); return g2; }],
    [0.85, () => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.05, 10),
      new THREE.MeshLambertMaterial({ color:0x4a4f55 })); m.position.y = -0.18;
      const g2 = new THREE.Group(); g2.add(m); return g2; }],
  ];
  for(const [x, mk] of hangDefs){
    const h = new THREE.Group();
    h.position.set(x, 1.85, -0.32);
    const str = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.14, 4), matWood);
    str.position.y = -0.07;
    h.add(str);
    h.add(mk());
    scene.add(h);
    window.__hangs.push({ g: h, ph: rand(0, 9) });
  }
  // shelf goods behind
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 0.4), matWoodLt);
  shelf.position.set(0, 1.5, -0.4);
  scene.add(shelf);
  for(let i = 0; i < 4; i++){
    const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.24, 8),
      new THREE.MeshLambertMaterial({ color:[0x7aa06a, 0xc9a85c, 0x6b8e9e, 0xa03636][i], flatShading:true }));
    jar.position.set(-0.9 + i*0.6, 1.66, -0.4);
    jar.castShadow = true;
    scene.add(jar);
  }
}
// counter goods: a berry basket (the trade good) + bread row
const tradeBasket = new THREE.Group();
{
  const tub = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.13, 0.16, 9, 1, true), matWood);
  tub.material = matWood.clone(); tub.material.side = THREE.DoubleSide;
  tradeBasket.add(tub);
  for(let i = 0; i < 5; i++){
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.05, 7, 6), matBerry);
    const a = i*2.4;
    b.position.set(Math.cos(a)*0.08, 0.09, Math.sin(a)*0.08);
    tradeBasket.add(b);
  }
  tradeBasket.position.set(-0.5, 1.09, 0.15);
  scene.add(tradeBasket);
  for(let i = 0; i < 3; i++){
    const loaf = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), matBread);
    loaf.scale.set(1.5, 0.7, 0.9);
    loaf.position.set(0.35 + i*0.38, 1.08, 0.12);
    loaf.castShadow = true;
    scene.add(loaf);
  }
}

// ---------- the two Vitas --------------------------------------------------
function person(dressC){
  const P = { g: new THREE.Group() };
  const dress = new THREE.MeshLambertMaterial({ color: dressC });
  const skin = new THREE.MeshLambertMaterial({ color:0xf2c299 });
  P.hips = new THREE.Group(); P.hips.position.y = 0.42; P.g.add(P.hips);
  const barrel = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.42, 6, 12), dress);
  barrel.position.y = 0.22; barrel.castShadow = true; P.hips.add(barrel);
  P.head = new THREE.Group(); P.head.position.y = 0.8; P.hips.add(P.head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), skin);
  skull.castShadow = true; P.head.add(skull);
  P.arms = [];
  for(const s of [-1, 1]){
    const arm = new THREE.Group();
    arm.position.set(s*0.32, 0.5, 0);
    const limb = new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.4, 4, 8), skin);
    limb.position.y = -0.24; limb.castShadow = true; arm.add(limb);
    const hand = new THREE.Group(); hand.position.y = -0.5; arm.add(hand);
    P.hips.add(arm); P.arms.push({ g: arm, hand });
  }
  P.legs = [];
  for(const s of [-1, 1]){
    const leg = new THREE.Group();
    leg.position.set(s*0.14, 0, 0);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.32, 4, 8),
      new THREE.MeshLambertMaterial({ color:0x4c5666 }));
    shin.position.y = -0.26; shin.castShadow = true; leg.add(shin);
    P.hips.add(leg); P.legs.push(leg);
  }
  scene.add(P.g);
  return P;
}
const keeper = person(0x7aa06a);
keeper.g.position.set(0, 0.1, -0.75);
const shopper = person(0xff7a5c);
// the coin that pays for it all
const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.015, 10),
  new THREE.MeshStandardMaterial({ color:0xd9a929, metalness:0.7, roughness:0.35 }));
coin.visible = false;
scene.add(coin);

// ---------- THE LOOP -------------------------------------------------------
// restock(2.5) → shopper arrives(2.5) → HAGGLE(6) → HANDSHAKE(1.6) →
// exchange(2.2) → shopper leaves(3.2)
let phT = 0;
const T_STOCK = 2.5, T_ARRIVE = 2.5, T_HAGGLE = 6, T_SHAKE = 1.6, T_SWAP = 2.2, T_LEAVE = 3.2;
const TOTAL = T_STOCK + T_ARRIVE + T_HAGGLE + T_SHAKE + T_SWAP + T_LEAVE;
const SHOP_FAR = new THREE.Vector3(4.5, 0.1, 2.6);
const SHOP_AT = new THREE.Vector3(0.1, 0.1, 1.15);

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT = (phT + dt) % TOTAL;
  let f = phT;

  // the awning breathes; the hanging goods sway
  {
    const pos = window.__awning.geometry.attributes.position;
    for(let i = 0; i < pos.count; i++){
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, Math.sin(x*3 + t*2.2)*0.02*(0.5 - y*0.3));
    }
    pos.needsUpdate = true;
  }
  for(const h of window.__hangs){
    h.g.rotation.x = Math.sin(t*1.4 + h.ph)*0.07;
    h.g.rotation.z = Math.sin(t*1.1 + h.ph*2)*0.06;
  }

  // defaults
  keeper.g.rotation.y = 0;
  const kIdleArms = () => {
    keeper.arms[0].g.rotation.x = lerp(keeper.arms[0].g.rotation.x, -0.2, dt*5);
    keeper.arms[1].g.rotation.x = lerp(keeper.arms[1].g.rotation.x, -0.2, dt*5);
  };
  const still = P => {
    P.legs[0].rotation.x = lerp(P.legs[0].rotation.x, 0, dt*6);
    P.legs[1].rotation.x = lerp(P.legs[1].rotation.x, 0, dt*6);
  };
  const walk = (P, sp = 1) => {
    const ph = t*8*sp;
    P.legs[0].rotation.x = Math.sin(ph)*0.45;
    P.legs[1].rotation.x = -Math.sin(ph)*0.45;
    P.hips.position.y = 0.42 + Math.abs(Math.cos(ph))*0.025;
  };

  if(f < T_STOCK){                          // laying out the wares
    shopper.g.position.copy(SHOP_FAR);
    shopper.g.visible = false;
    still(keeper);
    const p = (f/T_STOCK)*Math.PI*2;
    keeper.arms[1].g.rotation.x = -1.1 + Math.sin(p*2)*0.5;   // placing, adjusting
    keeper.arms[0].g.rotation.x = -0.6 + Math.sin(p*2 + 1)*0.3;
    keeper.hips.rotation.x = 0.12;
    keeper.head.rotation.x = 0.25;                              // eyes on the goods
    tradeBasket.position.set(-0.5, 1.09, 0.15);
    coin.visible = false;
  } else if((f -= T_STOCK) < T_ARRIVE){     // the shopper approaches
    shopper.g.visible = true;
    const p = smooth(f/T_ARRIVE);
    shopper.g.position.lerpVectors(SHOP_FAR, SHOP_AT, p);
    shopper.g.rotation.y = Math.atan2(SHOP_AT.x - SHOP_FAR.x, SHOP_AT.z - SHOP_FAR.z) + Math.PI;
    walk(shopper);
    still(keeper);
    kIdleArms();
    keeper.hips.rotation.x = 0;
    keeper.head.rotation.x = 0;
    keeper.head.rotation.y = lerp(keeper.head.rotation.y, 0.2, dt*3);  // clocking the customer
  } else if((f -= T_ARRIVE) < T_HAGGLE){    // THE HAGGLE
    shopper.g.position.copy(SHOP_AT);
    shopper.g.rotation.y = Math.PI;
    still(shopper); still(keeper);
    const round = Math.floor(f / 1.5) % 2;  // they take turns
    const beat = (f % 1.5) / 1.5;
    const talker = round === 0 ? shopper : keeper;
    const listener = round === 0 ? keeper : shopper;
    // the talker gesticulates BIG: offer palm, chop, point at the goods
    talker.arms[1].g.rotation.x = -1.2 - Math.sin(beat*Math.PI*3)*0.45;
    talker.arms[0].g.rotation.x = -0.6 - Math.sin(beat*Math.PI*2 + 1)*0.4;
    talker.head.rotation.x = -0.08 + Math.sin(beat*Math.PI*4)*0.05;
    talker.hips.rotation.x = 0.05;
    // the listener: crossed-ish arms, the slow skeptical head-shake
    listener.arms[1].g.rotation.x = lerp(listener.arms[1].g.rotation.x, -0.9, dt*4);
    listener.arms[0].g.rotation.x = lerp(listener.arms[0].g.rotation.x, -0.9, dt*4);
    listener.head.rotation.y = Math.sin(beat*Math.PI*2)*0.3;   // no… no…
    listener.hips.rotation.x = -0.03;
  } else if((f -= T_HAGGLE) < T_SHAKE){     // THE HANDSHAKE
    still(shopper); still(keeper);
    const p = Math.sin(clamp(f/T_SHAKE, 0, 1)*Math.PI);
    keeper.arms[1].g.rotation.x = -1.35;
    shopper.arms[1].g.rotation.x = -1.35;
    // the pump
    keeper.arms[1].g.rotation.x += Math.sin(t*9)*0.12*p;
    shopper.arms[1].g.rotation.x += Math.sin(t*9)*0.12*p;
    keeper.head.rotation.y = 0;
    shopper.head.rotation.y = 0;
    keeper.head.rotation.x = 0.08;          // the little nods of the deal
    shopper.head.rotation.x = 0.08;
  } else if((f -= T_SHAKE) < T_SWAP){       // goods and coin CHANGE HANDS
    still(shopper); still(keeper);
    const p = smooth(f/T_SWAP);
    // the coin travels shopper → keeper first half; basket keeper → shopper second
    coin.visible = p < 0.55;
    if(coin.visible){
      const from = new THREE.Vector3(); shopper.arms[1].hand.getWorldPosition(from);
      const to = new THREE.Vector3(); keeper.arms[1].hand.getWorldPosition(to);
      coin.position.lerpVectors(from, to, clamp(p/0.5, 0, 1));
      shopper.arms[1].g.rotation.x = -1.2;
      keeper.arms[1].g.rotation.x = -1.2;
    }
    if(p > 0.5){
      const bp = clamp((p - 0.5)/0.5, 0, 1);
      const from = new THREE.Vector3(-0.5, 1.09, 0.15);
      const to = new THREE.Vector3(); shopper.arms[0].hand.getWorldPosition(to);
      tradeBasket.position.lerpVectors(from, to, bp);
      keeper.arms[0].g.rotation.x = -1.0;
      shopper.arms[0].g.rotation.x = -1.0;
    }
  } else {                                  // off goes the shopper, basket in hand
    const p = smooth((f - T_SWAP)/T_LEAVE);
    shopper.g.position.lerpVectors(SHOP_AT, SHOP_FAR, p);
    shopper.g.rotation.y = Math.atan2(SHOP_FAR.x - SHOP_AT.x, SHOP_FAR.z - SHOP_AT.z) + Math.PI;
    walk(shopper, 0.95);
    shopper.arms[0].g.rotation.x = -0.9;    // carrying the basket
    const hp = new THREE.Vector3(); shopper.arms[0].hand.getWorldPosition(hp);
    tradeBasket.position.copy(hp);
    coin.visible = false;
    kIdleArms();
    keeper.head.rotation.y = lerp(keeper.head.rotation.y, 0.25*(1 - p), dt*3);  // watching them go
    if(p > 0.97) tradeBasket.position.set(-0.5, 1.09, 0.15);   // …and the loop re-stocks
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
