     or drag a .glb onto the page). To make that work, both IK layers
     were rebuilt REST-POSE-AGNOSTIC: instead of constructing absolute
     bone orientations (which assumed our rig's bind pose), they now
     apply WORLD-SPACE DELTA rotations on top of whatever the clip
     posed — so a real Mixamo skeleton, with its twisted rest bones,

       · the first Vita's walk clip clips its ELBOWS THROUGH THE TORSO
         slightly. Cosmetic; the arm swing needs a little more abduction
         (or the torso a slightly narrower collision profile).
       · feet can hover ~1 inch above the ground on some skins — the IK
         ground offset is measured from the rest ankle height and a few
         rigs sit their ankle differently.

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

const renderer = new THREE.WebGLRenderer({ antialias:true });

// ==========================================================================
//  THE MAP WITH NORMALS — analytic heightfield: exact height + normal
//  at every point. n = normalize(-dh/dx, 1, -dh/dz).
// ==========================================================================
function terrainH(x, z){
  return 0.55*Math.sin(x*0.42)*Math.cos(z*0.36)
       + 0.34*Math.sin(x*0.9 + 1.3)*Math.sin(z*0.74 + 0.6)
       + 0.16*Math.sin(x*1.9 + 4.0)*Math.cos(z*1.6 + 2.2);
}
function terrainGrad(x, z){
  return {
    hx: 0.55*0.42*Math.cos(x*0.42)*Math.cos(z*0.36)
      + 0.34*0.9*Math.cos(x*0.9 + 1.3)*Math.sin(z*0.74 + 0.6)
      + 0.16*1.9*Math.cos(x*1.9 + 4.0)*Math.cos(z*1.6 + 2.2),
    hz: -0.55*0.36*Math.sin(x*0.42)*Math.sin(z*0.36)
      + 0.34*0.74*Math.sin(x*0.9 + 1.3)*Math.cos(z*0.74 + 0.6)
      - 0.16*1.6*Math.sin(x*1.9 + 4.0)*Math.sin(z*1.6 + 2.2),
  };
}
function terrainNormal(x, z){
  const { hx, hz } = terrainGrad(x, z);
  return new THREE.Vector3(-hx, 1, -hz).normalize();
}
// ==========================================================================
//  THE GROUND MESH  (v8, 2026-09-02 — Doug: denser mesh + denser normals)
//
//  WHAT THIS DOES AND DOES NOT FIX, stated plainly:
//  The foot IK does NOT sample this mesh. It samples terrainH()/terrainNormal()
//  analytically (see legIK/ankleLayer), which are exact everywhere at any
//  density. So planting was never limited by triangle count.
//  What WAS limited is the surface you SEE. At 100 segments a cell was 0.36
//  units while the highest-frequency term of the heightfield has a 3.3-unit
//  wavelength — only ~9 samples across it — so rendered ridges were clipped
//  below the true surface and a correctly-planted foot could appear to hover
//  over a hill the mesh had flattened. Denser cells close that gap.
//
//  AND the normals: the old build computed exact analytic normals, used them
//  for the colour ramp, then threw them away by calling computeVertexNormals()
//  — replacing exactness with averaged face normals. We now write the analytic
//  normal straight into the attribute. That is not an approximation of smooth
//  shading, it IS the true surface normal at every vertex, and it costs
//  nothing.
//
//  DENSITY: 220x220 by default = 48.4k verts / 96.8k triangles, cell 0.164.
//  Static geometry, built once, one draw call — an iPad eats this. Override
//  with ?seg=N to A/B it (?seg=100 is the old mesh).
// ==========================================================================
const GROUND_SPAN = 36;
const GROUND_SEG = Math.max(16, Math.min(600,
  +(new URLSearchParams(location.search).get('seg')) || 220));
{
  const geo = new THREE.PlaneGeometry(GROUND_SPAN, GROUND_SPAN, GROUND_SEG, GROUND_SEG);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, nrm = geo.attributes.normal, col = [];
  const grass = new THREE.Color(0x7da45c), dry = new THREE.Color(0xb8a86a),
        steep = new THREE.Color(0x8a7a58), c = new THREE.Color();
  for(let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainH(x, z);
    pos.setY(i, y);
    const n = terrainNormal(x, z);
    nrm.setXYZ(i, n.x, n.y, n.z);          // EXACT — no computeVertexNormals()
    c.copy(grass).lerp(dry, clamp((y + 0.4)/1.6, 0, 1));
    c.lerp(steep, clamp((1 - n.y)*3.2, 0, 1));
    col.push(c.r, c.g, c.b);
  }
  pos.needsUpdate = nrm.needsUpdate = true;
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeBoundingSphere();
  const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true }));
  ground.receiveShadow = true;
  scene.add(ground);
  window.TW_MESH = { seg:GROUND_SEG, span:GROUND_SPAN,
    verts: pos.count, tris: GROUND_SEG*GROUND_SEG*2,
    cell: +(GROUND_SPAN/GROUND_SEG).toFixed(4), analyticNormals: true };
}
{
  let s2 = 977;
  const rnd = (a=1,b) => { s2 = (s2*1103515245 + 12345) & 0x7fffffff;
    const r = s2/0x7fffffff; return b===undefined ? r*a : a + r*(b-a); };
  const rockM = new THREE.MeshLambertMaterial({ color:0x8a8578, flatShading:true });
  const tuftM = new THREE.MeshLambertMaterial({ color:0x5c8544, flatShading:true });
  for(let i = 0; i < 40; i++){

      ? new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.1, 0.3)), rockM)
      : new THREE.Mesh(new THREE.ConeGeometry(rnd(0.06, 0.12), rnd(0.2, 0.45), 5), tuftM);
    m.position.set(x, terrainH(x, z) + 0.06, z);
    m.rotation.y = rnd(0, 6);
    m.castShadow = true;
    scene.add(m);

}

}

// ---------- the built-in NEW BODY -----------------------------------------
function buildCanonical(){
  const B = {};
  function bone(name, parentName, x, y, z){
    const b = new THREE.Bone();
    b.name = name; b.position.set(x, y, z);
    if(parentName) B[parentName].add(b);
    B[name] = b; return b;
  }
  const rootBone = bone('mixamorigHips', null, 0, 0.62, 0);
  bone('mixamorigSpine',  'mixamorigHips',  0, 0.10, 0);
  bone('mixamorigSpine1', 'mixamorigSpine', 0, 0.12, 0);
  bone('mixamorigSpine2', 'mixamorigSpine1',0, 0.12, 0);
  bone('mixamorigNeck',   'mixamorigSpine2',0, 0.12, 0);
  bone('mixamorigHead',   'mixamorigNeck',  0, 0.10, 0);
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    bone(`mixamorig${S}Shoulder`, 'mixamorigSpine2', s*0.16, 0.06, 0);
    bone(`mixamorig${S}Arm`,      `mixamorig${S}Shoulder`, s*0.14, -0.02, 0);
    bone(`mixamorig${S}ForeArm`,  `mixamorig${S}Arm`, s*0.09, -0.20, 0);
    bone(`mixamorig${S}Hand`,     `mixamorig${S}ForeArm`, s*0.05, -0.18, 0);
    bone(`mixamorig${S}UpLeg`,    'mixamorigHips', s*0.155, -0.06, 0);
    bone(`mixamorig${S}Leg`,      `mixamorig${S}UpLeg`, 0, -0.26, 0);
    bone(`mixamorig${S}Foot`,     `mixamorig${S}Leg`, 0, -0.26, 0);
    bone(`mixamorig${S}ToeBase`,  `mixamorig${S}Foot`, 0, -0.04, 0.12);
  }
  const allBones = Object.values(B);
  const skeleton = new THREE.Skeleton(allBones);
  const boneIndex = {};
  allBones.forEach((b, i) => boneIndex[b.name] = i);
  const tmp = new THREE.Group();
  tmp.add(rootBone);
  rootBone.updateMatrixWorld(true);
  const bWorld = {};
  for(const b of allBones)
    bWorld[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld);
  tmp.remove(rootBone);
  function partGeo(geoFn, boneName, colorHex){
    let g = geoFn();
    if(g.index) g = g.toNonIndexed();
    const p = bWorld[boneName];
    g.translate(p.x, p.y, p.z);
    const n = g.attributes.position.count;
    const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
    for(let i = 0; i < n; i++){ si[i*4] = boneIndex[boneName]; sw[i*4] = 1; }
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
    const col = new Float32Array(n*3);
    const c = new THREE.Color(colorHex);
    for(let i = 0; i < n; i++){ col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return g;
  }
  const pal = { shirt:0x2e6fd8, pants:0x4c5666, skin:0xeab98f, hair:0x54402e };
  const skinDk = new THREE.Color(pal.skin).offsetHSL(0, 0.02, -0.05).getHex();
  const shirtDk = new THREE.Color(pal.shirt).offsetHSL(0, 0, -0.07).getHex();
  const parts = [];
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.23, 20, 14);
    g.scale(1.34, 0.8, 1.0); g.translate(0, -0.02, 0); return g; }, 'mixamorigHips', pal.pants));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.215, 0.245, 0.16, 18);
    g.translate(0, 0.02, 0); return g; }, 'mixamorigSpine', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.26, 20, 16);
    g.scale(1.22, 0.98, 0.9); g.translate(0, 0.04, 0.01); return g; }, 'mixamorigSpine1', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.1, 0.115, 0.44, 14);
    g.rotateZ(Math.PI/2); g.translate(0, 0.05, 0); return g; }, 'mixamorigSpine2', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.085, 0.105, 0.14, 14);
    g.translate(0, 0.05, 0); return g; }, 'mixamorigNeck', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.40, 28, 20);
    g.scale(1.04, 1.0, 0.97); g.translate(0, 0.24, 0); return g; }, 'mixamorigHead', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.065, 12, 9);
    g.translate(0, 0.17, 0.4); return g; }, 'mixamorigHead', pal.skin));
  for(const s of [-1, 1]){
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.07, 10, 8);
      g.scale(0.7, 1, 0.9); g.translate(s*0.41, 0.2, 0.02); return g; }, 'mixamorigHead', skinDk));
  }
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.41, 24, 14, 0, Math.PI*2, 0, Math.PI*0.42);
    g.scale(1.05, 1.0, 0.99); g.translate(0, 0.26, 0); return g; }, 'mixamorigHead', pal.hair));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.12, 10, 7);
    g.scale(1.9, 0.42, 0.6); g.translate(0, 0.5, 0.28); return g; }, 'mixamorigHead', pal.hair));
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.082, 0.1, 6, 12);
      g.rotateZ(s*0.35); g.translate(s*0.075, -0.05, 0); return g; }, `mixamorig${S}Arm`, pal.shirt));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.074, 0.1, 6, 12);
      g.rotateZ(-s*0.1); g.translate(s*0.1, -0.17, 0); return g; }, `mixamorig${S}Arm`, shirtDk));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.066, 0.13, 6, 12);
      g.translate(s*0.028, -0.09, 0); return g; }, `mixamorig${S}ForeArm`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.092, 14, 10);
      g.scale(0.9, 1.1, 1); g.translate(0, -0.05, 0); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.032, 0.05, 4, 8);
      g.rotateZ(-s*0.7); g.translate(-s*0.075, -0.02, 0.03); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.135, 0.15, 8, 14);
      g.scale(1, 1, 1.08); g.rotateZ(s*0.06); g.translate(s*0.012, -0.13, 0.01); return g; }, `mixamorig${S}UpLeg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.085, 0.15, 8, 12);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.075, 10, 8);
      g.scale(0.9, 1.25, 0.9); g.translate(0, -0.07, -0.045); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.125, 14, 10);
      g.scale(1, 0.72, 1.2); g.translate(0, -0.015, 0.02); return g; }, `mixamorig${S}Foot`, 0xf2f2f0));
    parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.125, 0.135, 0.045, 14);
      g.scale(1, 1, 1.3); g.translate(0, -0.08, 0.03); return g; }, `mixamorig${S}Foot`, 0x3a3d42));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.095, 12, 9);
      g.scale(1, 0.62, 1.05); g.translate(0, -0.035, 0.055); return g; }, `mixamorig${S}ToeBase`, 0xf2f2f0));
  }
  const mesh = new THREE.SkinnedMesh(mergeGeometries(parts, false),
    new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.7 }));
  mesh.castShadow = true;
  mesh.frustumCulled = false;
  mesh.add(rootBone);
  mesh.bind(skeleton);
  return { name:'Vita', node: mesh, B };
}

// ---------- the walk clip (quaternions only — every rig keeps its own hips)
function quatTrack(bn, times, eulers){
  const vals = [];
  for(const e of eulers){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    vals.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.QuaternionKeyframeTrack(bn + '.quaternion', times, vals);
}
const T0 = [0, 0.4, 0.8, 1.2, 1.6];
const A0 = 0.55;
const walkClip = new THREE.AnimationClip('walk', 1.6, [
  quatTrack('mixamorigLeftUpLeg', T0, [[A0,0,0],[0,0,0],[-A0,0,0],[0,0,0],[A0,0,0]]),
  quatTrack('mixamorigRightUpLeg', T0, [[-A0,0,0],[0,0,0],[A0,0,0],[0,0,0],[-A0,0,0]]),
  quatTrack('mixamorigLeftLeg', T0, [[0,0,0],[0.5,0,0],[0,0,0],[0.05,0,0],[0,0,0]]),
  quatTrack('mixamorigRightLeg', T0, [[0,0,0],[0.05,0,0],[0,0,0],[0.5,0,0],[0,0,0]]),
  quatTrack('mixamorigLeftArm', T0, [[-0.4,0,0.3],[0,0,0.3],[0.4,0,0.3],[0,0,0.3],[-0.4,0,0.3]]),
  quatTrack('mixamorigRightArm', T0, [[0.4,0,-0.3],[0,0,-0.3],[-0.4,0,-0.3],[0,0,-0.3],[0.4,0,-0.3]]),
  quatTrack('mixamorigSpine', T0, [[0.05,0,0.02],[0.05,0,0],[0.05,0,-0.02],[0.05,0,0],[0.05,0,0.02]]),
]);
// NOTE: a foreign rig playing OUR quaternions inherits its rest-pose quirks;

// ---------- rig registration (measure the legs, wire the mixer) ------------
function skinnedOf(obj){ let m = null; obj.traverse(o => { if(!m && o.isSkinnedMesh) m = o; }); return m; }
function quatsOnly(clip){
  return new THREE.AnimationClip(clip.name, clip.duration,
    clip.tracks.filter(tr => !tr.name.endsWith('.position') && !tr.name.endsWith('.scale')));
}
function normNames(clip){
  for(const tr of clip.tracks) tr.name = tr.name.replace('mixamorig:', 'mixamorig');
  return clip;
}
let xbotMesh = null, xbotWalk = null;    // Xbot's own walk = the retarget SOURCE for imported skins
function registerRig(name, node, B, foreign = false, anims = []){
  node.visible = false;
  V.add(node);
  V.updateMatrixWorld(true);
  const m = {};
  const p1 = new THREE.Vector3(), p2 = new THREE.Vector3(), p3 = new THREE.Vector3();
  B.mixamorigLeftUpLeg.getWorldPosition(p1);
  B.mixamorigLeftLeg.getWorldPosition(p2);
  B.mixamorigLeftFoot.getWorldPosition(p3);
  m.L1 = p1.distanceTo(p2);
  m.L2 = p2.distanceTo(p3);
  m.ankleY = V.worldToLocal(p3.clone()).y;      // rest ankle height above ground
  const ws = new THREE.Vector3();
  B.mixamorigHips.parent.getWorldScale(ws);      // local-unit → world-unit factor
  // A foreign rig (Mixamo FBX) stores a different REST pose, so our absolute
  // quaternion walk would fold its limbs (2026-09-01): retarget the clip through
  // the canonical rig's world orientations onto the foreign bind pose. Mixer root
  // = the SkinnedMesh so the retargeted ".bones[x]" tracks bind.
  const mesh = foreign ? (skinnedOf(node) || node) : node;
  let clip = walkClip;
  if(name === 'Xbot'){
    // Xbot's rest quaternions match the canonical rig's, so our clip plays as-is;
    // and its bundled Mixamo walk becomes the source for every later import
    xbotMesh = mesh;
    const w = anims.find(c => /^walk$/i.test(c.name)) || anims.find(c => /walk/i.test(c.name));
    if(w) xbotWalk = normNames(w);
  } else if(foreign && xbotMesh && xbotWalk){
    // A Mixamo FBX binds in a T-pose like Xbot but stores a different REST pose
    // than the GLB rigs; retarget Xbot's walk through world orientations onto
    // this rig's bind pose. (The canonical chibi binds with its arms hanging,
    // so retargeting OUR walk from it would leave a T-posed import's arms up.)
    // retargetClip poses the TARGET bones while sampling and leaves them there
    // (position/scale included; FBX bind matrices carry a scale): snapshot + restore.
    const saved = mesh.skeleton ? mesh.skeleton.bones.map(b => [b, b.position.clone(), b.quaternion.clone(), b.scale.clone()]) : [];
    try { clip = quatsOnly(SkeletonUtils.retargetClip(mesh, xbotMesh, xbotWalk, { hip:'mixamorigHips', preserveHipPosition:true })); clip.name = 'walk'; }
    catch(err){ console.warn('retarget failed for', name, err); }
    for(const [b, p, q, s] of saved){ b.position.copy(p); b.quaternion.copy(q); b.scale.copy(s); }
    node.updateMatrixWorld(true);
  }
  const rig = { name, node, B, unit: ws.y || 1, foreign,
    mixer: new THREE.AnimationMixer(mesh), ...m, hipsRestY: B.mixamorigHips.position.y };
  rig.mixer.clipAction(clip).play();
  rigs.push(rig);
  return rig;
}
let pelvisDrop = 0;   // declared here: activate(0) below runs before the IK block that uses it (TDZ fix 2026-09-01)
function activate(i){
  // guarded: with the Vita gone there is no synchronously-registered rig, so
  // a stray activate() before Xbot lands must be a no-op rather than a crash
  const r = rigs[i];
  if(!r) return;
  for(const x of rigs) x.node.visible = false;
  active = r;
  active.node.visible = true;
  pelvisDrop = 0;
}
// 2026-09-02 (Doug): the built-in Vita used to be registered here as rigs[0]
// and activated on boot. It has been removed from the stage pending its
// replacement. buildCanonical() is LEFT IN PLACE and unused — it is the
// canonical-skeleton reference the new body will be built against, and the
// walk clip's bone naming is authored to match it. The retarget SOURCE for
// imported skins was always Xbot (xbotMesh/xbotWalk), never the Vita, so
// nothing in the walk pipeline depends on this removal.

// TARGET_H: every imported character is auto-scaled to this height on load,
// so a Meshy export and a Mixamo FBX stand shoulder to shoulder. One knob.
const TARGET_H = 1.55;

// ---- measuredHeight: the ONLY reliable way to size an imported character ----
// Box3.setFromObject() measures a SkinnedMesh from cached BIND-POSE geometry
// bounds. For a GLB rig whose mesh hangs under an Armature node scaled 0.01
// that does not describe what is actually drawn, and it lies CONSISTENTLY —
// it reported a tidy 1.55 for characters that were rendering at 4.1 to 4.9.
// (2026-09-02: verifying the old code with the same call is how the bug got
// signed off the first time. Measure the render, not the loader's opinion.)
// SkinnedMesh.computeBoundingBox() IS skinning-aware, so union per mesh.
function measuredHeight(node){
  node.updateMatrixWorld(true);
  let box = null;
  node.traverse(o => {
    if(!o.isMesh && !o.isSkinnedMesh) return;
    let b;
    if(o.isSkinnedMesh && typeof o.computeBoundingBox === 'function'){
      o.computeBoundingBox();
      b = o.boundingBox.clone().applyMatrix4(o.matrixWorld);
    } else {
      if(!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    }
    box = box ? box.union(b) : b;
  });
  return box ? { h: box.max.y - box.min.y, minY: box.min.y }
             : { h: 0, minY: 0 };
}

// ---------- imported skins: manifest + drag-drop ---------------------------
const loader = new GLTFLoader();
const fbxLoader = new FBXLoader();
// .glb/.gltf and .fbx both come back as {scene, animations}; FBX bone names
// "mixamorig:Hips" are normalized to "mixamorigHips" so the walk clip binds.
function normalizeBones(obj){
  obj.traverse(o => { o.name = o.name.replace('mixamorig:', 'mixamorig'); });
  return obj;
}
function loadAny(path, ok, fail){
  if(/\.fbx$/i.test(path)) fbxLoader.load(path, obj => ok({ scene: normalizeBones(obj), animations: obj.animations || [] }), undefined, fail);
  else loader.load(path, g => { normalizeBones(g.scene); ok(g); }, undefined, fail);
}
function parseAny(name, buf, ok, fail){
  if(/\.fbx$/i.test(name)){
    try { const obj = fbxLoader.parse(buf, './'); ok({ scene: normalizeBones(obj), animations: obj.animations || [] }); }
    catch(err){ fail(err); }
  } else loader.parse(buf, './', g => { normalizeBones(g.scene); ok(g); }, fail);
}
const skinSel = document.getElementById('skinsel');
function adoptGltf(name, gltf){
  const node = gltf.scene;
  // scale to Vita height, feet on the ground
  // v6: measure the RENDER, scale, then re-measure to put the feet on y=0
  const m0 = measuredHeight(node);
  const s = TARGET_H / Math.max(0.001, m0.h);
  node.scale.setScalar(s);
  const m1 = measuredHeight(node);
  node.position.y -= m1.minY;
  node.traverse(o => { if(o.isMesh || o.isSkinnedMesh){ o.castShadow = true; o.frustumCulled = false; } });
  // (frustumCulled off: an imported SkinnedMesh's bounding sphere is its bind
  //  pose at the origin, so parts of a walker vanish once the bones carry it away)
  // find the mixamorig bones (colon variants normalized)
  const B = {};
  node.traverse(o => {
    if(o.isBone){
      const n = o.name.replace('mixamorig:', 'mixamorig');
      if(n.startsWith('mixamorig')) B[n] = o;
    }
  });
  const need = ['mixamorigHips','mixamorigLeftUpLeg','mixamorigLeftLeg','mixamorigLeftFoot',
                'mixamorigRightUpLeg','mixamorigRightLeg','mixamorigRightFoot'];
  if(need.some(n => !B[n])){
    console.warn(name, 'lacks mixamorig leg bones — cannot IK this skin');
    return -1;
  }
  const rig = registerRig(name, node, B, true, gltf.animations || []);
  const idx = rigs.length - 1;
  const o = document.createElement('option');
  o.value = idx; o.textContent = name + ' (imported)';
  skinSel.appendChild(o);
  return idx;
}
// a listed skin loads only when picked (value "file~<name>"); Xbot loads eagerly
skinSel.addEventListener('change', () => {
  const v = String(skinSel.value);
  if(v.startsWith('file~')){
    const file = v.slice(5);
    const o = skinSel.selectedOptions[0];
    const label = o ? o.dataset.name : file;
    if(o) o.textContent = label + ' (loading…)';
    loadAny('./vendor/models/' + file, g => {
      const idx = adoptGltf(label, g);
      if(idx >= 0){ if(o) o.remove(); skinSel.value = idx; activate(idx); }
      else { if(o) o.textContent = label + ' (no Mixamo rig — cannot walk)'; skinSel.value = 0; activate(0); }
    }, err => { if(o) o.textContent = label + ' (failed to load)'; console.warn('skin load failed', file, err); });
    return;
  }
  if(v === '' || isNaN(+v)) return;       // a stage hash for a not-yet-listed skin lands here first
  activate(+v);
});
window.TW = { rigs, get active(){ return active; }, scene, camera, controls, renderer,
              activate, TARGET_H, terrainH, terrainNormal,
              get mesh(){ return window.TW_MESH; } };   // debug handle
// synchronous cost probe — a hidden tab suspends rAF, so timing the real loop
// is impossible from a script; render N frames back to back instead
window.TW_PERF = (n)=>{
  n = n || 40;
  renderer.render(scene, camera);
  const t0 = performance.now();
  for(let i=0;i<n;i++) renderer.render(scene, camera);
  const ms = (performance.now()-t0)/n;
  const r = renderer.info.render;
  return { msPerFrame:+ms.toFixed(2), impliedFps:Math.round(1000/ms),
           drawCalls:r.calls, triangles:r.triangles, mesh:window.TW_MESH };
};

// ---- STAGE ZOOM HOOK -------------------------------------------------------
// The stage bar drives this when the study is framed. Absolute dolly along the
// camera->target axis, clamped to OrbitControls' own limits, so the stage's
// slider is a real position and not a pile of wheel pulses.
window.STAGE_ZOOM = {
  get min(){ return controls.minDistance; },
  get max(){ return Math.min(controls.maxDistance, 30); },
  get(){ return camera.position.distanceTo(controls.target); },
  set(d){
    const lo = this.min, hi = this.max;
    d = Math.max(lo, Math.min(hi, d));
    const dir = camera.position.clone().sub(controls.target);
    if(dir.lengthSq() < 1e-9) dir.set(0, 0, 1);
    camera.position.copy(controls.target).add(dir.setLength(d));
    controls.update();
    return d;
  },
  by(f){ return this.set(this.get() * f); },
};

// v7 (2026-09-02, Doug): OUR VITA is the walker you meet on opening — not Xbot,
// and certainly not the old placeholder. Xbot still loads (it is the retarget
// SOURCE every imported skin's walk is built from) but it loads hidden and the
// Meshy Vita takes the stage as soon as it lands.
const BOOT_WALKER = ['vita_meshy_2b.glb', 'vita_meshy.glb'];   // newest first
loadAny('./vendor/models/Xbot.glb',
  g => {
    const i = adoptGltf('Xbot', g);
    // only fall back to Xbot if no Vita has arrived (or ever arrives)
    if(i >= 0 && !active){ skinSel.value = i; activate(i); }
    bootVita(0);
  },
  err => { console.warn('Xbot load failed', err); bootVita(0); });

function bootVita(n){
  if(n >= BOOT_WALKER.length) return;          // no Vita available; Xbot stays
  const file = BOOT_WALKER[n];
  loadAny('./vendor/models/' + file, g => {
    const label = (file.match(/vita_meshy_?(\d*[a-z]?)/) || [])[1];
    const i = adoptGltf('Vita' + (label ? ' ' + label : ''), g);
    if(i >= 0){ skinSel.value = i; activate(i); }
    else bootVita(n + 1);
  }, () => bootVita(n + 1));                   // missing or broken -> next one
}
fetch('./vendor/models/manifest.json')
  .then(r => r.ok ? r.json() : null)
  .then(man => {
    for(const it of ((man && man.skins) || [])){
      if(it.file === 'Xbot.glb') continue;
      const o = document.createElement('option');
      o.value = 'file~' + it.file;
      o.dataset.name = it.name || it.file;
      o.textContent = (it.name || it.file) + (it.mb ? ' (' + it.mb + ' MB)' : '');
      skinSel.appendChild(o);
    }
    // the stage's #set=skinsel:file~<name> arrives before these options exist: apply it now
    const want = (new URLSearchParams(location.hash.slice(1)).get('set') || '').split(',')
      .map(p => p.split(/:(.*)/)).find(p => p[0] === 'skinsel' && String(p[1]).startsWith('file~'));
    if(want){ skinSel.value = want[1]; skinSel.dispatchEvent(new Event('change')); }
  }).catch(() => {});
// v7: the file button and drag-drop share one path
function ingestFiles(files){
  for(const f of files){
    f.arrayBuffer().then(buf => parseAny(f.name, buf, g => {
      const idx = adoptGltf(f.name.replace(/\.(glb|gltf|fbx)$/i, ''), g);
      const hint = document.getElementById('loadhint');
      if(idx >= 0){ skinSel.value = idx; activate(idx); if(hint) hint.textContent = 'loaded ' + f.name; }
      else if(hint) hint.textContent = f.name + ' — no mixamorig bones, cannot walk';
    }, err => {
      const hint = document.getElementById('loadhint');
      if(hint) hint.textContent = f.name + ' — failed to parse';
      console.warn('parse failed', f.name, err);
    }));
  }
}
{
  const btn = document.getElementById('loadskin'), inp = document.getElementById('skinfile');
  btn.addEventListener('click', () => inp.click());
  inp.addEventListener('change', () => { ingestFiles(inp.files); inp.value = ''; });
}
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); ingestFiles(e.dataTransfer.files); });

// ==========================================================================
//  FULL LEG IK — rest-pose-agnostic. World-space DELTA rotations on top
//  of the clip pose: rotate the thigh so the hip→ankle chain reaches the
//  terrain-sampled target (knee toward the pole), then the shin onto the
//  target. Works on any skeleton; lengths are the rig's own.
// ==========================================================================
let legIKOn = true, ankleOn = true;
// pelvisDrop is declared above activate() (moved 2026-09-01: it was in the temporal dead zone when activate(0) first ran)
const _A = new THREE.Vector3(), _H = new THREE.Vector3(), _K = new THREE.Vector3(),
      _T = new THREE.Vector3(), _dir = new THREE.Vector3(), _po = new THREE.Vector3(),
      _fwd = new THREE.Vector3(), _cur = new THREE.Vector3(), _want = new THREE.Vector3(),
      _dq = new THREE.Quaternion(), _wq = new THREE.Quaternion(), _pq = new THREE.Quaternion(),
      _n = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function rotateBoneWorld(bone, deltaQ){
  bone.getWorldQuaternion(_wq);
  _wq.premultiply(deltaQ);                       // new world orientation
  bone.parent.getWorldQuaternion(_pq);
  bone.quaternion.copy(_pq.invert().multiply(_wq));
  bone.updateMatrixWorld(true);
}
function legIK(dt, heading){
  const R = active;
  R.B.mixamorigHips.position.y = R.hipsRestY
    + (Math.abs(Math.sin((performance.now()/1000)*3.9))*R.L1*0.13 - pelvisDrop)/R.unit;
  V.updateMatrixWorld(true);
  if(!legIKOn){ pelvisDrop = lerp(pelvisDrop, 0, Math.min(1, dt*6)); return; }
  let excess = 0;
  const L1 = R.L1, L2 = R.L2;
  for(const S of ['Left', 'Right']){
    const up = R.B[`mixamorig${S}UpLeg`], lo = R.B[`mixamorig${S}Leg`],
          ft = R.B[`mixamorig${S}Foot`];
    ft.getWorldPosition(_A);
    const lift = Math.max(0, V.worldToLocal(_A.clone()).y - R.ankleY*1.02);
    _T.set(_A.x, terrainH(_A.x, _A.z) + R.ankleY*0.92 + lift, _A.z);
    up.getWorldPosition(_H);
    let d = _H.distanceTo(_T);
    const reach = L1 + L2 - 0.012;
    if(d > reach){ excess = Math.max(excess, d - reach); d = reach; }
    d = Math.max(d, Math.abs(L1 - L2) + 0.02);
    _dir.copy(_T).sub(_H).normalize();
    _fwd.set(Math.sin(heading), 0, Math.cos(heading));
    _po.copy(_fwd).addScaledVector(_dir, -_fwd.dot(_dir)).normalize();
    const a1 = Math.acos(clamp((L1*L1 + d*d - L2*L2)/(2*L1*d), -1, 1));
    // 1) thigh: rotate current hip→knee direction onto the solved one
    lo.getWorldPosition(_K);
    _cur.copy(_K).sub(_H).normalize();
    _want.copy(_dir).multiplyScalar(Math.cos(a1)).addScaledVector(_po, Math.sin(a1)).normalize();
    _dq.setFromUnitVectors(_cur, _want);
    rotateBoneWorld(up, _dq);
    // 2) shin: rotate current knee→ankle direction onto knee→target
    lo.getWorldPosition(_K);
    ft.getWorldPosition(_A);
    _cur.copy(_A).sub(_K).normalize();
    _want.copy(_T).sub(_K).normalize();
    _dq.setFromUnitVectors(_cur, _want);
    rotateBoneWorld(lo, _dq);
  }
  pelvisDrop = lerp(pelvisDrop, excess, Math.min(1, dt*8));
  V.updateMatrixWorld(true);
}
// ANKLE LAYER — also delta-based: tilt each planted foot's WORLD frame so
// "up" matches the terrain normal under it, blended by ground proximity.
const _neutralQ = new THREE.Quaternion();
function ankleLayer(dt){
  const R = active;
  for(const S of ['Left', 'Right']){
    const foot = R.B[`mixamorig${S}Foot`];
    foot.getWorldPosition(_A);
    const sole = _A.y - R.ankleY*0.85;
    const gy = terrainH(_A.x, _A.z);
    const w = ankleOn ? clamp(1 - (sole - gy)/(R.ankleY*1.4), 0, 1) : 0;
    if(w > 0.001){
      _n.copy(terrainNormal(_A.x, _A.z));
      _dq.setFromUnitVectors(_up, _n);
      _neutralQ.identity().slerp(_dq, w);
      rotateBoneWorld(foot, _neutralQ);
    }
  }
}

// ---------- the loop: walk a ring over the relief --------------------------
const RING = 5.5;
let pathA = 0;
const SPEED = 1.05;
const bodyQ = new THREE.Quaternion(), yawQ = new THREE.Quaternion(),
      pitchQ = new THREE.Quaternion(), rollQ = new THREE.Quaternion();
document.getElementById('legik').addEventListener('click', e => {
  legIKOn = !legIKOn;
  e.target.textContent = 'LEG IK: ' + (legIKOn ? 'ON' : 'off');
  e.target.classList.toggle('on', legIKOn);
});
document.getElementById('ankle').addEventListener('click', e => {
  ankleOn = !ankleOn;
  e.target.textContent = 'ANKLE LAYER: ' + (ankleOn ? 'ON' : 'off');
  e.target.classList.toggle('on', ankleOn);
});
document.getElementById('normals').addEventListener('click', e => {
  normalsGroup.visible = !normalsGroup.visible;
  e.target.classList.toggle('on', normalsGroup.visible);
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  // 2026-09-02: with the built-in Vita removed there is no rig registered
  // synchronously, so the first few frames run before Xbot's async load
  // lands. Draw the empty terrain until a walker exists rather than
  // dereferencing a null active.
  if(!active){ controls.update(); renderer.render(scene, camera); return; }

  const px = Math.sin(pathA)*RING, pz = Math.cos(pathA)*RING;
  const heading = Math.atan2(Math.cos(pathA), -Math.sin(pathA));
  const g = terrainGrad(px, pz);
  const ahead = g.hx*Math.sin(heading) + g.hz*Math.cos(heading);
  pathA += (SPEED * (1 - clamp(ahead, -0.35, 0.5)*0.4)) / RING * dt;

  V.position.set(px, terrainH(px, pz), pz);
  const roll = g.hx*Math.cos(heading) - g.hz*Math.sin(heading);
  yawQ.setFromAxisAngle(new THREE.Vector3(0,1,0), heading);
  pitchQ.setFromAxisAngle(new THREE.Vector3(1,0,0), Math.atan(ahead)*0.35);
  rollQ.setFromAxisAngle(new THREE.Vector3(0,0,1), Math.atan(roll)*0.22);
  bodyQ.copy(yawQ).multiply(pitchQ).multiply(rollQ);
  V.quaternion.slerp(bodyQ, Math.min(1, dt*6));

  active.mixer.update(dt);
  legIK(dt, heading);
  ankleLayer(dt);

  controls.target.lerp(new THREE.Vector3(px, terrainH(px, pz) + 0.9, pz), dt*2.5);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// stage remote-control: #set=<selectId>:<value>[,...] · #click=<data-m>
{
  const _h = new URLSearchParams(location.hash.slice(1));
  const _s = _h.get('set');
  if(_s) for(const pair of _s.split(',')){
    const [id, val] = pair.split(':');
    const el = document.getElementById(id);
    if(el){ el.value = val; el.dispatchEvent(new Event('change')); }
  }
  const _c = _h.get('click');
  if(_c){ const b = document.querySelector('[data-m="' + _c + '"]'); if(b) b.click(); }
}
