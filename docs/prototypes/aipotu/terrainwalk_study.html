<!DOCTYPE html>
<!-- ======================================================================
     TERRAIN WALK STUDY — ankles on the normal, for George World.
     Filed 2026-08-31, Doug's challenge: walking on uneven ground.
     The map carries NORMALS (the terrain is an analytic heightfield, so
     height AND normal are exact at every point, not just at vertices).
     THE NEW BODY walks a loop over bumps, a ridge and a bowl. The walk
     clip owns the legs; a post-animation ANKLE LAYER owns the feet:
     each frame, each foot samples the normal under it, and when that
     normal is not vertical the ankle (the Foot bone) rotates so the
     sole lies on the slope — blended in by ground proximity, so the
     planted foot conforms while the swinging foot relaxes. The body
     also leans a fraction into the slope (pitch on the grade, roll on
     the camber), like a real hiker.
     Toggles: ANKLE LAYER on/off (watch the toes stab the slope when
     off) · show the normals as arrows.
     ====================================================================== -->
<html lang="en">

</style>
</head>

<script type="module">

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe2f0f6), 50, 260);
const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.05, 500);
camera.position.set(4, 3.4, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1; controls.maxDistance = 30;
controls.maxPolarAngle = 1.52;
{
  const geo = new THREE.SphereGeometry(280, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xeaf4f8), zenith = new THREE.Color(0x5fb0e4),
        below = new THREE.Color(0xd7e8ee), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/280;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.55)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xcfe6f5, 0xcbb98e, 1.0));
const sun = new THREE.DirectionalLight(0xffeeda, 2.3);
sun.position.set(12, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
scene.add(sun);

// ==========================================================================
//  THE MAP WITH NORMALS — an analytic heightfield. Because h(x,z) is a
//  formula, the surface NORMAL is exact at every point:
//  n = normalize(-dh/dx, 1, -dh/dz). No mesh lookup, no interpolation.
// ==========================================================================
function terrainH(x, z){
  return 0.55*Math.sin(x*0.42)*Math.cos(z*0.36)
       + 0.34*Math.sin(x*0.9 + 1.3)*Math.sin(z*0.74 + 0.6)
       + 0.16*Math.sin(x*1.9 + 4.0)*Math.cos(z*1.6 + 2.2);
}
function terrainGrad(x, z){
  return {
    hx: 0.55*0.42*Math.cos(x*0.42)*Math.cos(z*0.36)
      + 0.34*0.9*Math.cos(x*0.9 + 1.3)*Math.sin(z*0.74 + 0.6)
      + 0.16*1.9*Math.cos(x*1.9 + 4.0)*Math.cos(z*1.6 + 2.2),
    hz: -0.55*0.36*Math.sin(x*0.42)*Math.sin(z*0.36)
      + 0.34*0.74*Math.sin(x*0.9 + 1.3)*Math.cos(z*0.74 + 0.6)
      - 0.16*1.6*Math.sin(x*1.9 + 4.0)*Math.sin(z*1.6 + 2.2),
  };
}
function terrainNormal(x, z){
  const { hx, hz } = terrainGrad(x, z);
  return new THREE.Vector3(-hx, 1, -hz).normalize();
}
{
  const geo = new THREE.PlaneGeometry(36, 36, 100, 100);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, col = [];
  const grass = new THREE.Color(0x7da45c), dry = new THREE.Color(0xb8a86a),
        steep = new THREE.Color(0x8a7a58), c = new THREE.Color();
  for(let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainH(x, z);
    pos.setY(i, y);
    const n = terrainNormal(x, z);
    const flatness = n.y;                       // 1 = level, lower = steeper
    c.copy(grass).lerp(dry, clamp((y + 0.4)/1.6, 0, 1));
    c.lerp(steep, clamp((1 - flatness)*3.2, 0, 1));
    col.push(c.r, c.g, c.b);
  }
  geo.computeVertexNormals();
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true }));
  ground.receiveShadow = true;
  scene.add(ground);
}
// a few rocks and tufts so the eye reads the relief
{
  let seed = 977;
  const rnd = (a=1,b) => { seed = (seed*1103515245 + 12345) & 0x7fffffff;
    const r = seed/0x7fffffff; return b===undefined ? r*a : a + r*(b-a); };
  const rockM = new THREE.MeshLambertMaterial({ color:0x8a8578, flatShading:true });
  const tuftM = new THREE.MeshLambertMaterial({ color:0x5c8544, flatShading:true });
  for(let i = 0; i < 40; i++){
    const x = rnd(-16, 16), z = rnd(-16, 16);
    if(Math.abs(Math.hypot(x, z) - 5.5) < 1.2) continue;   // keep the path clear
    const m = rnd() < 0.4
      ? new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.1, 0.3)), rockM)
      : new THREE.Mesh(new THREE.ConeGeometry(rnd(0.06, 0.12), rnd(0.2, 0.45), 5), tuftM);
    m.position.set(x, terrainH(x, z) + 0.06, z);
    m.rotation.y = rnd(0, 6);
    m.castShadow = true;
    scene.add(m);
  }
}
// the normals, visible — arrows on a grid (toggle)
const normalsGroup = new THREE.Group();
normalsGroup.visible = false;
scene.add(normalsGroup);
for(let x = -14; x <= 14; x += 2){
  for(let z = -14; z <= 14; z += 2){
    const n = terrainNormal(x, z);
    const a = new THREE.ArrowHelper(n,
      new THREE.Vector3(x, terrainH(x, z), z), 0.8,
      n.y > 0.995 ? 0x4488cc : 0xcc4444, 0.16, 0.09);
    normalsGroup.add(a);
  }
}

// ==========================================================================
//  THE NEW BODY (canonical rig, verbatim from vita_rig_study.html)
// ==========================================================================
const B = {};
function bone(name, parentName, x, y, z){
  const b = new THREE.Bone();
  b.name = name;
  b.position.set(x, y, z);
  if(parentName) B[parentName].add(b);
  B[name] = b;
  return b;
}
const rootBone = bone('mixamorigHips', null, 0, 0.62, 0);
bone('mixamorigSpine',  'mixamorigHips',  0, 0.10, 0);
bone('mixamorigSpine1', 'mixamorigSpine', 0, 0.12, 0);
bone('mixamorigSpine2', 'mixamorigSpine1',0, 0.12, 0);
bone('mixamorigNeck',   'mixamorigSpine2',0, 0.12, 0);
bone('mixamorigHead',   'mixamorigNeck',  0, 0.10, 0);
for(const [S, s] of [['Left', 1], ['Right', -1]]){
  bone(`mixamorig${S}Shoulder`, 'mixamorigSpine2', s*0.16, 0.06, 0);
  bone(`mixamorig${S}Arm`,      `mixamorig${S}Shoulder`, s*0.14, -0.02, 0);
  bone(`mixamorig${S}ForeArm`,  `mixamorig${S}Arm`, s*0.09, -0.20, 0);
  bone(`mixamorig${S}Hand`,     `mixamorig${S}ForeArm`, s*0.05, -0.18, 0);
  bone(`mixamorig${S}UpLeg`,    'mixamorigHips', s*0.155, -0.06, 0);
  bone(`mixamorig${S}Leg`,      `mixamorig${S}UpLeg`, 0, -0.26, 0);
  bone(`mixamorig${S}Foot`,     `mixamorig${S}Leg`, 0, -0.26, 0);
  bone(`mixamorig${S}ToeBase`,  `mixamorig${S}Foot`, 0, -0.04, 0.12);
}
const allBones = Object.values(B);
const skeleton = new THREE.Skeleton(allBones);
const boneIndex = {};
allBones.forEach((b, i) => boneIndex[b.name] = i);
const V = new THREE.Group();
scene.add(V);
V.add(rootBone);
rootBone.updateMatrixWorld(true);
const bWorld = {};
for(const b of allBones){
  bWorld[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld)
    .sub(V.position);
}
V.remove(rootBone);
function partGeo(geoFn, boneName, colorHex){
  const g = geoFn();
  const p = bWorld[boneName];
  g.translate(p.x, p.y, p.z);
  const n = g.attributes.position.count;
  const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
  for(let i = 0; i < n; i++){ si[i*4] = boneIndex[boneName]; sw[i*4] = 1; }
  g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
  const col = new Float32Array(n*3);
  const c = new THREE.Color(colorHex);
  for(let i = 0; i < n; i++){ col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return g;
}
let mesh;
{
  const pal = { shirt:0x2e6fd8, pants:0x4c5666, skin:0xeab98f, hair:0x54402e };
  const skinDk = new THREE.Color(pal.skin).offsetHSL(0, 0.02, -0.05).getHex();
  const shirtDk = new THREE.Color(pal.shirt).offsetHSL(0, 0, -0.07).getHex();
  const parts = [];
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.23, 20, 14);
    g.scale(1.34, 0.8, 1.0); g.translate(0, -0.02, 0); return g; }, 'mixamorigHips', pal.pants));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.215, 0.245, 0.16, 18);
    g.translate(0, 0.02, 0); return g; }, 'mixamorigSpine', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.26, 20, 16);
    g.scale(1.22, 0.98, 0.9); g.translate(0, 0.04, 0.01); return g; }, 'mixamorigSpine1', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.1, 0.115, 0.44, 14);
    g.rotateZ(Math.PI/2); g.translate(0, 0.05, 0); return g; }, 'mixamorigSpine2', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.085, 0.105, 0.14, 14);
    g.translate(0, 0.05, 0); return g; }, 'mixamorigNeck', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.40, 28, 20);
    g.scale(1.04, 1.0, 0.97); g.translate(0, 0.24, 0); return g; }, 'mixamorigHead', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.065, 12, 9);
    g.translate(0, 0.17, 0.4); return g; }, 'mixamorigHead', pal.skin));
  for(const s of [-1, 1]){
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.07, 10, 8);
      g.scale(0.7, 1, 0.9); g.translate(s*0.41, 0.2, 0.02); return g; }, 'mixamorigHead', skinDk));
  }
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.41, 24, 14, 0, Math.PI*2, 0, Math.PI*0.42);
    g.scale(1.05, 1.0, 0.99); g.translate(0, 0.26, 0); return g; }, 'mixamorigHead', pal.hair));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.12, 10, 7);
    g.scale(1.9, 0.42, 0.6); g.translate(0, 0.5, 0.28); return g; }, 'mixamorigHead', pal.hair));
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.082, 0.1, 6, 12);
      g.rotateZ(s*0.35); g.translate(s*0.075, -0.05, 0); return g; }, `mixamorig${S}Arm`, pal.shirt));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.074, 0.1, 6, 12);
      g.rotateZ(-s*0.1); g.translate(s*0.1, -0.17, 0); return g; }, `mixamorig${S}Arm`, shirtDk));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.066, 0.13, 6, 12);
      g.translate(s*0.028, -0.09, 0); return g; }, `mixamorig${S}ForeArm`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.092, 14, 10);
      g.scale(0.9, 1.1, 1); g.translate(0, -0.05, 0); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.032, 0.05, 4, 8);
      g.rotateZ(-s*0.7); g.translate(-s*0.075, -0.02, 0.03); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.135, 0.15, 8, 14);
      g.scale(1, 1, 1.08); g.rotateZ(s*0.06); g.translate(s*0.012, -0.13, 0.01); return g; }, `mixamorig${S}UpLeg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.085, 0.15, 8, 12);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.075, 10, 8);
      g.scale(0.9, 1.25, 0.9); g.translate(0, -0.07, -0.045); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.125, 14, 10);
      g.scale(1, 0.72, 1.2); g.translate(0, -0.015, 0.02); return g; }, `mixamorig${S}Foot`, 0xf2f2f0));
    parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.125, 0.135, 0.045, 14);
      g.scale(1, 1, 1.3); g.translate(0, -0.08, 0.03); return g; }, `mixamorig${S}Foot`, 0x3a3d42));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.095, 12, 9);
      g.scale(1, 0.62, 1.05); g.translate(0, -0.035, 0.055); return g; }, `mixamorig${S}ToeBase`, 0xf2f2f0));
  }
  const merged = mergeGeometries(parts, false);
  mesh = new THREE.SkinnedMesh(merged,
    new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.7 }));
  mesh.castShadow = true;
  mesh.frustumCulled = false;
  mesh.add(rootBone);
  mesh.bind(skeleton);
  V.add(mesh);
}

// ---------- the walk clip (legs only — the ankle layer owns the feet) ------
function quatTrack(boneName, times, eulers){
  const vals = [];
  for(const e of eulers){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    vals.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.QuaternionKeyframeTrack(boneName + '.quaternion', times, vals);
}
const T = [0, 0.4, 0.8, 1.2, 1.6];
const A = 0.55;
const walkClip = new THREE.AnimationClip('walk', 1.6, [
  quatTrack('mixamorigLeftUpLeg', T, [[A,0,0],[0,0,0],[-A,0,0],[0,0,0],[A,0,0]]),
  quatTrack('mixamorigRightUpLeg', T, [[-A,0,0],[0,0,0],[A,0,0],[0,0,0],[-A,0,0]]),
  quatTrack('mixamorigLeftLeg', T, [[0,0,0],[0.5,0,0],[0,0,0],[0.05,0,0],[0,0,0]]),
  quatTrack('mixamorigRightLeg', T, [[0,0,0],[0.05,0,0],[0,0,0],[0.5,0,0],[0,0,0]]),
  quatTrack('mixamorigLeftArm', T, [[-0.4,0,0.3],[0,0,0.3],[0.4,0,0.3],[0,0,0.3],[-0.4,0,0.3]]),
  quatTrack('mixamorigRightArm', T, [[0.4,0,-0.3],[0,0,-0.3],[-0.4,0,-0.3],[0,0,-0.3],[0.4,0,-0.3]]),
  quatTrack('mixamorigSpine', T, [[0.06,0,0.03],[0.06,0,0],[0.06,0,-0.03],[0.06,0,0],[0.06,0,0.03]]),
  new THREE.VectorKeyframeTrack('mixamorigHips.position', T,
    [0,0.62,0, 0,0.655,0, 0,0.62,0, 0,0.655,0, 0,0.62,0]),
]);
const mixer = new THREE.AnimationMixer(mesh);
mixer.clipAction(walkClip).play();

// ==========================================================================
//  THE ANKLE LAYER — runs AFTER the mixer, owns the Foot bones (the walk
//  clip deliberately never keyframes them). For each foot:
//   1. where is it? (world) → sample terrain height + NORMAL there
//   2. how planted is it? proximity blend w: 1 on the ground, 0 in swing
//   3. build the target world orientation: up = the NORMAL, forward = the
//      body's heading projected onto the slope plane
//   4. convert to the Foot bone's LOCAL space via the parent's world
//      quaternion — this automatically counter-rotates whatever swing the
//      leg still carries, exactly like a real ankle
//   5. slerp toward it by w (and relax to neutral as w falls)
// ==========================================================================
let ankleOn = true;
const _fw = new THREE.Vector3(), _pq = new THREE.Quaternion(),
      _tq = new THREE.Quaternion(), _m = new THREE.Matrix4(),
      _right = new THREE.Vector3(), _up = new THREE.Vector3(),
      _fwd = new THREE.Vector3(), _neutral = new THREE.Quaternion();
function ankleLayer(dt, heading){
  for(const S of ['Left', 'Right']){
    const foot = B[`mixamorig${S}Foot`];
    foot.getWorldPosition(_fw);
    const gy = terrainH(_fw.x, _fw.z);
    const sole = _fw.y - 0.09;               // sole sits ~0.09 under the ankle
    const w = ankleOn ? clamp(1 - (sole - gy)/0.14, 0, 1) : 0;
    if(w > 0.001){
      _up.copy(terrainNormal(_fw.x, _fw.z));
      _fwd.set(Math.sin(heading), 0, Math.cos(heading));
      _right.crossVectors(_up, _fwd).normalize();
      _fwd.crossVectors(_right, _up).normalize();
      _m.makeBasis(_right, _up, _fwd);
      _tq.setFromRotationMatrix(_m);
      foot.parent.getWorldQuaternion(_pq);
      _tq.premultiply(_pq.invert());         // world target → foot-local
      _neutral.identity();
      _neutral.slerp(_tq, w);                // planted = conform, swing = relax
      foot.quaternion.slerp(_neutral, Math.min(1, dt*14));
    } else {
      _neutral.identity();
      foot.quaternion.slerp(_neutral, Math.min(1, dt*8));
    }
  }
}

// ---------- the loop: walk a ring over the relief --------------------------
const R = 5.5;
let pathA = 0;
const SPEED = 1.05;                          // units/sec along the ring
const bodyQ = new THREE.Quaternion(), yawQ = new THREE.Quaternion(),
      pitchQ = new THREE.Quaternion(), rollQ = new THREE.Quaternion();
document.getElementById('ankle').addEventListener('click', e => {
  ankleOn = !ankleOn;
  e.target.textContent = 'ANKLE LAYER: ' + (ankleOn ? 'ON' : 'off');
  e.target.classList.toggle('on', ankleOn);
});
document.getElementById('normals').addEventListener('click', e => {
  normalsGroup.visible = !normalsGroup.visible;
  e.target.classList.toggle('on', normalsGroup.visible);
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  // advance along the ring; slow slightly on a climb (real legs do)
  const px = Math.sin(pathA)*R, pz = Math.cos(pathA)*R;
  const heading = Math.atan2(Math.cos(pathA), -Math.sin(pathA));
  const g = terrainGrad(px, pz);
  const ahead = g.hx*Math.sin(heading) + g.hz*Math.cos(heading);   // grade on the path
  pathA += (SPEED * (1 - clamp(ahead, -0.35, 0.5)*0.4)) / R * dt;

  // the body rides the terrain and leans a fraction into it
  V.position.set(px, terrainH(px, pz), pz);
  const roll = g.hx*Math.cos(heading) - g.hz*Math.sin(heading);    // camber
  yawQ.setFromAxisAngle(new THREE.Vector3(0,1,0), heading);
  pitchQ.setFromAxisAngle(new THREE.Vector3(1,0,0), Math.atan(ahead)*0.35);
  rollQ.setFromAxisAngle(new THREE.Vector3(0,0,1), Math.atan(roll)*0.22);
  bodyQ.copy(yawQ).multiply(pitchQ).multiply(rollQ);
  V.quaternion.slerp(bodyQ, Math.min(1, dt*6));

  mixer.update(dt);
  V.updateMatrixWorld(true);                 // fresh bone matrices for the layer
  ankleLayer(dt, heading);

  // camera tags along
  controls.target.lerp(new THREE.Vector3(px, terrainH(px, pz) + 0.9, pz), dt*2.5);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
