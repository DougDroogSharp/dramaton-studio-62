<!DOCTYPE html>
<!-- ======================================================================
     EXPLOSIONS STUDY — ground bursts, grenade and shell, for George
     World. Filed 2026-09-01 09:19 by ASSET FOUNDRY. Standalone;
     vendored three (r160), game importmap. No existing file touched.

     Two calibres of ground burst, built from the same pooled parts so
     the game can afford a barrage:

     GRENADE — a sharp crack: small white-orange FLASH, a narrow spout
       of dirt clods, one fast SHOCK RING skimming the grass, a quick
       fist of grey smoke. Done in under two seconds.
     SHELL — the big one: taller flash, a COLUMN of earth, clods
       thrown wide on real ballistics with a bounce, a broad ring,
       rolling DARK smoke that leans downwind, and a lasting scorched
       CRATER (they accumulate, oldest fading out).

     Chip: drop one of either, or toggle the BARRAGE — random calibres
     walking across the field. Mood exposure band (1.05, STYLE.md).
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explosions Study</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#d8d4c2; }
  #chip { position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(24,22,18,0.78); color:#f0eee0; font:13px/1.5 system-ui, sans-serif;
    padding:10px 14px; border-radius:10px; user-select:none; backdrop-filter:blur(4px); }
  #chip b { font-size:14px; }
  #chip .hint { opacity:0.7; }
  #chip button { margin:5px 5px 0 0; padding:4px 10px; border:0; border-radius:7px;
    background:#6e5a3a; color:#fff; font:12px system-ui; cursor:pointer; }
  #chip button:hover { background:#8a7248; }
  #chip button.on { background:#c9a12e; color:#241d06; font-weight:700; }
</style>
</head>
<body>
<div id="chip">
  <b>💥 Explosions Study</b> — grenade + shell bursts, v1<br>
  <span class="hint">drag to orbit · scroll to zoom</span><br>
  <button data-m="grenade">Grenade</button><button data-m="shell">Shell</button><button
    data-m="barrage">Barrage</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 19161918;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;              // mood band
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xd4d0bc), 40, 260);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.2, 700);
camera.position.set(9, 5, 12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 2; controls.maxDistance = 50;
controls.maxPolarAngle = 1.52;

{
  const geo = new THREE.SphereGeometry(320, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xe8e2ca), zenith = new THREE.Color(0x8aa4bc),
        below = new THREE.Color(0xc6c0aa), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/320;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.6)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xd4e0e8, 0x9a9270, 0.95));
const sun = new THREE.DirectionalLight(0xf8e8cc, 2.1);
sun.position.set(18, 24, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0004;
scene.add(sun);
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(280, 48),
    new THREE.MeshLambertMaterial({ color:0x9a9468 }));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
  const tuftMat = new THREE.MeshLambertMaterial({ color:0x7e8a48, flatShading:true });
  for(let i=0;i<20;i++){
    const a = rand(0, Math.PI*2), r = rand(3, 26);
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(rand(0.12,0.2), rand(0.3,0.6), 5), tuftMat);
    tuft.position.set(Math.cos(a)*r, 0.15, Math.sin(a)*r);
    scene.add(tuft);
  }
  // a broken fence post or two, for scale and mood
  const post = new THREE.MeshLambertMaterial({ color:0x5c4c34, flatShading:true });
  for(const [px, pz, h, tip] of [[-4, 2, 1.1, 0.3], [4.5, -3, 0.7, -0.4]]){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, h, 6), post);
    p.position.set(px, h/2, pz);
    p.rotation.z = tip;
    p.castShadow = true;
    scene.add(p);
  }
}

// ==========================================================================
//  POOLS — flash, ring, clods, smoke, craters. Everything recycled.
// ==========================================================================
const flashes = [];
for(let i=0;i<4;i++){
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8),
    new THREE.MeshBasicMaterial({ color:0xffd890, transparent:true, opacity:0 }));
  f.userData.t = 9;
  scene.add(f);
  flashes.push(f);
}
const rings = [];
for(let i=0;i<5;i++){
  const r = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.8, 20),
    new THREE.MeshBasicMaterial({ color:0xd8ceb0, transparent:true, opacity:0, side:THREE.DoubleSide }));
  r.rotation.x = -Math.PI/2;
  r.userData.t = 9;
  scene.add(r);
  rings.push(r);
}
const clods = [];
const clodMat = new THREE.MeshLambertMaterial({ color:0x5c4e32, flatShading:true });
for(let i=0;i<40;i++){
  const c = new THREE.Mesh(new THREE.DodecahedronGeometry(0.07, 0), clodMat);
  c.visible = false;
  c.userData = { v: new THREE.Vector3(), t: 9 };
  scene.add(c);
  clods.push(c);
}
const smokes = [];
for(let i=0;i<26;i++){
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.16, 7, 5),
    new THREE.MeshLambertMaterial({ color:0x6a6660, transparent:true, opacity:0, flatShading:true }));
  s.userData = { t: 9, rise: 1, dark: 0 };
  scene.add(s);
  smokes.push(s);
}
const craters = [];
for(let i=0;i<12;i++){
  const cr = new THREE.Mesh(new THREE.CircleGeometry(0.8, 14),
    new THREE.MeshLambertMaterial({ color:0x3a3226, transparent:true, opacity:0 }));
  cr.rotation.x = -Math.PI/2;
  cr.userData.t = 9;
  scene.add(cr);
  craters.push(cr);
}
let craterI = 0;

// the earth COLUMN: a stretched dark cone that shoots and collapses
const columns = [];
for(let i=0;i<3;i++){
  const col = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1, 8), clodMat);
  col.visible = false;
  col.userData.t = 9;
  scene.add(col);
  columns.push(col);
}

function burst(x, z, type){
  const big = type === 'shell';
  // flash
  const f = flashes.find(f => f.userData.t > 1);
  if(f){ f.userData.t = 0; f.position.set(x, 0.25, z);
    f.scale.setScalar(big ? 1.6 : 0.8); }
  // ring
  const r = rings.find(r => r.userData.t > 1);
  if(r){ r.userData.t = 0; r.position.set(x, 0.06, z);
    r.scale.setScalar(big ? 1 : 0.5); r.userData.speed = big ? 7 : 5; }
  // the column (shell only)
  if(big){
    const col = columns.find(c => c.userData.t > 1);
    if(col){ col.visible = true; col.userData.t = 0; col.position.set(x, 0.4, z);
      col.scale.set(1, 0.4, 1); }
  }
  // clods, thrown ballistic
  const n = big ? 14 : 6;
  for(let k=0;k<n;k++){
    const c = clods.find(c => c.userData.t > 1);
    if(!c) break;
    c.visible = true;
    c.userData.t = 0;
    c.position.set(x, 0.2, z);
    const a = rand(0, Math.PI*2), spd = big ? rand(1.5, 4.5) : rand(0.8, 2.2);
    c.userData.v.set(Math.cos(a)*spd*rand(0.3, 1), rand(3, big ? 7.5 : 5), Math.sin(a)*spd*rand(0.3, 1));
    c.scale.setScalar(rand(0.6, big ? 1.6 : 1));
  }
  // smoke: grenades one grey fist; shells a rolling dark stack
  const sn = big ? 6 : 2;
  for(let k=0;k<sn;k++){
    const s = smokes.find(s => s.userData.t > 1);
    if(!s) break;
    s.userData.t = -k*0.12;                       // staggered birth
    s.userData.rise = big ? rand(0.8, 1.4) : rand(1.2, 1.8);
    s.userData.dark = big ? 1 : 0;
    s.material.color.set(big ? 0x3c3834 : 0x807c74);
    s.position.set(x + rand(-0.2, 0.2), 0.3, z + rand(-0.2, 0.2));
    s.scale.setScalar(big ? rand(1, 1.8) : rand(0.6, 1));
  }
  // crater (shell only): claim the next slot round-robin
  if(big){
    const cr = craters[craterI++ % craters.length];
    cr.userData.t = 0;
    cr.position.set(x, 0.02 + (craterI%3)*0.002, z);
    cr.scale.setScalar(rand(0.8, 1.3));
  }
}

// ---------- chip -----------------------------------------------------------
let barrage = false, barrageT = 0;
const chipBtns = [...document.querySelectorAll('#chip button')];
chipBtns.forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.m;
  if(m === 'barrage'){
    barrage = !barrage;
    b.classList.toggle('on', barrage);
  } else {
    burst(rand(-5, 5), rand(-5, 5), m);
  }
}));

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if(barrage){
    barrageT -= dt;
    if(barrageT <= 0){
      barrageT = rand(0.5, 1.8);
      burst(rand(-6, 6), rand(-6, 6), rand() < 0.45 ? 'shell' : 'grenade');
    }
  }

  for(const f of flashes){
    if(f.userData.t > 1){ f.material.opacity = 0; continue; }
    f.userData.t += dt*6.5;                       // fast: gone in ~0.15s
    f.scale.multiplyScalar(1 + dt*22);
    f.material.opacity = 0.95*(1 - f.userData.t);
  }
  for(const r of rings){
    if(r.userData.t > 1){ r.material.opacity = 0; continue; }
    r.userData.t += dt*2.2;
    r.scale.multiplyScalar(1 + dt*r.userData.speed);
    r.material.opacity = 0.5*(1 - r.userData.t);
  }
  for(const col of columns){
    if(col.userData.t > 1){ col.visible = false; continue; }
    col.userData.t += dt*1.6;
    const u = col.userData.t;
    if(u < 0.4){                                  // up hard
      col.scale.y = lerp(0.4, 3.2, u/0.4);
      col.scale.x = col.scale.z = lerp(1, 1.4, u/0.4);
      col.position.y = 0.4 + col.scale.y*0.4;
    } else {                                      // collapse and thin out
      col.scale.y = lerp(3.2, 0.6, (u - 0.4)/0.6);
      col.position.y = 0.4 + col.scale.y*0.4;
      col.scale.x = col.scale.z = lerp(1.4, 2.2, (u - 0.4)/0.6);
    }
  }
  for(const c of clods){
    if(c.userData.t > 1){ c.visible = false; continue; }
    c.userData.t += dt*0.55;
    c.userData.v.y -= 11*dt;
    c.position.addScaledVector(c.userData.v, dt);
    c.rotation.x += dt*8; c.rotation.z += dt*6;
    if(c.position.y < 0.05){
      c.position.y = 0.05;
      if(Math.abs(c.userData.v.y) > 1.4){         // one bounce
        c.userData.v.y *= -0.35;
        c.userData.v.x *= 0.6; c.userData.v.z *= 0.6;
      } else c.userData.v.set(0, 0, 0);
    }
  }
  for(const s of smokes){
    if(s.userData.t > 1){ s.material.opacity = 0; continue; }
    s.userData.t += dt*(s.userData.dark ? 0.28 : 0.6);
    if(s.userData.t < 0) continue;                // staggered start
    s.position.y += dt*s.userData.rise;
    s.position.x += dt*0.35;                      // the downwind lean
    s.scale.multiplyScalar(1 + dt*(s.userData.dark ? 0.9 : 1.4));
    s.material.opacity = (s.userData.dark ? 0.66 : 0.5)*(1 - Math.max(0, s.userData.t));
  }
  for(const cr of craters){
    if(cr.userData.t > 1){ cr.material.opacity = Math.max(0, cr.material.opacity - dt*0.01); continue; }
    cr.userData.t += dt*2;
    cr.material.opacity = Math.min(0.55, cr.material.opacity + dt*2);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
