<!DOCTYPE html>
<!-- ======================================================================
     BANK STUDY — where the surplus goes, for George World.
     Filed 2026-08-31, Doug's batch. A little stone temple of money:
     plinth, four columns, pediment with BANK carved over the door,
     and a round VAULT DOOR in the back wall. The working loop:
     a queue of depositors shuffles forward; the customer at the
     window hands over a coin sack; the TELLER counts it out coin by
     coin into a growing stack (tap, tap, tap); the PORTER carries
     the tray through the swinging vault door and the vault heap
     grows; the customer walks off studying a paper receipt; the
     queue advances and somebody new joins the back. Deposits in,
     paper out — the whole trick of banking in one loop.
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Study</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#e4e6d4; }
  #chip { position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(26,28,18,0.78); color:#f2f4e4; font:13px/1.5 system-ui, sans-serif;
    padding:10px 14px; border-radius:10px; user-select:none; backdrop-filter:blur(4px); }
  #chip b { font-size:14px; }
  #chip .hint { opacity:0.7; }
</style>
</head>
<body>
<div id="chip">
  <b>🏦 Bank Study</b> — deposits in, paper out, v1<br>
  <span class="hint">drag to orbit · the teller counts, the porter carries, the vault heap grows</span>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 1818;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe2e4d2), 40, 240);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.2, 600);
camera.position.set(4.5, 3, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.5; controls.maxDistance = 30;
controls.maxPolarAngle = 1.52;
{
  const geo = new THREE.SphereGeometry(280, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xf4f2e2), zenith = new THREE.Color(0x84b2d8),
        below = new THREE.Color(0xd8dac6), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/280;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.6)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xdcecf6, 0xaca878, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.3);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -3;
scene.add(sun);
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(240, 40),
    new THREE.MeshLambertMaterial({ color:0xbcb684 }));
  g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 10),
    new THREE.MeshLambertMaterial({ color:0xc4ae7e }));
  path.rotation.x = -Math.PI/2; path.position.set(0, 0.01, 5); scene.add(path);
}

// ---------- THE BUILDING ---------------------------------------------------
const stoneM = new THREE.MeshLambertMaterial({ color:0xcfc8b4, flatShading:true });
const stoneDk = new THREE.MeshLambertMaterial({ color:0xb0a890, flatShading:true });
const goldM = new THREE.MeshStandardMaterial({ color:0xd8a63c, roughness:0.4, metalness:0.5 });
{
  // plinth + steps
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.5, 4.6), stoneDk);
  plinth.position.set(0, 0.25, -1.2);
  plinth.receiveShadow = true; plinth.castShadow = true;
  scene.add(plinth);
  for(let i = 0; i < 3; i++){
    const step = new THREE.Mesh(new THREE.BoxGeometry(3.2 - i*0.0, 0.17, 0.5 + i*0.0), stoneDk);
    step.position.set(0, 0.085 + i*0.17, 1.35 + (2 - i)*0.45);
    step.castShadow = true; step.receiveShadow = true;
    scene.add(step);
  }
  // back + side walls (the banking hall, open at the front)
  const back = new THREE.Mesh(new THREE.BoxGeometry(6.0, 3.0, 0.3), stoneM);
  back.position.set(0, 2.0, -3.2);
  back.castShadow = true;
  scene.add(back);
  for(const s of [-1, 1]){
    const side = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.0, 3.8), stoneM);
    side.position.set(s*2.85, 2.0, -1.3);
    side.castShadow = true;
    scene.add(side);
  }
  // four columns + entablature + pediment
  for(const x of [-2.4, -0.8, 0.8, 2.4]){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 2.9, 12), stoneM);
    col.position.set(x, 1.95, 0.55);
    col.castShadow = true;
    scene.add(col);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.5), stoneDk);
    cap.position.set(x, 3.42, 0.55);
    scene.add(cap);
  }
  const ent = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.4, 1.0), stoneM);
  ent.position.set(0, 3.7, 0.4);
  ent.castShadow = true;
  scene.add(ent);
  // pediment with BANK
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const g2 = cv.getContext('2d');
  g2.fillStyle = '#cfc8b4'; g2.fillRect(0, 0, 512, 128);
  g2.fillStyle = '#7a725c';
  g2.font = '900 72px Georgia, serif';
  g2.textAlign = 'center';
  g2.fillText('B A N K', 256, 92);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const shape = new THREE.Shape();
  shape.moveTo(-3.2, 0); shape.lineTo(3.2, 0); shape.lineTo(0, 1.3); shape.closePath();
  const ped = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth:0.3, bevelEnabled:false }), stoneM);
  ped.position.set(0, 3.9, 0.3);
  ped.castShadow = true;
  scene.add(ped);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 0.85),
    new THREE.MeshLambertMaterial({ map:tex, transparent:false }));
  sign.position.set(0, 4.35, 0.62);
  scene.add(sign);
  // floor of the hall
  const floor = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.06, 3.6), new THREE.MeshLambertMaterial({ color:0xd8d2c0 }));
  floor.position.set(0, 0.53, -1.3);
  floor.receiveShadow = true;
  scene.add(floor);
}
// the counter
{
  const counter = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.9, 0.4),
    new THREE.MeshLambertMaterial({ color:0x7a5a36, flatShading:true }));
  counter.position.set(0, 1.0, -0.9);
  counter.castShadow = true;
  scene.add(counter);
  const top = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.08, 0.55), stoneDk);
  top.position.set(0, 1.48, -0.9);
  scene.add(top);
  // the grille
  for(let i = 0; i < 7; i++){
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.8, 6), goldM);
    bar.position.set(-0.6 + i*0.2, 1.9, -0.9);
    scene.add(bar);
  }
}
// THE VAULT — round door in the back wall, hinged
const vaultDoor = new THREE.Group();
let vaultHeap;
{
  const frame = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.1, 8, 24), stoneDk);
  frame.position.set(1.7, 1.35, -3.05);
  scene.add(frame);
  vaultDoor.position.set(1.08, 1.35, -3.05);          // hinge at the left edge
  const door = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.14, 22),
    new THREE.MeshStandardMaterial({ color:0x8a929c, roughness:0.35, metalness:0.7 }));
  door.rotation.x = Math.PI/2;
  door.position.x = 0.62;                             // offset from the hinge
  door.castShadow = true;
  vaultDoor.add(door);
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.03, 6, 14), goldM);
  wheel.position.set(0.62, 0, 0.12);
  vaultDoor.add(wheel);
  for(let i = 0; i < 3; i++){
    const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.38, 6), goldM);
    spoke.position.set(0.62, 0, 0.12);
    spoke.rotation.z = i*Math.PI/3;
    vaultDoor.add(spoke);
  }
  scene.add(vaultDoor);
  // the heap inside (glimpsed when the door swings)
  vaultHeap = new THREE.Mesh(new THREE.SphereGeometry(0.4, 10, 7), goldM);
  vaultHeap.scale.set(1, 0.5, 1);
  vaultHeap.position.set(1.75, 0.62, -3.7);
  scene.add(vaultHeap);
}

// ---------- the people -----------------------------------------------------
function makePerson(shirtCol, hatCol){
  const P = { g: new THREE.Group() };
  const shirt = new THREE.MeshLambertMaterial({ color:shirtCol });
  const skin = new THREE.MeshLambertMaterial({ color:0xe0ba92 });
  P.hips = new THREE.Group(); P.hips.position.y = 0.42; P.g.add(P.hips);
  const barrel = new THREE.Mesh(new THREE.CapsuleGeometry(0.27, 0.38, 6, 10), shirt);
  barrel.position.y = 0.2; barrel.castShadow = true; P.hips.add(barrel);
  P.head = new THREE.Group(); P.head.position.y = 0.74; P.hips.add(P.head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10), skin);
  skull.castShadow = true; P.head.add(skull);
  if(hatCol !== undefined){
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 12),
      new THREE.MeshLambertMaterial({ color:hatCol }));
    brim.position.y = 0.16; P.head.add(brim);
    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.17, 0.2, 10),
      new THREE.MeshLambertMaterial({ color:hatCol }));
    crown.position.y = 0.27; P.head.add(crown);
  }
  P.arms = []; P.hands = [];
  for(const s of [-1, 1]){
    const arm = new THREE.Group();
    arm.position.set(s*0.29, 0.44, 0);
    const limb = new THREE.Mesh(new THREE.CapsuleGeometry(0.058, 0.34, 4, 8), skin);
    limb.position.y = -0.21; limb.castShadow = true; arm.add(limb);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 6), skin);
    hand.position.y = -0.43; arm.add(hand);
    P.hips.add(arm); P.arms.push(arm); P.hands.push(hand);
  }
  P.legs = [];
  for(const s of [-1, 1]){
    const leg = new THREE.Group();
    leg.position.set(s*0.13, 0, 0);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.072, 0.3, 4, 8),
      new THREE.MeshLambertMaterial({ color:0x46402e }));
    shin.position.y = -0.24; shin.castShadow = true; leg.add(shin);
    P.hips.add(leg); P.legs.push(leg);
  }
  scene.add(P.g);
  return P;
}
function walkLegs(P, t, sp = 1){
  const ph = t*8*sp;
  P.legs[0].rotation.x = Math.sin(ph)*0.45;
  P.legs[1].rotation.x = -Math.sin(ph)*0.45;
  P.hips.position.y = 0.42 + Math.abs(Math.cos(ph))*0.02;
}
function stillLegs(P, dt){
  P.legs[0].rotation.x = lerp(P.legs[0].rotation.x, 0, dt*6);
  P.legs[1].rotation.x = lerp(P.legs[1].rotation.x, 0, dt*6);
}
const teller = makePerson(0x3c5a4c, 0x2a3a30);       // green eyeshade type
teller.g.position.set(0, 0.56, -1.7);
const porter = makePerson(0x5a5a72);
porter.g.position.set(1.2, 0.56, -2.2);
const customers = [makePerson(0x8a5a3c), makePerson(0x7a4a6a), makePerson(0x4a6a8a)];
// props: the sack, the tray, the receipt, the counting stack
const sack = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6),
  new THREE.MeshLambertMaterial({ color:0xc8b48a, flatShading:true }));
sack.scale.set(1, 0.85, 0.85); sack.castShadow = true; scene.add(sack);
const tray = new THREE.Group();
{
  const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.26), new THREE.MeshLambertMaterial({ color:0x6a4a2a }));
  tray.add(t2);
  scene.add(tray);
}
const receipt = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.22),
  new THREE.MeshLambertMaterial({ color:0xf4f0e0, side:THREE.DoubleSide }));
receipt.visible = false; scene.add(receipt);
const stack = [];
{
  for(let i = 0; i < 5; i++){
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.018, 10), goldM);
    c.position.set(0.25, 1.53 + i*0.02, -0.9);
    c.visible = false;
    scene.add(c);
    stack.push(c);
  }
  for(const t2 of [-0.25, 0]){   // permanent decoration stacks
    for(let i = 0; i < 3; i++){
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.018, 10), goldM);
      c.position.set(t2 - 0.35, 1.53 + i*0.02, -0.95);
      scene.add(c);
    }
  }
}

// ---------- the loop -------------------------------------------------------
// 0–2.5 customer walks up · 2.5–3.2 hands the sack · 3.2–6 teller COUNTS
// (stack grows, sack deflates) · 6–9 porter takes the tray to the VAULT
// (door swings, heap grows) · 8–11 customer leaves reading the receipt ·
// 11–12 queue shuffles up · repeat (14s)
let phT = 0;
let deposits = 0;
const WINDOW = new THREE.Vector3(0, 0.56, -0.1);
const QUEUE = [new THREE.Vector3(0, 0.56, 1.3), new THREE.Vector3(0.25, 0.56, 2.5), new THREE.Vector3(-0.15, 0.56, 3.7)];
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT = (phT + dt) % 14;
  const f = phT;
  const front = customers[0], q2 = customers[1], q3 = customers[2];

  // ------ the customer at the front ------
  if(f < 2.5){                               // up to the window
    const p = smooth(f/2.5);
    front.g.position.lerpVectors(QUEUE[0], WINDOW, p);
    front.g.rotation.y = Math.PI;
    walkLegs(front, t);
    sack.visible = true;
    sack.scale.set(1, 0.85, 0.85);
    const hp = new THREE.Vector3();
    front.hands[1].getWorldPosition(hp);
    sack.position.copy(hp).add(new THREE.Vector3(0, 0.05, 0));
    front.arms[1].rotation.x = -0.5;
    receipt.visible = false;
  } else if(f < 3.2){                        // the handover
    stillLegs(front, dt);
    front.arms[1].rotation.x = lerp(front.arms[1].rotation.x, -1.5, dt*8);
    const p = smooth((f - 2.5)/0.7);
    sack.position.lerp(new THREE.Vector3(0.25, 1.58, -0.85), Math.min(1, dt*8));
  } else if(f < 6){                          // THE COUNT
    stillLegs(front, dt);
    front.arms[1].rotation.x = lerp(front.arms[1].rotation.x, 0, dt*4);
    const n = Math.floor((f - 3.2)/0.56);    // a coin every half-second and a bit
    stack.forEach((c, i) => c.visible = i <= n);
    sack.position.set(0.25, 1.58, -0.85);
    sack.scale.setScalar(lerp(1, 0.45, (f - 3.2)/2.8));  // emptying
    sack.scale.y *= 0.85;
    // teller taps the stack
    teller.arms[1].rotation.x = -1.3 + Math.abs(Math.sin((f - 3.2)*11))*0.35;
    teller.head.rotation.x = 0.35;
  } else {
    teller.arms[1].rotation.x = lerp(teller.arms[1].rotation.x, -0.3, dt*4);
    teller.head.rotation.x = lerp(teller.head.rotation.x, 0.05, dt*4);
  }

  // ------ the porter's vault run ------
  if(f >= 6 && f < 9){
    const k = (f - 6)/3;
    sack.visible = k < 0.1;
    stack.forEach(c => c.visible = k < 0.15);
    let px, pz;
    if(k < 0.45){ const p = smooth(k/0.45); px = lerp(0.5, 1.35, p); pz = lerp(-1.5, -2.75, p); walkLegs(porter, t, 0.9); }
    else if(k < 0.7){ px = 1.35; pz = -2.75; stillLegs(porter, dt); }
    else { const p = smooth((k - 0.7)/0.3); px = lerp(1.35, 1.2, p); pz = lerp(-2.75, -2.2, p); walkLegs(porter, t, 0.9); }
    porter.g.position.set(px, 0.56, pz);
    porter.g.rotation.y = k < 0.7 ? Math.PI + 0.5 : 0.3;
    porter.arms[0].rotation.x = -1.1; porter.arms[1].rotation.x = -1.1;
    const hp = new THREE.Vector3(); porter.hands[0].getWorldPosition(hp);
    const hp2 = new THREE.Vector3(); porter.hands[1].getWorldPosition(hp2);
    tray.position.copy(hp.add(hp2).multiplyScalar(0.5)).add(new THREE.Vector3(0, 0.03, 0));
    tray.rotation.y = porter.g.rotation.y;
    tray.visible = true;
    // the vault door swings while the porter is near
    const open = smooth(clamp((k - 0.25)/0.2, 0, 1)) * (1 - smooth(clamp((k - 0.72)/0.2, 0, 1)));
    vaultDoor.rotation.y = -open*1.9;
    if(k > 0.55 && k - dt/3 <= 0.55){        // the dump — the heap grows
      deposits = Math.min(8, deposits + 1);
      const s = 1 + deposits*0.09;
      vaultHeap.scale.set(s, 0.5*s, s);
    }
  } else {
    porter.g.position.lerp(new THREE.Vector3(1.2, 0.56, -2.2), dt*3);
    porter.arms[0].rotation.x = lerp(porter.arms[0].rotation.x, 0, dt*4);
    porter.arms[1].rotation.x = lerp(porter.arms[1].rotation.x, 0, dt*4);
    stillLegs(porter, dt);
    tray.visible = false;
    vaultDoor.rotation.y = lerp(vaultDoor.rotation.y, 0, dt*4);
  }

  // ------ the exit, reading the paper ------
  if(f >= 8 && f < 11.5){
    const p = smooth((f - 8)/3.5);
    front.g.position.lerpVectors(WINDOW, new THREE.Vector3(-2.6, 0.56, 5.5), p);
    front.g.rotation.y = Math.atan2(-2.6, 5.6);
    walkLegs(front, t, 0.9);
    front.arms[0].rotation.x = -1.7;         // holding the receipt up
    front.head.rotation.x = 0.3;             // reading it
    receipt.visible = true;
    const hp = new THREE.Vector3(); front.hands[0].getWorldPosition(hp);
    receipt.position.copy(hp).add(new THREE.Vector3(0, 0.12, 0));
    receipt.rotation.y = front.g.rotation.y;
  }

  // ------ the queue shuffles ------
  if(f >= 11.5){
    const p = smooth((f - 11.5)/2.5);
    q2.g.position.lerpVectors(QUEUE[1], QUEUE[0], p);
    q3.g.position.lerpVectors(QUEUE[2], QUEUE[1], p);
    walkLegs(q2, t, 0.5); walkLegs(q3, t, 0.5);
    // the front customer becomes the back of the queue (rotation of roles)
    front.g.position.lerpVectors(new THREE.Vector3(-2.6, 0.56, 5.5), QUEUE[2], p);
    front.g.rotation.y = 0;
    walkLegs(front, t, 0.9);
    front.arms[0].rotation.x = lerp(front.arms[0].rotation.x, 0, dt*4);
    front.head.rotation.x = lerp(front.head.rotation.x, 0, dt*4);
    receipt.visible = false;
    if(f + dt >= 14){                        // roles rotate for the next loop
      customers.push(customers.shift());
      customers[0].g.position.copy(QUEUE[0]);
      customers[1].g.position.copy(QUEUE[1]);
      customers[2].g.position.copy(QUEUE[2]);
    }
  } else {
    q2.g.position.lerp(QUEUE[1], dt*2);
    q3.g.position.lerp(QUEUE[2], dt*2);
    stillLegs(q2, dt); stillLegs(q3, dt);
    q2.g.rotation.y = Math.PI; q3.g.rotation.y = Math.PI;
    // idle fidgets in the queue
    q2.head.rotation.y = Math.sin(t*0.7)*0.2;
    q3.head.rotation.y = Math.sin(t*0.9 + 2)*0.25;
    q3.hips.rotation.y = Math.sin(t*0.5)*0.05;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
