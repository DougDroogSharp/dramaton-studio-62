<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ======================================================================
// REV STAMP — bump BOTH of these on every regenerated build of this file.
// Shown bottom-left on screen AND burned into every PNG the Save / Copy Image
// buttons produce, so any screenshot says which build it came from.
// Rev history: 1 first pass 12:50 · 2 screenshot buttons 18:25 ·
// 3 volcano reshape 18:36 · 4 smoothing pass 18:45 · 5 Geode Vault 18:56 ·
// 6 rev stamp 20:22
// ======================================================================
const REV = 6;
const BUILT = '2026-08-31 20:22';

// ======================================================================
// 0. deterministic RNG + noise  (same island every reload)
// ======================================================================
let _seed = 20260831;
function srand(s){ _seed = s >>> 0; }
function rand(a=1, b){ _seed = (_seed*1103515245 + 12345) & 0x7fffffff;
  const r = _seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const sstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp  = (a,b,t)=>a+(b-a)*t;

// QUINTIC fade (Perlin's): 6t^5-15t^4+10t^3 has zero 1st AND 2nd derivatives
// at the cell edges, where the cubic smoothstep only zeroes the 1st. That
// second derivative is what shows up as faint creases along the noise lattice
// on a shallow slope, so every noise call below rides on the smoother curve.
const qfade = t => t*t*t*(t*(t*6 - 15) + 10);

function hash2(x, y){ const n = Math.sin(x*127.1 + y*311.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise2(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
  const u = qfade(xf), v = qfade(yf);
  const a = hash2(xi,yi), b = hash2(xi+1,yi), c = hash2(xi,yi+1), d = hash2(xi+1,yi+1);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm2(x, y, oct=4){
  let s=0, amp=0.5, f=1, norm=0;
  for(let i=0;i<oct;i++){ s += amp*vnoise2(x*f, y*f); norm += amp; f *= 2.03; amp *= 0.5; }
  return s/norm;
}
// ridged noise: sharp crests — the shape erosion gullies want
function ridged2(x, y, oct=3){
  let s=0, amp=0.5, f=1, norm=0;
  for(let i=0;i<oct;i++){ const n = 1 - Math.abs(vnoise2(x*f, y*f)*2 - 1);
    s += amp*n*n; norm += amp; f *= 2.11; amp *= 0.5; }
  return s/norm;
}
function hash3(x, y, z){ const n = Math.sin(x*127.1 + y*311.7 + z*74.7) * 43758.5453123; return n - Math.floor(n); }
function vnoise3(x, y, z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=qfade(xf), v=qfade(yf), w=qfade(zf);
  const c000=hash3(xi,yi,zi),     c100=hash3(xi+1,yi,zi);
  const c010=hash3(xi,yi+1,zi),   c110=hash3(xi+1,yi+1,zi);
  const c001=hash3(xi,yi,zi+1),   c101=hash3(xi+1,yi,zi+1);
  const c011=hash3(xi,yi+1,zi+1), c111=hash3(xi+1,yi+1,zi+1);
  return lerp(lerp(lerp(c000,c100,u), lerp(c010,c110,u), v),
              lerp(lerp(c001,c101,u), lerp(c011,c111,u), v), w);
}
function fbm3(x, y, z, oct=3){
  let s=0, amp=0.5, f=1, norm=0;
  for(let i=0;i<oct;i++){ s += amp*vnoise3(x*f,y*f,z*f); norm += amp; f *= 2.07; amp *= 0.5; }
  return s/norm;
}

// ======================================================================
// 1. THE ISLAND — base landform (verbatim from georgeworld.html v0.61)
// ======================================================================
const WS = 1.25;                       // world scale — same as the game
const VOLC = { x:44*WS, z:-14*WS };    // crater centre, world coords
const PATH = [[0,50],[8,30],[14,12],[18,-6],[10,-24],[-2,-38]].map(([px,pz])=>[px*WS, pz*WS]);
function pathDist(x, z){
  let best = 1e9;
  for(let i=0;i<PATH.length-1;i++){
    const [ax,az]=PATH[i], [bx,bz]=PATH[i+1];
    const abx=bx-ax, abz=bz-az;
    const t = clamp(((x-ax)*abx+(z-az)*abz)/(abx*abx+abz*abz), 0, 1);
    best = Math.min(best, Math.hypot(x-(ax+abx*t), z-(az+abz*t)));
  }
  return best;
}
function ridgeMask(x){
  let m = (1 - sstep(55, 78, Math.abs(x))) * (0.78 + 0.22*Math.sin(x*0.09 + 1.0));
  m *= (1 - 0.5*Math.exp(-(((x-18)/8)**2)));   // low saddle / pass at x≈18
  return m;
}
// THE VOLCANO (reshaped 2026-08-31): the iconic erupting-stratovolcano
// silhouette. The old cone was a plain Gaussian — a soft bell, wide and
// stumpy. This is exp(-(r/a)^p) with p BELOW 2, which is the Fuji profile:
// flanks that flare outward into a sweeping skirt at the base and steepen as
// they climb. p<2 also means the slope goes to ZERO at the apex, so the summit
// is ROUNDED, not pointed — tall and commanding without a spike. All the drama
// is in height, steepness and mass; nothing here is sharp.
const VOLC_H  = 65;    // cone height before the crater is carved out
const VOLC_A  = 14.5;  // skirt scale
const VOLC_P  = 1.45;  // <2 = concave sweeping flanks; 2 would be a soft bell
const VOLC_CD = 35;    // crater depth — deep enough to READ from a distance
const VOLC_CR = 5.5;   // crater radius -> rim at r~7, ~10 deep, summit ~50

function terrainBase(x, z){
  x /= WS; z /= WS;
  const d = Math.hypot(x, z);
  let h = 9*(1 - sstep(38, 88, d)) - 3.2;
  h += 15 * Math.exp(-(((z+8)/10)**2)) * ridgeMask(x);           // the ridge
  const vr = Math.hypot(x - 44, z + 14);                         // the volcano
  h += VOLC_H * Math.exp(-Math.pow(vr / VOLC_A, VOLC_P));
  h -= VOLC_CD * Math.exp(-((vr / VOLC_CR) ** 2));               // its crater bowl
  h += 10.5 * (1 - sstep(5.5, 17, Math.hypot(x - 26, z - 34)));  // the king's hill
  h += 7.0 * (1 - sstep(2.5, 10.5, Math.hypot(x + 24, z - 12))); // twin hill A
  h += 6.0 * (1 - sstep(2.0, 9.0,  Math.hypot(x + 15, z - 5)));  // twin hill B
  h += 0.6*Math.sin(x*0.15)*Math.sin(z*0.17)
     + 0.4*Math.sin(x*0.31+2)*Math.sin(z*0.23+1);
  h -= 9 * Math.exp(-(((x-56)/14)**2 + ((z-44)/11)**2));         // the surf bay
  return h;
}
// the game's sand-ring width function — reused so the beach lands in exactly
// the same places, and so rocks know which stretches of coast are ROCKY
function sandWidth(x, z){
  const ang = Math.atan2(z, x);
  return Math.max(0.5, 1.7 + 1.1*Math.sin(ang*3 + 1.2) + 0.8*Math.sin(ang*7 + 3.1)
    + 1.4*sstep(0.2, 0.9, Math.sin(ang - 1.35)));
}

// ======================================================================
// 2. THE DETAIL PASS — erosion, gullies, CLIFF TERRACES, volcano rilles
//    Pure function of (x,z). Zero below h≈0.4, so the island's outline,
//    beaches and bay are exactly the shape the game already ships.
// ======================================================================
let DETAIL_ON = true;

// How much of the SOFT volcano we are standing on: 1 across the cone, easing
// to 0 out on the skirt. Every roughening effect below is multiplied down by
// this, because the volcano's whole job is to read as one smooth, massive form.
function volcSoft(x, z){
  return 1 - sstep(26*WS, 46*WS, Math.hypot(x - VOLC.x, z - VOLC.z));
}

function terrainDetailFrom(x, z, b, s){
  if(!DETAIL_ON || b < 0.35) return 0;
  const inland = sstep(0.35, 3.2, b);           // never disturb the waterline
  const soft = volcSoft(x, z);
  let d = 0;

  // (a) broad erosion — hummocks and hollows, stronger on open slopes.
  //     Damped hard on the cone: smooth flanks are the whole point.
  const rough = 1 - 0.82*soft;
  d += (fbm2(x*0.048 + 3.1, z*0.048 - 1.7, 4) - 0.5) * 2.6 * rough;
  d += (fbm2(x*0.145 - 8.2, z*0.145 + 4.4, 3) - 0.5) * 1.05 * rough;
  d += (fbm2(x*0.42, z*0.42, 2) - 0.5) * 0.34 * rough;   // pebble-scale grain

  // (b) GULLIES — ridged noise carved DOWNWARD, only where water would run.
  //     Switched off entirely on the cone (they cut it into shards).
  //     Softened along with the terraces — these are shallow valleys now, not
  //     creases, and they vary in SPACE (not with height) so they never ring.
  const gully = ridged2(x*0.038 + 11.3, z*0.038 - 6.8, 4);
  d -= gully * 1.5 * sstep(0.26, 0.90, s) * sstep(2.0, 6.0, b) * (1 - soft);

  // (c) CLIFF TERRACING — DELETED 2026-08-31 18:5x.
  //     It quantised height into ledges: h -> STEP*(floor(t) + smoothstep(fr)).
  //     Steps of equal height ARE contour lines, so every hill came out wearing
  //     concentric rings — a fingerprint from above, a stepped staircase at
  //     ground level. Varying the bed thickness and phase only disguised it.
  //     There is no smooth version of a quantiser: the whole idea had to go.
  //     Cliff character now comes from ROCK GEOMETRY (outcrops, ledges, crags)
  //     rather than from stepping the heightfield.

  // (d) THE VOLCANO — the only detail it gets: broad, ROUNDED radial swells,
  //     the gentle ridges that run down a big cone. A signed swell (up AND
  //     down), not a carve, so the silhouette stays smooth and unbroken. The
  //     old sharp rilles are gone — they were what made it read as spiky.
  const vdx = x - VOLC.x, vdz = z - VOLC.z, vd = Math.hypot(vdx, vdz);
  if(vd < 46*WS){
    const ang = Math.atan2(vdz, vdx);
    const flank = sstep(8*WS, 16*WS, vd) * (1 - sstep(26*WS, 45*WS, vd));
    // barely there: enough to keep the cone from looking machined, not enough
    // to read as fluting down the flanks
    const swell = Math.sin(ang*5 + fbm2(ang*2.2, vd*0.04, 2)*2.2);
    d += swell * 0.30 * flank;
  }

  return d * inland;
}
function baseSlopeAt(x, z){
  const e = 1.5;
  return Math.hypot(terrainBase(x+e,z)-terrainBase(x-e,z),
                    terrainBase(x,z+e)-terrainBase(x,z-e)) / (2*e);
}
// THE drop-in: same signature as the game's terrainH
function terrainH(x, z){
  const b = terrainBase(x, z);
  return b + terrainDetailFrom(x, z, b, baseSlopeAt(x, z));
}
function slopeAt(x, z){
  const e = 1.2;
  return Math.hypot(terrainH(x+e,z)-terrainH(x-e,z), terrainH(x,z+e)-terrainH(x,z-e)) / (2*e);
}
function normalAt(x, z, e=1.2){
  return new THREE.Vector3(
    terrainH(x-e,z) - terrainH(x+e,z), 2*e,
    terrainH(x,z-e) - terrainH(x,z+e)).normalize();
}
// steepest-descent step — used to lay talus fans BELOW cliff faces
function downhill(x, z, step){
  const e = 1.4;
  const gx = terrainH(x+e,z) - terrainH(x-e,z);
  const gz = terrainH(x,z+e) - terrainH(x,z-e);
  const m = Math.hypot(gx, gz) || 1;
  return [x - gx/m*step, z - gz/m*step];
}

// ======================================================================
// 3. renderer / scene / camera
// ======================================================================
// preserveDrawingBuffer keeps the rendered frame readable by toBlob() instead
// of being discarded after compositing — without it screenshots come out blank.
// (The capture path ALSO renders a fresh frame first; belt and braces.)
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// the island never moves: render the shadow map ONCE per rebuild instead of
// every frame. On integrated graphics this is the single biggest win — it
// halves the geometry the GPU chews through.
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// fog tuned to the sky dome's horizon colour — a mismatch here is what turns a
// distant plane edge into a visible seam
const FOGC = new THREE.Color(0xd4ebf6);
scene.fog = new THREE.Fog(FOGC, 240, 640);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.4, 7000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 4;
controls.maxDistance = 460;
controls.maxPolarAngle = 1.55;

// sky dome (gradient, unfogged) — same trick as palm_study
{
  const R = 3400;   // must enclose the far sea planes
  const geo = new THREE.SphereGeometry(R, 26, 18);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xd8eef8), zenith = new THREE.Color(0x59a9e0);
  const below = new THREE.Color(0xc9e2ec), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/R;
    if(h >= 0) c.copy(horizon).lerp(zenith, Math.pow(h, 0.5)); else c.copy(below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.BackSide, fog:false })));
}

const hemi = new THREE.HemisphereLight(0xd6ecff, 0xb0c98e, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 2.05);
sun.position.set(120, 165, 78);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -175; sun.shadow.camera.right = 175;
sun.shadow.camera.top = 175;  sun.shadow.camera.bottom = -175;
sun.shadow.camera.near = 40;  sun.shadow.camera.far = 480;
sun.shadow.bias = -0.0007;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd8ecff, 0.42);
fill.position.set(-70, 50, -60);
scene.add(fill);

// ======================================================================
// 4. THE TERRAIN MESH
//    Heights are solved on a GRID first (one terrainBase call per vertex),
//    then slope/curvature come from grid neighbours — no re-sampling.
//    Normals are HYBRID: smooth where it's turf, faceted where it's rock,
//    in a single mesh with a single material.
// ======================================================================
const TSIZE = Math.round(260*WS);   // 325 — same footprint as the game
const TSEG  = 384;                  // 384 vs the game's 200 — ~0.85 units per
                                    // quad, so slopes resolve as smooth curves
const ROW   = TSEG + 1;
const CELL  = TSIZE / TSEG;

const cGrassA = new THREE.Color(0x8fd177), cGrassB = new THREE.Color(0x63b85e);
const cGrassDry = new THREE.Color(0xa9bd63), cMoss = new THREE.Color(0x4d7f45);
const cRock = new THREE.Color(0x9c9184), cRockHi = new THREE.Color(0xbdb2a3);
const cRockDk = new THREE.Color(0x6f665c), cSand = new THREE.Color(0xeed9a4);
const cWetSand = new THREE.Color(0xc3aa79), cDeep = new THREE.Color(0x7d9a8a);
const cSeabed = new THREE.Color(0x1d7fa0);   // MUST equal the deep plane's colour
const cPath = new THREE.Color(0xd9b98a);
// The volcano's skin: a WARM matte mid-tone, not scorched basalt. The old
// near-black 0x3b322d read as melted chocolate and turned every radial swell
// into a dark drip. Only the crater bowl itself goes dark, for depth.
const cVolc = new THREE.Color(0xa08e78), cVolcDeep = new THREE.Color(0x6f6154);

// grids kept around so scatter placement can look terrain facts up cheaply
let gH = null, gSlope = null, gRock = null, gSand = null;

// normal straight off the height grid — 4 array lookups instead of 4 full
// terrainH() evaluations, which matters when 30k tufts each want one
function gridNormal(x, z, e=1.1){
  return new THREE.Vector3(
    gridSample(gH, x-e, z) - gridSample(gH, x+e, z), 2*e,
    gridSample(gH, x, z-e) - gridSample(gH, x, z+e)).normalize();
}
function gridSample(arr, x, z){
  const fx = (x + TSIZE/2)/CELL, fz = (z + TSIZE/2)/CELL;
  const ix = clamp(Math.floor(fx), 0, TSEG-1), iz = clamp(Math.floor(fz), 0, TSEG-1);
  const tx = clamp(fx-ix, 0, 1), tz = clamp(fz-iz, 0, 1);
  const i = iz*ROW + ix;
  return lerp(lerp(arr[i], arr[i+1], tx), lerp(arr[i+ROW], arr[i+ROW+1], tx), tz);
}

function buildTerrainGeometry(){
  const geo = new THREE.PlaneGeometry(TSIZE, TSIZE, TSEG, TSEG);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position, N = pos.count;

  // --- pass 1: base heights -------------------------------------------
  const xs = new Float32Array(N), zs = new Float32Array(N), base = new Float32Array(N);
  for(let i=0;i<N;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    xs[i]=x; zs[i]=z; base[i] = terrainBase(x, z);
  }
  // --- pass 2: base slope from neighbours ------------------------------
  const bslope = new Float32Array(N);
  for(let iz=0; iz<ROW; iz++) for(let ix=0; ix<ROW; ix++){
    const i = iz*ROW+ix;
    const xm = base[iz*ROW + Math.max(0,ix-1)], xp = base[iz*ROW + Math.min(TSEG,ix+1)];
    const zm = base[Math.max(0,iz-1)*ROW + ix], zp = base[Math.min(TSEG,iz+1)*ROW + ix];
    bslope[i] = Math.hypot(xp-xm, zp-zm) / (2*CELL);
  }
  // --- pass 3: detail + final height ------------------------------------
  const H = new Float32Array(N);
  for(let i=0;i<N;i++) H[i] = base[i] + terrainDetailFrom(xs[i], zs[i], base[i], bslope[i]);
  // --- pass 4: slope + curvature (cheap AO) -----------------------------
  const slope = new Float32Array(N), curv = new Float32Array(N);
  for(let iz=0; iz<ROW; iz++) for(let ix=0; ix<ROW; ix++){
    const i = iz*ROW+ix;
    const l = H[iz*ROW+Math.max(0,ix-1)],      r = H[iz*ROW+Math.min(TSEG,ix+1)];
    const d = H[Math.max(0,iz-1)*ROW+ix],      u = H[Math.min(TSEG,iz+1)*ROW+ix];
    slope[i] = Math.hypot(r-l, u-d) / (2*CELL);
    curv[i]  = H[i] - (l+r+d+u)/4;             // <0 = hollow, >0 = crest
  }

  // --- pass 5: colours + rockiness --------------------------------------
  const colors = new Float32Array(N*3), rockiness = new Float32Array(N);
  const facetw = new Float32Array(N);   // faceting weight — separate from the
  const sandg = new Float32Array(N);    // turf mask, so the cone can stay smooth
  const c = new THREE.Color(), tmp = new THREE.Color();
  for(let i=0;i<N;i++){
    const x = xs[i], z = zs[i], h = H[i], s = slope[i];
    pos.setY(i, h);

    // turf: two greens by noise, drying out on sunny convex ground
    const n = fbm2(x*0.052 + 5, z*0.052 - 2, 3);
    c.copy(cGrassA).lerp(cGrassB, n);
    c.lerp(cGrassDry, sstep(0.45, 0.85, fbm2(x*0.031 - 12, z*0.031 + 7, 2)) * 0.55);
    c.lerp(cMoss, clamp(-curv[i]*0.8, 0, 1) * 0.45);            // damp hollows go mossy

    // exposed rock: steep faces and high ground, with STRATA banding so the
    // cliff terraces read as bedded stone rather than grey paint. High ground
    // goes bare PATCHILY — a uniform lerp turned every hilltop into a tan dome.
    // the mesh samples slope across two cells (~2.3 units), which under-reads
    // a cliff riser only a cell or two wide — hence the low trigger point
    const tr = clamp(Math.max(
      sstep(0.42, 0.85, s),
      sstep(9.5, 15.0, h) * (0.30 + 0.70*fbm2(x*0.085 + 9, z*0.085 - 5, 2))), 0, 1);
    // Rock tone varies by PLACE, never by height. This used to be
    // 0.5+0.5*sin(h*1.9 + ...) — strata banding, which looks right on a
    // vertical cliff face but on any rounded slope draws bands of equal
    // height, i.e. contour rings. It was a second, purely-colour source of
    // the onion-ring look, independent of the terracing in the heightfield.
    const band = fbm2(x*0.105 + 33, z*0.105 - 19, 3);
    tmp.copy(cRock).lerp(cRockHi, band*0.95).lerp(cRockDk, sstep(0.70, 1.30, s)*0.75);
    // squared: stone only takes over where it REALLY is stone. A linear blend
    // smeared a muddy brown wash over every hillside.
    const trc = clamp(Math.pow(tr, 1.55)*1.30, 0, 1);
    c.lerp(tmp, trc);
    rockiness[i] = trc;
    // the volcano keeps SMOOTH normals however stony its colour reads —
    // faceting a steep cone chops its silhouette into shards
    facetw[i] = trc * (1 - 0.94*volcSoft(x, z));

    // the sand ring — the game's exact formula, plus a wet band at the water
    const sw = sandWidth(x, z);
    const ts = (1 - sstep(sw, sw + 1.1, h)) * (1 - trc*0.75);
    c.lerp(cSand, ts);
    c.lerp(cWetSand, ts * (1 - sstep(0.15, 1.5, h)) * 0.85);
    sandg[i] = ts;
    // Underwater: shallows go green-grey, then settle onto EXACTLY the open
    // sea's colour by ~3 units down. The whole drowned rim of the terrain
    // plane sits at -3.2, so it merges with the sea floor and its square
    // outline can no longer be seen through the translucent water.
    if(h < 0){
      c.lerp(cDeep, clamp(-h/2.2, 0, 1) * 0.75);
      c.lerp(cSeabed, sstep(1.1, 2.9, -h));
    }

    const pd = pathDist(x, z);
    if(pd < 3 && h > 0.5) c.lerp(cPath, (1 - pd/3)*0.8);

    // the volcano wears burnt basalt — keyed to HEIGHT on the cone as well as
    // radius, so the upper flanks read as lava rock instead of brown dirt
    const vd = Math.hypot(x - VOLC.x, z - VOLC.z);
    if(vd < 42*WS){
      const volcW = Math.max(
        1 - sstep(7*WS, 19*WS, vd),                                   // the crater and its lip
        sstep(17, 31, h) * (1 - sstep(24*WS, 42*WS, vd)));            // the upper cone
      // matte: a faint, NON-directional mottle instead of the old height-keyed
      // banding, which drew vertical stripes straight down the flanks
      const mottle = 0.94 + 0.12*fbm2(x*0.10 + 71, z*0.10 - 44, 2);
      tmp.copy(cVolc).multiplyScalar(mottle)
         .lerp(cVolcDeep, (1 - sstep(2.5*WS, 8.5*WS, vd)) * 0.85);
      c.lerp(tmp, clamp(volcW, 0, 1) * 0.88);
    }

    // crevice shading: hollows sit in their own shadow
    const ao = 1 - clamp(-curv[i]*1.6, 0, 0.42);
    colors[i*3]=c.r*ao; colors[i*3+1]=c.g*ao; colors[i*3+2]=c.b*ao;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('rockiness', new THREE.BufferAttribute(facetw, 1));
  geo.computeVertexNormals();               // smooth normals first

  gH = H; gSlope = slope; gRock = rockiness; gSand = sandg;

  // --- pass 6: HYBRID normals -------------------------------------------
  // split into faces, then blend each vertex normal toward its FACE normal by
  // how rocky it is. Turf stays velvet-smooth; cliffs and outcrops facet.
  const flat = geo.toNonIndexed();
  const fp = flat.attributes.position, fn = flat.attributes.normal, fr = flat.attributes.rockiness;
  const a = new THREE.Vector3(), b2 = new THREE.Vector3(), c2 = new THREE.Vector3();
  const ab = new THREE.Vector3(), cb = new THREE.Vector3(), face = new THREE.Vector3();
  const sm = new THREE.Vector3();
  for(let t=0; t<fp.count; t+=3){
    a.fromBufferAttribute(fp, t); b2.fromBufferAttribute(fp, t+1); c2.fromBufferAttribute(fp, t+2);
    cb.subVectors(c2, b2); ab.subVectors(a, b2); face.crossVectors(cb, ab).normalize();
    for(let k=0;k<3;k++){
      // gentler than before: only genuinely rocky ground facets, so a grassy
      // slope never breaks into visible planes
      const w = clamp(fr.getX(t+k)*0.80, 0, 1);
      sm.fromBufferAttribute(fn, t+k).lerp(face, w).normalize();
      fn.setXYZ(t+k, sm.x, sm.y, sm.z);
    }
  }
  flat.deleteAttribute('rockiness');
  flat.deleteAttribute('uv');
  geo.dispose();
  return flat;
}

const matTerrain = new THREE.MeshLambertMaterial({ vertexColors:true });
let terrainMesh = null;
function makeTerrain(){
  if(terrainMesh){ scene.remove(terrainMesh); terrainMesh.geometry.dispose(); }
  terrainMesh = new THREE.Mesh(buildTerrainGeometry(), matTerrain);
  terrainMesh.receiveShadow = true;
  terrainMesh.castShadow = true;
  scene.add(terrainMesh);
}

// sea + seabed, matching the game
{
  // LAMBERT, not Basic: the terrain's drowned outskirts are Lambert-lit, so an
  // unlit plane of the same colour rendered a different shade and the seam
  // between them showed. Same material + same colour + same flat normal =
  // pixel-identical, and the terrain's square edge vanishes into the sea floor.
  const deep = new THREE.Mesh(new THREE.PlaneGeometry(5200, 5200),
    new THREE.MeshLambertMaterial({ color:0x1d7fa0 }));
  deep.rotation.x = -Math.PI/2; deep.position.y = -5.5;
  scene.add(deep);
}
// The sea used to be a 760-unit square — its edge sat at 380 units, well inside
// the fog's 620-unit reach, so it drew a faint rectangle around the island.
// Both sea planes now run out past the fog's far limit, where everything has
// already dissolved into the horizon colour, so no edge can show. 96 segments
// over 2600 keeps ~27-unit cells, still finer than the swell wavelengths.
const wGeo = new THREE.PlaneGeometry(2600, 2600, 96, 96);
wGeo.rotateX(-Math.PI/2);
const wBase = wGeo.attributes.position.array.slice();
// Toned-down specular: at 2600 units across, a hard highlight on the regular
// swell pattern tiled the sea into bright rectangles.
const water = new THREE.Mesh(wGeo, new THREE.MeshPhongMaterial({
  color:0x3ec6e0, transparent:true, opacity:0.82, flatShading:true,
  shininess:38, specular:0x63aac4 }));
scene.add(water);

// ======================================================================
// 5. REAL ROCKS — procedural, eroded, cleaved. Seven variants, instanced.
//    Displacement is a pure function of the undisplaced vertex position, so
//    duplicated (non-indexed) vertices move together and the shell stays
//    watertight. Cleave planes shear off flat faces — that's what makes a
//    lump of noise read as STONE instead of a potato.
// ======================================================================
function makeRockGeo(seed, { detail=1, rough=0.34, cleaves=3, squash=[1,0.85,1], flatBase=-0.55 }={}){
  srand(seed);
  const ox = rand(0,60), oy = rand(0,60), oz = rand(0,60);
  const planes = [];
  for(let i=0;i<cleaves;i++) planes.push({
    n: new THREE.Vector3(rand(-1,1), rand(-0.55,1), rand(-1,1)).normalize(),
    d: rand(0.60, 0.86)
  });
  const sq = new THREE.Vector3(squash[0], squash[1], squash[2]);
  const g = new THREE.IcosahedronGeometry(1, detail);   // non-indexed already
  const p = g.attributes.position, v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i);
    const n1 = fbm3(v.x*1.55 + ox, v.y*1.55 + oy, v.z*1.55 + oz, 3);
    const n2 = fbm3(v.x*4.1 + oy, v.y*4.1 + oz, v.z*4.1 + ox, 2);
    v.multiplyScalar(1 + (n1-0.5)*rough*2 + (n2-0.5)*rough*0.55);
    v.multiply(sq);
    for(const pl of planes){ const dd = v.dot(pl.n); if(dd > pl.d) v.addScaledVector(pl.n, pl.d - dd); }
    if(v.y < flatBase) v.y = flatBase + (v.y - flatBase)*0.22;   // sits flat
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  g.deleteAttribute('uv');
  g.deleteAttribute('normal');       // flatShading recomputes per-face anyway
  return g;
}

const ROCK_VARIANTS = [
  makeRockGeo(101, { detail:1, rough:0.30, cleaves:3, squash:[1.00,0.82,0.95] }),  // 0 boulder
  makeRockGeo(202, { detail:1, rough:0.40, cleaves:4, squash:[1.15,0.70,0.90] }),  // 1 flat boulder
  makeRockGeo(303, { detail:2, rough:0.26, cleaves:5, squash:[0.95,1.05,1.00] }),  // 2 blocky big
  makeRockGeo(404, { detail:2, rough:0.22, cleaves:6, squash:[0.80,1.30,0.70] }),  // 3 CRAG slab
  makeRockGeo(505, { detail:2, rough:0.30, cleaves:4, squash:[1.35,0.95,0.62] }),  // 4 ledge / strata
  makeRockGeo(606, { detail:0, rough:0.42, cleaves:2, squash:[1.00,0.72,1.00] }),  // 5 scree chip
  makeRockGeo(707, { detail:0, rough:0.36, cleaves:3, squash:[1.10,0.60,0.95] }),  // 6 pebble
];
const rockMat = new THREE.MeshLambertMaterial({ flatShading:true, vertexColors:false });
const PLACED = ROCK_VARIANTS.map(()=>[]);     // per-variant instance list
const OBSTACLES = [];                         // {x,z,r} — hand these to the game

const _q = new THREE.Quaternion(), _up = new THREE.Vector3(0,1,0);
const _m = new THREE.Matrix4(), _s = new THREE.Vector3(), _p = new THREE.Vector3();

// one dial for the whole rock population — the first pass read as boulder
// fields dropped on a model railway, because stone was competing with the
// landforms instead of decorating them
const ROCK_SCALE = 0.55;

function placeRock(variant, x, z, size, opt={}){
  size *= ROCK_SCALE;
  const h = terrainH(x, z);
  const sink = opt.sink !== undefined ? opt.sink : rand(0.22, 0.46);
  const nrm = normalAt(x, z, size*0.9);
  // stand mostly upright, but lean with the hillside — bedrock follows the bed
  _q.setFromUnitVectors(_up, nrm.lerp(_up, 1 - (opt.align !== undefined ? opt.align : 0.55)).normalize());
  const spin = new THREE.Quaternion().setFromAxisAngle(_up, rand(0, Math.PI*2));
  _q.multiply(spin);
  const sx = size * rand(0.82, 1.2), sy = size * rand(0.72, 1.15) * (opt.tall || 1), sz = size * rand(0.82, 1.2);
  _p.set(x, h - size*sink*(opt.tall ? 0.5 : 1), z);
  _s.set(sx, sy, sz);
  _m.compose(_p, _q, _s);
  const col = opt.color || 0x968a7c;
  const tint = rand(0.86, 1.12);
  const cc = new THREE.Color(col).multiplyScalar(tint);
  cc.offsetHSL(rand(-0.02,0.02), rand(-0.05,0.04), 0);
  PLACED[variant].push({ m: _m.clone(), c: cc });
  if(size > 0.85) OBSTACLES.push({ x, z, r: Math.max(sx, sz)*0.72 });
}

// --- placement RULES ---------------------------------------------------
// Every rock below is here because the geology puts it here. Nothing is
// scattered uniformly across the island (that was the old look).
function scatterRocks(){
  for(const a of PLACED) a.length = 0;
  OBSTACLES.length = 0;
  srand(778899);

  // (1) SHORELINE — boulders where the coast is ROCKY (thin sand ribbon), none
  //     on the broad landing beach or the surf bay's sand.
  let tries = 0, made = 0;
  while(made < 46 && tries++ < 6000){
    const ang = rand(0, Math.PI*2);
    // walk out from the middle until we cross the waterline at this bearing
    let r = 55, hh;
    for(let k=0;k<90;k++){ hh = terrainBase(Math.cos(ang)*r, Math.sin(ang)*r); if(hh < 0.4) break; r += 1.6; }
    const cx = Math.cos(ang)*r, cz = Math.sin(ang)*r;
    if(sandWidth(cx, cz) > 2.3) continue;              // sandy stretch: leave it clean
    if(fbm2(cx*0.05, cz*0.05, 2) < 0.42) continue;     // clumps, not a necklace
    made++;
    // a headland cluster: one anchor boulder, a few satellites, a wash of chips
    const big = rand(1.5, 3.1);
    placeRock(rand()<0.5?0:2, cx, cz, big, { color:0x8b8378, sink:0.5, align:0.35 });
    for(let k=0;k<3+Math.floor(rand(0,5));k++){
      const a2 = rand(0, Math.PI*2), d2 = rand(1.6, 7.5);
      const x = cx + Math.cos(a2)*d2, z = cz + Math.sin(a2)*d2;
      if(terrainBase(x, z) < -1.6) continue;
      placeRock(rand()<0.6?1:0, x, z, rand(0.5, 1.6), { color:0x8f877b, sink:0.55, align:0.3 });
    }
    for(let k=0;k<7;k++){
      const a2 = rand(0, Math.PI*2), d2 = rand(2, 11);
      const x = cx + Math.cos(a2)*d2, z = cz + Math.sin(a2)*d2;
      if(terrainBase(x, z) < -1.2) continue;
      placeRock(6, x, z, rand(0.18, 0.42), { color:0x9b9285, sink:0.6 });
    }
  }

  // (2) HILL OUTCROPS + CLIFF-BASE TALUS — bedrock breaks out of the steepest
  //     shoulders of the three hills, and its debris fans out downslope.
  const HILLS = [
    { x:26*WS,  z:34*WS,  r:16*WS, n:26, col:0x9a9082 },   // king's hill
    { x:-24*WS, z:-12*WS, r:11*WS, n:15, col:0x968c7e },   // twin A
    { x:-15*WS, z:-5*WS,  r:10*WS, n:13, col:0x968c7e },   // twin B
  ];
  for(const H of HILLS){
    let t2 = 0, n = 0;
    while(n < H.n && t2++ < 4000){
      const a = rand(0, Math.PI*2), d = rand(H.r*0.30, H.r*1.05);
      const x = H.x + Math.cos(a)*d, z = H.z + Math.sin(a)*d;
      const s = slopeAt(x, z), h = terrainH(x, z);
      if(h < 3.2 || s < 0.34) continue;                    // only the steep shoulders
      if(fbm2(x*0.09 + 40, z*0.09 - 20, 2) < 0.46) continue;
      n++;
      // the outcrop: a LEDGE slab plus attendant blocks
      placeRock(4, x, z, rand(1.5, 3.0), { color:H.col, sink:0.42, align:0.8 });
      for(let k=0;k<2+Math.floor(rand(0,4));k++){
        const a2 = rand(0,Math.PI*2), d2 = rand(1.2, 4.2);
        placeRock(rand()<0.5?2:0, x+Math.cos(a2)*d2, z+Math.sin(a2)*d2,
          rand(0.7, 1.9), { color:H.col, sink:0.4, align:0.65 });
      }
      // talus: walk downhill from the outcrop, dropping ever-smaller scree
      let [tx, tz] = [x, z];
      for(let k=0;k<9;k++){
        [tx, tz] = downhill(tx, tz, rand(1.4, 3.0));
        if(terrainH(tx, tz) < 1.6) break;
        for(let j=0;j<2;j++){
          placeRock(5, tx + rand(-2.2,2.2), tz + rand(-2.2,2.2),
            rand(0.22, 0.85) * (1 - k/11), { color:0x8e8578, sink:0.5 });
        }
      }
    }
  }

  // (3) THE CRAGS — tall slabs standing along the hill RIMS and the crater lip,
  //     so no hilltop reads as a bald dome any more.
  const RIMS = [
    { x:26*WS,  z:34*WS,  r:9.6*WS,  n:22, col:0x8f8676, size:[2.2,4.4] },
    { x:-24*WS, z:-12*WS, r:6.6*WS,  n:14, col:0x8a8172, size:[1.7,3.3] },
    { x:-15*WS, z:-5*WS,  r:5.4*WS,  n:11, col:0x8a8172, size:[1.5,2.9] },
    // the crater lip used to carry 18 tall slabs — that spiky crown is GONE.
    // The volcano now gets its drama from mass alone; no rock stands on it.
  ];
  for(const R of RIMS){
    for(let i=0;i<R.n;i++){
      const a = (i/R.n)*Math.PI*2 + rand(-0.14, 0.14);
      const d = R.r * rand(0.86, 1.16);
      const x = R.x + Math.cos(a)*d, z = R.z + Math.sin(a)*d;
      if(fbm2(x*0.11 + 3, z*0.11 + 9, 2) < 0.36) continue;   // broken rim, not a fence
      placeRock(3, x, z, rand(R.size[0], R.size[1]),
        { color:R.col, sink:0.30, align:0.42, tall:rand(1.0, 1.45) });
      for(let k=0;k<2;k++){
        const a2 = rand(0,Math.PI*2), d2 = rand(1.4, 4.0);
        placeRock(rand()<0.5?4:2, x+Math.cos(a2)*d2, z+Math.sin(a2)*d2,
          rand(0.6, 1.7), { color:R.col, sink:0.4, align:0.7 });
      }
    }
  }

  // (4) THE VOLCANO — a basalt boulder field on the flanks, thinning outward,
  //     with bombs flung further out onto the burnt ground.
  {
    let n = 0, t3 = 0;
    // Boulders sit on the SKIRT only, never up the cone, and only the rounded
    // variants (0,1) — a smooth mountain must not be speckled with blocks.
    while(n < 46 && t3++ < 5000){
      const a = rand(0, Math.PI*2), d = rand(25*WS, 40*WS);
      const x = VOLC.x + Math.cos(a)*d, z = VOLC.z + Math.sin(a)*d;
      if(terrainH(x, z) < 2.5) continue;
      const out = sstep(25*WS, 40*WS, d);         // commoner further down
      if(rand() > 0.3 + out*0.7) continue;
      n++;
      const dark = new THREE.Color(0x554a3f).lerp(new THREE.Color(0x7a6e60), out).getHex();
      placeRock(rand()<0.5?0:1, x, z, rand(0.4, 1.3),
        { color:dark, sink:0.44, align:0.6 });
      if(rand() < 0.6) for(let k=0;k<3;k++)
        placeRock(5, x+rand(-3.5,3.5), z+rand(-3.5,3.5), rand(0.2,0.7), { color:dark, sink:0.5 });
    }
  }

  // (5) THE RIDGE SPINE — the old game scattered 12 lone dodecahedra along
  //     z≈-8. Same territory, but now as weathered outcrop clusters ON the
  //     ridge's exposed crest, which is where stone actually surfaces.
  {
    let n = 0, t4 = 0;
    while(n < 16 && t4++ < 3000){
      const x = rand(-52, 52)*WS, z = (-8 + rand(-7, 7))*WS;
      if(terrainH(x, z) < 5.5 || slopeAt(x, z) < 0.22) continue;
      if(pathDist(x, z) < 5) continue;
      // the ridge runs east into the volcano's skirt — keep its outcrops OFF
      // the cone, which must stay clean
      if(Math.hypot(x - VOLC.x, z - VOLC.z) < 34*WS) continue;
      n++;
      placeRock(4, x, z, rand(1.2, 2.6), { color:0x9c9284, sink:0.45, align:0.75 });
      for(let k=0;k<2+Math.floor(rand(0,3));k++){
        const a2 = rand(0,Math.PI*2), d2 = rand(1.2, 4.5);
        placeRock(rand()<0.5?0:5, x+Math.cos(a2)*d2, z+Math.sin(a2)*d2,
          rand(0.35, 1.3), { color:0x958b7d, sink:0.5, align:0.6 });
      }
    }
  }

  // (6) HILLTOP CROWNS — bedrock breaking THROUGH the turf on the flat tops,
  //     so the king's hill and the twins stop reading as bald mud domes. Low,
  //     wide, ground-hugging ledges: they must not block the mead hall's site.
  {
    const CROWNS = [
      { x:26*WS,  z:34*WS,  r:8.2*WS, n:15, col:0x958b7c },
      { x:-24*WS, z:-12*WS, r:5.2*WS, n:9,  col:0x8f8677 },
      { x:-15*WS, z:-5*WS,  r:4.4*WS, n:7,  col:0x8f8677 },
    ];
    for(const C of CROWNS){
      let n = 0, t5 = 0;
      while(n < C.n && t5++ < 2500){
        const a = rand(0, Math.PI*2), d = rand(0.2, 1.0) * C.r;
        const x = C.x + Math.cos(a)*d, z = C.z + Math.sin(a)*d;
        if(fbm2(x*0.14 - 25, z*0.14 + 17, 2) < 0.45) continue;   // in groups
        n++;
        placeRock(4, x, z, rand(0.8, 1.9), { color:C.col, sink:0.62, align:0.92 });
        for(let k=0;k<1+Math.floor(rand(0,3));k++){
          const a2 = rand(0,Math.PI*2), d2 = rand(0.9, 3.2);
          placeRock(rand()<0.5?1:5, x+Math.cos(a2)*d2, z+Math.sin(a2)*d2,
            rand(0.3, 1.0), { color:C.col, sink:0.6, align:0.85 });
        }
      }
    }
  }
}

const rockGroup = new THREE.Group();
scene.add(rockGroup);
function buildRockMeshes(){
  rockGroup.clear();
  let total = 0;
  PLACED.forEach((list, vi) => {
    if(!list.length) return;
    const im = new THREE.InstancedMesh(ROCK_VARIANTS[vi], rockMat, list.length);
    im.castShadow = true; im.receiveShadow = true;
    for(let i=0;i<list.length;i++){ im.setMatrixAt(i, list[i].m); im.setColorAt(i, list[i].c); }
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;
    rockGroup.add(im);
    total += list.length;
  });
  return total;
}

// ======================================================================
// 6. GRASS + WEEDS — real blade geometry (no billboards), instanced, with a
//    world-space wind shader and a camera-distance LOD that shrinks far tufts
//    to nothing. One draw call for the whole island's turf.
// ======================================================================
const uTime = { value: 0 };
const uWind = { value: 0.85 };
const uFar0 = { value: 250 }, uFar1 = { value: 380 };

// a tuft: `blades` tapered, curved strips. aBend = 0 at the root, 1 at the tip.
function makeTuft({ blades=4, segs=2, h=[0.46,0.90], w=0.125, lean=0.35, tipDark=0.55, seed=1 }){
  srand(seed);
  const pos = [], col = [], bend = [], idx = [];
  const cBase = new THREE.Color(0x4f7f3b), cTip = new THREE.Color(0xb7de70);
  const c = new THREE.Color();
  for(let b=0; b<blades; b++){
    const ang = rand(0, Math.PI*2), height = rand(h[0], h[1]);
    const lx = Math.cos(ang)*lean*height, lz = Math.sin(ang)*lean*height;
    const wid = w * rand(0.75, 1.3);
    const perp = [Math.cos(ang+Math.PI/2), Math.sin(ang+Math.PI/2)];
    const start = pos.length/3;
    for(let s=0; s<=segs; s++){
      const t = s/segs;
      const y = height * Math.sin(t*Math.PI*0.5);          // arcs over at the tip
      const px = lx*t*t, pz = lz*t*t;
      const ww = wid * (1 - t*0.88);
      c.copy(cBase).lerp(cTip, Math.pow(t, tipDark));
      for(const sgn of [-1, 1]){
        pos.push(px + perp[0]*ww*sgn, y, pz + perp[1]*ww*sgn);
        col.push(c.r, c.g, c.b);
        bend.push(t*t);                                     // bend grows toward the tip
      }
    }
    for(let s=0; s<segs; s++){
      const a = start + s*2;
      idx.push(a, a+1, a+2,  a+1, a+3, a+2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aBend', new THREE.Float32BufferAttribute(bend, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// a weed: taller olive stems, some carrying a pale seed head
function makeWeed(seed){
  const g = makeTuft({ blades:4, segs:2, h:[0.75,1.30], w:0.055, lean:0.22, tipDark:0.9, seed });
  const col = g.attributes.color;
  const dry = new THREE.Color(0x9fa758), stem = new THREE.Color(0x53703a), c = new THREE.Color();
  for(let i=0;i<col.count;i++){
    c.fromBufferAttribute(col, i);
    const t = clamp(g.attributes.aBend.getX(i), 0, 1);
    c.copy(stem).lerp(dry, Math.pow(t, 0.6));
    col.setXYZ(i, c.r, c.g, c.b);
  }
  return g;
}

function windMaterial(){
  const m = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime; sh.uniforms.uWind = uWind;
    sh.uniforms.uFar0 = uFar0; sh.uniforms.uFar1 = uFar1;
    sh.vertexShader = `
      uniform float uTime; uniform float uWind; uniform float uFar0; uniform float uFar1;
      attribute float aBend;
      float vBend; vec3 vOrigin;
    ` + sh.vertexShader;
    // LOD: shrink tufts to nothing past the fade band (cheap, no CPU work)
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      vec3 transformed = vec3( position );
      #ifdef USE_INSTANCING
        vOrigin = vec3( instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2] );
        float iScale = length( vec3(instanceMatrix[0][0], instanceMatrix[0][1], instanceMatrix[0][2]) );
      #else
        vOrigin = vec3(0.0); float iScale = 1.0;
      #endif
      float dCam = distance( cameraPosition, vOrigin );
      transformed *= 1.0 - smoothstep( uFar0, uFar1, dCam );
      vBend = aBend * iScale;
    `);
    // wind in MODEL space (== world here) so the whole hillside leans together
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float ph = vOrigin.x * 0.085 + vOrigin.z * 0.062;
      float gust = 0.62 + 0.38 * sin( uTime * 0.43 + ph * 0.55 );
      float sway = ( sin( uTime * 1.75 + ph ) * 0.55 + sin( uTime * 3.1 + ph * 1.9 ) * 0.24 ) * uWind * gust;
      mvPosition.x += sway * vBend * 0.55;
      mvPosition.z += sway * vBend * 0.30;
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;
    `);
  };
  return m;
}
const grassMat = windMaterial();

const GRASS_MAX = 52000, WEED_MAX = 7000;
const grassGroup = new THREE.Group();
scene.add(grassGroup);
let grassIM = null, weedIM = null, grassN = 0, weedN = 0;

// how green is this spot? (drives grass density) — a pure placement rule:
// no sand, no bare rock, no basalt, no path, and patchy by noise.
function turfWeight(x, z){
  const h = gridSample(gH, x, z);
  if(h < 2.4 || h > 30) return 0;
  if(gridSample(gSand, x, z) > 0.18) return 0;            // never on the beach
  if(gridSample(gRock, x, z) > 0.34) return 0;            // never on bare rock
  const s = gridSample(gSlope, x, z);
  if(s > 0.78) return 0;                                  // never on a cliff face
  const vd = Math.hypot(x - VOLC.x, z - VOLC.z);
  if(vd < 17*WS) return 0;                                // never on the basalt
  let w = 1;
  w *= 1 - 0.85*sstep(0.40, 0.78, s);                     // thins out as it steepens
  w *= sstep(2.4, 4.2, h) * (1 - sstep(19, 27, h));       // and up near the tops
  w *= sstep(17*WS, 24*WS, vd);                           // fades in off the burnt ground
  w *= 0.30 + 0.70*sstep(0.28, 0.60, fbm2(x*0.036 + 17, z*0.036 - 9, 3));  // MEADOWS, not carpet
  w *= 0.55 + 0.45*sstep(0.35, 0.75, fbm2(x*0.12 - 4, z*0.12 + 6, 2));
  const pd = pathDist(x, z);
  w *= sstep(1.2, 4.0, pd);                               // the path stays trodden bare
  return clamp(w, 0, 1);
}

function scatterTurf(){
  srand(424242);
  const dummy = new THREE.Object3D();
  const gm = [], wm = [], gc = [], wc = [];
  const cc = new THREE.Color();
  const R = TSIZE*0.42;
  // grass grows in CLUMPS, not as an even sprinkle: find a good spot, then
  // crowd several tufts into it. Same instance budget, far denser read.
  for(let i=0; i<170000 && gm.length < GRASS_MAX; i++){
    const cx = rand(-R, R), cz = rand(-R, R);
    const cw = turfWeight(cx, cz);
    if(cw <= 0 || rand() > cw) continue;
    const k = 3 + Math.floor(rand(0, 8) * cw);
    for(let j=0; j<k && gm.length < GRASS_MAX; j++){
      const x = cx + rand(-2.1, 2.1), z = cz + rand(-2.1, 2.1);
      const w = turfWeight(x, z);
      if(w <= 0) continue;
      const h = gridSample(gH, x, z);
      const n = gridNormal(x, z);
      dummy.position.set(x, h - 0.06, z);
      dummy.quaternion.setFromUnitVectors(_up, n.lerp(_up, 0.45).normalize());
      dummy.rotateY(rand(0, Math.PI*2));
      const sc = rand(0.85, 1.45) * (0.75 + 0.25*w);
      dummy.scale.set(sc, sc*rand(0.85, 1.35), sc);
      dummy.updateMatrix();
      gm.push(dummy.matrix.clone());
      // tint: lusher in hollows, drier on the tops
      cc.setHSL(0.24 + rand(-0.035, 0.045), 0.42 + rand(-0.1, 0.16),
                0.42 + rand(-0.09, 0.13) - sstep(9, 20, h)*0.06);
      gc.push(cc.clone());
    }
  }
  for(let i=0; i<110000 && wm.length < WEED_MAX; i++){
    const x = rand(-R, R), z = rand(-R, R);
    let w = turfWeight(x, z);
    if(w <= 0) continue;
    // weeds like the damp: hollows, hill feet, gully bottoms — and rough ground
    const hollow = clamp((gridSample(gH, x, z) -
      (gridSample(gH, x+3, z) + gridSample(gH, x-3, z) +
       gridSample(gH, x, z+3) + gridSample(gH, x, z-3))/4), -3, 3);
    w *= 0.45 + clamp(-hollow*0.9, 0, 1)*1.3;
    w *= 0.5 + 0.5*sstep(0.45, 0.85, fbm2(x*0.07 + 31, z*0.07 + 12, 2));
    if(rand() > w*0.95) continue;
    const h = gridSample(gH, x, z);
    dummy.position.set(x, h - 0.05, z);
    const n = gridNormal(x, z);
    dummy.quaternion.setFromUnitVectors(_up, n.lerp(_up, 0.6).normalize());
    dummy.rotateY(rand(0, Math.PI*2));
    const sc = rand(0.6, 1.25);
    dummy.scale.set(sc, sc*rand(0.8, 1.5), sc);
    dummy.updateMatrix();
    wm.push(dummy.matrix.clone());
    cc.setHSL(0.19 + rand(-0.03, 0.05), 0.34 + rand(-0.1, 0.16), 0.40 + rand(-0.08, 0.14));
    wc.push(cc.clone());
  }

  grassGroup.clear();
  grassN = gm.length; weedN = wm.length;
  grassIM = new THREE.InstancedMesh(makeTuft({ blades:3, segs:2, seed:9 }), grassMat, Math.max(1, grassN));
  weedIM  = new THREE.InstancedMesh(makeWeed(77), grassMat, Math.max(1, weedN));
  for(let i=0;i<grassN;i++){ grassIM.setMatrixAt(i, gm[i]); grassIM.setColorAt(i, gc[i]); }
  for(let i=0;i<weedN;i++){  weedIM.setMatrixAt(i, wm[i]);  weedIM.setColorAt(i, wc[i]); }
  for(const im of [grassIM, weedIM]){
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;
    im.receiveShadow = true;
    grassGroup.add(im);
  }
  applyGrassDensity();
}
function applyGrassDensity(){
  const f = parseFloat(document.getElementById('gdens').value);
  if(grassIM) grassIM.count = Math.floor(grassN * f);
  if(weedIM)  weedIM.count  = Math.floor(weedN  * f);
}

// ======================================================================
// 7. build it all
// ======================================================================
let stats = { verts:0, rocks:0, ms:0 };
function buildAll(){
  const t0 = performance.now();
  makeTerrain();
  scatterRocks();
  stats.rocks = buildRockMeshes();
  // the shrine's egg rock is a solid too — pushed AFTER scatterRocks, which
  // clears the list on every rebuild
  if(typeof TRIG !== 'undefined') OBSTACLES.push({ x:TRIG.x, z:TRIG.z, r:1.3 });
  scatterTurf();
  stats.verts = terrainMesh.geometry.attributes.position.count;
  stats.ms = Math.round(performance.now() - t0);
  renderer.shadowMap.needsUpdate = true;   // one shadow pass per rebuild
  updateStats();
}
function updateStats(){
  document.getElementById('stats').textContent =
    `terrain ${(stats.verts/3/1000).toFixed(0)}k tris · rocks ${stats.rocks}\n` +
    `grass ${(grassIM?grassIM.count:0)} · weeds ${(weedIM?weedIM.count:0)}\n` +
    `built in ${stats.ms} ms · ${fps.toFixed(0)} fps`;
}

const VIEWS = {
  1: { pos:[-118, 96, 168],           tgt:[6, 4, 10] },     // overview
  2: { pos:[26*WS+42, 34, 34*WS+46],  tgt:[26*WS, 12, 34*WS] }, // king's hill
  3: { pos:[-24*WS-40, 30, -12*WS+44],tgt:[-20*WS, 8, -9*WS] }, // twin hills
  4: { pos:[VOLC.x+82, 46, VOLC.z+92],tgt:[VOLC.x, 26, VOLC.z] },// volcano
  5: { pos:[-96, 16, 92],             tgt:[-52, 1, 62] },   // shoreline
  6: { pos:[-40, 0, 26], tgt:[-30, 0, -14], eye:2.4, aim:5.0 },  // ground level, in the meadow
};
function setView(k){
  const v = VIEWS[k]; if(!v) return;
  if(inChamber) exitChamber();       // a view preset always means "the island"
  // 'eye'/'aim' views ride ON the ground — solve their height from the terrain
  // so a preset never ends up buried in a hill or under the sea
  const py = v.eye !== undefined ? terrainH(v.pos[0], v.pos[2]) + v.eye : v.pos[1];
  const ty = v.aim !== undefined ? terrainH(v.tgt[0], v.tgt[2]) + v.aim : v.tgt[1];
  camera.position.set(v.pos[0], py, v.pos[2]);
  controls.target.set(v.tgt[0], ty, v.tgt[2]);
  controls.update();
}
addEventListener('keydown', e => { if(VIEWS[e.key]) setView(e.key); });

// ======================================================================
// 9b. SCREENSHOTS — grab whatever the camera is looking at, right now
//     The PNG is the bare 3-D view at the canvas's full backing-store
//     resolution (devicePixelRatio up to 2); the overlay UI is DOM, so it
//     never appears in the shot.
// ======================================================================
const REV_LABEL = `Terrain Rev ${REV} · built ${BUILT}`;
$('rev').innerHTML = `Terrain Rev <b>${REV}</b> · built ${BUILT}`;

function shotStamp(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
let shotMsgT = 0;
function shotMsg(text, bad){
  const el = $('shotmsg');
  el.textContent = text;
  el.style.color = bad ? '#ffc2b4' : '#b8f0c0';
  clearTimeout(shotMsgT);
  shotMsgT = setTimeout(() => { el.textContent = ''; }, 5000);
}
// render a frame immediately before reading the canvas, so the capture is
// guaranteed to hold THIS camera angle and never comes back blank
// The exported PNG is the WebGL canvas only — the overlay UI is DOM and never
// lands in it. So the rev stamp is PAINTED into the image here; otherwise the
// screenshots actually sent to someone would be the one place the revision
// isn't recorded.
function captureBlob(){
  return new Promise((resolve, reject) => {
    renderer.render(scene, camera);
    const src = renderer.domElement;
    const oc = document.createElement('canvas');
    oc.width = src.width; oc.height = src.height;
    const ctx = oc.getContext('2d');
    ctx.drawImage(src, 0, 0);

    const s = Math.max(13, Math.round(src.height * 0.023));
    ctx.font = `600 ${s}px ui-monospace, Menlo, monospace`;
    ctx.textBaseline = 'alphabetic';
    const label = REV_LABEL;
    const w = ctx.measureText(label).width;
    const pad = Math.round(s * 0.55), x = pad * 2, y = src.height - pad * 2;
    ctx.fillStyle = 'rgba(14,20,26,0.66)';
    ctx.fillRect(x - pad, y - s - pad * 0.6, w + pad * 2, s + pad * 1.5);
    ctx.fillStyle = '#eaf4f8';
    ctx.fillText(label, x, y);

    oc.toBlob(b => b ? resolve(b) : reject(new Error('canvas produced no image')),
      'image/png');
  });
}
function downloadBlob(blob){
  const name = `terrain_rev${REV}_${shotStamp()}.png`;   // the rev is in the filename too
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return name;
}
$('btnSave').addEventListener('click', async () => {
  try { shotMsg('saved ' + downloadBlob(await captureBlob())); }
  catch(e){ shotMsg('save failed: ' + e.message, true); }
});
$('btnCopy').addEventListener('click', async () => {
  // navigator.clipboard exists ONLY in a secure context. localhost counts;
  // a plain-http LAN address (10.0.0.137) does not. Say so and save instead
  // of failing silently.
  if(!(window.isSecureContext && navigator.clipboard && window.ClipboardItem)){
    try {
      shotMsg('clipboard needs https or localhost — saved ' + downloadBlob(await captureBlob()), true);
    } catch(e){ shotMsg('copy unavailable here, and save failed: ' + e.message, true); }
    return;
  }
  try {
    // hand ClipboardItem the PROMISE of a blob, not an awaited one: that keeps
    // the click's user-activation alive across the async toBlob, which Chrome
    // requires for clipboard.write
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': captureBlob() }) ]);
    shotMsg('copied — paste it straight into chat');
  } catch(e){
    try {
      shotMsg('copy failed (' + e.message + ') — saved ' + downloadBlob(await captureBlob()), true);
    } catch(e2){ shotMsg('copy and save both failed: ' + e2.message, true); }
  }
});

// ======================================================================
// 9c. THE GEODE VAULT — the island's secret room
//
//   FLAVOUR: a magical crystal cavern. A drowned geode the size of a hall,
//   hollow under the ridge: amethyst teeth on the ceiling, a still luminous
//   pool, a dais in the middle of the water carrying a slowly turning
//   heart-stone, and ten thousand jewels twinkling in the walls. Deliberately
//   unrealistic — this is the one place on the island that gets to be magic.
//
//   TRIGGER: the pale-purple EGG ROCK on the ridge, at base (12, -10.5) =
//   world (15, -13.1) — the same stone George World already hides there, the
//   one you click three times to wake the sleeper under the island. Here it
//   sits inside a ring of seven standing stones on a glowing rune circle.
//   Click the geode THREE times and the island folds away.
// ======================================================================
const TRIG = { x: 12*WS, z: -10.5*WS };
const CAVE_ORIGIN = new THREE.Vector3(TRIG.x, -260, TRIG.z);   // far below, out of the way
const FLOOR_Y = -17;

const chamber = new THREE.Group();
chamber.position.copy(CAVE_ORIGIN);
chamber.visible = false;
scene.add(chamber);

// the cavern's inner surface, as a pure function of direction — the wall mesh
// and everything stuck to the wall are built from this same call, so jewels
// and stalactites always land exactly ON the rock
function caveFloorY(x, z){
  const r = Math.hypot(x, z);
  return FLOOR_Y + (fbm2(x*0.085 + 21, z*0.085 - 13, 3) - 0.5) * 2.8
       - 2.8 * Math.exp(-((r/11) ** 2));            // the pool's basin
}
function caveSurface(dx, dy, dz){
  const v = new THREE.Vector3(dx, dy, dz).normalize().multiplyScalar(46);
  const n1 = fbm3(v.x*0.055 + 3, v.y*0.055 + 7, v.z*0.055 + 11, 4);
  const n2 = fbm3(v.x*0.17, v.y*0.17, v.z*0.17, 3);
  v.multiplyScalar(0.80 + n1*0.44 + n2*0.10);
  const t = sstep(FLOOR_Y + 9, FLOOR_Y - 3, v.y);   // ease the walls into a floor
  if(t > 0) v.y = lerp(v.y, caveFloorY(v.x, v.z) - 0.7, t);
  return v;
}

const JEWEL_COLS = [0xc86aff, 0x6ad4ff, 0x64ffa8, 0xff6a9c, 0xffd45e, 0xff8a3d, 0xa07bff];
const uCave = { value: 0 };

// gems and runes glow on their own AND twinkle out of phase with each other
function glowMaterial(baseHex, twinkle){
  const m = new THREE.MeshBasicMaterial({ color: baseHex });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uCave = uCave;
    sh.vertexShader = 'varying float vPh;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>', `
      #include <begin_vertex>
      #ifdef USE_INSTANCING
        vPh = instanceMatrix[3][0]*0.83 + instanceMatrix[3][1]*1.27 + instanceMatrix[3][2]*0.61;
      #else
        vPh = position.x*0.7 + position.y*1.1;
      #endif
      `);
    sh.fragmentShader = 'uniform float uCave; varying float vPh;\n' + sh.fragmentShader.replace(
      '#include <dithering_fragment>', `
      float tw = 0.5 + 0.5*sin(uCave*2.1 + vPh);
      gl_FragColor.rgb *= ${twinkle ? '0.45 + 1.05*pow(tw, 3.0)' : '0.85 + 0.30*tw'};
      #include <dithering_fragment>`);
    m.userData.sh = sh;
  };
  return m;
}

function buildChamber(){
  srand(31337);
  const tmpc = new THREE.Color();

  // ---- the rock shell -------------------------------------------------
  {
    const g = new THREE.SphereGeometry(46, 46, 32);
    const p = g.attributes.position, cols = new Float32Array(p.count*3);
    const rockA = new THREE.Color(0x5a4e7d), rockB = new THREE.Color(0x8d74b2);
    const rockC = new THREE.Color(0x342d4a);
    const v = new THREE.Vector3();
    for(let i=0;i<p.count;i++){
      v.fromBufferAttribute(p, i);
      const s = caveSurface(v.x, v.y, v.z);
      p.setXYZ(i, s.x, s.y, s.z);
      const veins = fbm3(s.x*0.10, s.y*0.10, s.z*0.10, 3);
      tmpc.copy(rockC).lerp(rockA, sstep(0.30, 0.62, veins))
          .lerp(rockB, sstep(0.58, 0.85, veins) * 0.9);
      cols[i*3]=tmpc.r; cols[i*3+1]=tmpc.g; cols[i*3+2]=tmpc.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    g.computeVertexNormals();
    chamber.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({
      vertexColors:true, side:THREE.BackSide })));
  }

  // ---- the floor ------------------------------------------------------
  {
    const g = new THREE.CircleGeometry(64, 128);
    g.rotateX(-Math.PI/2);
    const p = g.attributes.position, cols = new Float32Array(p.count*3);
    const fA = new THREE.Color(0x6d5d90), fB = new THREE.Color(0x413861);
    for(let i=0;i<p.count;i++){
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i, caveFloorY(x, z));
      tmpc.copy(fA).lerp(fB, fbm2(x*0.12 + 4, z*0.12 - 8, 3));
      cols[i*3]=tmpc.r; cols[i*3+1]=tmpc.g; cols[i*3+2]=tmpc.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    g.computeVertexNormals();
    chamber.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true })));
  }

  // ---- the pool -------------------------------------------------------
  const poolY = FLOOR_Y - 1.15;
  const poolGeo = new THREE.CircleGeometry(12.6, 84);
  poolGeo.rotateX(-Math.PI/2);
  const poolBase = poolGeo.attributes.position.array.slice();
  const pool = new THREE.Mesh(poolGeo, new THREE.MeshPhongMaterial({
    color:0x1d7fa8, emissive:0x1d6f96, transparent:true, opacity:0.80,
    shininess:120, specular:0xa8f0ff }));
  pool.position.y = poolY;
  chamber.add(pool);

  // ---- stalactites + stalagmites --------------------------------------
  {
    const coneGeo = new THREE.ConeGeometry(1, 1, 7, 3);
    coneGeo.translate(0, -0.5, 0);        // pivot at the wide end
    const matDrip = new THREE.MeshLambertMaterial({ color:0x8a76ad, flatShading:true });
    const tips = [], up = new THREE.Vector3(0,1,0), d = new THREE.Object3D();
    for(let i=0;i<170;i++){              // hanging teeth
      const a = rand(0, Math.PI*2), y = rand(0.18, 0.97), rr = Math.sqrt(1-y*y);
      const s = caveSurface(Math.cos(a)*rr, y, Math.sin(a)*rr);
      const len = rand(2.2, 9.5) * (0.5 + 0.5*y);
      d.position.copy(s); d.scale.set(rand(0.5,1.5), len, rand(0.5,1.5));
      d.rotation.set(rand(-0.13,0.13), rand(0,6.3), rand(-0.13,0.13));
      d.updateMatrix(); tips.push(d.matrix.clone());
    }
    const im = new THREE.InstancedMesh(coneGeo, matDrip, tips.length);
    tips.forEach((m,i)=>im.setMatrixAt(i,m));
    im.instanceMatrix.needsUpdate = true; im.frustumCulled = false;
    chamber.add(im);

    const upGeo = coneGeo.clone(); upGeo.scale(1,-1,1);   // point them up
    const ups = [];
    for(let i=0;i<96;i++){
      const a = rand(0, Math.PI*2), r = rand(15.5, 41);
      const x = Math.cos(a)*r, z = Math.sin(a)*r;
      d.position.set(x, caveFloorY(x,z), z);
      d.scale.set(rand(0.6,1.9), rand(1.8, 7.0), rand(0.6,1.9));
      d.rotation.set(rand(-0.1,0.1), rand(0,6.3), rand(-0.1,0.1));
      d.updateMatrix(); ups.push(d.matrix.clone());
    }
    const im2 = new THREE.InstancedMesh(upGeo, matDrip, ups.length);
    ups.forEach((m,i)=>im2.setMatrixAt(i,m));
    im2.instanceMatrix.needsUpdate = true; im2.frustumCulled = false;
    chamber.add(im2);
  }

  // ---- TEN THOUSAND JEWELS in the walls --------------------------------
  {
    const gemGeo = new THREE.OctahedronGeometry(1, 0);
    const mat = glowMaterial(0xffffff, true);
    const N = 900, d = new THREE.Object3D();
    const im = new THREE.InstancedMesh(gemGeo, mat, N);
    for(let i=0;i<N;i++){
      const a = rand(0, Math.PI*2), y = rand(-0.35, 0.98), rr = Math.sqrt(Math.max(0,1-y*y));
      const s = caveSurface(Math.cos(a)*rr, y, Math.sin(a)*rr);
      s.multiplyScalar(0.985);            // sunk slightly into the rock
      d.position.copy(s);
      d.rotation.set(rand(0,6.3), rand(0,6.3), rand(0,6.3));
      const sc = rand(0.22, 0.85);
      d.scale.set(sc, sc*rand(0.8,1.7), sc);
      d.updateMatrix();
      im.setMatrixAt(i, d.matrix);
      im.setColorAt(i, tmpc.setHex(JEWEL_COLS[Math.floor(rand(0, JEWEL_COLS.length))]));
    }
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;
    chamber.add(im);
  }

  // ---- crystal clusters on the floor -----------------------------------
  {
    const gemGeo = new THREE.OctahedronGeometry(1, 0);
    const mat = glowMaterial(0xffffff, false);
    const list = [], d = new THREE.Object3D();
    for(let c=0;c<26;c++){
      const a = rand(0, Math.PI*2), r = rand(15, 41);
      const cx = Math.cos(a)*r, cz = Math.sin(a)*r;
      const col = JEWEL_COLS[Math.floor(rand(0, JEWEL_COLS.length))];
      for(let k=0;k<4+Math.floor(rand(0,6));k++){
        const ox = cx + rand(-2.6,2.6), oz = cz + rand(-2.6,2.6);
        const hgt = rand(1.6, 5.2);
        d.position.set(ox, caveFloorY(ox,oz) + hgt*0.42, oz);
        d.rotation.set(rand(-0.3,0.3), rand(0,6.3), rand(-0.3,0.3));
        d.scale.set(rand(0.4,0.95), hgt, rand(0.4,0.95));
        d.updateMatrix();
        list.push({ m:d.matrix.clone(), c:col });
      }
    }
    const im = new THREE.InstancedMesh(gemGeo, mat, list.length);
    list.forEach((o,i)=>{ im.setMatrixAt(i,o.m); im.setColorAt(i, tmpc.setHex(o.c)); });
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;
    chamber.add(im);
  }

  // ---- carved pillars, floor to ceiling ---------------------------------
  {
    const stone = new THREE.MeshLambertMaterial({ color:0x6d5c84, flatShading:true });
    const runeMat = glowMaterial(0x9ad9ff, false);
    for(let i=0;i<6;i++){
      const a = (i/6)*Math.PI*2 + 0.4, r = 27;
      const x = Math.cos(a)*r, z = Math.sin(a)*r;
      const fy = caveFloorY(x, z);
      const col = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.5, 44, 9), stone);
      col.position.set(x, fy + 22, z);
      chamber.add(col);
      for(let k=0;k<4;k++){                    // glowing rune bands
        const ring = new THREE.Mesh(new THREE.TorusGeometry(2.3, 0.17, 6, 18), runeMat);
        ring.rotation.x = Math.PI/2;
        ring.position.set(x, fy + 3 + k*3.4, z);
        chamber.add(ring);
      }
    }
  }

  // ---- the dais in the pool + the heart-stone ---------------------------
  const heart = new THREE.Group();
  {
    const stone = new THREE.MeshLambertMaterial({ color:0x7a6791, flatShading:true });
    const baseY = caveFloorY(0,0);
    const d1 = new THREE.Mesh(new THREE.CylinderGeometry(5.0, 5.6, 1.5, 26), stone);
    d1.position.y = baseY + 0.75; chamber.add(d1);
    const d2 = new THREE.Mesh(new THREE.CylinderGeometry(3.9, 4.6, 1.4, 26), stone);
    d2.position.y = baseY + 2.1; chamber.add(d2);
    const runes = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.16, 8, 44),
      glowMaterial(0xffd45e, false));
    runes.rotation.x = Math.PI/2;
    runes.position.y = baseY + 2.85; chamber.add(runes);

    const gem = new THREE.Mesh(new THREE.IcosahedronGeometry(2.0, 0),
      glowMaterial(0xd7a6ff, false));
    heart.add(gem);
    const halo = new THREE.Mesh(new THREE.IcosahedronGeometry(2.9, 0),
      new THREE.MeshBasicMaterial({ color:0x8a5ad6, transparent:true, opacity:0.22,
        side:THREE.BackSide }));
    heart.add(halo);
    const gl = new THREE.PointLight(0xc9a3ff, 3.0, 74, 1.6);
    heart.add(gl);
    heart.position.set(0, baseY + 7.4, 0);
    chamber.add(heart);
  }

  // ---- artifacts on plinths ---------------------------------------------
  {
    const stone = new THREE.MeshLambertMaterial({ color:0x6d5c84, flatShading:true });
    const gold  = new THREE.MeshPhongMaterial({ color:0xe8b23c, emissive:0x4a3208,
      shininess:150, specular:0xfff0c0, flatShading:true });
    const spots = [[-17, 9], [16, 12], [2, -20]];
    const makers = [
      // a chalice
      () => {
        const pts = [];
        for(let i=0;i<=12;i++){ const t=i/12;
          pts.push(new THREE.Vector2(0.15 + 1.5*Math.pow(t,1.7) + 0.25*Math.sin(t*3.2), t*2.6)); }
        return new THREE.Mesh(new THREE.LatheGeometry(pts, 16), gold);
      },
      // a crown
      () => {
        const g = new THREE.Group();
        g.add(new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.20, 8, 22), gold));
        for(let i=0;i<7;i++){
          const a = i/7*Math.PI*2;
          const sp = new THREE.Mesh(new THREE.ConeGeometry(0.24, 1.0, 6), gold);
          sp.position.set(Math.cos(a)*1.25, 0.55, Math.sin(a)*1.25);
          g.add(sp);
          const j = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0),
            glowMaterial(JEWEL_COLS[i % JEWEL_COLS.length], false));
          j.position.set(Math.cos(a)*1.25, 1.15, Math.sin(a)*1.25);
          g.add(j);
        }
        g.rotation.x = Math.PI/2;
        return g;
      },
      // a shard obelisk
      () => {
        const m = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0),
          glowMaterial(0x6ad4ff, false));
        m.scale.set(0.55, 3.0, 0.55);
        return m;
      },
    ];
    spots.forEach(([x, z], i) => {
      const fy = caveFloorY(x, z);
      const pl = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 2.1, 2.6, 12), stone);
      pl.position.set(x, fy + 1.3, z);
      chamber.add(pl);
      const art = makers[i]();
      art.position.set(x, fy + 3.4, z);
      chamber.add(art);
      chamber.userData.spin = chamber.userData.spin || [];
      chamber.userData.spin.push(art);
    });
  }

  // ---- loose gems scattered on the floor ---------------------------------
  {
    const gemGeo = new THREE.OctahedronGeometry(1, 0);
    const mat = glowMaterial(0xffffff, true);
    const list = [], d = new THREE.Object3D();
    for(let i=0;i<160;i++){
      const a = rand(0, Math.PI*2), r = rand(13.2, 34);
      const x = Math.cos(a)*r, z = Math.sin(a)*r;
      d.position.set(x, caveFloorY(x,z) + 0.18, z);
      d.rotation.set(rand(0,6.3), rand(0,6.3), rand(0,6.3));
      const s = rand(0.16, 0.44); d.scale.setScalar(s);
      d.updateMatrix();
      list.push({ m:d.matrix.clone(), c:JEWEL_COLS[Math.floor(rand(0,JEWEL_COLS.length))] });
    }
    const im = new THREE.InstancedMesh(gemGeo, mat, list.length);
    list.forEach((o,i)=>{ im.setMatrixAt(i,o.m); im.setColorAt(i, tmpc.setHex(o.c)); });
    im.instanceMatrix.needsUpdate = true;
    if(im.instanceColor) im.instanceColor.needsUpdate = true;
    im.frustumCulled = false;
    chamber.add(im);
  }

  // ---- glow-caps around the water ----------------------------------------
  {
    const capMat = glowMaterial(0x8affd0, false);
    const stemMat = new THREE.MeshLambertMaterial({ color:0xb9a9cf });
    for(let i=0;i<44;i++){
      const a = rand(0, Math.PI*2), r = rand(12.9, 17.5);
      const x = Math.cos(a)*r, z = Math.sin(a)*r;
      const fy = caveFloorY(x, z), s = rand(0.35, 0.95);
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.09*s, 0.13*s, 1.1*s, 6), stemMat);
      st.position.set(x, fy + 0.55*s, z); chamber.add(st);
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.42*s, 9, 6, 0, Math.PI*2, 0, 1.5), capMat);
      cap.position.set(x, fy + 1.1*s, z); chamber.add(cap);
    }
  }

  // ---- dust motes ---------------------------------------------------------
  {
    const n = 420, pos = new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const a = rand(0,Math.PI*2), r = rand(2, 40);
      pos[i*3] = Math.cos(a)*r; pos[i*3+1] = rand(FLOOR_Y, FLOOR_Y+34); pos[i*3+2] = Math.sin(a)*r;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const motes = new THREE.Points(g, new THREE.PointsMaterial({
      color:0xdcc6ff, size:0.34, transparent:true, opacity:0.75,
      blending:THREE.AdditiveBlending, depthWrite:false }));
    chamber.add(motes);
    chamber.userData.motes = motes;
  }

  // ---- cave lighting -------------------------------------------------------
  // generous fill: without it the rock goes black and the wall jewels read as
  // confetti floating in a void instead of gems set into stone
  chamber.add(new THREE.HemisphereLight(0xa992e2, 0x40355e, 2.0));
  chamber.add(new THREE.AmbientLight(0x6b5c95, 0.95));
  const poolLight = new THREE.PointLight(0x6ae0ff, 3.4, 95, 1.5);
  poolLight.position.set(0, FLOOR_Y + 5.5, 0);
  chamber.add(poolLight);
  [[-24, 10, 0xff9a5e], [22, -16, 0x7affc0], [-6, -28, 0xff6ac0]].forEach(([x,z,c])=>{
    const l = new THREE.PointLight(c, 2.1, 82, 1.6);
    l.position.set(x, caveFloorY(x,z) + 7, z);
    chamber.add(l);
  });

  chamber.userData.pool = pool;
  chamber.userData.poolGeo = poolGeo;
  chamber.userData.poolBase = poolBase;
  chamber.userData.heart = heart;
}
buildChamber();

let geodeMesh = null;
{

// ---- entering and leaving ---------------------------------------------------
let inChamber = false, eggClicks = 0;
const saved = {};
function flash(){
  // a timer, not requestAnimationFrame: rAF is throttled to a crawl whenever
  // the tab is backgrounded, which left the flash sitting over the screen
  const f = $('flash');
  f.style.transition = 'none'; f.style.opacity = '1';
  setTimeout(() => {
    f.style.transition = 'opacity 0.55s ease-out'; f.style.opacity = '0';
  }, 40);
  // hard reset: if the compositor is throttled the transition can stall
  // part-way and leave a violet veil over everything. Never allow that.
  setTimeout(() => { f.style.transition = 'none'; f.style.opacity = '0'; }, 1300);
}
function enterChamber(){
  if(inChamber) return;
  inChamber = true;
  flash();
  saved.camPos = camera.position.clone();
  saved.target = controls.target.clone();
  saved.fog = scene.fog;
  saved.bg = scene.background;
  saved.maxPolar = controls.maxPolarAngle;
  saved.minD = controls.minDistance; saved.maxD = controls.maxDistance;
  saved.sun = sun.intensity; saved.fill = fill.intensity; saved.hemi = hemi.intensity;
  saved.vis = scene.children.map(o => o.visible);

  scene.children.forEach(o => { if(o !== chamber && o.isObject3D && !o.isLight) o.visible = false; });
  sun.intensity = 0; fill.intensity = 0; hemi.intensity = 0;
  chamber.visible = true;
  scene.fog = new THREE.Fog(0x241c3e, 58, 215);
  scene.background = new THREE.Color(0x171227);
  controls.maxPolarAngle = Math.PI;
  controls.minDistance = 2; controls.maxDistance = 96;
  // stand high enough to look OVER the stalagmite field to the dais, rather
  // than arriving with a faceful of spikes
  camera.position.set(CAVE_ORIGIN.x + 20, CAVE_ORIGIN.y + FLOOR_Y + 19, CAVE_ORIGIN.z + 27);
  controls.target.set(CAVE_ORIGIN.x, CAVE_ORIGIN.y + FLOOR_Y + 6, CAVE_ORIGIN.z);
  controls.update();
  $('btnEgg').textContent = '← back to the island';
  shotMsg('the geode opens — welcome to the Geode Vault');
}
function exitChamber(){
  if(!inChamber) return;
  inChamber = false;
  flash();
  scene.children.forEach((o,i) => { if(saved.vis) o.visible = saved.vis[i]; });
  chamber.visible = false;
  sun.intensity = saved.sun; fill.intensity = saved.fill; hemi.intensity = saved.hemi;
  scene.fog = saved.fog; scene.background = saved.bg;
  controls.maxPolarAngle = saved.maxPolar;
  controls.minDistance = saved.minD; controls.maxDistance = saved.maxD;
  camera.position.copy(saved.camPos);
  controls.target.copy(saved.target);
  controls.update();
  eggClicks = 0;
  $('btnEgg').textContent = '✦ Go to Easter Egg Room';
}
$('btnEgg').addEventListener('click', () => inChamber ? exitChamber() : enterChamber());

// ---- the secret trigger: click the egg rock three times ---------------------
{
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    if(!downAt) return;
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
    downAt = null;
    if(moved > 5 || inChamber) return;            // that was an orbit drag
    ndc.x = (e.clientX / innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / innerHeight) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    if(!ray.intersectObject(geodeMesh, false).length) return;
    eggClicks++;
    if(eggClicks === 1) shotMsg('the geode hums under your hand…');
    else if(eggClicks === 2) shotMsg('the geode blazes — once more…');
    else { eggClicks = 0; enterChamber(); }
  });
}

// ======================================================================
// 10. loop
// ======================================================================
let fps = 0, lastT = performance.now(), frames = 0, fpsT = 0;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  uTime.value = t;
  uCave.value = t;

  if(inChamber){
    // the pool breathes, the heart-stone turns, the motes drift
    const u = chamber.userData;
    const pp = u.poolGeo.attributes.position.array, pb = u.poolBase;
    for(let i=0;i<pp.length;i+=3){
      const x = pb[i], z = pb[i+2];
      pp[i+1] = Math.sin(x*0.42 + t*1.5)*0.13 + Math.sin(z*0.55 - t*1.1)*0.10
              + Math.sin((x+z)*0.26 + t*0.7)*0.09;
    }
    u.poolGeo.attributes.position.needsUpdate = true;
    u.poolGeo.computeVertexNormals();
    u.heart.rotation.y = t*0.45;
    u.heart.children[0].rotation.set(t*0.6, t*0.9, 0);
    u.heart.position.y = caveFloorY(0,0) + 7.4 + Math.sin(t*0.9)*0.55;
    u.motes.rotation.y = t*0.035;
    (u.spin||[]).forEach((a,i)=>{ a.rotation.y = t*(0.3 + i*0.12); });
    controls.update();
    renderer.render(scene, camera);
    frames++; fpsT += dt;
    if(fpsT > 0.5){ fps = frames/fpsT; frames = 0; fpsT = 0; updateStats(); }
    return;
  }

  // sea: two crossing swells, flat-shaded like the game's
  const p = wGeo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){
    const x = wBase[i], z = wBase[i+2];
    // swells only near the island; the open sea beyond flattens off, so the
    // repeating wave pattern can't tile the horizon into visible panels
    const fade = 1 - sstep(300, 780, Math.hypot(x, z));
    if(fade <= 0){ p[i+1] = 0; continue; }
    p[i+1] = (Math.sin(x*0.055 + t*1.05)*0.42 + Math.sin(z*0.075 - t*0.85)*0.34
           + Math.sin((x+z)*0.028 + t*0.5)*0.3) * fade;
  }
  wGeo.attributes.position.needsUpdate = true;
  // no computeVertexNormals: the sea is flatShading, so normals come from
  // screen-space derivatives in the shader — recomputing them in JS every
  // frame was pure waste.

  controls.update();
  renderer.render(scene, camera);

  frames++; fpsT += dt;
  if(fpsT > 0.5){ fps = frames/fpsT; frames = 0; fpsT = 0; updateStats(); }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ======================================================================
// 11. the module surface the game lifts
// ======================================================================
window.TERRAIN = {
  REV, BUILT,
  terrainH, terrainBase, terrainDetailFrom, slopeAt, normalAt, sandWidth,
  WS, VOLC, TSIZE, TSEG,
  get obstacles(){ return OBSTACLES; },
  groups: { get terrain(){ return terrainMesh; }, rocks: rockGroup, turf: grassGroup },
  tick(t){ uTime.value = t; },
  rebuild: buildAll,
  renderer, scene, camera, controls,
  // the secret room, for whoever lifts this into the game
  secret: { trigger: TRIG, chamber, enter: () => enterChamber(), exit: () => exitChamber(),
            get inside(){ return inChamber; } },
  // honest frame cost, independent of requestAnimationFrame throttling:
  // render N frames back-to-back and force the GPU to finish each one.
  bench(n = 90){
    const gl = renderer.getContext();
    renderer.render(scene, camera);
    gl.finish();
    const t0 = performance.now();
    for(let i=0;i<n;i++){ uTime.value += 0.016; renderer.render(scene, camera); }
    gl.finish();
    const ms = (performance.now() - t0) / n;
    return { msPerFrame: +ms.toFixed(2), fps: +(1000/ms).toFixed(1),
             calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
  },
};

setView(1);
buildAll();
$('busy').style.display = 'none';
animate();
</script>
