<!DOCTYPE html>
<!-- ======================================================================
     ARMY STUDY — simple soldiery, for George World's imperial arc.
     Filed 2026-08-31, Doug's batch. Three scenes on the canonical
     armature (menu):
     · ARCHERY — three archers with real bows loose staggered volleys
       at straw butts; arrows fly true arcs and stick where they land.
     · THE DUEL — two swordsmen circle, trade slash and parry in a
       choreographed exchange, until one is beaten to a knee (bloodless
       defeat — a slump, not gore) ... then they both reset and go again.
     · THE MARCH — a column of four spearmen in step, up the ground and
       back, wheeling at each end.
     Swords, bows, spears and shields are props parented to the HAND
     BONES — the clips move the arms, the weapons ride along.
     ====================================================================== -->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

// ==========================================================================
//  makeRig — the canonical Vita; pal.helm adds a steel cap.
// ==========================================================================
function makeRig(pal){
  const B = {};
  function bone(name, parentName, x, y, z){
    const b = new THREE.Bone();
    b.name = name; b.position.set(x, y, z);
    if(parentName) B[parentName].add(b);
    B[name] = b; return b;
  }
  const rootBone = bone('mixamorigHips', null, 0, 0.62, 0);
  bone('mixamorigSpine',  'mixamorigHips',  0, 0.10, 0);
  bone('mixamorigSpine1', 'mixamorigSpine', 0, 0.12, 0);
  bone('mixamorigSpine2', 'mixamorigSpine1',0, 0.12, 0);
  bone('mixamorigNeck',   'mixamorigSpine2',0, 0.12, 0);
  bone('mixamorigHead',   'mixamorigNeck',  0, 0.10, 0);
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    bone(`mixamorig${S}Shoulder`, 'mixamorigSpine2', s*0.16, 0.06, 0);
    bone(`mixamorig${S}Arm`,      `mixamorig${S}Shoulder`, s*0.14, -0.02, 0);
    bone(`mixamorig${S}ForeArm`,  `mixamorig${S}Arm`, s*0.09, -0.20, 0);
    bone(`mixamorig${S}Hand`,     `mixamorig${S}ForeArm`, s*0.05, -0.18, 0);
    bone(`mixamorig${S}UpLeg`,    'mixamorigHips', s*0.155, -0.06, 0);
    bone(`mixamorig${S}Leg`,      `mixamorig${S}UpLeg`, 0, -0.26, 0);
    bone(`mixamorig${S}Foot`,     `mixamorig${S}Leg`, 0, -0.26, 0);
    bone(`mixamorig${S}ToeBase`,  `mixamorig${S}Foot`, 0, -0.04, 0.12);
  }
  const allBones = Object.values(B);
  const skeleton = new THREE.Skeleton(allBones);
  const boneIndex = {};
  allBones.forEach((b, i) => boneIndex[b.name] = i);
  const g0 = new THREE.Group();
  g0.add(rootBone);
  rootBone.updateMatrixWorld(true);
  const bWorld = {};
  for(const b of allBones)
    bWorld[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld);
  g0.remove(rootBone);
  function partGeo(geoFn, boneName, colorHex){
    let g = geoFn();
    if(g.index) g = g.toNonIndexed();
    const p = bWorld[boneName];
    g.translate(p.x, p.y, p.z);
    const n = g.attributes.position.count;
    const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
    for(let i = 0; i < n; i++){ si[i*4] = boneIndex[boneName]; sw[i*4] = 1; }
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
    const col = new Float32Array(n*3);
    const c = new THREE.Color(colorHex);
    for(let i = 0; i < n; i++){ col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return g;
  }
  const skinDk = new THREE.Color(pal.skin).offsetHSL(0, 0.02, -0.05).getHex();
  const shirtDk = new THREE.Color(pal.shirt).offsetHSL(0, 0, -0.07).getHex();
  const parts = [];
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.23, 20, 14);
    g.scale(1.34, 0.8, 1.0); g.translate(0, -0.02, 0); return g; }, 'mixamorigHips', pal.pants));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.215, 0.245, 0.16, 18);
    g.translate(0, 0.02, 0); return g; }, 'mixamorigSpine', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.26, 20, 16);
    g.scale(1.22, 0.98, 0.9); g.translate(0, 0.04, 0.01); return g; }, 'mixamorigSpine1', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.1, 0.115, 0.44, 14);
    g.rotateZ(Math.PI/2); g.translate(0, 0.05, 0); return g; }, 'mixamorigSpine2', pal.shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.085, 0.105, 0.14, 14);
    g.translate(0, 0.05, 0); return g; }, 'mixamorigNeck', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.40, 28, 20);
    g.scale(1.04, 1.0, 0.97); g.translate(0, 0.24, 0); return g; }, 'mixamorigHead', pal.skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.065, 12, 9);
    g.translate(0, 0.17, 0.4); return g; }, 'mixamorigHead', pal.skin));
  for(const s of [-1, 1]){
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.07, 10, 8);
      g.scale(0.7, 1, 0.9); g.translate(s*0.41, 0.2, 0.02); return g; }, 'mixamorigHead', skinDk));
  }
  if(pal.helm){
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.42, 22, 12, 0, Math.PI*2, 0, Math.PI*0.46);
      g.scale(1.05, 1.05, 1.0); g.translate(0, 0.26, 0); return g; }, 'mixamorigHead', 0x9aa2ac));
    parts.push(partGeo(() => { const g = new THREE.BoxGeometry(0.07, 0.3, 0.05);
      g.translate(0, 0.28, 0.42); return g; }, 'mixamorigHead', 0x9aa2ac));   // nose guard
  } else {
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.41, 24, 14, 0, Math.PI*2, 0, Math.PI*0.42);
      g.scale(1.05, 1.0, 0.99); g.translate(0, 0.26, 0); return g; }, 'mixamorigHead', pal.hair));
  }
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.082, 0.1, 6, 12);
      g.rotateZ(s*0.35); g.translate(s*0.075, -0.05, 0); return g; }, `mixamorig${S}Arm`, pal.shirt));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.074, 0.1, 6, 12);
      g.rotateZ(-s*0.1); g.translate(s*0.1, -0.17, 0); return g; }, `mixamorig${S}Arm`, shirtDk));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.066, 0.13, 6, 12);
      g.translate(s*0.028, -0.09, 0); return g; }, `mixamorig${S}ForeArm`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.092, 14, 10);
      g.scale(0.9, 1.1, 1); g.translate(0, -0.05, 0); return g; }, `mixamorig${S}Hand`, pal.skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.135, 0.15, 8, 14);
      g.scale(1, 1, 1.08); g.rotateZ(s*0.06); g.translate(s*0.012, -0.13, 0.01); return g; }, `mixamorig${S}UpLeg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.085, 0.15, 8, 12);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}Leg`, pal.pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.125, 14, 10);
      g.scale(1, 0.72, 1.2); g.translate(0, -0.015, 0.02); return g; }, `mixamorig${S}Foot`, 0x4a3a28));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.095, 12, 9);
      g.scale(1, 0.62, 1.05); g.translate(0, -0.035, 0.055); return g; }, `mixamorig${S}ToeBase`, 0x4a3a28));
  }
  const mesh = new THREE.SkinnedMesh(mergeGeometries(parts, false),
    new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.75 }));
  mesh.castShadow = true;
  mesh.frustumCulled = false;
  mesh.add(rootBone);
  mesh.bind(skeleton);
  const root = new THREE.Group();
  root.add(mesh);
  scene.add(root);
  return { root, mesh, B, mixer: new THREE.AnimationMixer(mesh), action:null };
}
function play(rig, clip, opts = {}){
  if(rig.action) rig.action.stop();
  rig.action = rig.mixer.clipAction(clip);
  if(opts.once){ rig.action.setLoop(THREE.LoopOnce); rig.action.clampWhenFinished = true; }
  if(opts.at !== undefined) rig.action.time = opts.at;
  rig.action.reset().play();
  if(opts.at !== undefined) rig.action.time = opts.at;
}

// ---------- weapons (parented to hand bones) -------------------------------
const steelM = new THREE.MeshStandardMaterial({ color:0xb8c0c8, roughness:0.35, metalness:0.6 });
const woodM = new THREE.MeshLambertMaterial({ color:0x6a4a2a, flatShading:true });
function makeSword(){
  const g = new THREE.Group();
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.62, 0.012), steelM);
  blade.position.y = -0.42; blade.castShadow = true; g.add(blade);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.08, 4), steelM);
  tip.rotation.x = Math.PI; tip.rotation.y = Math.PI/4; tip.position.y = -0.77; g.add(tip);
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 0.03), woodM);
  guard.position.y = -0.11; g.add(guard);
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.12, 8), woodM);
  grip.position.y = -0.04; g.add(grip);
  return g;
}
function makeShield(){
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.03, 18), woodM);
  s.rotation.x = Math.PI/2;
  const boss = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), steelM);
  boss.position.z = 0.03; s.add(boss);
  s.castShadow = true;
  return s;
}
function makeBow(){
  const g = new THREE.Group();
  const limb = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.016, 6, 20, Math.PI*0.9), woodM);
  limb.rotation.z = Math.PI/2 - Math.PI*0.45;
  limb.castShadow = true;
  g.add(limb);
  // the string — straight chord between the limb tips
  const a = Math.PI/2 - Math.PI*0.45, b2 = a + Math.PI*0.9;
  const p1 = new THREE.Vector3(Math.cos(a)*0.42, Math.sin(a)*0.42, 0);
  const p2 = new THREE.Vector3(Math.cos(b2)*0.42, Math.sin(b2)*0.42, 0);
  const sg = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  g.add(new THREE.Line(sg, new THREE.LineBasicMaterial({ color:0x2a2018 })));
  return g;
}
function makeSpear(){
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 1.9, 8), woodM);
  shaft.castShadow = true; g.add(shaft);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.16, 6), steelM);
  head.position.y = 1.0; g.add(head);
  return g;
}

function quatTrack(bn, times, eulers){
  const vals = [];
  for(const e of eulers){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    vals.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.QuaternionKeyframeTrack(bn + '.quaternion', times, vals);
}

    [[0,0,0],[0.02,-0.85,0],[0.02,-0.9,-0.05],[0.02,-0.9,-0.05],[0.02,-0.8,0],[0,0,0]]),
  quatTrack('mixamorigHead', [0, 1.0, 1.4, 2.0, 2.15, 3.2],
    [[0,0,0],[0,0.75,0],[-0.06,0.8,0],[-0.06,0.8,0],[0,0.7,0],[0,0,0]]),
]);
// the march: brisk walk, spear shouldered on the right, left arm swings
const marchClip = new THREE.AnimationClip('march', 1.3, [
  quatTrack('mixamorigLeftUpLeg', [0, 0.325, 0.65, 0.975, 1.3],
    [[0.6,0,0],[0,0,0],[-0.6,0,0],[0,0,0],[0.6,0,0]]),
  quatTrack('mixamorigRightUpLeg', [0, 0.325, 0.65, 0.975, 1.3],
    [[-0.6,0,0],[0,0,0],[0.6,0,0],[0,0,0],[-0.6,0,0]]),
  quatTrack('mixamorigLeftLeg', [0, 0.325, 0.65, 0.975, 1.3],
    [[0,0,0],[0.6,0,0],[0,0,0],[0.05,0,0],[0,0,0]]),
  quatTrack('mixamorigRightLeg', [0, 0.325, 0.65, 0.975, 1.3],
    [[0,0,0],[0.05,0,0],[0,0,0],[0.6,0,0],[0,0,0]]),
  quatTrack('mixamorigLeftArm', [0, 0.325, 0.65, 0.975, 1.3],
    [[-0.6,0,0.3],[0,0,0.3],[0.6,0,0.3],[0,0,0.3],[-0.6,0,0.3]]),
  quatTrack('mixamorigRightArm', [0, 1.3], [[-0.25,0,-0.5],[-0.25,0,-0.5]]),   // holds the spear
  quatTrack('mixamorigRightForeArm', [0, 1.3], [[-1.2,0,0],[-1.2,0,0]]),
  quatTrack('mixamorigSpine', [0, 0.65, 1.3], [[0.03,0,0],[0.03,0,0],[0.03,0,0]]),
  new THREE.VectorKeyframeTrack('mixamorigHips.position', [0, 0.325, 0.65, 0.975, 1.3],
    [0,0.62,0, 0,0.665,0, 0,0.62,0, 0,0.665,0, 0,0.62,0]),
]);

// ==========================================================================
//  THE CAST — three archers, two duelists, four marchers. One pool of
//  rigs re-dressed per scene (weapons toggled on the hand bones).
// ==========================================================================
const PALS = [
  { shirt:0x8a5a3c, pants:0x4c5666, skin:0xeab98f, hair:0x54402e },
  { shirt:0x5a7a4c, pants:0x3c3a30, skin:0xd8a878, hair:0x2e2620 },
  { shirt:0x6a6a8a, pants:0x4c5666, skin:0xf2c299, hair:0x8a5a28 },
  { shirt:0x8a4c4c, pants:0x3c3a30, skin:0xeab98f, hair:0x54402e, helm:true },
  { shirt:0x4c6a8a, pants:0x4c5666, skin:0xd8a878, hair:0x2e2620, helm:true },
  { shirt:0x7a6a4c, pants:0x3c3a30, skin:0xf2c299, hair:0x2e2620, helm:true },
];
const rigs = PALS.map(makeRig);
// weapons live on the hand bones, toggled per scene
for(const r of rigs){
  r.sword = makeSword(); r.sword.visible = false;
  r.B.mixamorigRightHand.add(r.sword);
  r.shield = makeShield(); r.shield.visible = false;
  r.shield.position.set(0.06, -0.12, 0.02);
  r.shield.rotation.y = Math.PI/2;
  r.B.mixamorigLeftForeArm.add(r.shield);
  r.bow = makeBow(); r.bow.visible = false;
  r.bow.rotation.z = Math.PI/2;
  r.B.mixamorigLeftHand.add(r.bow);
  r.spear = makeSpear(); r.spear.visible = false;
  r.spear.position.set(0, -0.05, 0.05);
  r.B.mixamorigRightHand.add(r.spear);
}

// straw butts for the archery range
const butts = [];
{
  const strawM = new THREE.MeshLambertMaterial({ color:0xc8a84c, flatShading:true });
  for(const x of [-1.4, 0, 1.4]){
    const b = new THREE.Group();
    const bale = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.4, 14), strawM);
    bale.rotation.x = Math.PI/2;
    bale.position.y = 1.0;
    bale.castShadow = true;
    b.add(bale);
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g2 = cv.getContext('2d');
    for(const [r2, col] of [[60,'#e8e4d8'],[44,'#c03a2a'],[28,'#e8e4d8'],[14,'#c03a2a']]){
      g2.fillStyle = col; g2.beginPath(); g2.arc(64, 64, r2, 0, Math.PI*2); g2.fill();
    }
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const face = new THREE.Mesh(new THREE.CircleGeometry(0.48, 20),
      new THREE.MeshLambertMaterial({ map:tex }));
    face.position.set(0, 1.0, 0.21);
    b.add(face);
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 1.1, 6), woodM);
    legL.position.set(-0.3, 0.5, -0.1); legL.rotation.z = 0.2; b.add(legL);
    const legR = legL.clone(); legR.position.x = 0.3; legR.rotation.z = -0.2; b.add(legR);
    b.position.set(x, 0, -5.5);
    scene.add(b);
    butts.push(b);
  }
}
// arrows — a pool with real arcs
const arrows = [];
{
  const am = new THREE.MeshLambertMaterial({ color:0x7a5a34 });
  for(let i = 0; i < 12; i++){
    const a = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.5, 5), am);
    shaft.rotation.x = Math.PI/2;
    a.add(shaft);
    const fl = new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.06, 4),
      new THREE.MeshLambertMaterial({ color:0xd8d8d0 }));
    fl.rotation.x = Math.PI/2; fl.position.z = -0.24;
    a.add(fl);
    a.visible = false;
    scene.add(a);
    arrows.push({ m:a, vel:new THREE.Vector3(), live:false, stuck:0 });
  }
}
function loose(from, target){
  const a = arrows.find(x => !x.live && x.stuck <= 0); if(!a) return;
  a.m.position.copy(from);
  const d = target.clone().sub(from);
  const tFlight = 0.9;
  a.vel.set(d.x/tFlight, d.y/tFlight + 4.9*tFlight*0.5, d.z/tFlight);
  a.live = true; a.m.visible = true;
}

// ==========================================================================
//  SCENES
// ==========================================================================
let mode = 'archery';
let phT = 0;
document.getElementById('scene').addEventListener('change', e => {
  mode = e.target.value; phT = 0; enter();
});
function dress(){
  for(const r of rigs){
    r.sword.visible = r.shield.visible = r.bow.visible = r.spear.visible = false;
    r.root.visible = false;
    r.root.rotation.set(0, 0, 0);
  }
}
function enter(){
  dress();
  for(const a of arrows){ a.live = false; a.stuck = 0; a.m.visible = false; }
  for(const b of butts) b.visible = mode === 'archery';
  if(mode === 'archery'){
    [0, 1, 2].forEach((i, k) => {
      const r = rigs[i];
      r.root.visible = true; r.bow.visible = true;
      r.root.position.set(-1.4 + k*1.4, 0, 2.2);
      r.root.rotation.y = Math.PI;             // facing the butts at -z
      play(r, drawClip, { at: k*0.5 });        // staggered volley
      r.loosed = false;
    });
  } else if(mode === 'duel'){
    const [d1, d2] = [rigs[3], rigs[4]];
    for(const [r, x, ry] of [[d1, -0.72, Math.PI/2], [d2, 0.72, -Math.PI/2]]){
      r.root.visible = true; r.sword.visible = true; r.shield.visible = true;
      r.root.position.set(x, 0, 0);
      r.root.rotation.y = ry;
    }
    play(d1, guardClip); play(d2, guardClip);
  } else {
    [2, 3, 4, 5].forEach((i, k) => {
      const r = rigs[i];
      r.root.visible = true; r.spear.visible = true;
      play(r, marchClip, { at: 0 });           // perfectly in step
      r.colIndex = k;
    });
  }
}
enter();

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT += dt;

  if(mode === 'archery'){
    // each archer looses at their clip's 2.0s mark, then the clip loops
    [0, 1, 2].forEach(i => {
      const r = rigs[i];
      const ct = r.action.time;
      if(ct > 2.0 && ct < 2.1 && !r.loosed){
        r.loosed = true;
        const from = new THREE.Vector3();
        r.B.mixamorigLeftHand.getWorldPosition(from);
        const targ = butts[i].position.clone().add(new THREE.Vector3((Math.random()-0.5)*0.5, 1.0 + (Math.random()-0.5)*0.4, 0.2));
        loose(from, targ);
      }
      if(ct < 1.0) r.loosed = false;
    });
    for(const a of arrows){
      if(a.live){
        a.vel.y -= 9.8*dt*0.5;                 // half-g reads better at this scale
        a.m.position.addScaledVector(a.vel, dt);
        a.m.lookAt(a.m.position.clone().add(a.vel));
        if(a.m.position.z < -5.28 || a.m.position.y < 0.02){
          a.live = false; a.stuck = 4;         // thunk — stick where it landed
        }
      } else if(a.stuck > 0){
        a.stuck -= dt;
        if(a.stuck <= 0) a.m.visible = false;
      }
    }
  } else if(mode === 'duel'){
    // the exchange: A slashes / B parries, then B slashes / A parries,
    // twice around — then A lands it and B takes the defeat, resets.
    const [d1, d2] = [rigs[3], rigs[4]];
    const f = phT % 14;
    const beat = (who, at, atk) => {
      if(f > at && f - dt <= at) play(who, atk ? slashClip : parryClip, {once:true});
    };
    beat(d1, 1.0, true);  beat(d2, 1.05, false);
    beat(d2, 3.0, true);  beat(d1, 3.05, false);
    beat(d1, 5.0, true);  beat(d2, 5.05, false);
    beat(d2, 7.0, true);  beat(d1, 7.05, false);
    if(f > 9.0 && f - dt <= 9.0){ play(d1, slashClip, {once:true}); play(d2, defeatClip, {once:true}); }
    if(f > 12.6 && f - dt <= 12.6){ play(d1, guardClip); play(d2, guardClip); }   // and again
    // circling footwork between the beats
    const circ = Math.sin(t*0.9)*0.12;
    d1.root.position.z = circ; d2.root.position.z = -circ;
  } else {
    // the march: a column of four, out and back, wheeling at each end
    const L = 5.2, period = 2*L/1.15;
    [2, 3, 4, 5].forEach(i => {
      const r = rigs[i];
      const k = r.colIndex;
      const s = ((t*1.15 + (period/2)*10 - k*0.8) % (2*L));
      const fwd = s < L;
      const along = fwd ? s : 2*L - s;
      r.root.position.set(along - L/2 - 1.2, 0, -0.8 + k*0.001);
      r.root.position.z = -0.9 + ((k%2)*0.0);   // single file
      r.root.rotation.y = fwd ? Math.PI/2 : -Math.PI/2;
    });
  }

  for(const r of rigs) if(r.root.visible) r.mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// stage remote-control: #set=<selectId>:<value>[,...] · #click=<data-m>
{
  const _h = new URLSearchParams(location.hash.slice(1));
  const _s = _h.get('set');
  if(_s) for(const pair of _s.split(',')){
    const [id, val] = pair.split(':');
    const el = document.getElementById(id);
    if(el){ el.value = val; el.dispatchEvent(new Event('change')); }
  }
  const _c = _h.get('click');
  if(_c){ const b = document.querySelector('[data-m="' + _c + '"]'); if(b) b.click(); }
}
</script>
