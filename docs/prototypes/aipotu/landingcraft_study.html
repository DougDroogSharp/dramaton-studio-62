     canonical armature. The run: she comes in through the swell

function swellY(x, z, t){
  return Math.sin(x*0.3 + t*0.9)*0.08 + Math.sin(z*0.4 - t*0.7 + 1)*0.07;
}

function makeSoldier(shirt){
  const B = {};
  function bone(name, parentName, x, y, z){
    const b = new THREE.Bone();
    b.name = name; b.position.set(x, y, z);
    if(parentName) B[parentName].add(b);
    B[name] = b; return b;
  }
  const rootBone = bone('mixamorigHips', null, 0, 0.62, 0);
  bone('mixamorigSpine',  'mixamorigHips',  0, 0.10, 0);
  bone('mixamorigSpine1', 'mixamorigSpine', 0, 0.12, 0);
  bone('mixamorigSpine2', 'mixamorigSpine1',0, 0.12, 0);
  bone('mixamorigNeck',   'mixamorigSpine2',0, 0.12, 0);
  bone('mixamorigHead',   'mixamorigNeck',  0, 0.10, 0);
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    bone(`mixamorig${S}Shoulder`, 'mixamorigSpine2', s*0.16, 0.06, 0);
    bone(`mixamorig${S}Arm`,      `mixamorig${S}Shoulder`, s*0.14, -0.02, 0);
    bone(`mixamorig${S}ForeArm`,  `mixamorig${S}Arm`, s*0.09, -0.20, 0);
    bone(`mixamorig${S}Hand`,     `mixamorig${S}ForeArm`, s*0.05, -0.18, 0);
    bone(`mixamorig${S}UpLeg`,    'mixamorigHips', s*0.155, -0.06, 0);
    bone(`mixamorig${S}Leg`,      `mixamorig${S}UpLeg`, 0, -0.26, 0);
    bone(`mixamorig${S}Foot`,     `mixamorig${S}Leg`, 0, -0.26, 0);
    bone(`mixamorig${S}ToeBase`,  `mixamorig${S}Foot`, 0, -0.04, 0.12);
  }
  const allBones = Object.values(B);
  const skeleton = new THREE.Skeleton(allBones);
  const boneIndex = {};
  allBones.forEach((b, i) => boneIndex[b.name] = i);
  const tmp = new THREE.Group();
  tmp.add(rootBone);
  rootBone.updateMatrixWorld(true);
  const bWorld = {};
  for(const b of allBones)
    bWorld[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld);
  tmp.remove(rootBone);
  function partGeo(geoFn, boneName, colorHex){
    let g = geoFn();
    if(g.index) g = g.toNonIndexed();
    const p = bWorld[boneName];
    g.translate(p.x, p.y, p.z);
    const n = g.attributes.position.count;
    const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
    for(let i = 0; i < n; i++){ si[i*4] = boneIndex[boneName]; sw[i*4] = 1; }
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
    const col = new Float32Array(n*3);
    const c = new THREE.Color(colorHex);
    for(let i = 0; i < n; i++){ col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return g;
  }
  const pants = 0x4a4a3a, skin = 0xe0ba92;
  const parts = [];
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.23, 12, 8);
    g.scale(1.34, 0.8, 1.0); g.translate(0, -0.02, 0); return g; }, 'mixamorigHips', pants));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.215, 0.245, 0.16, 10);
    g.translate(0, 0.02, 0); return g; }, 'mixamorigSpine', shirt));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.26, 12, 9);
    g.scale(1.22, 0.98, 0.9); g.translate(0, 0.04, 0.01); return g; }, 'mixamorigSpine1', shirt));
  parts.push(partGeo(() => { const g = new THREE.CylinderGeometry(0.1, 0.115, 0.44, 8);
    g.rotateZ(Math.PI/2); g.translate(0, 0.05, 0); return g; }, 'mixamorigSpine2', shirt));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.38, 14, 10);
    g.translate(0, 0.24, 0); return g; }, 'mixamorigHead', skin));
  parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.41, 14, 8, 0, Math.PI*2, 0, Math.PI*0.5);
    g.translate(0, 0.26, 0); return g; }, 'mixamorigHead', 0x5a6254));
  for(const [S, s] of [['Left', 1], ['Right', -1]]){
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.08, 0.22, 4, 6);
      g.rotateZ(s*0.25); g.translate(s*0.07, -0.1, 0); return g; }, `mixamorig${S}Arm`, shirt));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.065, 0.13, 4, 6);
      g.translate(s*0.028, -0.09, 0); return g; }, `mixamorig${S}ForeArm`, skin));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.085, 8, 6);
      g.translate(0, -0.05, 0); return g; }, `mixamorig${S}Hand`, skin));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.13, 0.15, 5, 8);
      g.translate(0, -0.13, 0.01); return g; }, `mixamorig${S}UpLeg`, pants));
    parts.push(partGeo(() => { const g = new THREE.CapsuleGeometry(0.082, 0.15, 5, 7);
      g.translate(0, -0.12, 0); return g; }, `mixamorig${S}Leg`, pants));
    parts.push(partGeo(() => { const g = new THREE.SphereGeometry(0.12, 9, 6);
      g.scale(1, 0.7, 1.25); g.translate(0, -0.02, 0.03); return g; }, `mixamorig${S}Foot`, 0x3a3228));
  }
  const mesh = new THREE.SkinnedMesh(mergeGeometries(parts, false),
    new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.75 }));
  mesh.castShadow = true;
  mesh.frustumCulled = false;
  mesh.add(rootBone);
  mesh.bind(skeleton);
  const root = new THREE.Group();
  root.add(mesh);
  scene.add(root);
  return { root, B, mixer: new THREE.AnimationMixer(mesh), action:null };
}
function quatTrack(bn, times, eulers){
  const vals = [];
  for(const e of eulers){
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0], e[1], e[2]));
    vals.push(q.x, q.y, q.z, q.w);
  }
  return new THREE.QuaternionKeyframeTrack(bn + '.quaternion', times, vals);
}

function play(S, clip, once){
  if(S.action) S.action.stop();
  S.action = S.mixer.clipAction(clip);
  if(once){ S.action.setLoop(THREE.LoopOnce); S.action.clampWhenFinished = true; }
  S.action.reset().play();
}
// the simplified GARAND — stock, barrel, front sight — riding the right hand

// wake + dust puffs
function puffTex(c1){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 4, 32, 32, 30);
  rg.addColorStop(0, c1); rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const puffs = [];
{
  const pm = new THREE.SpriteMaterial({ map:puffTex('rgba(255,255,255,0.8)'), transparent:true, depthWrite:false });
  for(let i = 0; i < 30; i++){
    const s = new THREE.Sprite(pm.clone());
    s.visible = false;
    scene.add(s);
    puffs.push({ m:s, age:9 });
  }
}
function puff(pos, size){
  const p = puffs.find(x => x.age > 1.2); if(!p) return;
  p.age = 0;
  p.m.position.copy(pos);
  p.m.scale.setScalar(size);
  p.baseSize = size;
  p.m.visible = true;
}

// ---------- the assault loop (32s) -----------------------------------------
// 0–8 the run in · 8–9 beaching · 9–10.2 RAMP DOWN · 10.2–18 the run-out,
// staggered · 18–23 the line holds · 23–26 re-embark (fade trot back) ·
// 26–29 ramp up, back off · 29–32 come round for another pass
let phT = 0;
const BEACHED_Z = 3.6;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  phT = (phT + dt) % 32;
  const f = phT;

  // sea
  {
    const pos = sea.geometry.attributes.position;
    for(let i = 0; i < pos.count; i++){
      const x = seaPos0[i*3], z = seaPos0[i*3+2];
      pos.setY(i, swellY(x, z, t)*clamp(1 - (z - 12)/6, 0, 1));
    }
    pos.needsUpdate = true;
    sea.geometry.computeVertexNormals();
  }

  // ------ the craft ------
  let craftZ, craftY, pitch = 0;
  if(f < 8){                                  // the run in
    const p = smooth(f/8);
    craftZ = lerp(-22, BEACHED_Z, p);
    craftY = swellY(0, craftZ, t)*0.8;
    pitch = Math.sin(t*1.4)*0.03;
    if(Math.random() < 0.4) puff(new THREE.Vector3(CRAFT.position.x + (Math.random() - 0.5)*1.6, 0.15, craftZ + 2.6), 0.5);
  } else if(f < 26){                          // beached
    craftZ = BEACHED_Z;
    craftY = 0.12;
    pitch = -0.045;                           // nose up the sand
  } else if(f < 29){                          // backing off
    const p = smooth((f - 26)/3);
    craftZ = lerp(BEACHED_Z, -8, p);
    craftY = lerp(0.12, swellY(0, craftZ, t)*0.8, p);
    if(Math.random() < 0.4) puff(new THREE.Vector3(CRAFT.position.x + (Math.random() - 0.5)*1.4, 0.15, craftZ - 2.6), 0.45);
  } else {                                    // circling for the next pass
    const p = (f - 29)/3;
    craftZ = lerp(-8, -22, smooth(p));
    craftY = swellY(0, craftZ, t)*0.8;
  }
  CRAFT.position.set(0, craftY, craftZ);
  CRAFT.rotation.x = pitch;
  // the beaching jolt
  if(f > 8 && f - dt <= 8){
    for(let i = 0; i < 6; i++)
      puff(new THREE.Vector3((Math.random() - 0.5)*2.4, 0.15, BEACHED_Z + 2.8), 0.7);
  }
  // ramp: up (–1.35 ≈ closed) … down flat onto the sand (+0.55)
  let rampA;
  if(f < 9) rampA = -1.35;
  else if(f < 10.2){
    const k = (f - 9)/1.2;
    rampA = lerp(-1.35, 0.55, k*k);           // gravity slam
    if(k > 0.96 && (f - dt - 9)/1.2 <= 0.96)
      for(let i = 0; i < 4; i++)
        puff(new THREE.Vector3((Math.random() - 0.5)*1.8, 0.2, BEACHED_Z + 3.6), 0.6);
  }
  else if(f < 26) rampA = 0.55;
  else rampA = lerp(0.55, -1.35, smooth(clamp((f - 26)/1.5, 0, 1)));
  ramp.rotation.x = rampA;

  // ------ the squad ------
  squad.forEach((S, i) => {
    const out = 10.2 + i*0.85;                // this soldier's go-time
    const wellW = new THREE.Vector3().copy(WELL[i]).applyMatrix4(CRAFT.matrixWorld);
    if(f < out){                              // braced in the well deck
      S.root.visible = true;
      S.root.position.copy(wellW);
      S.root.rotation.set(0, 0, 0);
      if(!S.state || S.state !== 'idle'){ play(S, idleClip); S.state = 'idle'; }
    } else if(f < 23){                        // OUT — down the ramp, up the beach
      const k = clamp((f - out)/3.6, 0, 1);
      if(S.state !== 'run' && k < 1){ play(S, runClip); S.state = 'run'; }
      if(k < 0.28){                           // down the ramp
        const p = k/0.28;
        const rampTop = new THREE.Vector3(WELL[i].x*0.6, 0.55, 3.2).applyMatrix4(CRAFT.matrixWorld);
        const rampFoot = new THREE.Vector3(WELL[i].x*0.6, 0.06, BEACHED_Z + 3.9);
        S.root.position.lerpVectors(rampTop, rampFoot, p);
        S.root.rotation.y = 0;
        if(p > 0.85 && Math.random() < 0.3) puff(S.root.position.clone().setY(0.12), 0.35);
      } else if(k < 1){                       // fan out up the sand
        const p = smooth((k - 0.28)/0.72);
        const foot = new THREE.Vector3(WELL[i].x*0.6, 0.06, BEACHED_Z + 3.9);
        S.root.position.lerpVectors(foot, LINE[i], p);
        S.root.rotation.y = Math.atan2(LINE[i].x - foot.x, LINE[i].z - foot.z);
        if(Math.random() < 0.15) puff(S.root.position.clone().setY(0.12), 0.3);
      } else {                                // take a knee, rifle UP, face inland
        S.root.position.copy(LINE[i]);
        S.root.rotation.y = lerp(S.root.rotation.y, 0, dt*5);
        if(S.state !== 'kneel'){ play(S, kneelClip, true); S.state = 'kneel'; }
      }
      // the rifle levels off as they settle into the aim
      S.rifle.rotation.x = lerp(S.rifle.rotation.x, S.state === 'kneel' ? -1.5 : -0.35, dt*5);
    } else if(f < 26){                        // re-embark (trot back)
      const p = smooth((f - 23)/3);
      if(S.state !== 'run2'){ play(S, runClip); S.state = 'run2'; }
      S.rifle.rotation.x = lerp(S.rifle.rotation.x, -0.35, dt*5);
      const foot = new THREE.Vector3(WELL[i].x*0.6, 0.06, BEACHED_Z + 3.9);
      const back = p < 0.75
        ? new THREE.Vector3().lerpVectors(LINE[i], foot, p/0.75)
        : new THREE.Vector3().lerpVectors(foot, wellW, (p - 0.75)/0.25);
      S.root.position.copy(back);
      S.root.rotation.y = Math.PI + Math.atan2(LINE[i].x - foot.x, LINE[i].z - foot.z)*(1 - p);
    } else {                                  // aboard for the ride out
      S.root.position.copy(wellW);
      S.root.rotation.set(0, 0, 0);
      if(S.state !== 'idle2'){ play(S, idleClip); S.state = 'idle2'; }
    }
    S.mixer.update(dt);
  });
  if(f < 0.1) squad.forEach(S => S.state = null);

  // puff pool
  for(const p of puffs){
    p.age += dt;
    const k = clamp(p.age/1.2, 0, 1);
    p.m.scale.setScalar((p.baseSize || 0.4)*(1 + k*2));
    p.m.material.opacity = (1 - k)*0.6;
    if(k >= 1) p.m.visible = false;
  }

  controls.target.lerp(new THREE.Vector3(CRAFT.position.x, 1, clamp(CRAFT.position.z + 3, -6, 10)), dt*2);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
