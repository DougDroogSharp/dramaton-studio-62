function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;

const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => t*t*(3-2*t);

function quadBase(bodyGeoFn, bodyMat, o = {}){
  const Q = { g: new THREE.Group() };
  Q.body = new THREE.Group();
  Q.body.position.y = o.bodyY || 0.5;
  Q.g.add(Q.body);
  const body = bodyGeoFn();
  body.castShadow = true;
  Q.body.add(body);
  Q.head = new THREE.Group();
  Q.head.position.set(0, o.headY || 0.15, o.headZ || 0.45);
  Q.body.add(Q.head);
  Q.legs = [];
  for(const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]){
    const leg = new THREE.Group();
    leg.position.set(sx*(o.legX || 0.16), -(o.bodyY || 0.5) + (o.legTop || 0.42), sz*(o.legZ || 0.3));
    // the JOINT — a haunch/shoulder blend sphere rooting the limb into the body
    const joint = new THREE.Mesh(new THREE.SphereGeometry((o.legR || 0.045)*(sz < 0 ? 2.6 : 2.2), 12, 9), bodyMat);
    joint.scale.set(0.9, 1.25, 1.1);
    joint.position.copy(leg.position);
    joint.position.y += 0.02;
    joint.castShadow = true;
    Q.body.add(joint);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry((o.legR || 0.045), (o.legTop || 0.42)*0.9, 5, 10), bodyMat);
    shin.position.y = -(o.legTop || 0.42)/2;
    shin.castShadow = true;
    leg.add(shin);
    Q.body.add(leg);
    Q.legs.push(leg);
  }
  scene.add(Q.g);
  return Q;
}
function trotLegs(Q, t, sp = 1, amp = 0.5){
  const ph = t*9*sp;
  Q.legs[0].rotation.x = Math.sin(ph)*amp;
  Q.legs[3].rotation.x = Math.sin(ph)*amp;
  Q.legs[1].rotation.x = -Math.sin(ph)*amp;
  Q.legs[2].rotation.x = -Math.sin(ph)*amp;
}
function stillQ(Q, dt){
  for(const l of Q.legs) l.rotation.x = lerp(l.rotation.x, 0, dt*6);
}

// ---------- goats ----------------------------------------------------------
function makeGoat(col){
  const m = new THREE.MeshLambertMaterial({ color:col });
  const G = quadBase(() => {
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.21, 0.46, 8, 14), m);
    b.rotation.x = Math.PI/2;
    b.scale.set(1.12, 0.95, 1);
    return b;
  }, m, { bodyY:0.52, legTop:0.36, legX:0.17, legZ:0.3, legR:0.04, headZ:0.5, headY:0.2 });
  // the NECK — a real bridge from chest to skull
  const neck = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.24, 6, 10), m);
  neck.rotation.x = -0.75;
  neck.position.set(0, 0.13, 0.42);
  neck.castShadow = true;
  G.body.add(neck);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 11), m);
  skull.scale.set(0.9, 1.0, 1.25);
  skull.position.z = 0.08; skull.castShadow = true; G.head.add(skull);
  const snout = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.12, 5, 9), m);
  snout.rotation.x = Math.PI/2 + 0.25;
  snout.position.set(0, -0.05, 0.26); snout.castShadow = true; G.head.add(snout);
  const hornM = new THREE.MeshLambertMaterial({ color:0x8a8072, flatShading:true });
  for(const s of [-1, 1]){
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.24, 5), hornM);
    horn.position.set(s*0.07, 0.17, 0.02);
    horn.rotation.x = -0.7; horn.rotation.z = s*0.3;
    G.head.add(horn);
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), m);
    ear.scale.set(0.42, 0.55, 1.1);
    ear.position.set(s*0.13, 0.05, 0.02);
    ear.rotation.z = s*0.9;
    G.head.add(ear);
  }
  const beard = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.14, 5),
    new THREE.MeshLambertMaterial({ color:0xd8d2c4, flatShading:true }));
  beard.rotation.x = Math.PI;
  beard.position.set(0, -0.16, 0.28);
  G.head.add(beard);
  const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.11, 5, 8), m);
  tail.position.set(0, 0.2, -0.45);
  tail.rotation.x = 0.6;
  tail.castShadow = true;
  G.body.add(tail);
  G.tail = tail;
  return G;
}

// ---------- sheep ----------------------------------------------------------
function makeSheep(){
  const wool = new THREE.MeshLambertMaterial({ color:0xf2ede0, flatShading:true });  // lumpy = fleece
  const skin = new THREE.MeshLambertMaterial({ color:0xe8c2b0 });
  const S = quadBase(() => {
    const grp = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 9), wool);
    grp.scale.set(1, 0.85, 1.25);
    return grp;
  }, skin, { bodyY:0.5, legTop:0.32, legX:0.15, legZ:0.24, legR:0.038, headZ:0.48, headY:0.12 });
  S.wool = S.body.children[0];
  // fleece tufts over each leg root, so the legs grow OUT of the wool
  for(const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]){
    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), wool);
    tuft.position.set(sx*0.15, -0.2, sz*0.24);
    tuft.castShadow = true;
    S.body.add(tuft);
  }
  // wool neck bridging into the head
  const neckWool = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.16, 6, 9), wool);
  neckWool.rotation.x = -0.85;
  neckWool.position.set(0, 0.05, 0.4);
  neckWool.castShadow = true;
  S.body.add(neckWool);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), skin);
  skull.scale.z = 1.35; skull.castShadow = true; S.head.add(skull);
  const topknot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), wool);
  topknot.position.set(0, 0.11, -0.02);
  S.head.add(topknot);
  S.topknot = topknot;
  for(const s of [-1, 1]){
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.06, 9, 7), skin);
    ear.scale.set(0.45, 0.5, 1.15);
    ear.position.set(s*0.12, 0.03, 0);
    ear.rotation.z = s*1.1;
    S.head.add(ear);
  }
  S.coat = 1;                                 // 1 woolly … 0 sheared
  return S;
}

function makeChicken(){

  const C = { g: new THREE.Group() };

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), white);
  body.scale.set(0.9, 0.9, 1.2); body.castShadow = true; C.body.add(body);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.12, 5), white);
  tail.rotation.x = -1.0; tail.position.set(0, 0.06, -0.13); C.body.add(tail);
  C.head = new THREE.Group(); C.head.position.set(0, 0.1, 0.1); C.body.add(C.head);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.035, 0.12, 6), white);
  neck.position.y = 0.05; C.head.add(neck);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.05, 7, 5), white);

  const comb = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.045, 0.06),
    new THREE.MeshLambertMaterial({ color:0xd83a2a }));
  comb.position.y = 0.18; C.head.add(comb);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.05, 4),
    new THREE.MeshLambertMaterial({ color:0xe8a83c }));
  beak.rotation.x = Math.PI/2; beak.position.set(0, 0.13, 0.06); C.head.add(beak);

}

// ---------- the loop -------------------------------------------------------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  // ------ goats: graze / rock-hop (goat 0) / headbutt duel (goats 1+2) ------
  {
    const G = goats[0];                        // the rock king
    const f = t % 16;
    if(f < 5){                                 // graze near the rock
      G.g.position.set(ROCK.x + 1.8, 0, ROCK.z + 1.4);
      G.g.rotation.y = 2.2;
      G.head.rotation.x = 0.55 + Math.sin(t*2.2)*0.15;   // cropping
      stillQ(G, dt);
    } else if(f < 6){                          // THE HOP — up onto the boulder
      const p = smooth(f - 5);
      G.g.position.lerpVectors(new THREE.Vector3(ROCK.x + 1.8, 0, ROCK.z + 1.4),
        new THREE.Vector3(ROCK.x, 0.92, ROCK.z), p);
      G.g.position.y += Math.sin(p*Math.PI)*0.55;
      G.g.rotation.y = lerp(2.2, 3.6, p);
      G.head.rotation.x = -0.2;
      for(const l of G.legs) l.rotation.x = p < 0.5 ? -0.7 : 0.5;
    } else if(f < 12){                         // king of the boulder
      G.g.position.set(ROCK.x, 0.92, ROCK.z);
      G.head.rotation.x = -0.15;
      G.head.rotation.y = Math.sin(t*0.8)*0.5; // surveying the realm
      G.tail.rotation.z = Math.sin(t*7)*0.3;
      stillQ(G, dt);
    } else if(f < 13){                         // hop down
      const p = smooth(f - 12);
      G.g.position.lerpVectors(new THREE.Vector3(ROCK.x, 0.92, ROCK.z),
        new THREE.Vector3(ROCK.x + 1.2, 0, ROCK.z + 1.2), p);
      G.g.position.y += Math.sin(p*Math.PI)*0.35;
    } else {
      G.g.position.set(ROCK.x + 1.2, 0, ROCK.z + 1.2);
      G.head.rotation.x = 0.55 + Math.sin(t*2.2)*0.15;
    }
  }
  {
    // the duel: back off … CHARGE … clonk … shake … graze
    const [g1, g2] = [goats[1], goats[2]];
    const f = t % 20;
    const C1 = new THREE.Vector3(-1.2, 0, 2.8), C2 = new THREE.Vector3(1.2, 0, 2.8);
    g1.g.rotation.y = Math.PI/2; g2.g.rotation.y = -Math.PI/2;
    if(f < 8){                                 // grazing side by side
      g1.g.position.lerp(new THREE.Vector3(-0.7, 0, 2.8), dt*2);
      g2.g.position.lerp(new THREE.Vector3(0.7, 0, 2.8), dt*2);
      g1.head.rotation.x = 0.55 + Math.sin(t*2.0)*0.15;
      g2.head.rotation.x = 0.55 + Math.sin(t*2.4 + 1)*0.15;
      stillQ(g1, dt); stillQ(g2, dt);
    } else if(f < 10.5){                       // the back-off (something was said)
      const p = smooth((f - 8)/2.5);
      g1.g.position.lerpVectors(new THREE.Vector3(-0.7, 0, 2.8), C1, p);
      g2.g.position.lerpVectors(new THREE.Vector3(0.7, 0, 2.8), C2, p);
      g1.head.rotation.x = -0.3; g2.head.rotation.x = -0.3;
      trotLegs(g1, t, 0.6, 0.3); trotLegs(g2, t, 0.6, 0.3);
    } else if(f < 11.1){                       // THE CHARGE
      const p = (f - 10.5)/0.6;
      g1.g.position.lerpVectors(C1, new THREE.Vector3(-0.24, 0, 2.8), p);
      g2.g.position.lerpVectors(C2, new THREE.Vector3(0.24, 0, 2.8), p);
      g1.head.rotation.x = -0.75; g2.head.rotation.x = -0.75;   // heads down
      trotLegs(g1, t, 2.2, 0.6); trotLegs(g2, t, 2.2, 0.6);
    } else if(f < 12.4){                       // CLONK — the recoil
      const k = clamp((f - 11.1)/0.4, 0, 1);
      g1.g.position.x = -0.24 - smooth(k)*0.25;
      g2.g.position.x = 0.24 + smooth(k)*0.25;
      g1.head.rotation.x = -0.75 + k*0.4;
      g2.head.rotation.x = -0.75 + k*0.4;
      g1.body.rotation.x = -k*0.12; g2.body.rotation.x = -k*0.12;
    } else {                                   // shake it off, wander back
      g1.body.rotation.x = lerp(g1.body.rotation.x, 0, dt*5);
      g2.body.rotation.x = lerp(g2.body.rotation.x, 0, dt*5);
      g1.head.rotation.z = Math.sin(t*9)*0.18*Math.max(0, 1 - (f - 12.4));
      g2.head.rotation.z = Math.sin(t*9 + 1)*0.18*Math.max(0, 1 - (f - 12.4));
      g1.head.rotation.x = lerp(g1.head.rotation.x, 0.5, dt*3);
      g2.head.rotation.x = lerp(g2.head.rotation.x, 0.5, dt*3);
      stillQ(g1, dt); stillQ(g2, dt);
    }
  }

  // ------ sheep: the flock + THE SHEARING (sheep 0 takes the turn) ------
  {
    const f = t % 34;
    const S = sheep[0];
    for(const [i, sh] of sheep.entries()){
      if(i === 0 && f >= 4 && f < 20) continue;       // it's being sheared
      sh.g.position.lerp(sh.home, dt*1.5);
      sh.g.rotation.y = Math.sin(sh.ph + t*0.15)*1.2;
      sh.head.rotation.x = 0.5 + Math.sin(t*1.8 + sh.ph)*0.18;   // graze graze
      stillQ(sh, dt);
      // wool regrows slowly on anyone sheared
      sh.coat = clamp(sh.coat + dt/60, 0.25, 1);
      sh.wool.scale.set(lerp(0.5, 1, sh.coat), lerp(0.45, 0.85, sh.coat), lerp(0.7, 1.25, sh.coat));
      sh.topknot.scale.setScalar(lerp(0.4, 1, sh.coat));
    }
    if(f < 4){                                 // led to the stool
      const p = smooth(f/4);
      S.g.position.lerpVectors(S.home, new THREE.Vector3(STOOL.x, 0.3, STOOL.z), p);
      S.g.rotation.y = Math.atan2(STOOL.x - S.home.x, STOOL.z - S.home.z);
      trotLegs(S, t, 0.7, 0.35);
    } else if(f < 16){                         // THE SHEARING
      S.g.position.set(STOOL.x, 0.3, STOOL.z);
      S.g.rotation.y = 0;
      stillQ(S, dt);
      S.head.rotation.x = 0.2 + Math.sin(t*1.2)*0.05;  // resigned
      const k = (f - 4)/12;
      S.coat = 1 - k*0.75;
      S.wool.scale.set(lerp(0.5, 1, S.coat), lerp(0.45, 0.85, S.coat), lerp(0.7, 1.25, S.coat));
      S.topknot.scale.setScalar(lerp(0.4, 1, S.coat));
      // the shearer works down the flank
      shearer.hips.rotation.x = 0.45;
      shearer.arms[1].rotation.x = -1.1 + Math.sin(t*9)*0.18;   // the clippers buzz
      shearer.arms[1].rotation.z = -0.3 + Math.sin(k*Math.PI)*0.3;
      shearer.arms[0].rotation.x = -0.8;       // steadying hand
      // wool puffs drop onto the pile at the thirds
      const stage = Math.floor(k*4);
      if(stage > wooled && wooled < woolPile.length){
        woolPile[wooled].visible = true;
        wooled++;
      }
    } else if(f < 20){                         // the pink trot back
      const p = smooth((f - 16)/4);
      S.g.position.lerpVectors(new THREE.Vector3(STOOL.x, 0.3, STOOL.z), S.home, p);
      S.g.rotation.y = Math.atan2(S.home.x - STOOL.x, S.home.z - STOOL.z);
      trotLegs(S, t, 1.3, 0.5);                // a bit skittish without the coat
      shearer.hips.rotation.x = lerp(shearer.hips.rotation.x, 0, dt*4);
      shearer.arms[0].rotation.x = lerp(shearer.arms[0].rotation.x, 0, dt*4);
      shearer.arms[1].rotation.x = lerp(shearer.arms[1].rotation.x, 0, dt*4);
    } else {
      // between shearings the pile gets collected for the spinning wheel
      if(f > 30 && wooled > 0){
        woolPile.forEach(p2 => p2.visible = false);
        wooled = 0;
      }
      shearer.hips.rotation.x = lerp(shearer.hips.rotation.x, 0, dt*4);
    }
    // rotate whose turn it is
    if(f + dt >= 34) sheep.push(sheep.shift());
  }

  // ------ chickens: peck, flap-dash, dust bath, scatter ------
  const goatCharging = (t % 20) > 10.5 && (t % 20) < 11.4;
  for(const [i, C] of chickens.entries()){
    const f = (t*0.5 + C.ph) % 8;
    if(goatCharging){                          // SCATTER, squawking
      const away = C.g.position.clone().sub(new THREE.Vector3(0, 0, 2.8)).setY(0).normalize();
      C.g.position.addScaledVector(away, dt*2.4);
      C.wings[0].rotation.z = Math.sin(t*30)*0.9;
      C.wings[1].rotation.z = -Math.sin(t*30)*0.9;
      C.head.rotation.x = -0.3;
      C.body.position.y = 0.16 + Math.abs(Math.sin(t*18))*0.06;
    } else if(f < 3){                          // peck peck peck
      C.g.position.lerp(C.home, dt*1.2);
      C.head.rotation.x = (Math.sin(t*7 + C.ph) > 0.2 ? 0.9 : 0.1);
      C.wings[0].rotation.z = lerp(C.wings[0].rotation.z, 0, dt*6);
      C.wings[1].rotation.z = lerp(C.wings[1].rotation.z, 0, dt*6);
      C.body.position.y = 0.16;
      C.g.rotation.y += Math.sin(t*0.9 + C.ph)*dt*0.8;
    } else if(f < 4){                          // the flap-dash to a new spot
      C.g.position.x += Math.sin(C.ph*3)*dt*1.4;
      C.g.position.z += Math.cos(C.ph*2)*dt*1.4;
      C.wings[0].rotation.z = Math.sin(t*22)*0.8;
      C.wings[1].rotation.z = -Math.sin(t*22)*0.8;
    } else if(i === 0 && f < 6.5){             // the dust bath (one at a time)
      C.g.position.lerp(new THREE.Vector3(3.4, 0, 2.6), dt*2);
      C.body.rotation.z = Math.sin(t*6)*0.5;   // the happy wallow
      C.body.position.y = 0.1;
      C.wings[0].rotation.z = Math.sin(t*13)*0.6;
      C.wings[1].rotation.z = -Math.sin(t*13)*0.6;
    } else {
      C.body.rotation.z = lerp(C.body.rotation.z, 0, dt*5);
      C.body.position.y = 0.16;
      C.head.rotation.x = (Math.sin(t*7 + C.ph) > 0.2 ? 0.9 : 0.1);
    }
  }

  // ------ the donkey: the patient loop ------
  {
    const a = t*0.14;
    const R = 6.2;
    donkey.g.position.set(Math.sin(a)*R, 0, Math.cos(a)*R*0.8);
    donkey.g.rotation.y = Math.atan2(Math.cos(a)*R, -Math.sin(a)*R*0.8);
    trotLegs(donkey, t, 0.45, 0.35);           // the plod
    donkey.ears[0].rotation.x = Math.sin(t*1.7)*0.2;
    donkey.ears[1].rotation.x = Math.sin(t*2.3 + 1)*0.2;
    donkey.tail.rotation.z = Math.sin(t*2.8)*0.35;
    donkey.head.rotation.x = 0.12 + Math.sin(t*0.9)*0.06;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
