<!DOCTYPE html>
<!-- ======================================================================
     VOLCANO STUDY — the eruption, for George World.
     Filed 2026-08-31. Standalone: nothing here touches georgeworld.html.
     Three.js VENDORED locally (vendor/three, r160) — same importmap as the
     game so the eruption machinery can drop into the island's volcano.

     Doug's brief: animate the volcano ERUPTING — a GOUT of lava, SMOKE
     and ROCKS — and LAVA OOZING down one side, slowly… slowly…
     HARDENING. The flow is the heart of it: a tongue of lava that
     advances downslope segment by segment, each one living its whole
     life on camera — blinding orange → deep red → crusted crimson →
     dark basalt that STAYS as new permanent rock.
     ====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volcano Study</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#dfd8cc; }
  #chip {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(26,20,16,0.8); color:#f2ece0;
    font:13px/1.5 system-ui, sans-serif;
    padding:10px 14px; border-radius:10px; user-select:none;
    backdrop-filter: blur(4px);
  }
  #chip b { font-size:14px; }
  #chip .hint { opacity:0.7; }
  #chip button {
    margin:5px 5px 0 0; padding:4px 10px; border:0; border-radius:7px;
    background:#a8442a; color:#fff; font:12px system-ui; cursor:pointer;
  }
  #chip button:hover { background:#c2543a; }
  #chip button.on { background:#ff8c3a; color:#241206; font-weight:700; }
</style>
</head>
<body>
<div id="chip">
  <b>🌋 Volcano Study</b> — the eruption, v1<br>
  <span class="hint">drag to orbit · scroll to zoom</span><br>
  <button data-m="erupt">ERUPT</button><button data-m="calm">Let it sleep</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 79797979;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;

// ---------- renderer / scene ---------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xddd6c8), 80, 420);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.3, 900);
camera.position.set(16, 11, 24);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 90;
controls.maxPolarAngle = 1.52;

// ---------- sky + light ---------------------------------------------------
{
  const geo = new THREE.SphereGeometry(420, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xf0e9d6), zenith = new THREE.Color(0x7fb0d8),
        below = new THREE.Color(0xd6cfc0), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/420;
    c.copy(h >= 0 ? horizon.clone().lerp(zenith, Math.pow(h, 0.6)) : below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xdce8f0, 0xa89878, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d4, 2.0);
sun.position.set(40, 42, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;  sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 140;
sun.shadow.bias = -0.0005;
scene.add(sun);

// ---------- ground ---------------------------------------------------------
{
  const g = new THREE.Mesh(new THREE.CircleGeometry(400, 48),
    new THREE.MeshLambertMaterial({ color:0xc7bd85 }));
  g.rotation.x = -Math.PI/2;
  g.receiveShadow = true;
  scene.add(g);
}

// ==========================================================================
//  THE MOUNTAIN — a lathe cone with a bitten crater and rocky shoulders.
// ==========================================================================
const VOLC_H = 9.5, VOLC_R = 10.5, CRATER_R = 2.1;
function slopeY(r){   // height of the flank at radius r (crater lip at CRATER_R)
  const f = clamp((r - CRATER_R) / (VOLC_R - CRATER_R), 0, 1);
  return VOLC_H * (1 - Math.pow(f, 1.35)) * 0.92 + (r < CRATER_R ? -1.2 * (1 - r/CRATER_R) : 0);
}
{
  const pts = [];
  for(let i = 0; i <= 26; i++){
    const f = i / 26;
    const r = CRATER_R * 0.35 + f * (VOLC_R - CRATER_R * 0.35);
    pts.push(new THREE.Vector2(r, slopeY(r) + (i > 1 && i < 24 ? rand(-0.18, 0.18) : 0)));
  }
  const geo = new THREE.LatheGeometry(pts, 36);
  const pos = geo.attributes.position, col = [];
  const rock = new THREE.Color(0x5c5148), rockDk = new THREE.Color(0x453c34),
        ash = new THREE.Color(0x37302a), c = new THREE.Color();
  for(let i = 0; i < pos.count; i++){
    const y = pos.getY(i);
    c.copy(rock).lerp(rockDk, rand(0, 1)).lerp(ash, clamp(y / VOLC_H, 0, 1) * 0.55);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true, flatShading:true }));
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  // the crater pool: a dark disc that glows when she wakes
  window.__pool = new THREE.Mesh(new THREE.CircleGeometry(CRATER_R*0.8, 20),
    new THREE.MeshBasicMaterial({ color:0x1c1410 }));
  window.__pool.rotation.x = -Math.PI/2;
  window.__pool.position.y = slopeY(0) + 0.35;
  scene.add(window.__pool);
}
const craterLipY = slopeY(CRATER_R);
const glow = new THREE.PointLight(0xff5a1e, 0, 26);
glow.position.set(0, craterLipY + 1.5, 0);
scene.add(glow);

// ==========================================================================
//  THE LAVA FLOW — a tongue of segments walking down ONE flank. Each
//  segment is born blinding orange at the advancing front, then spends a
//  long lifetime hardening in place: orange → red → crusted crimson →
//  matte basalt, which STAYS. New land, made on camera.
// ==========================================================================
const FLOW_DIR = 0.52;          // the chosen flank (radians around the cone)
const FLOW_N = 26;
const flowSegs = [];
{
  for(let i = 0; i < FLOW_N; i++){
    const f = i / (FLOW_N - 1);
    const r = CRATER_R * 0.9 + f * (VOLC_R * 1.18 - CRATER_R * 0.9);
    const a = FLOW_DIR + Math.sin(f * 5.2) * 0.09 + f * 0.14;   // a lazy meander
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const y = Math.max(slopeY(r), 0.06);
    const w = 0.55 + f * 0.75;                                   // the tongue widens
    const m = new THREE.Mesh(new THREE.SphereGeometry(w, 10, 8),
      new THREE.MeshStandardMaterial({ color:0x2a201a, roughness:0.9,
        emissive:0x000000, emissiveIntensity:1 }));
    m.scale.set(1, 0.28, 1.25);
    m.position.set(x, y + 0.1, z);
    m.rotation.y = -a;
    m.visible = false;
    m.castShadow = true;
    scene.add(m);
    flowSegs.push({ m, born: -1 });
  }
}
const C_FRESH = new THREE.Color(0xffa826), C_RED = new THREE.Color(0xd8330f),
      C_CRUST = new THREE.Color(0x6e1408), C_BASALT = new THREE.Color(0x2b2420);
function flowTint(age){
  // the SLOW hardening: 0-6s blinding, →18s red, →40s crusting, →75s stone
  const c = new THREE.Color();
  if(age < 6) c.copy(C_FRESH);
  else if(age < 18) c.copy(C_FRESH).lerp(C_RED, (age - 6) / 12);
  else if(age < 40) c.copy(C_RED).lerp(C_CRUST, (age - 18) / 22);
  else c.copy(C_CRUST).lerp(C_BASALT, clamp((age - 40) / 35, 0, 1));
  return c;
}

// ---------- the GOUT: fountain droplets ------------------------------------
const drops = [];
{
  const geo = new THREE.SphereGeometry(0.16, 6, 5);
  for(let i = 0; i < 90; i++){
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:0xffa826 }));
    m.visible = false;
    scene.add(m);
    drops.push({ m, t: 99, vx:0, vy:0, vz:0 });
  }
}
// ---------- the BOMBS: arcing rocks ----------------------------------------
const bombs = [];
{
  for(let i = 0; i < 10; i++){
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(0.22, 0.45), 0),
      new THREE.MeshStandardMaterial({ color:0xff7a26, emissive:0xdd4400,
        emissiveIntensity:0.9, roughness:0.8 }));
    m.visible = false;
    m.castShadow = true;
    scene.add(m);
    bombs.push({ m, t: 99, vx:0, vy:0, vz:0, spin: rand(3, 9) });
  }
}
// ---------- the SMOKE: billowing puffs -------------------------------------
const puffs = [];
{
  const geo = new THREE.SphereGeometry(1, 8, 7);
  for(let i = 0; i < 46; i++){
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
      color:0x4b453f, transparent:true, opacity:0 }));
    m.visible = false;
    scene.add(m);
    puffs.push({ m, t: 99, vx:0, vy:0, drift:0 });
  }
}

// ==========================================================================
//  THE ERUPTION — phases: WAKE (rumble + glow) → FURY (gout, bombs, smoke,
//  the flow advancing) → EASE (fountain dies, flow stalls) → the long
//  HARDENING (everything cools where it lies; the smoke thins to wisps).
// ==========================================================================
let mode = 'erupt', eruptT = 0, fury = 0, flowHead = 0;
const chipBtns = [...document.querySelectorAll('#chip button')];
function setMode(m){
  mode = m;
  if(m === 'erupt'){
    eruptT = 0;
    // a fresh eruption REMELTS the tongue from the top
    flowHead = 0;
    for(const s of flowSegs) s.born = -1;
  }
  chipBtns.forEach(b => b.classList.toggle('on', b.dataset.m === m));
}
chipBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
setMode('erupt');

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if(mode === 'erupt') eruptT += dt;
  // FURY envelope: builds over 3s, holds ~18s, eases off by 30s
  const targetFury = mode === 'erupt'
    ? (eruptT < 3 ? eruptT/3 : eruptT < 21 ? 1 : clamp(1 - (eruptT - 21)/9, 0, 0.0))
    : 0;
  fury = lerp(fury, targetFury, Math.min(1, dt*1.5));

  // the mountain breathes light
  glow.intensity = fury * (26 + Math.sin(t*13)*7) + (mode === 'erupt' ? 2 : 0);
  window.__pool.material.color.setHex(fury > 0.05 ? 0xff7a1e : 0x1c1410);
  // camera rumble at the height of it
  if(fury > 0.35) camera.position.y += Math.sin(t*31) * 0.012 * fury;

  // ---------- the GOUT ----------
  if(fury > 0.15 && Math.random() < dt * 90 * fury){
    const d = drops.find(d => d.t > 2);
    if(d){
      d.t = 0;
      d.m.visible = true;
      d.m.position.set(rand(-0.5, 0.5), craterLipY + 0.8, rand(-0.5, 0.5));
      const a = rand(0, Math.PI*2), sp = rand(0.4, 1.7);
      d.vx = Math.cos(a)*sp; d.vz = Math.sin(a)*sp;
      d.vy = rand(9, 15) * (0.6 + fury*0.4);
    }
  }
  for(const d of drops){
    if(d.t > 2){ d.m.visible = false; continue; }
    d.t += dt;
    d.vy -= 16*dt;
    d.m.position.x += d.vx*dt; d.m.position.y += d.vy*dt; d.m.position.z += d.vz*dt;
    d.m.material.color.copy(flowTint(d.t * 6));   // droplets cool fast in the air
    if(d.m.position.y < craterLipY - 1.5) d.t = 99;
  }

  // ---------- the BOMBS ----------
  if(fury > 0.4 && Math.random() < dt * 2.2 * fury){
    const b = bombs.find(b => b.t > 8);
    if(b){
      b.t = 0;
      b.m.visible = true;
      b.m.position.set(0, craterLipY + 1, 0);
      const a = rand(0, Math.PI*2), sp = rand(2.5, 6.5);
      b.vx = Math.cos(a)*sp; b.vz = Math.sin(a)*sp;
      b.vy = rand(10, 16);
      b.m.material.emissiveIntensity = 0.9;
    }
  }
  for(const b of bombs){
    if(b.t > 8){ b.m.visible = false; continue; }
    b.t += dt;
    b.m.rotation.x += dt*b.spin; b.m.rotation.y += dt*b.spin*0.7;
    if(b.m.position.y > 0.25 || b.vy > 0){
      b.vy -= 16*dt;
      b.m.position.x += b.vx*dt; b.m.position.y += b.vy*dt; b.m.position.z += b.vz*dt;
      const r = Math.hypot(b.m.position.x, b.m.position.z);
      const gy = Math.max(slopeY(r), 0.15) + 0.15;
      if(b.m.position.y < gy && b.vy < 0){   // the THUD + a lazy half-bounce
        b.m.position.y = gy;
        b.vy = Math.abs(b.vy) * 0.25;
        b.vx *= 0.5; b.vz *= 0.5;
        if(b.vy < 1.2) b.vy = 0;
      }
    }
    // landed rocks cool where they lie… and stay a long moment
    b.m.material.emissiveIntensity = Math.max(0, 0.9 - b.t*0.14);
  }

  // ---------- the SMOKE ----------
  if(fury > 0.1 && Math.random() < dt * 22 * fury){
    const p = puffs.find(p => p.t > 9);
    if(p){
      p.t = 0;
      p.m.visible = true;
      p.m.position.set(rand(-0.7, 0.7), craterLipY + rand(0.5, 1.5), rand(-0.7, 0.7));
      p.m.scale.setScalar(rand(0.5, 0.9));
      p.vy = rand(1.6, 2.6);
      p.drift = rand(0.2, 0.7);
      p.m.material.color.setHex(Math.random() < 0.25 ? 0x6b645c : 0x413b35);
    }
  }
  for(const p of puffs){
    if(p.t > 9){ p.m.visible = false; continue; }
    p.t += dt;
    p.m.position.y += p.vy*dt;
    p.m.position.x += p.drift*dt;                     // the wind takes the column
    p.m.scale.multiplyScalar(1 + dt*0.32);            // billowing
    p.m.material.opacity = clamp(p.t < 1 ? p.t*0.55 : 0.55 - (p.t - 1)*0.075, 0, 1);
  }

  // ---------- the FLOW: the tongue advances, then slowly HARDENS ----------
  if(fury > 0.3 && flowHead < FLOW_N){
    // the front oozes downhill — a segment every couple of seconds
    if(Math.random() < dt * 0.85 * fury){
      const s = flowSegs[flowHead++];
      s.born = t;
      s.m.visible = true;
    }
  }
  for(const s of flowSegs){
    if(s.born < 0) continue;
    const age = t - s.born;
    const c = flowTint(age);
    s.m.material.color.copy(c);
    // fresh lava GLOWS from inside; the glow dies as the crust takes it
    s.m.material.emissive.copy(c).multiplyScalar(age < 6 ? 0.9 : Math.max(0, 0.9 - (age - 6) / 34));
    // a fresh segment swells and settles as it arrives
    const settle = clamp(age / 4, 0, 1);
    s.m.scale.y = 0.34 - settle * 0.06;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
