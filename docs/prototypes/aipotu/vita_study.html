<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 909090;
function rand(a=1, b){ seed = (seed*1103515245 + 12345) & 0x7fffffff;
  const r = seed / 0x7fffffff; return b===undefined ? r*a : a + r*(b-a); }
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const smoothstep = t => t*t*(3-2*t);

// ---------- the standard study rig ----------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(0xe2f0f6), 60, 300);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 800);
camera.position.set(0, 2.2, 7.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 30;
controls.maxPolarAngle = 1.53;

{
  const geo = new THREE.SphereGeometry(360, 24, 16);
  const pos = geo.attributes.position, col = [];
  const horizon = new THREE.Color(0xeaf4f8), zenith = new THREE.Color(0x5fb0e4);
  const below = new THREE.Color(0xd7e8ee), c = new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const h = pos.getY(i)/360;
    if(h >= 0) c.copy(horizon).lerp(zenith, Math.pow(h, 0.55));
    else c.copy(below);
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.BackSide, fog:false })));
}
scene.add(new THREE.HemisphereLight(0xcfe6f5, 0xcbb98e, 1.05));
const sun = new THREE.DirectionalLight(0xffeeda, 2.5);
sun.position.set(14, 20, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;  sun.shadow.camera.bottom = -2;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0003;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xd8ecff, 0.55);
fill.position.set(-12, 8, -10);
scene.add(fill);
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(256,256,30, 256,256,256);
  grad.addColorStop(0, '#ead9b0'); grad.addColorStop(0.7, '#e0cba0');
  grad.addColorStop(1, '#e2f0f6');
  g.fillStyle = grad; g.fillRect(0,0,512,512);
  for(let i=0;i<4000;i++){
    g.fillStyle = rand()<0.5 ? 'rgba(160,135,90,0.15)' : 'rgba(255,250,235,0.16)';
    g.fillRect(rand(512), rand(512), rand(1,2), rand(1,2));
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(new THREE.CircleGeometry(200, 48),
    new THREE.MeshStandardMaterial({ map:t, roughness:1 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
}

// ==========================================================================
//  THE PAINTED FACE — big friendly eyes, 7 expressions, blink
// ==========================================================================
const SKIN = '#eab98f';
const EXPRS = ['happy','content','surprised','smug','weary','afraid','angry'];
function drawFace(g, expr, blink){
  const W = 256;
  g.fillStyle = SKIN; g.fillRect(0, 0, W, W);
  // freckle-blush
  const P = {
    happy:     { lid:0,    browY:-8,  browA: 0.15, mouth:'grin',  blush:1, eyeS:1.0 },
    content:   { lid:0.25, browY:-2,  browA: 0.10, mouth:'smile', blush:1, eyeS:0.95 },
    surprised: { lid:0,    browY:-16, browA: 0.05, mouth:'O',     blush:0, eyeS:1.22 },
    smug:      { lid:0.38, browY:-6,  browA:-0.28, mouth:'smug',  blush:0, eyeS:0.95, browOne:true },
    weary:     { lid:0.55, browY: 2,  browA: 0.45, mouth:'flat',  blush:0, eyeS:0.9 },
    afraid:    { lid:0,    browY:-14, browA: 0.55, mouth:'wobble',blush:0, eyeS:1.15 },
    angry:     { lid:0.15, browY: 0,  browA:-0.55, mouth:'frown', blush:0, eyeS:0.95 },
  }[expr] || {};
  const lid = Math.max(P.lid ?? 0, blink);
  const eyeY = 110, mouthY = 163;
  for(const s of [-1, 1]){
    const ex = 128 + s*36;
    // the big friendly eye
    g.fillStyle = '#ffffff';
    g.beginPath(); g.ellipse(ex, eyeY, 24*(P.eyeS||1), 29*(P.eyeS||1)*(1-lid*0.85), 0, 0, 7); g.fill();
    if(lid < 0.8){
      g.fillStyle = '#432';
      g.beginPath(); g.ellipse(ex, eyeY+4, 11.5, 13*(1-lid*0.7), 0, 0, 7); g.fill();
      g.fillStyle = '#000';
      g.beginPath(); g.ellipse(ex, eyeY+5, 6.5, 7.5*(1-lid*0.7), 0, 0, 7); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(ex-4, eyeY-1, 3.6, 4, 0, 0, 7); g.fill();
      g.beginPath(); g.ellipse(ex+5, eyeY+8, 1.8, 2, 0, 0, 7); g.fill();
    }
    // eyelid skin over the top
    if(lid > 0){
      g.fillStyle = SKIN;
      g.beginPath();
      g.ellipse(ex, eyeY - 29*(1-lid*1.6), 26*(P.eyeS||1), 30*lid, 0, 0, 7);
      g.fill();
    }
    // brow — thick, readable
    const bA = (P.browA||0)*s*-1, bY = eyeY - 42 + (P.browY||0)
             + (P.browOne && s===1 ? -7 : 0);
    g.save();
    g.translate(ex, bY);
    g.rotate(bA);
    g.fillStyle = '#54402e';
    g.beginPath(); g.roundRect(-20, -5, 40, 10, 5); g.fill();
    g.restore();
    if(P.blush){
      g.fillStyle = 'rgba(235,130,110,0.35)';
      g.beginPath(); g.ellipse(128 + s*62, 148, 12, 8, 0, 0, 7); g.fill();
    }
  }
  // mouth
  g.strokeStyle = '#5a3325'; g.fillStyle = '#7c3a2c';
  g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath();
  switch(P.mouth){
    case 'grin':
      g.moveTo(96, mouthY-6);
      g.quadraticCurveTo(128, mouthY+30, 160, mouthY-6);
      g.quadraticCurveTo(128, mouthY+6, 96, mouthY-6);
      g.fill();
      g.beginPath(); g.moveTo(96, mouthY-6);
      g.quadraticCurveTo(128, mouthY+30, 160, mouthY-6); g.stroke();
      break;
    case 'smile':
      g.moveTo(106, mouthY-2); g.quadraticCurveTo(128, mouthY+14, 150, mouthY-2); g.stroke(); break;
    case 'smug':
      g.moveTo(112, mouthY+2); g.quadraticCurveTo(140, mouthY+8, 154, mouthY-8); g.stroke(); break;
    case 'flat':
      g.moveTo(108, mouthY+3); g.quadraticCurveTo(128, mouthY+6, 148, mouthY+3); g.stroke(); break;
    case 'frown':
      g.moveTo(106, mouthY+10); g.quadraticCurveTo(128, mouthY-8, 150, mouthY+10); g.stroke(); break;
    case 'O':
      g.beginPath(); g.ellipse(128, mouthY+4, 13, 17, 0, 0, 7); g.fill();
      g.stroke(); break;
    case 'wobble':
      g.moveTo(104, mouthY+4);
      for(let i=1;i<=6;i++) g.lineTo(104 + i*8, mouthY+4 + (i%2 ? 7 : 0));
      g.stroke(); break;
  }
}

// ==========================================================================
//  BUILD ONE VITA
// ==========================================================================
const matSkin  = new THREE.MeshStandardMaterial({ color:0xeab98f, roughness:0.65 });
const matHair  = new THREE.MeshStandardMaterial({ color:0x54402e, roughness:0.8 });
const matPants = new THREE.MeshStandardMaterial({ color:0x4c5666, roughness:0.8 });
const matShoe  = new THREE.MeshStandardMaterial({ color:0xf2f2f0, roughness:0.6 });
const matSole  = new THREE.MeshStandardMaterial({ color:0x3a3d42, roughness:0.8 });
const matGold  = new THREE.MeshStandardMaterial({ color:0xe8b93c, roughness:0.25, metalness:0.85 });
const matWood  = new THREE.MeshStandardMaterial({ color:0x9a7648, roughness:0.9 });

const sparkTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  g.translate(32,32);
  g.fillStyle = '#fff';
  for(const a of [0, Math.PI/2]){
    g.save(); g.rotate(a);
    g.beginPath();
    g.moveTo(0,-30); g.quadraticCurveTo(3,-3, 30,0); g.quadraticCurveTo(3,3, 0,30);
    g.quadraticCurveTo(-3,3, -30,0); g.quadraticCurveTo(-3,-3, 0,-30);
    g.fill(); g.restore();
  }
  return new THREE.CanvasTexture(cv);
})();

// the DUKE hat: a classic tall BLACK top hat, thin house-colored band
const matTopHat = new THREE.MeshStandardMaterial({ color:0x17171a, roughness:0.38 });
function makeTopHat(bandMat){
  const g = new THREE.Group();
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.275, 0.25, 0.46, 24), matTopHat);
  crown.position.y = 0.26;
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.275, 0.275, 0.03, 24), matTopHat);
  top.position.y = 0.50;
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.41, 0.035, 28), matTopHat);
  brim.position.y = 0.02;
  const curl = new THREE.Mesh(new THREE.TorusGeometry(0.405, 0.028, 8, 28), matTopHat);
  curl.rotation.x = Math.PI/2;
  curl.position.y = 0.035;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.262, 0.256, 0.09, 24), bandMat);
  band.position.y = 0.085;
  for(const m of [crown, top, brim, curl, band]){ m.castShadow = true; g.add(m); }
  return g;
}

function makeCrown(){
  const g = new THREE.Group();
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.15, 24, 1, true), matGold);
  band.material.side = THREE.DoubleSide;
  const rimT = new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.022, 8, 24), matGold);
  rimT.rotation.x = Math.PI/2; rimT.position.y = 0.075;
  const rimB = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.022, 8, 24), matGold);
  rimB.rotation.x = Math.PI/2; rimB.position.y = -0.075;
  g.add(band, rimT, rimB);
  const jewels = [];
  const jm = {
    ruby:     new THREE.MeshStandardMaterial({ color:0xd0202a, roughness:0.15, metalness:0.2, emissive:0x550000 }),
    emerald:  new THREE.MeshStandardMaterial({ color:0x1faa50, roughness:0.15, metalness:0.2, emissive:0x004410 }),
    sapphire: new THREE.MeshStandardMaterial({ color:0x2a5cd8, roughness:0.15, metalness:0.2, emissive:0x001a55 }),
  };
  const names = ['ruby','sapphire','emerald'];
  for(let i=0;i<8;i++){
    const a = i/8*Math.PI*2;
    const pt = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.16, 6), matGold);
    pt.position.set(Math.sin(a)*0.27, 0.15, Math.cos(a)*0.27);
    g.add(pt);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.026, 8, 6), matGold);
    ball.position.set(Math.sin(a)*0.27, 0.24, Math.cos(a)*0.27);
    g.add(ball);
    if(i%2===0){
      const jmat = jm[names[(i/2)|0 % 3] || 'ruby'];
      const j = new THREE.Mesh(new THREE.OctahedronGeometry(0.045, 0), jmat);
      j.position.set(Math.sin(a)*0.295, 0, Math.cos(a)*0.295);
      j.scale.set(1, 1.3, 0.7);
      g.add(j);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map:sparkTex, transparent:true, depthWrite:false,
        blending:THREE.AdditiveBlending, color:0xffffff, opacity:0.9 }));
      sp.position.copy(j.position).multiplyScalar(1.12);
      sp.scale.setScalar(0.001);
      sp.userData.phase = rand(9);
      sp.userData.speed = rand(0.7, 1.4);
      g.add(sp);
      jewels.push(sp);
    }
  }
  for(const m of g.children) m.castShadow = true;
  g.userData.sparks = jewels;
  return g;
}

function makeVita({ hat = null } = {}){
  const shirtMat = new THREE.MeshStandardMaterial({ color:0xc0392b, roughness:0.75 });
  const root = new THREE.Group();

  const hips = new THREE.Group();
  hips.position.y = 0.55;
  root.add(hips);

  // stubby legs + fat sneakers
  const legs = {};
  const legGeo = new THREE.CapsuleGeometry(0.115, 0.30, 4, 10);
  legGeo.translate(0, -0.22, 0);
  const shoeGeo = new THREE.SphereGeometry(0.155, 12, 8);
  const soleGeo = new THREE.CylinderGeometry(0.155, 0.165, 0.06, 12);
  for(const s of [-1, 1]){
    const L = new THREE.Group();
    L.position.set(s*0.155, 0.02, 0);
    const leg = new THREE.Mesh(legGeo, matPants);
    leg.castShadow = true;
    const shoe = new THREE.Mesh(shoeGeo, matShoe);
    shoe.scale.set(1, 0.8, 1.35);
    shoe.position.set(0, -0.48, 0.05);
    shoe.castShadow = true;
    const sole = new THREE.Mesh(soleGeo, matSole);
    sole.scale.z = 1.35;
    sole.position.set(0, -0.545, 0.05);
    L.add(leg, shoe, sole);
    hips.add(L);
    legs[s] = L;
  }

  // torso — a friendly little barrel in the house shirt
  const torso = new THREE.Group();
  torso.position.y = 0.10;
  hips.add(torso);
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 16), shirtMat);
  belly.scale.set(1.02, 1.05, 0.88);
  belly.position.y = 0.32;
  belly.castShadow = true;
  torso.add(belly);

  // small arms with mitten hands
  const arms = {};
  const armGeo = new THREE.CapsuleGeometry(0.085, 0.16, 4, 10);
  armGeo.translate(0, -0.11, 0);
  const foreGeo = new THREE.CapsuleGeometry(0.078, 0.13, 4, 10);
  foreGeo.translate(0, -0.10, 0);
  for(const s of [-1, 1]){
    const sh = new THREE.Group();
    sh.position.set(s*0.335, 0.50, 0);
    const up = new THREE.Mesh(armGeo, shirtMat);
    up.castShadow = true;
    const el = new THREE.Group();
    el.position.y = -0.22;
    const fore = new THREE.Mesh(foreGeo, matSkin);
    fore.castShadow = true;
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.105, 10, 8), matSkin);
    hand.position.y = -0.26;
    hand.castShadow = true;
    el.add(fore, hand);
    sh.add(up, el);
    torso.add(sh);
    arms[s] = { sh, el };
  }

  // THE HEAD — big, round, painted face
  const headG = new THREE.Group();
  headG.position.y = 0.72;
  torso.add(headG);
  const faceCv = document.createElement('canvas');
  faceCv.width = faceCv.height = 256;
  const faceCtx = faceCv.getContext('2d');
  drawFace(faceCtx, 'happy', 0);
  const faceTex = new THREE.CanvasTexture(faceCv);
  faceTex.colorSpace = THREE.SRGBColorSpace;
  // compress the painted face into a front window (the canvas border is all
  // skin, so clamped edges smear invisibly over the rest of the head)
  faceTex.wrapS = faceTex.wrapT = THREE.ClampToEdgeWrapping;
  faceTex.repeat.set(2.2, 2.2);
  faceTex.offset.set(-0.6, -0.662);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.46, 32, 24),
    new THREE.MeshStandardMaterial({ map:faceTex, roughness:0.65 }));
  head.scale.set(1.04, 1.0, 0.97);
  head.position.y = 0.28;
  head.rotation.y = -Math.PI/2;       // brings the painted face to +Z (verified)
  head.castShadow = true;
  headG.add(head);
  // button nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), matSkin);
  nose.position.set(0, 0.21, 0.435);
  headG.add(nose);
  // the full donut beard — mouth shows through the hole
  const beard = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.095, 12, 20), matHair);
  beard.position.set(0, 0.035, 0.315);
  beard.scale.set(1.12, 0.9, 0.5);
  beard.castShadow = true;
  headG.add(beard);
  const chin = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), matHair);
  chin.scale.set(1.35, 0.8, 0.7);
  chin.position.set(0, -0.10, 0.26);
  headG.add(chin);
  // short hair cap + little ears
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.475, 24, 16,
    0, Math.PI*2, 0, Math.PI*0.36), matHair);
  cap.scale.set(1.04, 1.0, 0.99);
  cap.position.y = 0.30;
  cap.castShadow = true;
  headG.add(cap);
  const fringe = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), matHair);
  fringe.scale.set(1.9, 0.45, 0.6);
  fringe.position.set(0, 0.585, 0.32);
  headG.add(fringe);
  for(const s of [-1,1]){
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 8), matSkin);
    ear.position.set(s*0.47, 0.24, 0.02);
    headG.add(ear);
  }
  // hat mount
  const hatMount = new THREE.Group();
  hatMount.position.set(0, 0.66, -0.02);
  hatMount.rotation.z = -0.08;
  headG.add(hatMount);
  let crownSparks = null;
  let hatMats = [];
  if(hat === 'tophat'){
    const bandMat = new THREE.MeshStandardMaterial({ color:0x3f7040, roughness:0.7 });
    hatMats.push(bandMat);            // only the band takes the house color
    hatMount.add(makeTopHat(bandMat));
  } else if(hat === 'crown'){
    const c = makeCrown();
    hatMount.position.y = 0.72;
    hatMount.rotation.z = 0;
    hatMount.add(c);
    crownSparks = c.userData.sparks;
  }

  // haul prop: a little wooden crate (hidden unless hauling)
  const crate = new THREE.Group();
  const cbox = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.34, 0.36), matWood);
  cbox.castShadow = true;
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.06, 0.38),
    new THREE.MeshStandardMaterial({ color:0x7a5c36, roughness:0.9 }));
  trim.position.y = 0.14;
  const trim2 = trim.clone(); trim2.position.y = -0.14;
  crate.add(cbox, trim, trim2);
  crate.position.set(0, 0.30, 0.52);
  crate.visible = false;
  torso.add(crate);

  // sleeping Z's
  const zs = [];
  for(let i=0;i<3;i++){
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g2 = cv.getContext('2d');
    g2.font = 'bold 44px system-ui'; g2.fillStyle = '#4a6a8a';
    g2.textAlign = 'center'; g2.textBaseline = 'middle';
    g2.fillText('Z', 32, 34);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false, opacity:0 }));
    sp.scale.setScalar(0.22 + i*0.08);
    root.add(sp);
    zs.push(sp);
  }

  const face = {
    expr: 'happy', blink: 0,
    set(e){ this.expr = e; this.redraw(); },
    redraw(){ drawFace(faceCtx, this.expr, this.blink); faceTex.needsUpdate = true; },
  };

  return {
    root, hips, torso, headG, arms, legs, crate, zs, face,
    shirtMat, hatMats, crownSparks,
    blinkT: rand(2,4),
    setHouseColor(hex){
      this.shirtMat.color.setHex(hex);
      for(const m of this.hatMats) m.color.setHex(hex);
    },
  };
}

// ==========================================================================
//  POSE ENGINE — every animation is a pose function; poses cross-blend
// ==========================================================================
function zeroPose(){
  return { rootY:0, rootRX:0, hipsY:0, hipsRX:0, hipsRZ:0,
    torsoRX:0, torsoRY:0, torsoRZ:0,
    headRX:0, headRY:0, headRZ:0,
    shL:[0,0,0], elL:[0,0,0], shR:[0,0,0], elR:[0,0,0],
    legL:0, legR:0, crate:false, lying:false, zzz:false };
}
// every move IN EARNEST: big angles, anticipation, bounce.
const ANIMS = {
  idle(t, P){
    const b = Math.sin(t*2.2);
    P.hipsY = 0.012*b;
    P.torsoRX = 0.03 + 0.015*b;
    P.headRY = 0.15*Math.sin(t*0.6);
    P.headRZ = 0.04*Math.sin(t*0.45+2);
    P.shL[2] = -0.10 - 0.02*b; P.shR[2] = 0.10 + 0.02*b;
    P.elL[0] = -0.15; P.elR[0] = -0.15;
  },
  walk(t, P){
    const p = t*6.0, sw = Math.sin(p);
    P.legL = 0.62*sw; P.legR = -0.62*sw;
    P.shL[0] = -0.55*sw; P.shR[0] = 0.55*sw;
    P.elL[0] = -0.35; P.elR[0] = -0.35;
    P.hipsY = 0.045*Math.abs(Math.cos(p));
    P.hipsRZ = 0.05*sw;
    P.torsoRX = 0.10;
    P.headRZ = -0.05*sw;
    P.headRX = 0.03*Math.sin(p*2);
  },
  run(t, P){
    const p = t*10.5, sw = Math.sin(p);
    P.legL = 1.0*sw; P.legR = -1.0*sw;
    P.shL[0] = -0.95*sw; P.shR[0] = 0.95*sw;
    P.elL[0] = -1.5; P.elR[0] = -1.5;
    P.hipsY = 0.10*Math.abs(Math.cos(p));
    P.torsoRX = 0.38;
    P.headRX = -0.18;
    P.hipsRZ = 0.07*sw;
  },
  pick(t, P){
    const c = (t % 3.4)/3.4;
    if(c < 0.28){                                  // reeeach up on tiptoes
      const k = smoothstep(c/0.28);
      P.shL[2] = -2.6*k; P.shR[2] = 2.6*k;
      P.shL[0] = -0.35*k; P.shR[0] = -0.35*k;
      P.elL[0] = -0.2*k; P.elR[0] = -0.2*k;
      P.hipsY = 0.10*k; P.torsoRX = -0.18*k;
      P.headRX = -0.5*k;
    } else if(c < 0.42){                           // grab! little pulses
      P.shL[2] = -2.6; P.shR[2] = 2.6;
      P.shL[0] = -0.35; P.shR[0] = -0.35;
      P.hipsY = 0.10 + 0.02*Math.sin(c*90);
      P.torsoRX = -0.18; P.headRX = -0.5;
    } else if(c < 0.62){                           // pull it down to the chest
      const k = smoothstep((c-0.42)/0.2);
      P.shL[0] = lerp(-0.35, -1.1, k); P.shR[0] = lerp(-0.35, -1.1, k);
      P.shL[2] = lerp(-2.6, -0.15, k); P.shR[2] = lerp(2.6, 0.15, k);
      P.elL[0] = lerp(-0.2, -1.5, k); P.elR[0] = lerp(-0.2, -1.5, k);
      P.hipsY = lerp(0.10, -0.05, k);
      P.torsoRX = lerp(-0.18, 0.22, k);
      P.headRX = lerp(-0.5, 0.35, k);
    } else if(c < 0.85){                           // admire the fruit
      P.shL[0] = -1.1; P.shR[0] = -1.1;
      P.elL[0] = -1.5; P.elR[0] = -1.5;
      P.torsoRX = 0.22; P.headRX = 0.35;
      P.headRZ = 0.15*Math.sin((c-0.62)*24);
      P.hipsY = -0.05;
    } else {                                       // happy hop
      const k = (c-0.85)/0.15;
      P.hipsY = 0.14*Math.sin(k*Math.PI);
      P.shL[0] = -1.1; P.shR[0] = -1.1;
      P.elL[0] = -1.5; P.elR[0] = -1.5;
    }
  },
  celebrate(t, P){
    const c = (t % 1.5)/1.5;
    const jump = Math.max(0, Math.sin(c*Math.PI*2));
    P.rootY = 0.30*jump;
    // arms thrown up and OUT (z-raise reads around the big head)
    P.shL[0] = -0.5; P.shR[0] = -0.5;
    P.shL[2] = -2.45 - 0.2*Math.sin(t*14);
    P.shR[2] = 2.45 + 0.2*Math.sin(t*14);
    P.elL[2] = -0.3; P.elR[2] = 0.3;
    P.headRX = -0.35;
    P.hipsY = jump < 0.05 ? -0.06 : 0;
    P.legL = -0.3*jump; P.legR = -0.3*jump;
  },
  dance(t, P){
    const p = t*5.2, b = Math.sin(p), b2 = Math.sin(p/2);
    P.hipsY = 0.05*Math.abs(Math.sin(p));
    P.hipsRZ = 0.16*b2;
    P.torsoRZ = -0.12*b2;
    P.torsoRY = 0.25*Math.sin(p/2 + 1);
    P.headRZ = 0.18*b2;
    P.headRY = 0.2*Math.sin(p/2 - 1);
    P.shL[0] = -1.2 - 1.1*Math.max(0, b);  P.elL[0] = -1.7;
    P.shR[0] = -1.2 - 1.1*Math.max(0, -b); P.elR[0] = -1.7;
    P.shL[2] = -0.55; P.shR[2] = 0.55;
    P.legL = 0.15*b; P.legR = -0.15*b;
  },
  sleep(t, P){
    P.lying = true; P.zzz = true;
    P.rootRX = -Math.PI/2;
    P.rootY = 0.62;
    P.legL = 0.5 + 0.02*Math.sin(t*1.1);
    P.legR = 0.62 + 0.02*Math.sin(t*1.1+0.5);
    P.shL[0] = -2.6; P.elL[0] = -1.9;              // hands behind the head
    P.shR[0] = -2.6; P.elR[0] = -1.9;
    P.torsoRX = 0.05*Math.sin(t*1.1);              // slow breathing
    P.headRX = 0.25;
  },
  point(t, P){
    P.shR[0] = -1.5; P.shR[1] = -0.15;
    P.elR[0] = -0.1 + 0.06*Math.sin(t*3);          // emphatic little jabs
    P.shL[2] = 0.9; P.elL[0] = -1.9;               // other fist on hip
    P.torsoRX = 0.14; P.torsoRY = -0.18;
    P.headRY = -0.18; P.headRX = -0.06;
    P.hipsY = 0.01*Math.sin(t*3);
  },
  headturn(t, P){
    const c = (t % 4.8)/4.8;
    let y = 0, x = 0;
    if(c < 0.2) y = smoothstep(c/0.2)*-0.95;
    else if(c < 0.35) y = -0.95;
    else if(c < 0.55) y = lerp(-0.95, 0.95, smoothstep((c-0.35)/0.2));
    else if(c < 0.7) y = 0.95;
    else if(c < 0.85){ y = lerp(0.95, 0, smoothstep((c-0.7)/0.15));
                       x = -0.55*smoothstep((c-0.7)/0.15); }
    else { x = -0.55 + 0.05*Math.sin(t*8); }
    P.headRY = y; P.headRX = x;
    P.torsoRY = y*0.22;                            // the body commits too
    P.elL[0] = -0.15; P.elR[0] = -0.15;
  },
  jump(t, P){
    const c = (t % 1.7)/1.7;
    if(c < 0.25){                                  // deep anticipation squat
      const k = smoothstep(c/0.25);
      P.hipsY = -0.16*k; P.torsoRX = 0.30*k;
      P.shL[0] = 0.6*k; P.shR[0] = 0.6*k;
      P.headRX = -0.3*k;
    } else if(c < 0.65){                           // UP — trying to see!
      const k = (c-0.25)/0.4;
      P.rootY = 0.55*Math.sin(k*Math.PI);
      P.shL[0] = -0.9; P.shR[0] = -0.9;
      P.legL = -0.5; P.legR = -0.5;
      P.headRX = -0.55;
      P.torsoRX = -0.12;
    } else if(c < 0.78){                           // land squash
      const k = smoothstep((c-0.65)/0.13);
      P.hipsY = -0.10*(1-k*0.4);
      P.torsoRX = 0.18;
      P.headRX = -0.4;
    } else {
      P.headRX = -0.5;                             // still peering up
      P.hipsY = -0.02;
    }
  },
  bow(t, P){
    const c = (t % 3.6)/3.6;
    let k = 0;
    if(c < 0.22) k = smoothstep(c/0.22);
    else if(c < 0.7) k = 1;
    else if(c < 0.9) k = 1 - smoothstep((c-0.7)/0.2);
    P.torsoRX = 1.0*k;
    P.headRX = 0.25*k;
    P.shR[0] = -0.8*k; P.elR[0] = -1.7*k;          // arm across the waist
    P.shL[0] = 0.55*k; P.shL[1] = 0.4*k;           // other swept behind
    P.hipsY = -0.03*k;
  },
  haul(t, P){
    const p = t*4.6, sw = Math.sin(p);
    P.crate = true;
    P.legL = 0.42*sw; P.legR = -0.42*sw;
    P.hipsY = 0.05*Math.abs(Math.cos(p)) - 0.04;
    P.torsoRX = -0.14;                             // leaning back under load
    P.shL[0] = -1.05; P.elL[0] = -0.9;
    P.shR[0] = -1.05; P.elR[0] = -0.9;
    P.headRX = 0.10;
    P.headRZ = 0.05*sw;
  },
  sit(t, P){
    P.rootY = -0.44;
    P.legL = -1.45; P.legR = -1.45;
    P.torsoRX = 0.10 + 0.02*Math.sin(t*1.8);
    P.shL[0] = -0.7; P.elL[0] = -0.55;
    P.shR[0] = -0.7; P.elR[0] = -0.55;
    P.headRY = 0.25*Math.sin(t*0.5);
    P.headRZ = 0.05*Math.sin(t*0.7);
  },
};
const ANIM_LIST = ['idle','walk','run','pick','celebrate','dance','sleep',
                   'point','headturn','jump','bow','haul','sit'];

function applyPose(v, P, k){
  const e = (o, x, y, z) => { o.rotation.x += (x-o.rotation.x)*k;
    o.rotation.y += (y-o.rotation.y)*k; o.rotation.z += (z-o.rotation.z)*k; };
  v.root.position.y += (P.rootY + (P.lying ? 0 : 0) - v.root.position.y)*k;
  v.root.rotation.x += (P.rootRX - v.root.rotation.x)*k;
  v.hips.position.y += (0.55 + P.hipsY - v.hips.position.y)*k;
  e(v.hips, P.hipsRX, 0, P.hipsRZ);
  e(v.torso, P.torsoRX, P.torsoRY, P.torsoRZ);
  e(v.headG, P.headRX, P.headRY, P.headRZ);
  e(v.arms[-1].sh, P.shL[0], P.shL[1], P.shL[2]);
  e(v.arms[-1].el, P.elL[0], P.elL[1], P.elL[2]);
  e(v.arms[1].sh, P.shR[0], P.shR[1], P.shR[2]);
  e(v.arms[1].el, P.elR[0], P.elR[1], P.elR[2]);
  v.legs[-1].rotation.x += (P.legL - v.legs[-1].rotation.x)*k;
  v.legs[1].rotation.x += (P.legR - v.legs[1].rotation.x)*k;
  v.crate.visible = P.crate;
}

// ==========================================================================
//  THE TRIO — serf, duke (Tyrolean), king (crown)
// ==========================================================================
const vitas = [];
{
  const defs = [
    { hat:null,       x:-1.7 },
    { hat:'tophat',   x:0 },
    { hat:'crown',    x:1.7 },
  ];
  for(const d of defs){
    const v = makeVita({ hat:d.hat });
    v.root.position.x = d.x;
    scene.add(v.root);
    vitas.push(v);
  }
}
const HOUSE = [0xc0392b, 0x2e6fd8, 0x27a05a, 0xe0812a, 0x1fa8a0, 0xb8399f];
let houseIdx = 0, houseT = 0;
vitas[2].setHouseColor(0x7d3fa8);          // the king keeps royal purple

// ---------- UI ------------------------------------------------------------
let curAnim = 'walk', curExpr = 'happy', animT = 0;
const animsEl = document.getElementById('anims');
for(const a of ANIM_LIST){
  const b = document.createElement('button');
  b.textContent = a; b.dataset.a = a;
  if(a === curAnim) b.classList.add('on');
  b.addEventListener('click', () => {
    curAnim = a; animT = 0;
    for(const x of animsEl.children) x.classList.toggle('on', x.dataset.a === a);
    const auto = { sleep:'content', celebrate:'happy', dance:'happy', bow:'content',
                   haul:'weary', jump:'surprised', pick:'happy' }[a];
    if(auto) setExpr(auto);
  });
  animsEl.appendChild(b);
}
const exprsEl = document.getElementById('exprs');
function setExpr(e2){
  curExpr = e2;
  for(const x of exprsEl.children) x.classList.toggle('on', x.dataset.e === e2);
  for(const v of vitas) v.face.set(e2);
}
for(const e2 of EXPRS){
  const b = document.createElement('button');
  b.textContent = e2; b.dataset.e = e2;
  if(e2 === curExpr) b.classList.add('on');
  b.addEventListener('click', () => setExpr(e2));
  exprsEl.appendChild(b);
}

// ---------- loop ----------------------------------------------------------
const clock = new THREE.Clock();
let simT = 0;
function update(dt){
  simT += dt; animT += dt;
  houseT += dt;
  if(houseT > 3.5){
    houseT = 0;
    houseIdx = (houseIdx+1)%HOUSE.length;
    vitas[0].setHouseColor(HOUSE[houseIdx]);
    vitas[1].setHouseColor(HOUSE[(houseIdx+2)%HOUSE.length]);
  }
  const P = zeroPose();
  ANIMS[curAnim](animT, P);
  for(let i=0;i<vitas.length;i++){
    const v = vitas[i];
    applyPose(v, P, Math.min(1, dt*(animT < 0.45 ? 6 : 14)));
    // blink
    v.blinkT -= dt;
    if(v.blinkT < 0){
      v.face.blink = 1; v.face.redraw();
      v.blinkT = rand(2.4, 4.8);
      setTimeout(() => { v.face.blink = 0; v.face.redraw(); }, 130);
    }
    // sleeping Z's
    for(let z=0; z<v.zs.length; z++){
      const sp = v.zs[z];
      if(P.zzz){
        const ph = (simT*0.5 + z*0.33) % 1;
        sp.material.opacity = Math.sin(ph*Math.PI)*0.8;
        sp.position.set(v.root.position.x + 0.5 + ph*0.3 + z*0.1,
                        0.9 + ph*0.8 + z*0.15, 0.2);
      } else sp.material.opacity = 0;
    }
    // crown twinkles
    if(v.crownSparks){
      for(const sp of v.crownSparks){
        const s = Math.pow(Math.max(0, Math.sin(simT*sp.userData.speed*2.2 + sp.userData.phase)), 6);
        sp.scale.setScalar(0.02 + s*0.16);
        sp.material.rotation = simT*1.5 + sp.userData.phase;
      }
    }
  }
}
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  controls.update();
  renderer.render(scene, camera);
}
frame();

window.VITA = {
  renderer, scene, camera, controls, vitas,
  setAnim(a){ curAnim = a; animT = 0; }, setExpr,
  step(sec){ const n = Math.max(1, Math.round(sec*60));
             for(let i=0;i<n;i++) update(1/60);
             renderer.render(scene, camera); },
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
